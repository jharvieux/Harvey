# Batch B7 — auth / access-control heuristics (#71, spec §"Batch 7 — Auth / access-control /
# left-open"). Per-batch custom-rule file (see base.yml header for the directory convention).
# Scheduled deliberately LAST in the #71 fan-out because it carries the HIGHEST negative-precision
# risk in the whole corpus: a static tool cannot confirm an ownership check, a permission check, or
# an auth guard living in middleware is correct — it can only see the shape "this mutation has no
# guard call in this function." That is real signal, but it is NOT ~100% precise, so every rule in
# this file is WARNING + MEDIUM confidence -> `review` tier, never `high`/free-count. Three rows
# already ship ([exists], not duplicated here): P-DEBUG-ENDPOINT and P-TODO-AUTH (leftover-auth
# greps, base.entries.ts) and P-SRV-KEY-CLIENT (harvey-service-role-in-client, base.yml).
#
# Overlap note (intentional, not a bug): harvey-route-noauth's "mutation with no auth-check call"
# shape will also fire on some pre-existing fixtures planted for a DIFFERENT named bug (e.g.
# pages/api/dev/seed.js, pages/api/admin/reset.js, pages/api/comments/create.js,
# pages/api/counter/increment.js all genuinely lack an auth-check call too). That's correct,
# review-tier-only overlap between two legitimately-true heuristics on the same code, not a
# taxonomy error — see GROUND-TRUTH.md §B7 for the same reasoning applied to
# harvey-missing-server-only and lib/supabaseAdmin.js.
#
# #126: harvey-route-noauth originally only recognized the stock getServerSession/
# supabase.auth.getUser call names, so it false-positived on every route gated by a
# NAMED CUSTOM GUARD HELPER instead (122/122 false on the ATC dogfood — assertPlatformAdmin,
# assertPermission, authenticateUser, none of which the rule could see). A fixed name list
# doesn't generalize (every codebase invents its own helper names), so the guard-not-inside
# clause below is broadened to a GUARD_CALL_RE: any call whose name starts with a
# gate verb (assert/require/ensure/authenticate/authorize/guard — these verbs are
# guard-specific enough on their own) or contains a weaker generic verb (check/verify,
# anywhere in the identifier, not just as a prefix — covers jwtVerify) together with an
# auth-ish token (admin/permission/auth/session/tenant/role/access/user/login/signature/
# jwt/webhook/hmac/token) anywhere else in the same identifier — covers the ATC dogfood's
# webhook routes too (verifyGitHubSignature/verifyResendSignature/verifyWebhookSignature),
# the "genuinely public but signature-verified" category the issue's acceptance criteria
# names explicitly. This is a pattern-not-REGEX (text match over the
# matched function's source), not an AST pattern-not-inside, because Semgrep's
# metavariable-regex does not constrain which call a wildcard `$GUARD(...)` inside a
# pattern-not-inside binds to (verified empirically — it suppresses ALL matches, guarded
# or not). A helper name outside both buckets (e.g. `mustBeOwner()`) is still a false
# negative here — same class of gap, just not the one evidenced on ATC; see #126 for the
# `--auth-guards` per-engagement allowlist as a possible follow-up mitigation.
#
# #1066 — because those two guards are TEXT matches over the matched function's source, they used to
# see COMMENTS and STRING LITERALS too: `// TODO: requireAdmin() before shipping` on an
# unauthenticated DELETE route removed the harvey-route-noauth finding, and `// FIXME: no permission
# gate here yet` removed harvey-authed-no-role-check. The marker of KNOWN-MISSING auth was exactly
# what silenced the detector — an integrity hole the audited party controls. Both regexes now start
# with LINE_PREFIX below: the match must begin at a LINE START and reach the token through code
# only, so a `//` line comment, a block-comment continuation line, or a string/template literal
# blocks it and the token inside is unreachable. Adversarial positives that must still fire:
# P-NOAUTH-COMMENT-GUARD, P-ROLE-COMMENT-GUARD.
#
#   LINE_PREFIX = (?m)^(?![ \t]*\*)(?:[^\n/"'`]|/(?![/*])|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`[^`\n]*`)*?
#
# NOT \A-anchored, and that is load-bearing: MEASURED 2026-07-25 (semgrep 1.164.0) — semgrep runs a
# pattern-not-regex over the whole FILE and keeps only matches falling INSIDE the matched range, so
# an \A-anchored regex starts at file offset 0, lands outside every range, and suppresses NOTHING.
# The first attempt at this fix did exactly that and turned every correctly-guarded route into a
# review-tier false positive; the dry-run artifact grew by 400+ lines and the calibration gate did
# not catch it because these rules are review tier and the gate only fails on free-count FPs.
# Falsifier if you doubt this: put \A back and watch N-ROUTE-NOAUTH-ADMIN-AREA start firing.
#
# Exercised against targets/calibration by `pnpm validate:calibration`; see GROUND-TRUTH.md §B7.

rules:
  # A cookie/session-authed Server Action mutates data with no authority/permission check call
  # anywhere in the function. Distinct from harvey-csrf-missing (app/actions.ts, headers.yml):
  # CSRF is about the request's ORIGIN; this is about whether the caller is ALLOWED to perform the
  # action at all. Gated on a fixed set of common authority-check call names — a real guard under
  # a different name is a false negative (review tier, not a gate concern).
  - id: harvey-server-action-noauth
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-862: Missing Authorization"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      This 'use server' Server Action mutates data with no authority/permission check
      (assertPermission/requirePermission/requireRole) anywhere in the function. An Origin check
      alone (see harvey-csrf-missing) proves the request is same-site, not that the caller is
      authorized to perform this specific mutation. SCOPE OF THIS CHECK: the guard is recognised by
      NAME, from a fixed list. A real authority check under a different name is not recognised, so
      this is a prompt to confirm the action is guarded, not proof that it is not.
    patterns:
      - pattern-inside: |
          "use server";
          ...
      - pattern: |
          async function $F(...) {
            ...
          }
      - pattern-either:
          - pattern-inside: |
              async function $F(...) {
                ...
                $DB.from($T).insert(...)
                ...
              }
          - pattern-inside: |
              async function $F(...) {
                ...
                $DB.from($T).update(...)
                ...
              }
          - pattern-inside: |
              async function $F(...) {
                ...
                $DB.from($T).delete(...)
                ...
              }
      - pattern-not-inside: |
          async function $F(...) {
            ...
            assertPermission(...)
            ...
          }
      - pattern-not-inside: |
          async function $F(...) {
            ...
            requirePermission(...)
            ...
          }
      - pattern-not-inside: |
          async function $F(...) {
            ...
            requireRole(...)
            ...
          }

  # A route handler (Pages Router `export default async function handler(req, res)` or an App
  # Router route `export async function <VERB>(req)`) mutates data with no auth-check call
  # (session read / supabase.auth.getUser()) anywhere in the function. See the file header for
  # the intentional overlap with other named bugs that share this shape.
  #
  # #382: the App Router half matches ANY mutation verb — GET/POST/PUT/DELETE/PATCH — via a single
  # $M metavariable constrained to the verb set, not POST alone. REST-conventional handlers split
  # mutations across PUT/PATCH (update) and DELETE (delete), reserving POST for create; keying on
  # POST caught roughly a third of the mutation-verb space by construction. The verb-name regex is
  # declared once (in the route-handler gate below) and unifies across the mutation-inside and
  # pattern-not-inside blocks, so a guard living in a PUT/DELETE body suppresses the match exactly
  # as it does for POST. GET is included deliberately: the rule already gates on "contains a
  # mutation call" rather than the verb's REST semantics, so a state-changing GET is caught for
  # free rather than being a blind spot.
  - id: harvey-route-noauth
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-862: Missing Authorization"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      This route handler mutates data (insert/update/delete) with no auth-check call anywhere in
      the function (no session read, no supabase.auth.getUser()). If the route is reachable
      without a session, this is an unauthenticated write — confirm a guard exists elsewhere
      (e.g. middleware) or add one here.
    patterns:
      - pattern-either:
          - pattern: |
              export default async function $H($REQ, $RES) {
                ...
              }
          - patterns:
              - pattern: |
                  export async function $M($REQ) {
                    ...
                  }
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(GET|POST|PUT|DELETE|PATCH)$
      - pattern-either:
          - pattern-inside: |
              export default async function $H($REQ, $RES) {
                ...
                $DB.from($T).insert(...)
                ...
              }
          - pattern-inside: |
              export default async function $H($REQ, $RES) {
                ...
                $DB.from($T).update(...)
                ...
              }
          - pattern-inside: |
              export default async function $H($REQ, $RES) {
                ...
                $DB.from($T).delete(...)
                ...
              }
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                $DB.from($T).insert(...)
                ...
              }
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                $DB.from($T).update(...)
                ...
              }
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                $DB.from($T).delete(...)
                ...
              }
      - pattern-not-inside: |
          export default async function $H($REQ, $RES) {
            ...
            getServerSession(...)
            ...
          }
      - pattern-not-inside: |
          export default async function $H($REQ, $RES) {
            ...
            $SUP.auth.getUser(...)
            ...
          }
      - pattern-not-inside: |
          export async function $M($REQ) {
            ...
            getServerSession(...)
            ...
          }
      - pattern-not-inside: |
          export async function $M($REQ) {
            ...
            $SUP.auth.getUser(...)
            ...
          }
      # #126: a custom-named guard helper call anywhere in the function — see file header.
      # The weak-verb bucket (check/verify/with) uses lookaheads so the verb and the auth-ish
      # token can appear in either order in the identifier (jwtVerify, verifyWebhookSignature,
      # withPlatformAdminAudit). #171: "with" joined the weak-verb bucket (an audit/guard HOC
      # wrapper called inline, e.g. withPlatformAdminAudit — the "Area"-suffixed assert variant,
      # assertPlatformAdminArea, was already covered by the assert-prefix bucket). constantTimeEqual/
      # timingSafeEqual are fixed names, not verb+token: a constant-time comparison against a
      # server-held secret (an admin header-secret check) IS the auth check by convention, with no
      # auth-ish token in the name for the weak-verb bucket to key off.
      # #562: the bare session-accessor names (getUser/getSession/getServerSession/getCurrentUser/
      # getAuthUser/getAuthenticatedUser/auth) are fixed guard names too. The stock
      # supabase.auth.getUser() METHOD call is already suppressed by the pattern-not-inside blocks
      # above, but a project that wraps it in a plain top-level helper -- `const user = getUser(req)`
      # (the vandyand/saas-security-teardown shape) -- reads the session just as authoritatively and
      # must not be asserted "no auth-check call anywhere". "auth" bare covers the next-auth v5
      # `auth()` accessor. Reading the session is a SEPARATE axis from whether the caller is
      # AUTHORIZED for this specific privileged action (harvey-authed-no-role-check).
      # #1093: this used to end in a `pattern-not-regex` (the LINE_PREFIX text match, #1066) that
      # cleared the finding when a guard-shaped call appeared ANYWHERE in the function's SOURCE
      # TEXT. LINE_PREFIX had no cross-line "inside a block comment" state, so a `/* ... */` whose
      # interior lines didn't start with `*` still reached the guard token and silenced a
      # genuinely unguarded route (P-NOAUTH-BLOCK-COMMENT-GUARD) — an `\A`-anchored fix is
      # unavailable (see file header). Re-tried the AST alternative (nested `pattern-not-inside` +
      # `metavariable-regex` on a wildcard $GUARD(...) callee) first: TRIED 2026-07-26, semgrep
      # 1.164.0 — a minimal repro (one statement, no guard call at all) still matched
      # `pattern-not-inside: function $F(...) { ...; $GUARD(...); ... }` because $GUARD can bind to
      # the flagged call itself, so #126's "suppresses ALL matches, guarded or not" still holds and
      # the AST route is not viable for this shape. So this rule now matches unconditionally and
      # `partitionGuardTokenSuppressed` (src/scan/semgrep.ts) re-derives the guard check itself, on
      # a real comment/string-stripped copy of the matched span (a state machine, not a per-line
      # regex) — the same "re-derive it ourselves" shape as partitionMarkerSuppressed for nosem.

  # IDOR/BOLA shape: an id from the request (req.query/req.params, or the App Router route-handler
  # `{ params }` second-arg — params.id) is the SOLE predicate on a Supabase query — .eq('id', $ID)
  # with nothing else chained. The sink is anchored to a full statement (a `const { ... } = await
  # ...;` destructure, or the bare `await ....delete()` statement) so it does NOT match when a
  # second .eq() scopes the same query by owner/tenant (N-IDOR-SCOPED / N-IDOR-APPROUTER-SCOPED) —
  # that additional call makes the statement's RHS a different, longer expression tree that this
  # exact-shape pattern can't match. #570: the trailing-.single() and update().select().single()
  # variants are the idiomatic App Router / supabase-js single-row read+write shapes; each is spelled
  # out so a scoping .eq() between .eq("id",$ID) and .single() still breaks the match.
  - id: harvey-idor-param
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-639: Authorization Bypass Through User-Controlled Key"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A request-controlled id (req.query/req.params or the App Router { params } arg) is the only
      predicate on this query — no owner/tenant scoping (e.g. .eq('user_id', session.user.id)) in
      the same chain. Any caller who can guess/enumerate another record's id can read or write it
      (IDOR/BOLA, OWASP API1). SCOPE OF THIS CHECK: the id must arrive by one of the request shapes
      treated as a source here — req.query / req.params, an App Router params value (awaited or
      not), a URL searchParams read, or an awaited JSON body. An identifier carried in a cookie or
      a header is deliberately not a source (an IDOR source is an identifier), and owner scoping
      applied in a different statement or file is not assessed.
    # #1221 measured this rule blind to BOTH `searchParams.get()` and `await req.json()`, then put
    # it outside its own scope list and outside #1224's split — so it would have fallen through.
    # It does NOT adopt base.yml's canonical block: an IDOR source is an IDENTIFIER, and widening
    # to cookies/headers would change what the rule is about. The two shapes added are the two an
    # id actually arrives by on the App Router — `?id=` and a JSON body on a by-id write.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.params
          - metavariable-regex:
              metavariable: $REQ
              regex: ^_?(req|request|nextReq|nextRequest|httpReq|incoming)$
      # App Router route handler: `export async function GET(req, { params }) { ... params.id ... }`
      - pattern: params.$K
      # #601 (CX-13): Next 15/16 makes the route-handler `params` a Promise, read as
      # `const { id } = await params;`. The destructured id is tainted from the awaited promise —
      # a source `params.$K` (property access) never saw, so the pure-App-Router IDOR stayed dark.
      - pattern: await params
      - pattern: $U.searchParams.get(...)
      - pattern: $U.searchParams
      - pattern: await $REQ.json()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  const { $DATA } = await $C.from($T).select($S).eq("id", $ID);
              - pattern: |
                  const { $DATA, $ERR } = await $C.from($T).select($S).eq("id", $ID);
              - pattern: |
                  const { $DATA } = await $C.from($T).update($V).eq("id", $ID);
              - pattern: |
                  const { $DATA } = await $C.from($T).select($S).eq("id", $ID).single();
              - pattern: |
                  const { $DATA } = await $C.from($T).update($V).eq("id", $ID).select().single();
              - pattern: |
                  await $C.from($T).delete().eq("id", $ID);
          - focus-metavariable: $ID

  # Mass assignment (OWASP API3/BOPLA): the entire request body is spread into an insert/update
  # payload with no field allowlist. A picked/destructured object literal (N-MASS-ASSIGN-PICK) is
  # a different (safe) shape — the spread operator on req.body is the specific signal here.
  - id: harvey-mass-assignment
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      The entire request body is spread into an insert/update payload with no field allowlist —
      mass assignment. A caller can set any column the table exposes (e.g. a role/is_admin/price
      field never meant to be client-writable) by adding it to the JSON body. Destructure and
      pass an explicit list of allowed fields instead of spreading req.body.
    pattern-sources:
      - pattern: req.body
      # App Router route handler body: `const body = await req.json()` (#570)
      - pattern: await $REQ.json()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.from($T).insert({ ...$BODY, ... })
              - pattern: $C.from($T).insert({ ...$BODY })
              - pattern: $C.from($T).update({ ...$BODY, ... })
              - pattern: $C.from($T).update({ ...$BODY })
          - focus-metavariable: $BODY

  # #601 (CX-14): the BARE-variable mass-assignment sink. harvey-mass-assignment above requires an
  # object SPREAD (`update({ ...body })`); this target passes the whole parsed request body directly
  # — `const body = await request.json(); supabase.from("profiles").update(body).eq("id", user.id)`.
  # A bare tainted variable as the ENTIRE payload is an even stronger over-posting signal than a
  # spread, but the spread-only sink never matched it. Precision is held by UNIFYING $BODY: the sink
  # variable must be the exact identifier declared from `await req.json()` / `req.body` in the same
  # function — a safe reconstructed object (`const upd = { name: body.name }; update(upd)`) has a
  # different RHS, so its variable never binds $BODY and it stays dark. This is why it is a separate
  # non-taint rule: taint would flow through the reconstruction and lose the distinction. Review tier
  # (same as harvey-mass-assignment — a static rule can't prove no allowlist runs elsewhere).
  - id: harvey-mass-assignment-bare
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      The whole parsed request body is passed directly as the insert/update payload (a bare
      variable, no field allowlist) — mass assignment. A caller can set any column the table
      exposes (role/is_admin/owner_id/price) by adding it to the JSON body. Destructure and pass
      an explicit list of allowed fields instead of the raw body object.
    patterns:
      - pattern-either:
          - pattern-inside: |
              const $BODY = await $REQ.json();
              ...
          - pattern-inside: |
              let $BODY = await $REQ.json();
              ...
          - pattern-inside: |
              const $BODY = $REQ.body;
              ...
      - pattern-either:
          - pattern: $C.from($T).update($BODY)
          - pattern: $C.from($T).insert($BODY)

  # #663 (M1 #614 follow-up): the pg/Express analogue of harvey-mass-assignment-bare — the raw
  # `req.body` reaches a repo write function's payload argument directly, no field allowlist. The
  # sink is name-gated to a write-verb prefix (update|insert|create|save|set) so this does NOT
  # match every `$FN($_, req.body)` — an arbitrary id-parameterized call (validation, logging) never
  # matches, only a call whose own name says it persists the payload. Bare identifier form ONLY (the
  # literal `req.body` expression as the argument, not a variable merely derived from it) — a
  # reconstructed/allowlisted object has a different AST shape and stays dark, same precision
  # discipline as the bare-variable Supabase rule above. Review tier (WARNING/MEDIUM): a static rule
  # can't prove no allowlist runs inside the named function.
  - id: harvey-pg-mass-assignment
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      The whole request body is passed directly as a repo write function's payload — mass
      assignment. A caller can set any column the write path exposes (role/is_admin/price) by
      adding it to the JSON body. Destructure and pass an explicit list of allowed fields instead.
    patterns:
      - pattern: $FN($ID, req.body)
      - metavariable-regex:
          metavariable: $FN
          regex: (?i)^(update|insert|create|save|set)[A-Za-z0-9_]*$

  # #614: a privilege/role decision is taken directly from a client-supplied request field. A plain
  # Express (or any HTTP) handler reads `req.body.isAdmin` / `req.body.role` / `req.query.*` and uses
  # it as an authorization gate or persists it — the client names its own privilege level (privilege
  # escalation, OWASP A01/API1). The role must come from the verified session (`session.user.role`),
  # never the request. Gated on BOTH the source root being an HTTP request (`req`/`request`, not an
  # arbitrary object — the #614 "non-Express req" precision concern) AND the field being an
  # unambiguous privilege flag, so a benign body field (`req.body.title`) or a session-derived flag
  # stays dark. Review tier (WARNING/MEDIUM): reading such a field usually IS the bug, but a handler
  # that reads it only to reject it is a benign shape a single-file rule can't tell apart, so it is
  # surfaced for triage rather than counted as high-precision. `role` is included despite being the
  # softest of the set (an admin-set invite can legitimately carry it) precisely because review tier
  # absorbs that ambiguity without touching the free count.
  - id: harvey-client-trusted-role
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-602: Client-Side Enforcement of Server-Side Security"]
      owasp: ["A04:2021 - Insecure Design"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      A privilege/role value is read directly from a client-supplied request field
      (req.body/req.query/req.params). If it gates authorization or is persisted, any caller can
      escalate their own privileges by adding the field to the request. Derive role/admin status
      from the verified session, never from the request.
    patterns:
      - pattern-either:
          - pattern: $REQ.body.$FLAG
          - pattern: $REQ.query.$FLAG
          - pattern: $REQ.params.$FLAG
      - metavariable-regex:
          metavariable: $REQ
          regex: ^(req|request)$
      - metavariable-regex:
          metavariable: $FLAG
          regex: (?i)^(is_?admin|is_?superuser|is_?root|is_?owner|admin|superuser|role)$

  # A full DB row (select('*')) is spread directly into a rendered component's props. In a Server
  # Component (no "use client" in this file), every column on that row serializes across the
  # Server -> Client Component boundary in the RSC payload, whether or not the target component
  # actually renders every field. Low severity, review only: proving a specific sensitive field
  # crosses the boundary needs cross-file knowledge this rule doesn't have (see spec §5).
  - id: harvey-server-client-leak
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Low
    message: >
      A full database row (select('*')) is spread directly into a rendered component's props —
      the whole row serializes across the Server -> Client Component boundary in the RSC payload.
      Map to an explicit DTO with only the fields the client needs before passing it down.
    patterns:
      - pattern: |
          const { $DATA } = await $C.from($T).select("*").eq($COL, $ID);
          ...
          <$COMP {...$DATA} />
      - pattern-not-inside: |
          "use client";
          ...

  # A module reads a server secret from process.env (name matching SECRET/SERVICE_ROLE/API_KEY/
  # a _TOKEN suffix, excluding NEXT_PUBLIC_-prefixed public vars) with no "import 'server-only'"
  # guard. Nothing stops an accidental import graph from a Client Component pulling this module
  # (and the secret) into the browser bundle. A "use client" module is excluded here — that's the
  # more specific, already-covered case (harvey-service-role-in-client, base.yml).
  - id: harvey-missing-server-only
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Low
    message: >
      This module reads a server secret from process.env but has no "import 'server-only'" guard
      — nothing stops it from being imported into a Client Component by mistake, which would ship
      the secret to the browser bundle. Add import "server-only" as the first line of the module.
    patterns:
      - pattern: process.env.$SECRET
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)^(?!NEXT_PUBLIC_).*(SECRET|SERVICE_ROLE|API_KEY|_TOKEN).*$
      - pattern-not-inside: |
          import "server-only";
          ...
      - pattern-not-inside: |
          "use client";
          ...

  # An auth/rate-limit check fails OPEN on a backing-store error: the catch block returns
  # allowed/true instead of failing closed. If the store (Redis/DB) is unreachable, every caller
  # is treated as authorized/under-limit — an outage becomes an auth/rate-limit bypass.
  - id: harvey-fail-open
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-285: Improper Authorization"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      On a backing-store error, this check fails OPEN (returns allowed/true) instead of failing
      closed. If the store is unreachable, every caller is treated as authorized/under-limit —
      an outage becomes an auth or rate-limit bypass. Return a deny/false default on error.
    patterns:
      - pattern-either:
          - pattern: |
              try {
                ...
              } catch ($E) {
                ...
                return { allowed: true };
                ...
              }
          - pattern: |
              try {
                ...
              } catch ($E) {
                ...
                return true;
                ...
              }

  # #560: application/seed/setup code creates a Supabase Storage bucket with `public: true`. A
  # public bucket skips storage RLS for reads, so every object in it is world-readable by URL
  # regardless of any policy. On vandyand/saas-security-teardown this made KYC/patient documents
  # (scripts/seed.mjs: createBucket("documents", { public: true })) globally readable. This is the
  # STATIC, source-only sibling of the connected-tier live check checkPublicBucketsWithNoPolicies
  # (src/scan/supabase-config.ts), which reads storage.buckets from a live DB; that live check is
  # never fed on the source or autonomous-dynamic paths (the M2 stand-up neutralizes the client
  # seed, so scripts/seed.mjs never runs and the bucket is never created to be observed). Review
  # tier / High severity: `public: true` is a definite fact, but whether the bucket legitimately
  # holds public assets (avatars, marketing images) vs. private data is not statically knowable --
  # confirm what the bucket stores. Matches both createBucket(id, {public:true}) and the
  # single-options-object form.
  - id: harvey-public-bucket
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-668: Exposure of Resource to Wrong Sphere"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      This code creates a Supabase Storage bucket with public: true. A public bucket skips storage
      RLS for reads — every object in it is readable by anyone who knows or can guess the URL,
      regardless of policies. If it holds private/user data (documents, uploads, PII), this is a
      broken object-authorization exposure. Set the bucket private and serve via signed URLs, or
      confirm it only holds intentionally-public assets.
    patterns:
      - pattern-either:
          - pattern: "$X.createBucket($NAME, { ..., public: true, ... })"
          - pattern: "$X.createBucket($NAME, { public: true })"
          - pattern: "$X.createBucket({ ..., public: true, ... })"
          - pattern: "$X.createBucket({ public: true })"

  # #561: a privileged/admin route handler AUTHENTICATES (reads the session via getUser/getSession)
  # but performs NO role/authorization check before reading or returning privileged data — broken
  # function-level authorization (OWASP API5 / BFLA). Distinct from harvey-route-noauth, which is
  # about a route reachable with NO session at all: here the route correctly 401s an anonymous
  # caller, but any AUTHENTICATED lower-privilege member passes. This is the real shape behind
  # vandyand #5 (app/api/admin/revenue/route.ts: getUser() then returns CFO revenue with no role
  # gate), which was previously only flagged by the filename+missing-auth-hint heuristic
  # (Unauthenticated debug/admin route) — a false rationale, since the route DOES authenticate.
  # Scoped to admin/internal/privileged path segments to hold precision (an authenticated route
  # with no role check is normal for a user reading their OWN data; it is a defect only for a
  # privileged surface). The pattern-not-regex clears any handler that references a role/authz gate
  # (a `.role` read, is_admin, requireRole/assertAdmin/authorize/permission, a 403/forbidden
  # response). Review tier / High severity — same negative-precision caveat as the rest of this file.
  # #586: the "authenticated" signal is auth-MECHANISM-neutral. #561 only recognized Supabase
  # getUser/getSession, so a CUSTOM-JWT-authenticated admin route (SuperRedHat F-04,
  # app/api/admin/users: `jwt.verify(token, secret)` then returns every user with no role gate) never
  # registered as authenticated and was MISSED. The pattern-either below now also fires on a custom
  # verify — a `$X.verify(...)` method call (jwt.verify / jsonwebtoken) or a bare auth-helper call
  # (jwtVerify/verifyToken/verifySession/verifyJwt/requireAuth/decodeToken, jose/next-auth/Clerk/Lucia
  # session shapes) — so an admin/privileged handler reached after ANY auth establishment with no
  # subsequent role comparison fires, regardless of mechanism. Kept path-scoped for precision.
  - id: harvey-authed-no-role-check
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-863: Incorrect Authorization"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    paths:
      include:
        - "*admin*"
        - "*internal*"
        - "*privileged*"
    message: >
      This admin/privileged route establishes a session (Supabase getUser/getSession or a custom
      jwt.verify/verifyToken/requireAuth) but performs no role/permission check before returning
      privileged data — broken function-level authorization (OWASP API5). It correctly rejects
      anonymous callers, but any authenticated lower-privilege user (e.g. a member) reaches it. Add
      a server-side role/permission gate after authenticating. SCOPE OF THIS CHECK: it reads only
      files whose path contains admin/internal/privileged — a privileged handler on any other path
      is not assessed — and it is a review-tier signal, so a role gate expressed in a form this rule
      does not recognise reads here as missing.
    patterns:
      - pattern: |
          export async function $M($REQ) {
            ...
          }
      - metavariable-regex:
          metavariable: $M
          regex: ^(GET|POST|PUT|DELETE|PATCH)$
      - pattern-either:
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                getUser(...)
                ...
              }
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                $S.auth.getUser(...)
                ...
              }
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                getSession(...)
                ...
              }
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                $S.auth.getSession(...)
                ...
              }
          # #586 — custom-JWT / non-Supabase auth establishment: a `$X.verify(...)` method call
          # (jwt.verify / jsonwebtoken) inside the handler.
          - pattern-inside: |
              export async function $M($REQ) {
                ...
                $V.verify(...)
                ...
              }
          # #586 — a bare auth-helper call (jose jwtVerify, verifyToken/verifySession/verifyJwt/
          # requireAuth/decodeToken helpers) inside the handler.
          - patterns:
              - pattern-inside: |
                  export async function $M($REQ) {
                    ...
                    $AUTHFN(...)
                    ...
                  }
              - metavariable-regex:
                  metavariable: $AUTHFN
                  regex: ^(jwtVerify|verifyJwt|verifyJWT|verifyToken|verifyAccessToken|verifySession|verifyAuth|requireAuth|decodeToken)$
      # #1093: same LINE_PREFIX block-comment hole as harvey-route-noauth above, and the same fix —
      # this rule now matches unconditionally and `partitionGuardTokenSuppressed`
      # (src/scan/semgrep.ts) re-derives the role/permission-gate check on a comment/string-
      # stripped copy of the matched span. See harvey-route-noauth's comment for the full record
      # (why the AST alternative was tried and rejected, MEASURED/TRIED 2026-07-26).
