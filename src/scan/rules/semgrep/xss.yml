# Batch B4 — XSS / client-side sink family (#71, spec §"Batch 2 — XSS & client-side sink
# family"). Per-batch custom-rule file (see base.yml header for the directory convention).
# Taint mode with request/DOM sources (Pages-Router router.query, URLSearchParams .get(),
# location.hash/.search, App-Router searchParams), mirroring the base DSIH/SSRF rules. Tiering
# follows the locked preamble: only ~100%-precision sinks are ERROR + HIGH confidence (free
# count) — .innerHTML/insertAdjacentHTML and document.write, both of which execute markup/script
# unconditionally with no legitimate "safe by default" reading once the source is tainted. The
# heuristic sinks (href schemes, window.location assignment, setAttribute, a DB-read source
# reaching dangerouslySetInnerHTML) are WARNING + MEDIUM → review tier, exactly as the spec
# quarantines them. harvey-dangerously-set-inner-html (reflected, request-sourced, high) already
# ships in base.yml; this file adds the DB-sourced (stored) variant and the DOM/client sinks.
#
# Exercised against targets/calibration by `pnpm validate:calibration`; see GROUND-TRUTH.md §B4.
#
# ---------------------------------------------------------------------------------------------
# THE CANONICAL DOM/CLIENT SOURCE BLOCK (#1223). The client-side sibling of base.yml's
# request-source block, and it exists for the same reason: the five client sink rules below each
# carried their own hand-copied list and they had drifted apart. MEASURED 2026-07-27
# (semgrep 1.164.0), with paired controls firing on the same sinks —
# `harvey-open-url-sink`, `harvey-set-attribute-xss` and `harvey-href-js-url` were all silent on
# `location.hash` and `location.search` while `harvey-dom-innerhtml` and `harvey-document-write`
# already declared both.
#
# The fragment is the source that matters most here and the one that was missing: `location.hash`
# never reaches the server, so it is invisible to every server-side control, and it is the shape
# most client-side XSS proofs-of-concept use.
#
# `useSearchParams()` is kept even though `$SP.get(...)` subsumes the common read — unifying on the
# UNION is the conservative move, and the defect being fixed is the divergence, not the redundancy.
# The canonical request-taint source block (#1221) — see base.yml for the rationale, which is not
# repeated here. Copied because YAML anchors resolve at parse time and do not cross documents;
# shared-sources.test.ts fails loud if any copy drifts. xss.yml needs it for harvey-jsx-prop-spread-
# injection (#1237), whose sink lives on BOTH sides of the server/client boundary.
x-request-source: &request_source
  pattern-either:
    # Express / Pages-Router accessors, plus the App Router handler parameter.
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            # #984: cookies/headers are attacker-controllable request sources (session tokens,
            # X-Forwarded-*, User-Agent, custom headers) — a well-known injection entry point.
            - pattern: $REQ.cookies
            - pattern: $REQ.headers
            # #987: method-form request accessors (Express req.get('X-…')/req.header('X-…')). The
            # destructured/bracket/aliased/multi-hop forms propagate through semgrep's taint
            # dataflow once the base object is a source; the method form is a distinct call shape.
            - pattern: $REQ.get(...)
            - pattern: $REQ.header(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^_?(req|request|nextReq|nextRequest|httpReq|incoming)$
    # #1221: the App Router query string. `$U.searchParams` subsumes `req.nextUrl.searchParams`
    # AND the split `const u = new URL(req.url); u.searchParams.get(…)` form, so neither needs its
    # own pattern; the `.get(...)` arm carries the inline `new URL(req.url).searchParams.get(…)`
    # call. A BARE `$SP.get(...)` is deliberately NOT used — measured to fire on Map/Headers/
    # config/FormData `.get()` even behind the `^(?!(https?|axios)$)` http-client guard.
    - pattern: $U.searchParams.get(...)
    - pattern: $U.searchParams
    # #1221: the App Router request body — the shape 17 of 21 rules were blind to.
    - pattern: await $REQ.json()
    # #984: App Router next/headers request sources.
    - pattern: cookies()
    - pattern: headers()
    # #1240: the App Router SERVER COMPONENT request props. A page/layout receives its dynamic route
    # segments and query string as DESTRUCTURED PARAMETERS — `{ params }` / `{ searchParams }` — and
    # never as a `req` object, so every arm above is blind to the idiomatic RSC page. Found through
    # the SSRF facet (P-OWASP-REACT-RSC-SSRF), but the gap was never SSRF's: the shared block did not
    # model the source, so all 21 rules missed it.
    #
    # Reached by NAME because semgrep OSS cannot match a destructured object parameter in JS/TS
    # (TRIED 2026-07-27, semgrep 1.164.0 — `function $C({ ..., $P, ... }, ...) { ... }` and three
    # variants matched nothing on a file the equivalent name-based rule matched twice). The
    # `pattern-not-inside` is what makes the name safe: a locally-ASSIGNED `params`/`searchParams` is
    # an options bag, a URLSearchParams the module built itself, or a Map alias — never a request
    # prop, because a destructured parameter is never assigned. MEASURED against five benign probes
    # (options object, axios config, locally-built URLSearchParams, Map alias, RPC argument bag): the
    # bare name-constrained access fired on THREE of five; with the not-inside it fires on none,
    # while all four RSC positives still fire. `await $RSCPROP` carries the Next 15 shape, where
    # `params` is a Promise the component awaits before destructuring.
    - patterns:
        - pattern-either:
            - pattern: $RSCPROP.$RSCFIELD
            - pattern: await $RSCPROP
        - metavariable-regex:
            metavariable: $RSCPROP
            regex: ^(params|searchParams)$
        - pattern-not-inside: |
            $RSCPROP = ...
            ...
#
x-dom-source: &dom_source
  pattern-either:
    - pattern: location.hash
    - pattern: location.search
    - pattern: router.query.$K
    - pattern: $RT.query.$K
    - pattern: $SP.get(...)
    - pattern: useSearchParams()
#
# The guard these URL/HTML sinks clear on: the repo's standard (a2) validator guard — an ANCHORED,
# POSITIVE-class regex test or an exact-match allowlist, each with an early return. Same soundness
# constraints as every other (a2) arm in this directory: an unanchored regex matches a prefix, a
# negated class is a denylist, and a failure branch that does not return leaves the value live.
# Both early-return spellings are matched — client handlers write the braceless form constantly.
x-dom-url-guard: &dom_url_guard
  by-side-effect: true
  patterns:
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... return; }
                - pattern: |
                    if (!$RE.test($X)) return ...;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - pattern: |
            if (!$ARR.includes($X)) { ... return; }
        - pattern: |
            if (!$ARR.includes($X)) return ...;
        - pattern: |
            if (!$SET.has($X)) { ... return; }
        - pattern: |
            if (!$SET.has($X)) return ...;
    - focus-metavariable: $X
# ---------------------------------------------------------------------------------------------

rules:
  # DOM XSS via .innerHTML / insertAdjacentHTML assigned a request/URL-controlled value. High —
  # both sinks execute any <script>/event-handler markup in the string unconditionally; there is
  # no benign "just text" reading of an innerHTML assignment from a tainted source.
  - id: harvey-dom-innerhtml
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
      # #455: standard, unambiguous CWE/OWASP mapping — same bug class as
      # harvey-dangerously-set-inner-html (base.yml).
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      A request/URL-controlled value is assigned to .innerHTML / insertAdjacentHTML — DOM XSS.
      Sanitize (e.g. DOMPurify.sanitize) before assigning, or use textContent for plain text.
    pattern-sources:
      - *dom_source
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      # #1066: a BARE `sanitize(...)` cleared the sink even when `sanitize` was a pass-through
      # no-op defined three lines below it — the audited party could silence a real XSS by naming
      # a function. The name carries meaning only if it resolves to a library, so require an
      # import binding. Adversarial positive: P-XSS-LOCAL-SANITIZE.
      - patterns:
          - pattern: sanitize(...)
          - pattern-inside: |
              import { sanitize } from "$MOD";
              ...
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      # #1027: (a2) SCHEMA-validator guard — zod/valibot `safeParse` + an early return on
      # `!result.success`. Measured as the largest unmodeled sub-population in the #989 census and
      # the idiomatic shape in real Next/Express code, unlike BenchProctor's bare regex guards.
      #
      # What makes it sound is that the sink receives `$P.data` — a value the SCHEMA produced —
      # rather than the original input, so this is closer to a transformation than a gate. But
      # `z.string()` alone accepts every string, i.e. `.data` IS the raw input: the schema must
      # carry a real allowlist. Hence the SAME constraints as the regex form, each with a
      # calibration positive that must still fire: an ANCHORED, POSITIVE-class `.regex(...)`, or a
      # `.enum([...])` membership list; and a failure branch that RETURNS. A guard on one variable
      # while the sink reads another (`$P.data` never used) is untouched by construction.
      # #1236: the braceless `if (!$P.success) return ...;` spelling is matched too — see the
      # (a2) block above.
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $VAL
              - pattern: $EL.insertAdjacentHTML($POS, $VAL)
          - focus-metavariable: $VAL

  # DOM XSS via document.write(). High — document.write executes any <script> tag in its
  # argument unconditionally once the browser is parsing it; a URL/DOM source is ~100% precise.
  - id: harvey-document-write
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
      # #455: standard, unambiguous CWE/OWASP mapping — same bug class as
      # harvey-dangerously-set-inner-html (base.yml).
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      document.write() is called with a request/URL-controlled value — DOM XSS (document.write
      executes any script in its argument). Remove document.write, or sanitize and use a safe
      DOM API (textContent / a sanitized innerHTML assignment).
    pattern-sources:
      - *dom_source
    pattern-sinks:
      - patterns:
          - pattern: document.write($VAL)
          - focus-metavariable: $VAL

  # Reflected/stored XSS variant: a DATABASE-READ value (a Supabase select result) reaches
  # dangerouslySetInnerHTML unsanitized. Review — a static rule can't confirm whether the write
  # path sanitized the value before it was persisted.
  - id: harvey-dangerously-set-inner-html-stored
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
      # #455: standard, unambiguous CWE/OWASP mapping — same bug class as
      # harvey-dangerously-set-inner-html (base.yml).
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      A database-read value (Supabase select result) reaches dangerouslySetInnerHTML unsanitized
      — stored XSS (the payload was persisted by an earlier write, e.g. a comment body). Sanitize
      before rendering, or sanitize at write time.
    pattern-sources:
      - pattern: $C.from($T).select(...)
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      # #1066: a BARE `sanitize(...)` cleared the sink even when `sanitize` was a pass-through
      # no-op defined three lines below it — the audited party could silence a real XSS by naming
      # a function. The name carries meaning only if it resolves to a library, so require an
      # import binding. Adversarial positive: P-XSS-LOCAL-SANITIZE.
      - patterns:
          - pattern: sanitize(...)
          - pattern-inside: |
              import { sanitize } from "$MOD";
              ...
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      # #1027: (a2) SCHEMA-validator guard — zod/valibot `safeParse` + an early return on
      # `!result.success`. Measured as the largest unmodeled sub-population in the #989 census and
      # the idiomatic shape in real Next/Express code, unlike BenchProctor's bare regex guards.
      #
      # What makes it sound is that the sink receives `$P.data` — a value the SCHEMA produced —
      # rather than the original input, so this is closer to a transformation than a gate. But
      # `z.string()` alone accepts every string, i.e. `.data` IS the raw input: the schema must
      # carry a real allowlist. Hence the SAME constraints as the regex form, each with a
      # calibration positive that must still fire: an ANCHORED, POSITIVE-class `.regex(...)`, or a
      # `.enum([...])` membership list; and a failure branch that RETURNS. A guard on one variable
      # while the sink reads another (`$P.data` never used) is untouched by construction.
      # #1236: the braceless `if (!$P.success) return ...;` spelling is matched too — see the
      # (a2) block above.
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $VAL }} />"
              - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $VAL }}>...</$EL>"
          - focus-metavariable: $VAL

  # #613 (vibe-dummy stage-06/10): a prop/param/identifier value reaches dangerouslySetInnerHTML with
  # no sanitizer. The stored rule above keys its source on a Supabase select; the base reflected rule
  # keys on request sources. Neither matches the very common React shape where the tainted HTML arrives
  # as a component PROP or function parameter — `<div dangerouslySetInnerHTML={{ __html: user.bio }} />`,
  # `__html: html`, `__html: inquiry.messageHtml`. This is a non-taint structural rule: $VAL is any
  # NON-literal, NON-sanitized expression (a string literal — including a propagated const like
  # STATIC_BIO — and a DOMPurify.sanitize/sanitizeHtml/sanitize/escapeHtml wrap are excluded via
  # metavariable-pattern). Review tier (MEDIUM): a static rule can't prove the value was sanitized
  # upstream, so it is surfaced, not free-counted — safe JSX text interpolation ({user.bio}) is not a
  # dangerouslySetInnerHTML sink and never matches, which is what keeps this precise.
  - id: harvey-dangerously-set-inner-html-prop
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      A prop/parameter/identifier value reaches dangerouslySetInnerHTML with no sanitizer. If any of
      the data on this path is user-controlled (a bio, a comment, markdown, an AI-generated string),
      this is stored/reflected XSS. Sanitize with DOMPurify.sanitize before it reaches __html, or
      render the value as text.
    patterns:
      - pattern-either:
          - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $VAL }} />"
          - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $VAL }}>...</$EL>"
      - metavariable-pattern:
          metavariable: $VAL
          patterns:
            - pattern-not: '"..."'
            - pattern-not: DOMPurify.sanitize(...)
            - pattern-not: sanitizeHtml(...)
            - pattern-not: escapeHtml(...)
      # #1066: the bare `sanitize(...)` exclusion moved OUT of the metavariable-pattern (which has
      # no file context to check an import against) and is re-applied here bound to an import — a
      # locally-defined pass-through named `sanitize` no longer clears this sink.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: "<$EL dangerouslySetInnerHTML={{ __html: sanitize(...) }} />"
                - pattern: "<$EL dangerouslySetInnerHTML={{ __html: sanitize(...) }}>...</$EL>"
            - pattern-inside: |
                import { sanitize } from "$MOD";
                ...
      - focus-metavariable: $VAL

  # javascript: URL XSS via a native <a href>. Review — a static rule can't see whether a scheme
  # allowlist runs elsewhere before render; the sink is scoped to a plain <a>, not next/link's
  # <Link> (an internal-route string on <Link> is a different element and not a scheme sink).
  - id: harvey-href-js-url
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A request-controlled value reaches an <a href> with no scheme allowlist — an attacker can
      supply javascript: to run script in the victim's session (XSS) on click.
    pattern-sources:
      - *dom_source
    pattern-sanitizers:
      - *dom_url_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "<a href={$URL}>...</a>"
              - pattern: "<a href={$URL} />"
          - focus-metavariable: $URL

  # Open-URL sink: a request-controlled value assigned directly to window.location. Review — any
  # URL enables phishing/open-redirect, and a javascript:/data: value can execute script; a
  # static rule can't see a host allowlist that may run first.
  - id: harvey-open-url-sink
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A request/URL-controlled value is assigned directly to window.location — an
      attacker-chosen javascript:/data: value can execute script, and any URL enables
      phishing/open-redirect. Validate against a host allowlist first.
    pattern-sources:
      - *dom_source
    pattern-sanitizers:
      - *dom_url_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: window.location = $URL
              - pattern: window.location.href = $URL
              - pattern: location.href = $URL
          - focus-metavariable: $URL

  # javascript: URL XSS via setAttribute("href"/"src", ...). Review — same reasoning as the <a
  # href> sink, generalized to imperative DOM attribute writes.
  - id: harvey-set-attribute-xss
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A request-controlled value is passed to setAttribute("href"/"src", ...) with no scheme
      allowlist — an attacker can supply a javascript: URL that runs script on click/load.
    pattern-sources:
      - *dom_source
    pattern-sanitizers:
      - *dom_url_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $EL.setAttribute("href", $VAL)
              - pattern: $EL.setAttribute("src", $VAL)
          - focus-metavariable: $VAL

  # ---- Batch B12 (#71) — Next-config & client-surface misconfig (client-surface half; the
  # config/server-response half lives in headers.yml). See GROUND-TRUTH.md §B12. ----

  # postMessage() with targetOrigin '*' broadcasts the message to whatever site currently frames the
  # page — any origin can read it. When the payload is session/auth data this leaks it cross-origin.
  # The literal "*" targetOrigin is unambiguous; an explicit origin does not match. #996 (operator
  # decision): the "*" is exact but whether the DATA is sensitive is a semantic judgment the
  # mechanical tier cannot make (the common real-world shape — player/embed commands, resize
  # events — is benign; carbon's one hit was a lesson-player route). Still ERROR + HIGH (the fact
  # is exact, so it reaches the free report) but harveyTaxonomy routes it to the non-grading
  # informational section; the paid LLM pass makes the sensitivity call. Taxonomy string must stay
  # in sync with POSTMESSAGE_WILDCARD_TAXONOMY in src/scan/semgrep.ts (pinned by semgrep.test.ts).
  - id: harvey-postmessage-wildcard
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-346: Origin Validation Error"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      category: security
      harveySeverity: Medium
      harveyTaxonomy: "postMessage to any origin — a leak only if the data is sensitive (confirm)"
    message: >
      postMessage() is called with targetOrigin '*' — the message is delivered to any site that
      frames this page. That is a cross-origin leak only if the data is sensitive (session/auth
      material), which this scan cannot verify — confirm, or pass the exact expected origin as
      the second argument instead of '*'. Not counted in the grade; the deep scan judges the
      payload's sensitivity.
    patterns:
      - pattern-either:
          - pattern: $W.postMessage($DATA, "*")
          - pattern: postMessage($DATA, "*")

  # A window 'message' listener whose callback never inspects event.origin trusts data posted by ANY
  # page (including a malicious frame/opener). The callback text carrying no `.origin` reference is
  # the signal; an origin-checked callback is excluded. Review — a heuristic (the origin check could
  # be a helper the callback calls). See N-POSTMESSAGE-NO-ORIGIN-OK.
  - id: harvey-postmessage-no-origin
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-346: Origin Validation Error"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A window 'message' event listener uses event.data with no event.origin check — any page can
      post data into your app. Validate event.origin against an allowlist before trusting the
      message.
    patterns:
      - pattern-either:
          - pattern: $W.addEventListener("message", $CB)
          - pattern: addEventListener("message", $CB)
      - metavariable-regex:
          metavariable: $CB
          regex: (?s)^(?!.*\.origin).*$

  # An app-issued auth/session token stashed in Web Storage (localStorage/sessionStorage) is readable
  # by any injected script — one XSS exfiltrates a live session. Name-gated on the storage key: keys
  # naming an auth/access/refresh/id/session token match; a 'csrf'-prefixed key (JS-readable by
  # design) does not. Review — some 'token'-named values are legitimately client-readable. See
  # N-WEBSTORAGE-CSRF.
  - id: harvey-token-in-webstorage
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-522: Insufficiently Protected Credentials"]
      owasp: ["A04:2021 - Insecure Design"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      An auth/session token is written to Web Storage (localStorage/sessionStorage), which is
      readable by any injected script — an XSS can steal the session. Keep session tokens in an
      HttpOnly cookie instead.
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem($K, $V)
          - pattern: sessionStorage.setItem($K, $V)
          - pattern: window.localStorage.setItem($K, $V)
          - pattern: window.sessionStorage.setItem($K, $V)
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^['"]?(auth|access|refresh|id|jwt|bearer|session)[-_]?token

  # A third-party CDN <script> loaded with no Subresource Integrity hash — if the CDN/URL is
  # compromised, arbitrary script runs in this origin. External http(s) src with no integrity
  # attribute matches; a first-party/relative src, or one carrying integrity, does not. Review —
  # first-party scripts don't need SRI and some setups pin integrity elsewhere. See N-SRI-PRESENT.
  - id: harvey-missing-sri
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-353: Missing Support for Integrity Check"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A third-party CDN <script> is loaded with no Subresource Integrity (integrity=) hash — a
      compromised CDN can serve arbitrary script into your origin. Add integrity="sha384-..." and
      crossOrigin, or self-host the script.
    patterns:
      - pattern-either:
          - pattern: <script src=$SRC></script>
          - pattern: <script src=$SRC />
      - metavariable-regex:
          metavariable: $SRC
          regex: (?i)^['"]?https?://
      - pattern-not: <script src=$SRC integrity=$I></script>
      - pattern-not: <script src=$SRC integrity=$I />
      - pattern-not: <script src=$SRC integrity=$I crossOrigin=$C></script>
      - pattern-not: <script src=$SRC integrity=$I crossOrigin=$C />

  # #1237 — PROP INJECTION VIA THE SPREAD OPERATOR. OWASP React Security CS (draft), XSS Prevention:
  # `<Field {...userInput} />` where the object is attacker-controlled lets the caller supply props
  # the component never meant to accept — including `dangerouslySetInnerHTML` itself. The XSS sink is
  # reached WITHOUT THE SOURCE EVER NAMING A SINK, which is precisely why every dangerouslySetInnerHTML
  # rule above stays dark on it: they key on the attribute, and here the attribute is data.
  #
  # Both source vocabularies, because this sink lives on both sides of the boundary: a Client
  # Component spreads a value off the URL (*dom_source), a Server Component spreads one off the
  # request (*request_source). Review tier, not free count — the shippability of this rule rests
  # entirely on the sanitizer below, and a heuristic sanitizer is not a ~100%-precision boundary.
  #
  # THE SANITIZER IS THE RULE. Without it this fires on every spread in every React codebase and is
  # unshippable; with a LOOSE one it repeats #1066, where a sanitizer that does nothing read as
  # protection. So the allowlist must be a real membership test: MEASURED 2026-07-27, the bare
  # `Object.fromEntries(Object.entries($O).filter(...))` shape also cleared a planted
  # `.filter(() => true)` no-op, and constraining the predicate to `.has`/`.includes` rejects it
  # while still clearing the sheet's own remedy. `pick($O, …)` is an allowlist by construction.
  - id: harvey-jsx-prop-spread-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      An attacker-controlled object is spread into a component's props — the caller chooses which
      props the component receives, including dangerouslySetInnerHTML, so this is an XSS sink that
      never names one. Filter the object against an explicit allowlist of prop names before
      spreading it, and never use a blocklist (new dangerous props keep being added).
    pattern-sources:
      - *dom_source
      - *request_source
    pattern-sanitizers:
      - pattern: Object.fromEntries(Object.entries($O).filter((...) => $ALLOW.has(...)))
      - pattern: Object.fromEntries(Object.entries($O).filter((...) => $ALLOW.includes(...)))
      - pattern: pick($O, ...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: <$EL {...$X} />
              - pattern: <$EL {...$X}>...</$EL>
          - focus-metavariable: $X
