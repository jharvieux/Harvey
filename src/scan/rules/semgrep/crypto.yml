# Batch B6 — JWT / crypto / randomness (#71, spec §"Batch 8 — JWT / crypto / randomness"). Per-batch
# custom-rule file (see base.yml header for the directory convention). Tiering follows the locked
# preamble: only ~100%-precision sinks are ERROR + HIGH confidence (free count) — an explicit
# `algorithms:['none']` JWT verify, a weak hash (md5/sha1) whose immediate input is named like a
# password/token/secret/signature (the sink-gating that separates it from a non-security cache-key
# hash), a named-weak cipher (DES/RC4/ECB), and an explicit `rejectUnauthorized: false`/
# `NODE_TLS_REJECT_UNAUTHORIZED=0`. The rest (unverified jwt.decode(), a hardcoded/static IV,
# Math.random() feeding a token/secret-named sink, a raw password column with no hash fn) are
# WARNING + MEDIUM → review tier — each needs more context than a static rule can see.
#
# Exercised against targets/calibration by `pnpm validate:calibration`; see GROUND-TRUTH.md §B6.

rules:
  # JWT verified with algorithms:['none'] (or 'none' present in the allowlist) — the classic
  # "alg confusion" bypass: an attacker crafts an unsigned token and the app trusts it. The
  # explicit literal "none" in the algorithms array is the ~100%-precision signal.
  - id: harvey-jwt-none-alg
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: Critical
      # #455: signature-verification bypass is definitionally CWE-347; OWASP A02:2021
      # (Cryptographic Failures) is where signature/verification bugs land in the 2021 mapping.
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    message: >
      jwt.verify() allows the "none" algorithm — an attacker can present an unsigned token with
      an arbitrary payload and it will verify successfully. Remove "none" from the algorithms
      allowlist (allowlist only the specific algorithm your signing key uses, e.g. RS256).
    patterns:
      - pattern-either:
          - pattern: 'jwt.verify($T, $K, { ..., algorithms: [..., "none", ...], ... })'
          - pattern: 'jsonwebtoken.verify($T, $K, { ..., algorithms: [..., "none", ...], ... })'

  # jwt.decode() reads the payload WITHOUT checking the signature. Review — decode() has
  # legitimate non-authz uses (e.g. reading `exp` client-side before a refresh); this rule
  # flags every use as a heuristic because distinguishing "used for an authz decision" from
  # "informational read" needs the caller's control-flow context, not just the call site.
  - id: harvey-jwt-decode-noverify
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      jwt.decode() reads the token's claims WITHOUT verifying the signature. If the result feeds
      an authorization decision, anyone can forge a token with an arbitrary claim (no key
      needed). Use jwt.verify() (with an explicit algorithms allowlist) for anything security-relevant.
    patterns:
      - pattern-either:
          - pattern: jwt.decode($T)
          - pattern: jsonwebtoken.decode($T)

  # Weak hash (MD5/SHA-1) whose immediate input is named like a password/token/secret/signature —
  # the sink-gating signal that separates a SECURITY use (broken: no work factor, crackable via
  # rainbow tables / collision attacks) from a non-security cache-key/ETag fingerprint (the
  # N-WEAK-HASH-CACHE shape in lib/cache.js, which hashes `JSON.stringify(params)` — no match).
  - id: harvey-weak-hash-security
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      MD5/SHA-1 hashes a password/token/secret/signature value directly — both are
      cryptographically broken (collision + rainbow-table attacks) and unsafe for anything
      security-sensitive. Use bcrypt/argon2 for passwords, HMAC-SHA256+ for signatures/integrity.
    patterns:
      - pattern-either:
          - pattern: crypto.createHash("md5").update($ARG)
          - pattern: crypto.createHash("sha1").update($ARG)
      - metavariable-regex:
          metavariable: $ARG
          regex: (?i).*(password|pwd|passwd|secret|token|signature|signing).*

  # Named-weak cipher: DES/3DES/RC4 (broken by brute force / bias attacks) or AES in ECB mode
  # (identical plaintext blocks encrypt identically — leaks structure). The algorithm literal is
  # an unambiguous, ~100%-precision signal.
  - id: harvey-weak-cipher
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      A cryptographically weak or broken cipher (DES/3DES/RC4, or AES in ECB mode) is used for
      encryption. DES/RC4 fall to brute force; ECB mode leaks plaintext structure. Use
      AES-256-GCM (or another authenticated mode) with a freshly-random IV per encryption.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv("des", ...)
          - pattern: crypto.createCipheriv("des-cbc", ...)
          - pattern: crypto.createCipheriv("des-ecb", ...)
          - pattern: crypto.createCipheriv("des-ede3", ...)
          - pattern: crypto.createCipheriv("des-ede3-cbc", ...)
          - pattern: crypto.createCipheriv("rc4", ...)
          - pattern: crypto.createCipheriv("rc4-40", ...)
          - pattern: crypto.createCipheriv("aes-128-ecb", ...)
          - pattern: crypto.createCipheriv("aes-192-ecb", ...)
          - pattern: crypto.createCipheriv("aes-256-ecb", ...)
          - pattern: crypto.createDecipheriv("des", ...)
          - pattern: crypto.createDecipheriv("des-cbc", ...)
          - pattern: crypto.createDecipheriv("des-ecb", ...)
          - pattern: crypto.createDecipheriv("des-ede3", ...)
          - pattern: crypto.createDecipheriv("des-ede3-cbc", ...)
          - pattern: crypto.createDecipheriv("rc4", ...)
          - pattern: crypto.createDecipheriv("aes-128-ecb", ...)
          - pattern: crypto.createDecipheriv("aes-192-ecb", ...)
          - pattern: crypto.createDecipheriv("aes-256-ecb", ...)

  # Hardcoded/static IV: the third createCipheriv/createDecipheriv argument is a literal string
  # wrapped in Buffer.from (not freshly random per call). Review — a static rule can't confirm the
  # value is reused across every call (vs. e.g. read from a per-record config), only that it's a
  # literal at this call site, which is already a strong smell.
  - id: harvey-static-iv
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      The IV passed to createCipheriv/createDecipheriv is a hardcoded literal, not freshly random
      per encryption. Reusing an IV with the same key breaks CBC/CTR/GCM's security guarantees
      (CBC leaks identical plaintext blocks; CTR/GCM can be fully broken). Generate it with
      crypto.randomBytes() for every call.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv($ALGO, $KEY, Buffer.from($IV, ...))
          - pattern: crypto.createDecipheriv($ALGO, $KEY, Buffer.from($IV, ...))
      - metavariable-regex:
          metavariable: $IV
          regex: ^".*"$

  # Math.random() (a non-cryptographic, predictable PRNG) feeding a function whose name signals a
  # security-sensitive value (token/secret/otp/session/password/reset). Review — the name-based
  # gate gives it a real signal without needing dataflow to a specific sink; a UI-jitter/animation
  # use (N-RANDOM-NONSEC) has no such name and stays silent.
  - id: harvey-insecure-random-token
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      Math.random() is not cryptographically secure (its internal state is predictable/seedable)
      and this function's name signals a security-sensitive value (token/secret/session/otp).
      Use crypto.randomBytes()/crypto.randomUUID() for anything security-relevant.
    patterns:
      - pattern: Math.random()
      - pattern-inside: |
          function $FN(...) { ... }
      - metavariable-regex:
          metavariable: $FN
          regex: (?i).*(token|secret|otp|session|password|reset).*

  # Plaintext password: a request body value is written directly to a `password` column/field
  # with no hash-function call in between. Review — a heuristic (no dataflow proof that no
  # hashing ever happens; only that this direct shape has none at the call site).
  - id: harvey-plaintext-password
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      A request-controlled value is written directly to a `password` column with no hashing step
      (bcrypt/argon2) in between — passwords land in the DB in plaintext. Hash with bcrypt/argon2
      before persisting; never store or compare raw passwords.
    patterns:
      - pattern-either:
          - pattern: '$C.insert({ ..., password: req.body.$K, ... })'
          - pattern: '$C.update({ ..., password: req.body.$K, ... })'

  # TLS certificate verification explicitly disabled — either per-connection
  # (rejectUnauthorized: false) or process-wide (NODE_TLS_REJECT_UNAUTHORIZED=0). Either way any
  # man-in-the-middle can present an arbitrary certificate and it will be trusted silently.
  - id: harvey-tls-verify-disabled
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: Critical
      # #493: CWE-295 is definitional. Verified against OWASP's official Top-10-2021 CWE mapping
      # (owasp.org/Top10/2021/A07_2021-Identification_and_Authentication_Failures/) — CWE-295 is
      # listed under A07 (Identification and Authentication Failures), not A02; A02's own mapped-CWE
      # list does not include CWE-295 (it has CWE-296, a distinct cert-chain-of-trust weakness).
      # Corrected from A02:2021 - Cryptographic Failures, applied under #455 from general knowledge.
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
    message: >
      TLS certificate verification is explicitly disabled (rejectUnauthorized: false, or
      NODE_TLS_REJECT_UNAUTHORIZED=0). Any man-in-the-middle can present an arbitrary certificate
      and this client will trust it silently — fix the underlying certificate problem instead.
    patterns:
      - pattern-either:
          - pattern: "{ ..., rejectUnauthorized: false, ... }"
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  # ---- Batch B11 (#71) — crypto-API misuse & JWT-verify options (roadmap §3c) ----

  # createCipher/createDecipher (no explicit IV): the legacy API derives key+IV from the passphrase
  # via a weak MD5-based KDF, so the IV is fixed for a given passphrase (IV reuse). Deprecated in
  # Node for exactly this reason. Exact-API name match → high (createCipheriv/createDecipheriv, the
  # correct IV-taking calls, are a different identifier and do not match).
  - id: harvey-crypto-createcipher
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      crypto.createCipher()/createDecipher() derive the key and IV from the passphrase with a weak
      KDF and reuse the IV for a given passphrase. Use createCipheriv()/createDecipheriv() with a
      key and a freshly-random IV per encryption.
    patterns:
      - pattern-either:
          - pattern: crypto.createCipher(...)
          - pattern: crypto.createDecipher(...)

  # crypto.pseudoRandomBytes(): an alias that does NOT draw from the CSPRNG — predictable output,
  # unsafe for tokens/secrets/keys/IVs. Exact-API name match → high (randomBytes is a different
  # identifier).
  - id: harvey-crypto-pseudorandombytes
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      crypto.pseudoRandomBytes() is not cryptographically secure (it does not use the CSPRNG) and
      its output is predictable. Use crypto.randomBytes() for any security-sensitive value.
    patterns:
      - pattern: crypto.pseudoRandomBytes(...)

  # jwt.verify() with NO algorithms allowlist (2-argument form). With an asymmetric signing key an
  # attacker can forge an HS256 token that HMACs the public key bytes and it verifies — RS256/HS256
  # algorithm confusion. The 2-arg pattern is exact (a 3-arg verify with an options object does not
  # match), so → high.
  - id: harvey-jwt-verify-noalg
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
      # #455: same underlying signature-verification weakness class as harvey-jwt-none-alg above.
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    message: >
      jwt.verify() is called with no `algorithms` allowlist. With an asymmetric key this enables the
      RS256/HS256 algorithm-confusion bypass. Always pass { algorithms: ['<your-alg>'] }.
    patterns:
      - pattern-either:
          - pattern: jwt.verify($T, $K)
          - pattern: jsonwebtoken.verify($T, $K)

  # jwt.verify(..., { ignoreExpiration: true }) — expired tokens are honoured, defeating token
  # expiry/revocation. The explicit literal option is an unambiguous, ~100%-precision signal → high.
  - id: harvey-jwt-ignore-exp
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      jwt.verify() is called with { ignoreExpiration: true } — expired tokens are accepted, so a
      revoked/stale session token is honoured forever. Remove the option (expiry is enforced by default).
    patterns:
      - pattern-either:
          - pattern: "jwt.verify($T, $K, { ..., ignoreExpiration: true, ... })"
          - pattern: "jsonwebtoken.verify($T, $K, { ..., ignoreExpiration: true, ... })"

  # #595 (SuperRedHat F-09): jwt.sign() with NO expiry. The 2-argument form has no options object at
  # all, so no `expiresIn`; the 3-argument INLINE-object form is flagged only when the options literal
  # has no `expiresIn` key (pattern-not). A variable options argument is NOT flagged — this rule can't
  # see whether expiresIn lives inside it, so it stays out to preserve precision. Review tier: a token
  # with no expiry is a real weakness (it can't be revoked by time), but a deliberately long-lived
  # token is a legitimate design choice, so it is surfaced, not free-counted. harvey-jwt-verify-noalg
  # is the verify-side (unpinned alg); this is the sign-side companion (missing expiry) of the same F-09.
  - id: harvey-jwt-sign-noexpiry
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
      cwe: ["CWE-613: Insufficient Session Expiration"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    message: >
      jwt.sign() is called with no `expiresIn` — the token never expires, so a leaked or stolen
      token is valid forever and cannot be revoked by time. Pass { expiresIn: '<duration>' } (and
      verify with a matching maxAge), unless this token is intentionally long-lived with its own
      revocation path.
    patterns:
      - pattern-either:
          - pattern: jwt.sign($P, $S)
          - pattern: jsonwebtoken.sign($P, $S)
          - patterns:
              - pattern: jwt.sign($P, $S, { ... })
              - pattern-not: "jwt.sign($P, $S, { ..., expiresIn: $E, ... })"
          - patterns:
              - pattern: jsonwebtoken.sign($P, $S, { ... })
              - pattern-not: "jsonwebtoken.sign($P, $S, { ..., expiresIn: $E, ... })"

  # Plaintext WebSocket URL (ws://): the connection — session token and all messages — travels
  # unencrypted, open to on-path interception/tampering. The scheme literal is anchored to ws:// so
  # the secure wss:// scheme does not match → high.
  - id: harvey-insecure-ws-url
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      A WebSocket is opened over the plaintext ws:// scheme — traffic (including any auth token) is
      unencrypted and tamperable by an on-path attacker. Use wss:// (TLS).
    patterns:
      - pattern: new WebSocket($URL, ...)
      - metavariable-regex:
          metavariable: $URL
          regex: ^["']ws://

  # AES-GCM decipher with no authTagLength option (3-argument form): the auth-tag length is not
  # pinned, so a short/truncated tag is silently accepted, weakening GCM's integrity guarantee.
  # Review — a 3-arg GCM decipher is a strong smell but the default (16) is often fine, so it needs
  # human confirmation. The 4-arg options form (authTagLength set) does not match.
  - id: harvey-gcm-no-authtaglength
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      AES-GCM createDecipheriv() is called with no authTagLength option, so the authentication-tag
      length is not pinned and a truncated tag can be accepted. Pass { authTagLength: 16 }.
    patterns:
      - pattern: crypto.createDecipheriv($ALGO, $KEY, $IV)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)^["'].*gcm

  # AEAD (GCM/CCM/ChaCha20-Poly1305) decipher whose update() result is returned with no .final()
  # call — for an authenticated cipher, .final() is what verifies the tag, so skipping it accepts a
  # forged/tampered ciphertext. Review — the "returns update() directly" shape is heuristic (final()
  # could live on another path a static rule can't see).
  - id: harvey-aead-decipher-no-final
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      An AEAD decipher returns decipher.update() directly without calling decipher.final() — .final()
      is what verifies the authentication tag, so a forged/tampered ciphertext is accepted. Always
      call .final() and let it throw on a bad tag.
    patterns:
      - pattern: |
          $D = crypto.createDecipheriv($ALGO, ...);
          ...
          return $D.update(...);
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)^["'].*(gcm|ccm|chacha20-poly1305|ocb)

  # jwtDecode()/jwt_decode() (the client-side `jwt-decode` package): reads claims WITHOUT verifying
  # the signature, and the result commonly drives a client render/authz gate — a forged token unlocks
  # UI. Review — every jwtDecode() call is flagged heuristically (adjacent to harvey-jwt-decode-
  # noverify, which covers the server-side jwt.decode()/jsonwebtoken.decode()).
  - id: harvey-jwt-decode-render
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      jwtDecode() reads the token's claims WITHOUT verifying the signature. If a claim (e.g. `role`)
      drives what the client renders or an authz gate, anyone can forge a token to unlock it. Base
      authorization on a signature-verified server session, not a client-side decode.
    patterns:
      - pattern-either:
          - pattern: jwtDecode(...)
          - pattern: jwt_decode(...)

  # createHmac() with a hardcoded string-literal key: anyone with source/bundle access can forge
  # valid MACs. Review — a committed literal is a strong smell but can be a public/test constant, so
  # it needs human confirmation (a key read from process.env / a secret manager does not match).
  - id: harvey-hmac-hardcoded-key
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      crypto.createHmac() is keyed with a hardcoded string literal — anyone with source/bundle access
      can forge valid signatures. Load the HMAC key from the environment / a secret manager.
    patterns:
      - pattern: crypto.createHmac($ALGO, $KEY)
      - metavariable-regex:
          metavariable: $KEY
          regex: ^["'].+["']$
