  # PostgREST filter injection: request input concatenated into a string .or()/.filter()/
  # .textSearch() expression. Review — a string filter can be legitimate, and PostgREST scopes
  # the blast radius to the selected table.
  - id: harvey-postgrest-filter-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      Request input is interpolated into a PostgREST string filter (.or/.filter/.textSearch). An
      attacker can inject extra filter clauses. Pass discrete column/operator/value arguments.
    pattern-sources:
      - *request_source
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.or($X, ...)
              - pattern: $C.filter($X, ...)
              - pattern: $C.textSearch($X, ...)
          - focus-metavariable: $X

  # #985: NoSQL (Mongo/Mongoose) injection — request input reaches a Mongo query OPERATOR
  # ($where/$regex/$ne/$gt/…) as its value. The explicit-operator shape (findOne({ name: { $regex:
  # data } })) is a query-logic injection: the attacker controls a regex/$where predicate or a
  # comparison operator. harvey-postgrest-filter-injection is Supabase/PostgREST-specific; this is
  # the generic Mongo detector detectOrm already resolves Mongoose for (#869). Review — a static
  # rule can't prove the value wasn't cast/escaped, and blast radius is the queried collection.
  - id: harvey-nosql-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-943: Improper Neutralization of Special Elements in Data Query Logic"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      Request input flows into a MongoDB query operator ($where/$regex/$ne/$gt) — NoSQL injection.
      An attacker can craft an operator object to bypass the filter or run a $where JS predicate.
      Cast/validate the value to its expected primitive type before building the query.
    pattern-sources:
      - *request_source
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "{ ..., $where: $X, ... }"
              - pattern: "{ ..., $regex: $X, ... }"
              - pattern: "{ ..., $ne: $X, ... }"
              - pattern: "{ ..., $gt: $X, ... }"
              - pattern: "{ ..., $gte: $X, ... }"
              - pattern: "{ ..., $lt: $X, ... }"
              - pattern: "{ ..., $lte: $X, ... }"
          - focus-metavariable: $X

  # Prototype pollution: request body recursively merged into an object (lodash merge / defaultsDeep
  # / a custom recursive merge). Object.assign (shallow, N-PROTO-SAFE) is not matched.
  - id: harvey-prototype-pollution
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      # #975: no clean OWASP Top-10-2021 category maps to this CWE; cwe carried, owasp omitted.
      cwe: ["CWE-1321: Improperly Controlled Modification of Object Prototype Attributes ('Prototype Pollution')"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      Request body flows into a recursive merge — prototype pollution (a __proto__/constructor key
      mutates Object.prototype). Validate keys, or merge only an explicit allowlist of fields.
    # #1224 judgment: this rule does NOT take the canonical block, and the reason is the sink.
    # A recursive merge pollutes only via KEYS, so a source qualifies only if it can carry an
    # attacker-named key — an attacker-controlled STRING merged into an object is inert.
    #
    # IN: `req.body` (parsed JSON) and `await req.json()` — a JSON body is exactly what carries
    # `__proto__`, and #1224 is right that it is this rule's single most important omission.
    # `req.query` too, because Express's qs parses `?__proto__[x]=1` into a NESTED OBJECT — the
    # classic vector. `req.cookies`/`req.headers` stay: their KEYS are attacker-named.
    #
    # OUT, deliberately: `req.params` and `searchParams.get(...)` return STRINGS, and a route
    # segment cannot pollute a prototype on its own. `$U.searchParams`, `cookies()` and `headers()`
    # are WHATWG objects whose entries live in internal slots, not own enumerable properties, so a
    # deep merge walks nothing. Each of these would be recall theatre: a source that cannot reach
    # this weakness.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              # #984: cookies/headers are attacker-controllable request sources.
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
              # #987: method-form request accessors (Express req.get('X-…')/req.header('X-…')). The
              # destructured/bracket/aliased/multi-hop forms of these sources propagate through
              # semgrep's taint dataflow once the base object is a source; the method form is a
              # distinct call shape. Both return strings and so are inert for THIS sink, but they
              # predate #1224 and removing them changes no outcome.
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^_?(req|request|nextReq|nextRequest|httpReq|incoming)$
      - pattern: await $REQ.json()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: merge($TARGET, $SRC, ...)
              - pattern: mergeWith($TARGET, $SRC, ...)
              - pattern: defaultsDeep($TARGET, $SRC, ...)
              - pattern: $L.merge($TARGET, $SRC, ...)
              - pattern: $L.defaultsDeep($TARGET, $SRC, ...)

  # Unsafe deserialization: request input passed to node-serialize unserialize() (executes an
  # embedded function body). Review — depends on the sink library being the exploitable one.
  - id: harvey-unsafe-deserialization
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
      # #455: CWE-502 is definitional for this bug shape; OWASP A08:2021 (Software and Data
      # Integrity Failures) explicitly absorbed the old A8:2017 "Insecure Deserialization" category.
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
    message: >
      Request input is deserialized with an unsafe unserialize() (node-serialize executes embedded
      function bodies) — remote code execution. Use JSON.parse and validate the shape.
    # #1224 judgment: adopt the canonical block WHOLESALE — the opposite call from its neighbour
    # harvey-prototype-pollution, and for the same reason read the other way. `unserialize()`
    # consumes a serialized STRING, so every attacker-controlled string is in class: a payload in a
    # query param, a route segment, or a session COOKIE — the classic vector this rule exists for,
    # and one its old list could not see on the App Router at all. #1224 grouped these two rules
    # together; the sink is what separates them.
    pattern-sources:
      - *request_source
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: unserialize($X)
              - pattern: $S.unserialize($X)
          - focus-metavariable: $X

  # XXE: an XML parser configured to resolve external entities (noent: true / resolveEntities).
  # noent: false (N-XXE-SAFE) is the hardened setting and is not matched.
  - id: harvey-xxe
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
      # #455: CWE-611 is definitional; OWASP A05:2021 (Security Misconfiguration) is where OWASP
      # relocated XXE from its own dedicated 2017 category.
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A05:2021 - Security Misconfiguration"]
    message: >
      An XML parser is configured to resolve external entities (noent/resolveEntities true) — XXE
      (file read / SSRF via DOCTYPE entities). Disable entity resolution when parsing untrusted XML.
    patterns:
      - pattern-either:
          - pattern: "{ ..., noent: true, ... }"
          - pattern: "{ ..., resolveEntities: true, ... }"

  # #985: XXE via an XML parser fed request-tainted input. harvey-xxe (above) keys on the unsafe
  # parser OPTION (noent/resolveEntities true); this taint variant catches the parse CALL itself
  # taking untrusted XML through an XXE-capable parser (libxmljs / DOMParser), where entity
  # resolution may be enabled by config the static rule can't see. Review — exploitability depends
  # on the parser's entity settings, so it is surfaced for triage rather than free-counted.
  - id: harvey-xxe-parse
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-611: Improper Restriction of XML External Entity Reference"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      Request-controlled input is parsed as XML through an XXE-capable parser (libxmljs/DOMParser).
      If external-entity resolution is enabled, this is XXE (file read / SSRF via DOCTYPE entities).
      Disable entity resolution (e.g. libxmljs { noent: false }) and validate the input.
    pattern-sources:
      - *request_source
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: libxmljs.parseXml($X, ...)
              - pattern: libxmljs.parseXmlString($X, ...)
              - pattern: $L.parseXml($X, ...)
              - pattern: $L.parseXmlString($X, ...)
              - pattern: new DOMParser().parseFromString($X, ...)
          - focus-metavariable: $X

  # Path traversal: request input joined into a filesystem path reaching fs. path.basename
  # (N-PATH-BASENAME) strips directory components and is registered as a sanitizer.
  - id: harvey-path-traversal
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
      # #455: CWE-22 is definitional; OWASP's official A01:2021 mapping table lists CWE-22 among
      # the CWEs rolled into Broken Access Control.
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2021 - Broken Access Control"]
    message: >
      Request input is joined into a filesystem path and read/written — path traversal
      (../ escapes the intended directory). Sanitize with path.basename and confine to a base dir.
    pattern-sources:
      - *request_source
    pattern-sanitizers:
      - pattern: path.basename(...)
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      # #1027: (a2) SCHEMA-validator guard — zod/valibot `safeParse` + an early return on
      # `!result.success`. Measured as the largest unmodeled sub-population in the #989 census and
      # the idiomatic shape in real Next/Express code, unlike BenchProctor's bare regex guards.
      #
      # What makes it sound is that the sink receives `$P.data` — a value the SCHEMA produced —
      # rather than the original input, so this is closer to a transformation than a gate. But
      # `z.string()` alone accepts every string, i.e. `.data` IS the raw input: the schema must
      # carry a real allowlist. Hence the SAME constraints as the regex form, each with a
      # calibration positive that must still fire: an ANCHORED, POSITIVE-class `.regex(...)`, or a
      # `.enum([...])` membership list; and a failure branch that RETURNS. A guard on one variable
      # while the sink reads another (`$P.data` never used) is untouched by construction.
      # #1236: the braceless `if (!$P.success) return ...;` spelling is matched too — see the
      # (a2) block above.
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
      # #1220: (a2) CONTAINMENT guard — resolve-then-re-verify. Widening the sink set to
      # fs/promises and Supabase Storage newly reaches the shape CORRECT code uses, so it is
      # modelled in the same change that created the exposure rather than shipped as noise.
      #
      # Anchored the way #1027's schema arm is: the sanitizer is the `path.resolve(...)` EXPRESSION,
      # cleared only inside a scope where the resolved variable is prefix-tested with an early
      # return. path.resolve alone is not a defence — it collapses `..` but confines nothing — so
      # the guard has to be part of the pattern, not adjacent to it.
      #
      # What makes it sound is a property of path.resolve specifically: the string it returns IS
      # the path the filesystem will open, so a prefix test on THAT value confines the read. The
      # same test on the RAW input confines nothing — `<tenant>/../<other>/f` starts with
      # `<tenant>/` (jharvieux/ATC#2050) — and P-STORAGE-TRAVERSAL is the positive wearing exactly
      # that guard which must keep firing. path.normalize is deliberately absent: it does not make
      # the path absolute, so a prefix test against an absolute base says nothing.
      #
      # Both early-return spellings are matched. MEASURED 2026-07-27: the block form alone
      # (`{ ... return; }`) missed this fixture outright — App Router handlers overwhelmingly write
      # the braceless `if (!ok) return Response.json(...)`. #1236 then measured the same hole in
      # every other (a2) arm in this directory and widened them all, each with braceless twins of
      # its adversarial positives.
      - patterns:
          - pattern: path.resolve($BASE, $X)
          - pattern-either:
              - pattern-inside: |
                  $R = path.resolve($BASE, $X);
                  ...
                  if (!$R.startsWith($PREFIX)) { ... return; }
                  ...
              - pattern-inside: |
                  $R = path.resolve($BASE, $X);
                  ...
                  if (!$R.startsWith($PREFIX)) return ...;
                  ...
    pattern-sinks:
      # #1220: the five modelled sinks were all callback/sync `fs.*` spelled with a LITERAL `fs.`
      # prefix, so `import { readFile } from "node:fs/promises"` — the idiomatic App Router form —
      # reached none of them. The prefix is a metavariable now (picking up `fsp.`/`fsPromises.`
      # aliases) and the bare-call arm carries the named-import form. `open` is deliberately
      # prefixed-only: a bare `open(x)` is far more often a UI call than a file handle.
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.appendFile($P, ...)
              - pattern: $FS.open($P, ...)
              - pattern: $FS.copyFile($P, ...)
              - pattern: $FS.rename($P, ...)
              - pattern: $FS.unlink($P, ...)
              - pattern: $FS.rm($P, ...)
              - pattern: $FS.readdir($P, ...)
              - pattern: readFile($P, ...)
              - pattern: readFileSync($P, ...)
              - pattern: createReadStream($P, ...)
              - pattern: writeFile($P, ...)
              - pattern: writeFileSync($P, ...)
              - pattern: appendFile($P, ...)
              - pattern: copyFile($P, ...)
              - pattern: unlink($P, ...)
              - pattern: readdir($P, ...)
          - focus-metavariable: $P
      # #1220: Supabase Storage as a PATH sink. For a Supabase-specialist audit this was the
      # notable hole — storage is a first-class tenant-data surface and no rule treated an object
      # key as a path, so a real cross-tenant storage route produced zero findings from any rule.
      #
      # The sanitizer set deliberately does NOT gain a `startsWith` prefix test, which is the guard
      # the real route wore: a PREFIX check is not a CONTAINMENT check, and
      # `<tenant>/../<other-tenant>/file` satisfies it (jharvieux/ATC#2050). Adding it would have
      # encoded the vulnerable pattern as the safe one.
      - patterns:
          - pattern-either:
              - pattern: $C.storage.from($B).createSignedUrl($P, ...)
              - pattern: $C.storage.from($B).createSignedUrls($P, ...)
              - pattern: $C.storage.from($B).download($P, ...)
              - pattern: $C.storage.from($B).upload($P, ...)
              - pattern: $C.storage.from($B).update($P, ...)
              - pattern: $C.storage.from($B).remove($P, ...)
              - pattern: $C.storage.from($B).copy($P, ...)
              - pattern: $C.storage.from($B).move($P, ...)
              - pattern: $C.storage.from($B).getPublicUrl($P, ...)
          - focus-metavariable: $P

  # Zip-slip: an archive entry name joined into a write path with no containment check — a
  # ../ entry escapes the extraction directory. Review — needs the extraction-loop context.
  - id: harvey-zip-slip
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
      # #455: zip-slip is a path-traversal variant — same CWE/OWASP mapping as
      # harvey-path-traversal above.
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2021 - Broken Access Control"]
    message: >
      An archive entry name is joined into a write path with no containment check — zip-slip
      (a ../ entry writes outside the extraction dir). Resolve and verify the path stays under it.
    patterns:
      - pattern-either:
          - pattern: fs.writeFileSync(path.join($D, $E.entryName), ...)
          - pattern: fs.writeFile(path.join($D, $E.entryName), ...)
          - pattern: fs.writeFileSync(path.join($D, $E.path), ...)
          - pattern: fs.writeFile(path.join($D, $E.path), ...)

  # Server-side template injection: request input compiled/rendered as a template. Review — the
  # engine and whether the template is attacker-controlled determine exploitability.
  - id: harvey-template-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      # #990: the pattern matches an ejs/handlebars/pug template SINK compiling request-controlled
      # template SOURCE — server-side template injection — so CWE-917 (Expression Language / template
      # injection) is more specific than the generic code-injection parent CWE-94, and (unlike the
      # newer CWE-1336) is in OWASP's official A03 mapped-CWE list so the owasp field stays honest.
      cwe: ["CWE-917: Improper Neutralization of Special Elements used in an Expression Language Statement ('Expression Language Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      Request input is compiled/rendered as a server-side template (ejs/handlebars/pug) — SSTI,
      which escalates to RCE on most engines. Treat user input as data, never as template source.
    pattern-sources:
      - *request_source
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: ejs.render($X, ...)
              - pattern: ejs.compile($X, ...)
              - pattern: Handlebars.compile($X, ...)
              - pattern: pug.render($X, ...)
              - pattern: pug.compile($X, ...)
          - focus-metavariable: $X

  # ReDoS: a regex literal with a nested quantifier ((a+)+ style) — catastrophic backtracking on a
  # crafted input. A linear regex with negated classes (N-REDOS-SAFE) has no nested group + does
  # not match. metavariable-regex flags the nested-quantifier shape.
  - id: harvey-redos
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      # #975: no clean OWASP Top-10-2021 category maps to this CWE; cwe carried, owasp omitted.
      cwe: ["CWE-1333: Inefficient Regular Expression Complexity"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      Regex with a nested quantifier ((x+)+ / (x*)* style) — catastrophic backtracking (ReDoS) on
      adversarial input. Rewrite without nested quantifiers, or bound input length / use RE2.
    patterns:
      - pattern-either:
          - pattern: new RegExp($RE, ...)
          - pattern: new RegExp($RE)
      - metavariable-regex:
          metavariable: $RE
          regex: (?s).*\([^)]*[+*][^)]*\)\s*[+*].*

  # Log injection: request input written into a log line unescaped — an attacker can forge or split
  # log records with CR/LF. Review — extremely common shape, low individual severity.
  - id: harvey-log-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-117: Improper Output Neutralization for Logs"]
      owasp: ["A09:2021 - Security Logging and Monitoring Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Low
    message: >
      Request input is written to a log line unsanitized — log forging/injection via CR/LF. Strip
      newlines (or log structured fields) before writing user input to the log.
    pattern-sources:
      - *request_source
    pattern-sanitizers:
      # #1027: #989 shipped the (a2) guard sanitizer on 11 taint rules and left this one out. It was
      # then MEASURED (2026-07-25, BenchProctor JS/Express quicktest 2026.07.22) to carry the largest
      # modelable-guard false-positive population of every rule that was skipped — 43 of its FPs are
      # safe twins wearing one of the three guard shapes below, more than any other rule. Same
      # sanitizer, same soundness constraints, same adversarial fixtures.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: console.log($X, ...)
              - pattern: console.error($X, ...)
              - pattern: console.info($X, ...)
              - pattern: console.warn($X, ...)
          - focus-metavariable: $X

  # ---- Batch B13 (#71) — Supabase static-config/edge + injection-sink breadth. See
  # docs/design/corpus-roadmap-to-100.md §3e and GROUND-TRUTH.md §B13. Two ERROR+HIGH structural
  # rules (spawn shell:true, pg ssl:false to the pooler), one ERROR+HIGH client-surface rule
  # (auth.admin in a Client Component), and the review-tier injection-sink family. ----

  # child_process spawn/execFile with { shell: true } runs the command through /bin/sh, which
  # re-parses the argv array as a shell string — the argv-array safety is gone and any interpolated
  # value can inject shell metacharacters. The shell:true option is the unambiguous footgun. HIGH.
  # (Distinct from harvey-command-injection above, which matches exec/execSync — this covers the
  # spawn/execFile family the argv-array rules deliberately excluded.)
  - id: harvey-spawn-shell-true
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
      category: security
      harveySeverity: Critical
    message: >
      spawn/execFile is called with { shell: true }, which runs the command through a shell and
      re-parses the arguments — reintroducing command injection the argv array was preventing. Drop
      shell: true and pass the binary + argv array directly.
    patterns:
      - pattern-either:
          - pattern: "spawn($CMD, $ARGS, { ..., shell: true, ... })"
          - pattern: "execFile($CMD, $ARGS, { ..., shell: true, ... })"
          - pattern: "child_process.spawn($CMD, $ARGS, { ..., shell: true, ... })"
          - pattern: "child_process.execFile($CMD, $ARGS, { ..., shell: true, ... })"

  # A direct pg Pool to a Supabase pooler host with TLS disabled (ssl: false). The pooler is reached
  # over the public internet, so turning off TLS exposes the connection and its credentials to a
  # network attacker. Both signals in one Pool literal: the pooler host (pattern-regex over the same
  # object) AND ssl: false. HIGH — an explicit `ssl: false` to a pooler host is unambiguous.
  - id: harvey-pg-ssl-disabled
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      A pg Pool connects to a Supabase pooler host with ssl: false — the connection to the pooler
      crosses the public internet unencrypted. Set ssl: { rejectUnauthorized: true } (or remove the
      ssl:false override) so the pooler connection is TLS-verified.
    patterns:
      - pattern: "new Pool({ ..., ssl: false, ... })"
      - pattern-regex: pooler\.supabase\.com

  # auth.admin.* (the GoTrue admin API) is reachable from a Client Component ("use client"). The
  # admin API requires the service-role key, so an admin surface that ships to the browser bundle
  # exposes privileged user-management operations (and the key backing them). HIGH. Broader than
  # harvey-service-role-in-client (base.yml, which keys off the SERVICE_ROLE_KEY env literal) — this
  # fires on the admin call itself, however the client was constructed. Scoped to a client whose
  # binding NAME reads as service-role/admin ($C matches /admin|service/i) — the premise is a
  # service-role client shipping to the browser; the plain anon client (bound as `supabase`) can't
  # ship a privileged key it never holds, and the call is a runtime no-op there, not a key leak
  # (#164). No cross-file taint in OSS Semgrep, so the identifier is the available signal — matches
  # this repo's naming convention (`supabaseAdmin` for positives, `supabase` for the anon client).
  - id: harvey-auth-admin-in-client
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      category: security
      harveySeverity: Critical
    message: >
      supabase.auth.admin.* (the service-role-only GoTrue admin API) is called inside a Client
      Component ("use client") on what looks like the service-role client. The privileged admin
      client ships to the browser. Move all auth.admin usage into a server-only route/action.
    patterns:
      - pattern: $C.auth.admin.$M(...)
      - pattern-inside: |
          "use client";
          ...
      - metavariable-regex:
          metavariable: $C
          regex: (?i).*(admin|service).*

  # select("*") whose result is serialized into an API response (res.json / NextResponse.json). A
  # star-select spreads every column — including PII the client never needed — into the payload.
  # Review: proving a specific sensitive column is present needs schema knowledge this rule lacks.
  - id: harvey-select-star-pii
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A select("*") result is returned directly in an API response — every column, including any
      PII/sensitive fields, is serialized to the client. Project an explicit column list with only
      the fields the response needs.
    pattern-sources:
      - pattern: $C.from($T).select("*")
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.json($X)
              - pattern: NextResponse.json($X)
          - focus-metavariable: $X

  # A service-role cron handler with no caller-secret gate: a supabaseAdmin DB call reachable from a
  # handler with no preflight `if` guard, so anyone who finds the URL can trigger the privileged job.
  # The pattern-not-inside excludes any handler carrying a guard block (the CRON_SECRET check). Review.
  - id: harvey-cron-no-secret
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-862: Missing Authorization"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A cron/background handler uses the service-role client (supabaseAdmin) with no CRON_SECRET
      caller check — any anonymous request can trigger the privileged job. Compare a shared secret
      (e.g. an Authorization bearer CRON_SECRET) before doing any work.
    patterns:
      - pattern-either:
          - pattern: supabaseAdmin.from(...)
          - pattern: supabaseAdmin.rpc(...)
      - pattern-not-inside: |
          function $H(...) { ... if (...) { ... } ... }

  # require() with a request-tainted argument loads and executes an attacker-chosen module path.
  # Review — dynamic require of a fixed/derived-but-safe path is common; taint from a request is the
  # risky shape.
  - id: harvey-dynamic-require
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-829: Inclusion of Functionality from Untrusted Control Sphere"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      require() is called with request-controlled input — an attacker chooses which module is
      loaded and executed. Map the input through an explicit allowlist to a fixed module path.
    pattern-sources:
      - *request_source
    pattern-sinks:
      - patterns:
          - pattern: require($X)
          - focus-metavariable: $X

  # obj[userInput]() — a method dispatched by a request-controlled key with no allowlist. The caller
  # can reach any property on the object, including inherited ones. Review — a checked/allowlisted
  # dispatch is the common safe shape.
  - id: harvey-dynamic-dispatch
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-470: Use of Externally-Controlled Input to Select Classes or Code ('Unsafe Reflection')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A method is dispatched by a request-controlled key (obj[req...]()) with no allowlist — the
      caller can invoke any property on the object. Check the key against an explicit allowlist
      before dispatch.
    pattern-sources:
      - *request_source
    pattern-sinks:
      - patterns:
          - pattern: $OBJ[$IDX](...)
          - focus-metavariable: $IDX

  # A template engine compiled with autoescaping turned off (Handlebars noEscape / Mustache
  # escape:false) renders every interpolation raw — any user data through the template is an XSS
  # sink. Review — depends on whether user data actually flows through the template.
  - id: harvey-template-autoescape-off
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      A template is compiled with HTML autoescaping disabled (noEscape / escape:false) — every
      interpolation renders raw, so any user data through it is an XSS sink. Leave autoescaping on
      and mark only known-safe values as raw.
    patterns:
      - pattern-either:
          - pattern: "Handlebars.compile($T, { ..., noEscape: true, ... })"
          - pattern: "$H.compile($T, { ..., noEscape: true, ... })"
          - pattern: "Mustache.render($T, $D, $PART, { ..., escape: false, ... })"

  # Request input interpolated into an HTML template literal handed to res.send — reflected XSS. The
  # sink is a res.send() of a template literal carrying a tainted value. Review — a static rule can't
  # confirm no escaping/sanitizer ran on the interpolated value.
  - id: harvey-html-template-literal
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: High
    message: >
      Request input is interpolated into an HTML template literal and sent with res.send —
      reflected XSS. Escape the value, or render through a template engine with autoescaping on.
    pattern-sources:
      - *request_source
    pattern-sanitizers:
      # #986: an HTML escaper / sanitizer on the interpolated value is a real transformation that
      # neutralizes the XSS — a value run through it is no longer a finding (the (a1) subset).
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      - pattern: sanitize(...)
      - pattern: escapeHtml(...)
      - pattern: escape(...)
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      # #1027: (a2) SCHEMA-validator guard — zod/valibot `safeParse` + an early return on
      # `!result.success`. Measured as the largest unmodeled sub-population in the #989 census and
      # the idiomatic shape in real Next/Express code, unlike BenchProctor's bare regex guards.
      #
      # What makes it sound is that the sink receives `$P.data` — a value the SCHEMA produced —
      # rather than the original input, so this is closer to a transformation than a gate. But
      # `z.string()` alone accepts every string, i.e. `.data` IS the raw input: the schema must
      # carry a real allowlist. Hence the SAME constraints as the regex form, each with a
      # calibration positive that must still fire: an ANCHORED, POSITIVE-class `.regex(...)`, or a
      # `.enum([...])` membership list; and a failure branch that RETURNS. A guard on one variable
      # while the sink reads another (`$P.data` never used) is untouched by construction.
      # #1236: the braceless `if (!$P.success) return ...;` spelling is matched too — see the
      # (a2) block above.
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
    pattern-sinks:
      - patterns:
          - pattern: $RES.send(`...`)

  # A .replace() sanitizer with a STRING-literal needle only strips the first occurrence — an
  # incomplete filter that leaves every later match intact. A /g regex needle (the real sanitizer)
  # has no leading quote and does not match. Review — heuristic; some single-replace calls are fine.
  - id: harvey-incomplete-sanitize
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-116: Improper Encoding or Escaping of Output"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A .replace() with a plain string needle replaces only the FIRST match, so this "sanitizer"
      leaves later dangerous characters intact. Use a global regex (/.../g) or a real sanitizer.
    patterns:
      - pattern: $S.replace($NEEDLE, $R)
      - metavariable-regex:
          metavariable: $NEEDLE
          regex: ^['"](<|>|&|"|')['"]$
