# Batch B3 — injection & code-execution family (#71, spec §"Batch 1 — Injection & code-execution").
# Per-batch custom-rule file (see base.yml header for the directory convention). Taint mode with
# request sources (Pages-Router req.query/body/params + App-Router searchParams), mirroring the
# base SQLi/XSS rules. Tiering follows the locked preamble: only ~100%-precision sinks are ERROR +
# HIGH confidence (free count) — a raw-SQL-executor RPC, `exec`/`execSync` of a request string, and
# `eval`/`new Function` of request input. The heuristic sinks (PostgREST string filters, recursive
# merge, deserialize, XXE options, path traversal, zip-slip, SSTI, ReDoS, log forging) are
# WARNING + MEDIUM → review tier, exactly as the spec quarantines them.
#
# Exercised against targets/calibration by `pnpm validate:calibration`; see GROUND-TRUTH.md §B3.
#
# Byte-equal copy of base.yml's canonical request-taint source block (#1221) — YAML anchors resolve
# at parse time and do not cross documents, so each file needs its own. Rationale and the FP
# measurement that fixed its shape: base.yml. `semgrep-shared-sources.test.ts` fails loud on drift.
x-request-source: &request_source
  pattern-either:
    # Express / Pages-Router accessors, plus the App Router handler parameter.
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            # #984: cookies/headers are attacker-controllable request sources (session tokens,
            # X-Forwarded-*, User-Agent, custom headers) — a well-known injection entry point.
            - pattern: $REQ.cookies
            - pattern: $REQ.headers
            # #987: method-form request accessors (Express req.get('X-…')/req.header('X-…')). The
            # destructured/bracket/aliased/multi-hop forms propagate through semgrep's taint
            # dataflow once the base object is a source; the method form is a distinct call shape.
            - pattern: $REQ.get(...)
            - pattern: $REQ.header(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^_?(req|request|nextReq|nextRequest|httpReq|incoming)$
    # #1221: the App Router query string. `$U.searchParams` subsumes `req.nextUrl.searchParams`
    # AND the split `const u = new URL(req.url); u.searchParams.get(…)` form, so neither needs its
    # own pattern; the `.get(...)` arm carries the inline `new URL(req.url).searchParams.get(…)`
    # call. A BARE `$SP.get(...)` is deliberately NOT used — measured to fire on Map/Headers/
    # config/FormData `.get()` even behind the `^(?!(https?|axios)$)` http-client guard.
    - pattern: $U.searchParams.get(...)
    - pattern: $U.searchParams
    # #1221: the App Router request body — the shape 17 of 21 rules were blind to.
    - pattern: await $REQ.json()
    # #984: App Router next/headers request sources.
    - pattern: cookies()
    - pattern: headers()
    # #1240: the App Router SERVER COMPONENT request props. A page/layout receives its dynamic route
    # segments and query string as DESTRUCTURED PARAMETERS — `{ params }` / `{ searchParams }` — and
    # never as a `req` object, so every arm above is blind to the idiomatic RSC page. Found through
    # the SSRF facet (P-OWASP-REACT-RSC-SSRF), but the gap was never SSRF's: the shared block did not
    # model the source, so all 21 rules missed it.
    #
    # #1544: an earlier version of this comment gave a semgrep OSS capability bound — that a
    # destructured object parameter is unmatchable in JS/TS — as the reason the name is matched
    # WITHOUT its binding form. That bound was ASSUMED, it was copied into five venues, and it is
    # false. MEASURED 2026-07-31, semgrep 1.164.0: both spellings below match the repo's own RSC
    # fixture. The real constraint is a pattern-authoring detail, and it is why the block reads the
    # way it does — the pattern must carry the type annotation to reach a TYPED parameter (so both
    # spellings are listed), and a metavariable unified with the OUTER access stops at the first
    # field of a multi-key object pattern like a layout's `{ children, params }` (so the binding is
    # bound by its own $RSCBIND and regex-filtered instead).
    #
    # The binding form is therefore REQUIRED, not inferred: the access is a request source only
    # inside a scope that destructures `params`/`searchParams` out of an object. MEASURED 2026-07-31
    # over 20 probes — 8 real RSC binding shapes (typed/untyped destructured function parameter,
    # typed/untyped destructured arrow, route-handler second parameter, Next 15 awaited `params`,
    # in-body `const { params } = props`, multi-key layout) and 12 benign `params`/`searchParams`
    # shapes: RSC shapes 8/8 before and 8/8 after, NOTHING newly caught, and three benign shapes no
    # longer read as request input — a for-of loop variable over DB rows, an array-destructured
    # `const [params] = useState()`, and an imported module constant. The three not-insides could
    # see none of those: on all three the pre-#1544 block fired exactly as the unguarded bare name
    # did. They are kept because they only ever narrow further, which makes this block a strict
    # subset of what the name alone reports.
    #
    # WHAT THAT 8/8 DID NOT COVER, and what the ARROW ARMS BELOW ARE ABOUT. The two arrow probes
    # behind it had EXPRESSION bodies (`=> fetch(...)`). MEASURED 2026-07-31, semgrep 1.164.0:
    # `(..., { ..., $B, ... }, ...) => ...` returns 0 matches on a BLOCK-bodied arrow and
    # `=> { ... }` returns 1 — so the two `=> ...` arms alone left `const Page = async ({ params })
    # => { … }` silent, and with it every rule below. That is CLAUDE.md's "a measurement whose
    # probes are drawn from the same intuition as the guard proves only that the intuition is
    # self-consistent", landing inside the fix for a false MEASURED claim in this same block. The
    # `=> { ... }` twins are therefore listed alongside, and are the arms that carry the real-world
    # population: MEASURED 2026-07-31 over all 17 pinned corpus repos at their pins (`pnpm
    # corpus-pins`, `-j 1 --timeout 0`, 3 repeats, identical output each time) the block-bodied
    # spelling occurs 40 times in 33 files (carbon 12, documenso 10, inbox-zero 18) and the
    # expression-bodied spelling occurs ZERO times. NOTHING GATED THIS — the corpus population
    # reaches no sink, so the loss cost 0 findings; validate-calibration had no arrow fixture; and
    # shared-sources.test.ts asserted only that the pattern STRINGS were present. All three are now
    # closed: P-RSC-ARROW-TYPED-BINDING / P-RSC-ARROW-UNTYPED-BINDING are mustCatch corpus rows, and
    # the test runs semgrep over probes instead of grepping this file.
    #
    # The plain-identifier not-insides at the end of this block do NOT have the same defect and must
    # not be "fixed" the same way. MEASURED 2026-07-31: with a bare metavariable in parameter
    # position, `(..., $X, ...) => ...` matches a block-bodied arrow (both shadowed-plain-parameter
    # probes stay silent). Adding a `=> { ... }` twin there would be actively wrong — measured the
    # same day, `(..., $X, ...) => { ... }` MATCHES the destructured RSC arrow itself, binding $X to
    # the object pattern, so the twin would risk excluding the very shape these arms exist to catch.
    #
    # THE COST OF THE BINDING REQUIREMENT, over the reachable population rather than the probes:
    # exactly ONE finding — carbon apps/erp/app/modules/production/ui/Jobs/JobBillOfProcess.tsx:655,
    # harvey-path-traversal on a client component's `const [params] = useUrlParams()` reaching a
    # storage upload path. A true positive the pre-#1544 block reached for the same unsound reason
    # it reached a scheduler's DB rows. Planted as the P-CLIENT-HOOK-URL-PARAM measured gap and
    # tracked on #1708, so the cost is in the gate.
    #
    # HOW THAT ONE IS KNOWN, because the obvious method has a wider noise band than the signal it
    # is being asked to resolve (#1710). A single-pass
    # full-ruleset diff over the 17 repos read 456 -> 454, and a single-pass diff over just the 22
    # rules that consume this block read 194 -> 178 — but 15 of those 16 rows were ENGINE NOISE:
    # semgrep's default parallelism silently drops up to ~36% of findings on a large repo while
    # reporting a clean run, so on carbon the noise band is an order of magnitude wider than the
    # signal. The figure that survives repetition, MEASURED 2026-07-31 by PR #1709's acceptance
    # verifier: 16 of the 17 repos produce SET-IDENTICAL findings under both rule sets, and on
    # carbon 6 repeats per arm at `-j 1 --timeout 0` give a stable core of 74 findings in BOTH arms
    # with zero true gains and zero true losses. The one row above was then isolated and reproduced
    # 3/3 per arm on its own file — re-verified independently for this correction, 2026-07-31,
    # 3/3 per arm at `-j 1 --timeout 0`: present pre-#1544, absent after. Never quote 456 -> 454.
    #
    # THE ARROW FIX'S OWN blast radius, MEASURED 2026-07-31 the sound way rather than the noisy one:
    # OSS taint is intra-file and `pattern-inside` is intra-file, so every finding this widening can
    # add lies in one of the 33 files that carry the newly-matched binding form. All 33 scanned with
    # the full rule directory, 3 arms (pre-#1544 / as-shipped #1544 / with the `=> { ... }` arms),
    # 3 repeats each at `-j 1 --timeout 0`: 7 findings, IDENTICAL in all nine runs. Zero gained,
    # zero lost.
    #
    # `await $RSCPROP` carries the Next 15 shape, where `params` is a Promise the component awaits
    # before destructuring. Corpus: P-OWASP-REACT-RSC-SSRF must keep firing;
    # N-RSC-PARAM-PLAIN-PARAMETER keeps the not-insides falsifiable; N-RSC-PARAM-NON-PARAM-BINDING
    # keeps the destructuring requirement falsifiable.
    - patterns:
        - pattern-either:
            - pattern: $RSCPROP.$RSCFIELD
            - pattern: await $RSCPROP
        - metavariable-regex:
            metavariable: $RSCPROP
            regex: ^(params|searchParams)$
        - pattern-either:
            - pattern-inside: |
                function $RSCFN(..., { ..., $RSCBIND, ... }, ...) { ... }
            - pattern-inside: |
                function $RSCFN(..., { ..., $RSCBIND, ... }: $T, ...) { ... }
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }, ...) => ...
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }: $T, ...) => ...
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }, ...) => { ... }
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }: $T, ...) => { ... }
            - pattern-inside: |
                const { ..., $RSCBIND, ... } = $SRC;
                ...
        - metavariable-regex:
            metavariable: $RSCBIND
            regex: ^(params|searchParams)$
        # A locally-ASSIGNED `params`/`searchParams` is an options bag, a URLSearchParams the module
        # built itself, or a Map alias — never a request prop. This still earns its place under the
        # binding requirement above: inside a real RSC page, `const searchParams = new
        # URLSearchParams(...)` sits in a scope that DOES destructure `params`, so without this line
        # the module's own URLSearchParams would read as request input. MEASURED 2026-07-31.
        - pattern-not-inside: |
            $RSCPROP = ...
            ...
        # #1344: `function runJob(params: JobSpec)`, a scheduler argument bag with no request
        # anywhere near it, was read as request input, because the assignment guard above was the
        # only exclusion and a function parameter is never assigned. MEASURED 2026-07-27 on two
        # byte-identical files differing only in the parameter name: `params`/`searchParams`
        # produced 6 findings including harvey-command-injection at Critical/precisionTier=high
        # (GRADED), `opts`/`spec` produced 3. That falsified this block's own recorded measurement,
        # which claimed an "RPC argument bag" probe fired on none — all five probes must have bound
        # the name by local assignment. The binding requirement above now spares this shape too, so
        # these two lines are a second, independent narrowing rather than the sole discriminator.
        - pattern-not-inside: |
            function $F(..., $RSCPROP, ...) { ... }
        - pattern-not-inside: |
            (..., $RSCPROP, ...) => ...
# #1248: the (a2) validator guards, with a failure branch that THROWS instead of returning.
# Throwing is the idiomatic guard in a Next.js Server Action or route handler under an error
# boundary, in Express with http-errors/createError, and in NestJS (BadRequestException) — so
# before this block a correct throwing guard read as a Critical injection. MEASURED 2026-07-31
# (semgrep 1.164.0): the issue's own repro fired harvey-sql-injection-template at Critical.
#
# WHY IT IS A SEPARATE SANITIZER AND NOT A WIDENED ARM. A `return` is unconditionally an exit.
# A `throw` is an exit only if nothing between the guard and the sink catches it: with the guard
# inside a `try` whose `catch` swallows, execution continues into the sink with the rejected
# value live, and a `finally` runs the sink even when the throw propagates. That has no analogue
# on the return path, so the throw spellings carry a constraint the return spellings do not —
# the guard must not be lexically inside a try statement. This is deliberately conservative: a
# guard AND its sink both inside one try (where the throw does skip the sink) is not cleared,
# which costs precision in the safe direction and never clears a live value.
# MEASURED 2026-07-31, both directions: with the two pattern-not-inside conjuncts the swallowed
# and finally-run shapes FIRE; with them deleted both go silent — a real bug cleared by a guard
# that never protected it. Adversarial positives P-SQLI-THROW-SWALLOWED / P-SQLI-THROW-FINALLY.
#
# `throw $E;` rather than `throw ...;`: a throw always carries an operand, so there is no
# valueless twin to cover the way `return;` needed one.
x-throw-guard: &throw_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - pattern: |
            if (!$ARR.includes($X)) { ... throw $E; }
        - pattern: |
            if (!$ARR.includes($X)) throw $E;
        - pattern: |
            if (!$SET.has($X)) { ... throw $E; }
        - pattern: |
            if (!$SET.has($X)) throw $E;
    - focus-metavariable: $X

# #1248: the SCHEMA-validator (a2) guard whose failure branch throws. Same soundness argument and
# the same two try exclusions as x-throw-guard above, and the same allowlist constraints as the
# return spelling — an ANCHORED, POSITIVE-class `.regex(...)` or an `.enum([...])` membership list,
# because a bare `z.string()` accepts everything and `$P.data` IS then the raw input.
#
# UNLIKE the return spelling it is `by-side-effect` on `$P`, not a `pattern-inside` region ending
# at `$P.data`. MEASURED 2026-07-31: semgrep's statement `...` matches DEEPLY, so a region written
# `safeParse(...); ... if (!$P.success) throw $E; ...` matches a guard nested inside a `try` — and
# the try exclusions, attached to the `$P.data` use site, sat outside that try and cleared it. Both
# swallowed-throw fixtures went silent under that form and fire under this one
# (P-CMD-ZOD-THROW-SWALLOWED, P-CMD-ZOD-ENUM-THROW-SWALLOWED).
x-throw-schema-guard: &throw_schema_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-inside: |
                $P = $Z.regex($RE).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        # #1630: the hoisted-named-const twin, on the THROW spelling. The #1363 fix reached the
        # `.test()` arms in both failure-branch spellings but no zod arm in either, so this one
        # carried the same defect as the return spelling above.
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-inside: |
                $P = $Z.regex($RE).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                $P = $Z.enum([...]).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
    - focus-metavariable: $P

# #1708: the CLIENT URL PARAM source, for the three sinks in this file that a "use client"
# component can call directly with no server hop (a supabase-js call ships in the browser bundle):
# Supabase Storage object keys (harvey-path-traversal), `.rpc(...)` (harvey-sql-injection-rpc) and
# `.or`/`.filter`/`.textSearch` (harvey-postgrest-filter-injection). Judgment for every rule that
# consumes `*request_source` is recorded in shared-sources.test.ts's CLIENT_URL_PARAM_* maps.
#
# THIS IS A NARROWING OF xss.yml's `x-dom-source`, NOT A COPY OF IT, and the difference is the whole
# point. xss.yml can afford a receiver-agnostic `$SP.get(...)` / `$RT.query.$K` because its sinks
# (innerHTML, document.write, dangerouslySetInnerHTML) exist ONLY in a browser, so the receiver is
# overwhelmingly a URLSearchParams. The three sinks here run on BOTH sides of the boundary, so the
# bare arms fire on every server-side `.get()` and every `.query.` property access — which is
# precisely what base.yml's canonical request block records as the reason IT carries no bare
# `$SP.get(...)`: "measured to fire on Map/Headers/config/FormData `.get()`".
#
# MEASURED 2026-08-01, semgrep 1.164.0, five benign server-side probes with no request, no DOM and
# no URL anywhere in the module — a module-level `config.get("reportFn")` into `.rpc()`, a
# `Headers.get("x-tenant")` into `.or()`, a `Map` row-bag `.get("path")` into `storage.download()`,
# a Drizzle `db.query.invoices` read into `.rpc()`, and a server-built `FormData.get("key")` into
# `storage.upload()`. Bare arms: 5 findings, TWO of them harvey-sql-injection-rpc at
# ERROR/confidence HIGH, which src/scan/semgrep.ts maps to precisionTier "high" — the GRADED free
# count that sets a client's letter grade. Bound arms below: 0. The receiver is therefore bound to a
# URL-parameter-shaped name here.
#
# What the binding costs, MEASURED on carbon (crbnos/carbon@92e19c04417e, 5 repeats per arm) rather
# than assumed: eleven `harvey-path-traversal` rows, every one of them `formData.get(...)`-derived
# and every one read against source. They are genuine request-body taint — but they are the REQUEST
# class, not the client-URL-param class. `*request_source` deliberately does not model a bare
# `.get()`, and widening it to reach FormData is a change to the block 22 rules share, moving
# corpus-drift baselines on 17 targets; carrying it here would also make this rule's own carbon
# delta unattributable to one variable. Relative to `main` nothing is lost — `main` reported none of
# the eleven — so this is an accidental half-closure withdrawn, not a regression. Tracked with the
# eleven file:line rows and their acceptance criteria as #1814.
x-client-url-source: &client_url_source
  pattern-either:
    - pattern: location.hash
    - pattern: location.search
    # The pages-router `router.query.x`, with the receiver bound: a bare `$RT.query.$K` reads
    # Drizzle's relational builder (`db.query.invoices`) as a URL parameter, measured above.
    - patterns:
        - pattern: $RT.query.$K
        - metavariable-regex:
            metavariable: $RT
            regex: ^_?(router|nextRouter|appRouter|Router)$
    # The receiver names a URLSearchParams. `params` is in the list because it is the idiomatic
    # array-destructured spelling every React Router / Next client component uses
    # (`const [params] = useSearchParams()`), and it is the shape P-CLIENT-HOOK-URL-PARAM models.
    # This is a name test, so a Map deliberately named `searchParams` still reads as a source; the
    # claim is that the name is evidence of intent, not that it is a type.
    - patterns:
        - pattern: $SP.get(...)
        - metavariable-regex:
            metavariable: $SP
            regex: ^_?(searchParams|search_params|params|urlParams|url_params|queryParams|query_params|qs)$
    - pattern: useSearchParams()

rules:
  # SQLi via a raw-SQL-executor RPC. The high-precision signal is the FUNCTION NAME: exec_sql /
  # execute / run_sql style RPCs run a raw SQL string, so any request-tainted argument is a SQLi
  # primitive. A normal parameterized RPC (supabase.rpc('total', { uid: req.query.uid })) passes
  # the value as a bound argument and is NOT in this sink set — the safe shape N-RPC-PARAM models.
  - id: harvey-sql-injection-rpc
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: Critical
      # #455: standard, unambiguous CWE/OWASP mapping — same underlying bug class as
      # harvey-sql-injection-template (base.yml).
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      Request input reaches a raw-SQL-executor RPC (exec_sql/execute/run_sql). The value is run as
      SQL text, not a bound parameter — SQL injection. Use a parameterized RPC or bind arguments.
    # #1708: the sink is a supabase-js `.rpc(...)` call, which ships in the client bundle and is
    # called directly from client components exactly like the storage sink below — so a client URL
    # param is in class here too, not only a server request accessor.
    pattern-sources:
      - *request_source
      - *client_url_source
    pattern-sanitizers:
      # #986: numeric coercion (the (a1) transformation-sanitizer subset) — a value cast to a number
      # cannot carry SQL metacharacters, so it is safe to interpolate into the raw-SQL string.
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              # #1363: the same guard with the regex HOISTED to a named constant — how it is normally
              # written once the regex is reused, and until now it read as vulnerable. metavariable-regex
              # reads a metavariable's matched TEXT, so $RE binds to the identifier `OK` and the anchoring
              # constraint has to move to the literal, bound alongside the guard by pattern-inside. `const`
              # deliberately, not a bare `$RE = $LIT`: MEASURED 2026-07-31, the bare form also clears a
              # guard whose regex was reassigned to /.*/ first — a sanitizer that clears a real bug.
              - patterns:
                  - pattern-inside: |
                      const $RE = $LIT;
                      ...
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $LIT
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
