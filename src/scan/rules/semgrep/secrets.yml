# Batch B9 — secrets & config-secret breadth (#71, spec docs/design/corpus-roadmap-to-100.md §3a).
# Per-batch custom-rule file (see base.yml header for the directory convention). The gitleaks-
# caught classes in this batch live in src/scan/rules/gitleaks-supabase.toml; these three are the
# structural patterns gitleaks (a value/regex matcher) can't express. Tiering per the locked
# preamble: only ~100%-precision structural sinks are ERROR + HIGH confidence (free count) — a
# secret-named key inlined into the client bundle via next.config `env`, and a hardcoded string
# fallback for a secret env read in an Edge Function. The secret-in-URL param is a heuristic
# (a query param can be non-sensitive), so it stays WARNING + MEDIUM → review.
#
# Exercised against targets/calibration by `pnpm validate:calibration`; see GROUND-TRUTH.md §B9.

rules:
  # A secret-named key placed in next.config `env: {}` is inlined into the CLIENT bundle at build
  # time — a service-role/secret/token handed to every visitor. The high-precision signal is the
  # KEY NAME inside the env block; a non-secret build constant (APP_VERSION, N-NEXTCONFIG-ENV-BENIGN)
  # doesn't match the name regex.
  - id: harvey-nextconfig-env-secret
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: HIGH
      category: security
      harveySeverity: Critical
    message: >
      A secret-named key is exposed through next.config `env` — its value is inlined into the
      client bundle and shipped to every browser. Never put service-role/secret/token values in
      `env`; keep them server-only (unprefixed process.env, read in server code).
    patterns:
      - pattern-inside: "{ ..., env: {...}, ... }"
      - pattern: "{ ..., $KEY: process.env.$V, ... }"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(service_role|secret|token|password|private_?key|_key|apikey).*
      - focus-metavariable: $KEY

  # An Edge Function that falls back to a hardcoded string literal when a secret env var is missing
  # ships the literal in its bundle/history instead of failing closed. The safe shape reads the env
  # and throws when absent (N-EDGEFN-SECRET-THROWS) — no string-literal `??`/`||` fallback. Scoped
  # to a SECRET-SHAPED literal (a known key-format prefix, or a long hex/base64 blob) so a non-secret
  # fallback (a URL, a feature flag, another Deno.env.get()/process.env read) doesn't fire (#163).
  - id: harvey-edgefn-secret-fallback
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      category: security
      harveySeverity: Critical
    message: >
      A secret read from Deno.env falls back to a hardcoded secret-shaped string literal — the
      literal ships in the deployed function bundle and its git history. Fail closed (throw) when
      the env var is absent; never embed a fallback secret.
      SCOPE OF THIS CHECK (#1342), so its silence elsewhere is not read as a clean bill of health:
      it fires only when the fallback literal is SECRET-SHAPED — a known key-format prefix, or a
      long hex/base64 string. A hardcoded fallback credential that does not look like one (a short
      password, a project-specific token format) is not assessed by this rule.
    patterns:
      - pattern-either:
          - pattern: Deno.env.get(...) ?? "$FALLBACK"
          - pattern: Deno.env.get(...) || "$FALLBACK"
      - metavariable-regex:
          metavariable: $FALLBACK
          regex: ^(sk_|pk_live_|re_|whsec_|eyJ|ghp_|xox[baprs]-)[A-Za-z0-9_-]{8,}$|^[A-Fa-f0-9]{32,}$|^[A-Za-z0-9+/]{32,}=*$

  # #595 (SuperRedHat F-09): the Node analogue of harvey-edgefn-secret-fallback. A `process.env.$NAME
  # || "$LIT"` / `?? "$LIT"` fallback ships the hardcoded literal in the bundle/history and makes the
  # secret fail OPEN (a missing env var silently uses a known dev secret) instead of failing closed.
  # edgefn-secret-fallback is Deno-only AND shape-gated (a key-format regex), which misses a Node
  # module whose fallback is a human-readable dev secret ("notevault-dev-secret"). This rule is NAME-
  # driven (the env var is named like a secret) rather than shape-driven, since dev secrets are rarely
  # key-shaped. The fallback must be a NON-EMPTY literal — a `?? ""` fail-closed default is cleared.
  # Review tier: whether the literal is a real secret vs. a placeholder is a triage call (fp-rules /
  # .env.example allowlist), so it is surfaced, not free-counted.
  - id: harvey-node-secret-fallback
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A secret-named environment variable falls back to a hardcoded non-empty string literal
      (process.env.X || "…"). The literal ships in the bundle and git history, and a missing env var
      silently uses this known value instead of failing closed. Throw when the variable is absent;
      never embed a fallback secret.
    patterns:
      - pattern-either:
          - pattern: process.env.$NAME || "$LIT"
          - pattern: process.env.$NAME ?? "$LIT"
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(SECRET|JWT|TOKEN|_KEY|APIKEY|PASSWORD|PRIVATE_?KEY|PASSPHRASE|CREDENTIAL).*
      - metavariable-regex:
          metavariable: $LIT
          regex: .+

  # A secret passed as a URL query parameter leaks into access logs, proxy caches, browser history,
  # and Referer headers. Review — a query param isn't always sensitive; the safe shape sends the
  # secret in an Authorization header (N-SECRET-IN-HEADER).
  #
  # #1237: the sink list was OUTBOUND HTTP ONLY, so a client-side NAVIGATION carrying the same
  # secret — `navigate(`/reset?token=${t}`)`, the OWASP React sheet's "Keep Sensitive Data Out of
  # URLs" example — did not fire. That facet is the WORSE half: an outbound fetch URL reaches the
  # target's logs, whereas a navigation writes the value into browser history AND the Referer header
  # of every subsequent third-party request from the destination page. Same class, same tier, so it
  # extends this rule rather than starting a second one. The parameter-NAME allowlist stays narrow
  # on purpose — this is a naming heuristic, and `session`/`code` were deliberately left out (a
  # conference `?session=` and an OAuth `?code=` on the redirect URI are both routine and benign).
  - id: harvey-secret-in-url-param
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-598: Use of HTTP Request With Sensitive Query String"]
      owasp: ["A04:2021 - Insecure Design"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A secret is passed as a URL query parameter (api_key/access_token/token/secret). Secrets in
      URLs leak into logs, proxies, browser history, and Referer headers. Send it in an
      Authorization header instead.
      SCOPE OF THIS CHECK (#1342), so its silence elsewhere is not read as a clean bill of health:
      it recognises secrets by the PARAMETER NAME only. Names deliberately left out — `session`,
      `code`, and anything project-specific — are not assessed, so a credential carried under a
      different parameter name will not appear here.
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - pattern: fetch($URL)
          - pattern: $C.get($URL, ...)
          - pattern: $C.post($URL, ...)
          # #1237 — client-side navigation sinks.
          - pattern: navigate($URL, ...)
          - pattern: $R.push($URL, ...)
          - pattern: $R.replace($URL, ...)
          - pattern: $R.assign($URL, ...)
          - pattern: redirect($URL, ...)
          - pattern: $W.location.href = $URL
          - pattern: $W.location = $URL
      - metavariable-regex:
          metavariable: $URL
          regex: (?i).*[?&](api_?key|apikey|access_token|refresh_token|auth_token|token|secret|password|passwd|otp)=.*
      - focus-metavariable: $URL
