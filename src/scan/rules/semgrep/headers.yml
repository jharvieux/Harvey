# Batch B5 (#71, spec §"Batch 6 — Headers / CORS / CSRF / transport / error-hygiene").
# Per-batch custom-rule file (see base.yml header for the directory convention). This batch's
# detection mechanism is mostly "config-parse custom" rather than taint: reflected-origin CORS,
# missing-header presence-in-an-array checks, insecure cookie flags, CSRF-missing on a
# cookie-authed Server Action, and dev-mode error/config leakage. Two rows already ship
# ([exists]): P-NO-CSP (checkMissingCsp, src/scan/semgrep.ts) and P-CORS-WILDCARD
# (harvey-permissive-cors, base.yml) — not duplicated here. Tiering per the locked preamble:
# only the reflected-origin CORS rule and the bare-cookie rule are ~100%-precision (`high`,
# free count); the rest are heuristic presence/pattern checks (`review`).
#
# Missing-header rules (harvey-missing-hsts/frame-options/nosniff) use the Semgrep
# "pattern minus pattern-not, both with `...`" idiom to detect a next.config.js headers() route
# object whose `headers:` array lacks a specific key — verified directly against fixture pairs
# with `semgrep --config headers.yml` before being wired in (a Semgrep AST rule can't express
# "absent anywhere in this file", but it CAN express "this specific array literal has no element
# shaped like X", which is what's needed here). This deliberately does NOT reuse
# checkMissingCsp's cross-file (next.config.js/middleware.ts/vercel.json) global-OR presence
# check — that check is correctly global (a CSP set in any one of the three means the app has a
# CSP), so folding new headers into those files would flip the existing P-NO-CSP fixture off.
# Keeping these as per-object-literal Semgrep matches lets the positive (incomplete) and negative
# (complete) route objects coexist in the same next.config.js without disturbing it.
#
# Exercised against targets/calibration by `pnpm validate:calibration`; see GROUND-TRUTH.md §B5.
#
# Byte-equal copy of base.yml's canonical request-taint source block (#1221) — YAML anchors resolve
# at parse time and do not cross documents, so each file needs its own. Rationale and the FP
# measurement that fixed its shape: base.yml. `semgrep-shared-sources.test.ts` fails loud on drift.
x-request-source: &request_source
  pattern-either:
    # Express / Pages-Router accessors, plus the App Router handler parameter.
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            # #984: cookies/headers are attacker-controllable request sources (session tokens,
            # X-Forwarded-*, User-Agent, custom headers) — a well-known injection entry point.
            - pattern: $REQ.cookies
            - pattern: $REQ.headers
            # #987: method-form request accessors (Express req.get('X-…')/req.header('X-…')). The
            # destructured/bracket/aliased/multi-hop forms propagate through semgrep's taint
            # dataflow once the base object is a source; the method form is a distinct call shape.
            - pattern: $REQ.get(...)
            - pattern: $REQ.header(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^_?(req|request|nextReq|nextRequest|httpReq|incoming)$
    # #1221: the App Router query string. `$U.searchParams` subsumes `req.nextUrl.searchParams`
    # AND the split `const u = new URL(req.url); u.searchParams.get(…)` form, so neither needs its
    # own pattern; the `.get(...)` arm carries the inline `new URL(req.url).searchParams.get(…)`
    # call. A BARE `$SP.get(...)` is deliberately NOT used — measured to fire on Map/Headers/
    # config/FormData `.get()` even behind the `^(?!(https?|axios)$)` http-client guard.
    - pattern: $U.searchParams.get(...)
    - pattern: $U.searchParams
    # #1221: the App Router request body — the shape 17 of 21 rules were blind to.
    - pattern: await $REQ.json()
    # #984: App Router next/headers request sources.
    - pattern: cookies()
    - pattern: headers()
    # #1240: the App Router SERVER COMPONENT request props. A page/layout receives its dynamic route
    # segments and query string as DESTRUCTURED PARAMETERS — `{ params }` / `{ searchParams }` — and
    # never as a `req` object, so every arm above is blind to the idiomatic RSC page. Found through
    # the SSRF facet (P-OWASP-REACT-RSC-SSRF), but the gap was never SSRF's: the shared block did not
    # model the source, so all 21 rules missed it.
    #
    # Reached by NAME because semgrep OSS cannot match a destructured object parameter in JS/TS
    # (TRIED 2026-07-27, semgrep 1.164.0 — `function $C({ ..., $P, ... }, ...) { ... }` and three
    # variants matched nothing on a file the equivalent name-based rule matched twice). The
    # `pattern-not-inside` is what makes the name safe: a locally-ASSIGNED `params`/`searchParams` is
    # an options bag, a URLSearchParams the module built itself, or a Map alias — never a request
    # prop, because a destructured parameter is never assigned. MEASURED against five benign probes
    # (options object, axios config, locally-built URLSearchParams, Map alias, RPC argument bag): the
    # bare name-constrained access fired on THREE of five; with the not-inside it fires on none,
    # while all four RSC positives still fire. `await $RSCPROP` carries the Next 15 shape, where
    # `params` is a Promise the component awaits before destructuring.
    - patterns:
        - pattern-either:
            - pattern: $RSCPROP.$RSCFIELD
            - pattern: await $RSCPROP
        - metavariable-regex:
            metavariable: $RSCPROP
            regex: ^(params|searchParams)$
        - pattern-not-inside: |
            $RSCPROP = ...
            ...
        # #1344: the assignment guard above was the ONLY exclusion, and a name arriving as an
        # ordinary FUNCTION PARAMETER is never assigned — so `function runJob(params: JobSpec)`,
        # a scheduler argument bag with no request anywhere near it, was read as request input.
        # MEASURED 2026-07-27 on two byte-identical files differing only in the parameter name:
        # `params`/`searchParams` produced 6 findings including harvey-command-injection at
        # Critical/precisionTier=high (GRADED), `opts`/`spec` produced 3. That falsified this
        # block's own recorded measurement, which claimed an "RPC argument bag" probe fired on
        # none — all five probes must have bound the name by local assignment.
        #
        # The discriminator is the BINDING FORM, which is also what makes the name safe at all: an
        # RSC page receives `{ params }` DESTRUCTURED, and semgrep OSS cannot match a destructured
        # object parameter (the reason this source is name-based in the first place). So a plain
        # identifier parameter is excludable precisely because the real shape is not.
        - pattern-not-inside: |
            function $F(..., $RSCPROP, ...) { ... }
        - pattern-not-inside: |
            (..., $RSCPROP, ...) => ...

# #1248: the (a2) validator guards, with a failure branch that THROWS instead of returning.
# Throwing is the idiomatic guard in a Next.js Server Action or route handler under an error
# boundary, in Express with http-errors/createError, and in NestJS (BadRequestException) — so
# before this block a correct throwing guard read as a Critical injection. MEASURED 2026-07-31
# (semgrep 1.164.0): the issue's own repro fired harvey-sql-injection-template at Critical.
#
# WHY IT IS A SEPARATE SANITIZER AND NOT A WIDENED ARM. A `return` is unconditionally an exit.
# A `throw` is an exit only if nothing between the guard and the sink catches it: with the guard
# inside a `try` whose `catch` swallows, execution continues into the sink with the rejected
# value live, and a `finally` runs the sink even when the throw propagates. That has no analogue
# on the return path, so the throw spellings carry a constraint the return spellings do not —
# the guard must not be lexically inside a try statement. This is deliberately conservative: a
# guard AND its sink both inside one try (where the throw does skip the sink) is not cleared,
# which costs precision in the safe direction and never clears a live value.
# MEASURED 2026-07-31, both directions: with the two pattern-not-inside conjuncts the swallowed
# and finally-run shapes FIRE; with them deleted both go silent — a real bug cleared by a guard
# that never protected it. Adversarial positives P-SQLI-THROW-SWALLOWED / P-SQLI-THROW-FINALLY.
#
# `throw $E;` rather than `throw ...;`: a throw always carries an operand, so there is no
# valueless twin to cover the way `return;` needed one.
x-throw-guard: &throw_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - pattern: |
            if (!$ARR.includes($X)) { ... throw $E; }
        - pattern: |
            if (!$ARR.includes($X)) throw $E;
        - pattern: |
            if (!$SET.has($X)) { ... throw $E; }
        - pattern: |
            if (!$SET.has($X)) throw $E;
    - focus-metavariable: $X

# #1248: the SCHEMA-validator (a2) guard whose failure branch throws. Same soundness argument and
# the same two try exclusions as x-throw-guard above, and the same allowlist constraints as the
# return spelling — an ANCHORED, POSITIVE-class `.regex(...)` or an `.enum([...])` membership list,
# because a bare `z.string()` accepts everything and `$P.data` IS then the raw input.
#
# UNLIKE the return spelling it is `by-side-effect` on `$P`, not a `pattern-inside` region ending
# at `$P.data`. MEASURED 2026-07-31: semgrep's statement `...` matches DEEPLY, so a region written
# `safeParse(...); ... if (!$P.success) throw $E; ...` matches a guard nested inside a `try` — and
# the try exclusions, attached to the `$P.data` use site, sat outside that try and cleared it. Both
# swallowed-throw fixtures went silent under that form and fire under this one
# (P-CMD-ZOD-THROW-SWALLOWED, P-CMD-ZOD-ENUM-THROW-SWALLOWED).
x-throw-schema-guard: &throw_schema_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-inside: |
                $P = $Z.regex($RE).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                $P = $Z.enum([...]).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
    - focus-metavariable: $P

rules:
  # Reflected-origin CORS: Access-Control-Allow-Origin is set to the request's own Origin header
  # (not validated against an allowlist) AND Allow-Credentials is true — an attacker's page can
  # read the response with the victim's cookies attached, for any origin. The two-statement
  # pattern with a `...` gap requires both header sets to appear in the same function; a single
  # reflected-origin set with no credentials, or an allowlisted origin (N-CORS-ALLOWLIST), does
  # not match. HIGH → free count.
  - id: harvey-cors-reflected-origin
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-942: Permissive Cross-domain Security Policy with Untrusted Domains"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      Access-Control-Allow-Origin reflects the request's Origin header verbatim (no allowlist),
      combined with Access-Control-Allow-Credentials: true. This defeats CORS's same-origin
      protection for authenticated requests from any origin. Validate Origin against an
      allowlist before echoing it back.
    patterns:
      - pattern-either:
          - pattern: |
              $RES.headers.set("Access-Control-Allow-Origin", $REQ.headers.get("origin"))
              ...
              $RES.headers.set("Access-Control-Allow-Credentials", "true")
          - pattern: |
              $RES.setHeader("Access-Control-Allow-Origin", $REQ.headers.origin)
              ...
              $RES.setHeader("Access-Control-Allow-Credentials", "true")

  # #601 (CX-17): the OBJECT-LITERAL reflected-origin variant. The App Router idiom builds a headers
  # map — `{ "Access-Control-Allow-Origin": origin, "Access-Control-Allow-Credentials": "true" }`
  # (origin = request.headers.get("origin")) — and returns it via new NextResponse(body, { headers }),
  # instead of the imperative res.headers.set() the rule above matches. Taint from the request origin
  # to the object field, gated on Allow-Credentials: "true" in the SAME literal, is the same
  # ~100%-precision reflected+credentials combo → high. A hardcoded allowlisted origin string is not
  # tainted, so it never reaches the sink (N-CORS-OBJLIT-REFLECTED-SAFE).
  - id: harvey-cors-reflected-origin-object
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    metadata:
      cwe: ["CWE-942: Permissive Cross-domain Security Policy with Untrusted Domains"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      An object-literal CORS headers map reflects the request's Origin header verbatim into
      Access-Control-Allow-Origin, combined with Access-Control-Allow-Credentials: "true". Any
      origin can read the response with the victim's cookies attached. Validate Origin against an
      allowlist before echoing it back.
    pattern-sources:
      - pattern: $REQ.headers.get("origin")
      - pattern: $REQ.headers.get("Origin")
      - pattern: $REQ.headers.origin
    pattern-sinks:
      - patterns:
          - pattern: '{ ..., "Access-Control-Allow-Origin": $O, ..., "Access-Control-Allow-Credentials": "true", ... }'
          - focus-metavariable: $O

  # CSP present but weakened with 'unsafe-inline'/'unsafe-eval' in script-src — defeats the
  # policy's main XSS mitigation (inline/eval'd script runs regardless of the policy). Review —
  # some apps genuinely need unsafe-inline for a third-party widget and accept the trade-off.
  - id: harvey-csp-unsafe-inline
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      # #975: no clean OWASP Top-10-2021 category maps to this CWE; cwe carried, owasp omitted.
      cwe: ["CWE-693: Protection Mechanism Failure"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      Content-Security-Policy's script-src allows 'unsafe-inline' or 'unsafe-eval', which
      defeats CSP's main XSS mitigation (inline/eval'd script executes regardless of the
      policy). Use nonces/hashes for inline scripts instead.
    patterns:
      - pattern: '{ key: "Content-Security-Policy", value: $V }'
      - metavariable-regex:
          metavariable: $V
          regex: (?is).*script-src.*unsafe-(inline|eval).*

  # Missing Strict-Transport-Security on a next.config.js headers() route. Review — HSTS can
  # legitimately be set at the CDN/hosting layer this repo scan can't see (same caveat as CSP).
  - id: harvey-missing-hsts
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-319: Cleartext Transmission of Sensitive Information"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      This next.config.js headers() route does not set Strict-Transport-Security. Without HSTS
      a user's first request (or any downgraded request) can be intercepted over plain HTTP.
      SCOPE OF THIS CHECK: it reads this repository's next.config.js only. A header legitimately
      set at the CDN/hosting layer, a proxy, or middleware is invisible to a source scan — confirm
      at the edge before treating this as unmitigated.
    patterns:
      - pattern: '{ source: $S, headers: $ARR }'
      - pattern-not: '{ source: $S, headers: [..., { key: "Strict-Transport-Security", ... }, ...] }'

  # Missing X-Frame-Options (or an equivalent frame-ancestors CSP directive) — clickjacking.
  # Review — same hosting-layer caveat as HSTS/CSP.
  - id: harvey-missing-frame-options
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-1021: Improper Restriction of Rendered UI Layers or Frames"]
      owasp: ["A04:2021 - Insecure Design"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      This next.config.js headers() route does not set X-Frame-Options (or a frame-ancestors
      CSP directive) — the page can be framed by any site and used for clickjacking.
      SCOPE OF THIS CHECK: it reads this repository's next.config.js only. A header legitimately
      set at the CDN/hosting layer, a proxy, or middleware is invisible to a source scan — confirm
      at the edge before treating this as unmitigated.
    patterns:
      - pattern: '{ source: $S, headers: $ARR }'
      - pattern-not: '{ source: $S, headers: [..., { key: "X-Frame-Options", ... }, ...] }'

  # Missing X-Content-Type-Options: nosniff — a browser may MIME-sniff a response into an
  # executable content type. Review — same hosting-layer caveat.
  - id: harvey-missing-nosniff
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      # #975: no clean OWASP Top-10-2021 category maps to this CWE; cwe carried, owasp omitted.
      cwe: ["CWE-693: Protection Mechanism Failure"]
      confidence: MEDIUM
      category: security
      harveySeverity: Low
    message: >
      This next.config.js headers() route does not set X-Content-Type-Options: nosniff — a
      browser may MIME-sniff the response into an executable content type.
      SCOPE OF THIS CHECK: it reads this repository's next.config.js only. A header legitimately
      set at the CDN/hosting layer, a proxy, or middleware is invisible to a source scan — confirm
      at the edge before treating this as unmitigated.
    patterns:
      - pattern: '{ source: $S, headers: $ARR }'
      - pattern-not: '{ source: $S, headers: [..., { key: "X-Content-Type-Options", ... }, ...] }'

  # CSRF on a cookie-authed Server Action: a mutation ('use server' + delete/update) with no
  # Origin check anywhere in the function. Review — a heuristic (can't see a global CSRF
  # middleware living elsewhere), and correctly N/A on token-authed (non-cookie) APIs, which
  # never reach this pattern-inside scope.
  - id: harvey-csrf-missing
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
      # #493: CWE-352 is definitional. Verified against OWASP's official Top-10-2021 CWE mapping
      # (owasp.org/Top10/2021/A01_2021-Broken_Access_Control/) — CWE-352 IS in A01's mapped-CWE
      # list, so the #455 "no dedicated category" call was wrong; corrected to add the owasp field.
      cwe: ["CWE-352: Cross-Site Request Forgery (CSRF)"]
      owasp: ["A01:2021 - Broken Access Control"]
    message: >
      This 'use server' Server Action mutates data with no Origin/CSRF check. Cookie-based auth
      is submitted automatically by the browser on cross-site requests too — without an Origin
      allowlist or CSRF token, a malicious page can trigger this mutation as the logged-in user.
      SCOPE OF THIS CHECK (#1342), so its silence elsewhere is not read as a clean bill of health:
      it looks for an Origin or CSRF comparison inside this function. A global CSRF guard — proxy
      middleware, a framework default, or a shared action wrapper applied everywhere — is not
      something this rule reads, so confirm none applies before treating this as unprotected.
    patterns:
      - pattern-inside: |
          "use server";
          ...
      - pattern: |
          async function $F(...) {
            ...
          }
      - pattern-either:
          - pattern-inside: |
              async function $F(...) {
                ...
                $DB.from($T).delete(...)
                ...
              }
          - pattern-inside: |
              async function $F(...) {
                ...
                $DB.from($T).update(...)
                ...
              }
      - pattern-not-inside: |
          async function $F(...) {
            ...
            $H.get("origin")
            ...
          }

  # Bare Set-Cookie with no attributes at all (no Secure/HttpOnly/SameSite) — the metavariable
  # captures the cookie value expression's source text; a value with zero semicolons has no
  # attributes appended. A hardened cookie string (`sid=...; HttpOnly; Secure; SameSite=Strict`)
  # contains semicolons and is not matched (N-COOKIE-SECURE). HIGH → free count.
  - id: harvey-cookie-insecure
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      Set-Cookie is written with no Secure/HttpOnly/SameSite attributes. A session cookie
      without HttpOnly is readable by any injected script (XSS → session theft); without
      Secure it can be sent over plain HTTP; without SameSite it rides cross-site requests.
      SCOPE OF THIS CHECK (#1294): the CWE this finding carries names the SECURE attribute only,
      because a finding carries one weakness id. The `(?s)^[^;]*$` match below proves the cookie
      has NO attribute at all, so the missing HttpOnly and SameSite are equally determined and are
      equally your problem — read the CWE as the narrowest of the three, not as the whole defect.
    patterns:
      - pattern: $RES.setHeader("Set-Cookie", $V)
      - metavariable-regex:
          metavariable: $V
          regex: (?s)^[^;]*$

  # Express-style res.cookie(name, value[, options]) with the security attributes missing (#988).
  # BenchProctor and real Express code use the framework method, not a raw Set-Cookie string — the
  # rule above scores 0% on it. Fires on the 2-arg form (no options at all) and on any options
  # object that does not set httpOnly AND secure AND sameSite. The fully-hardened form is excluded.
  - id: harvey-cookie-insecure-express
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      An Express cookie is set with res.cookie() missing one or more of HttpOnly/Secure/SameSite.
      Without HttpOnly it is readable by injected script (XSS → session theft); without Secure it
      can ride plain HTTP; without SameSite it rides cross-site requests. Set all three.
    patterns:
      - pattern-either:
          - pattern: $RES.cookie($NAME, $VAL)
          - pattern: $RES.cookie($NAME, $VAL, $OPTS)
      - pattern-not: |
          $RES.cookie($NAME, $VAL, { ..., httpOnly: true, ..., secure: true, ..., sameSite: $SS, ... })

  # A caught error's .stack or .message is echoed straight into the JSON response — leaks stack
  # traces / internal paths / library versions to the client. Review — some apps intentionally
  # surface .message in dev, and this is common enough to need triage rather than an auto-Critical.
  #
  # #1184 (cipherx CX-18): the original four patterns were all Express-shaped and single-argument,
  # so the App Router form — `NextResponse.json(body, { status: 500 })` — matched none of them.
  # `$RES.json(…, ...)` covers res.json, NextResponse.json and Response.json in one, and the
  # trailing `...` admits the init argument (MEASURED 2026-07-27: without it the two-argument call
  # does not match, and with it the one-argument call still does). The key is a metavariable now:
  # the leak is the .stack VALUE reaching the body, whatever field it is filed under.
  - id: harvey-verbose-error
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-209: Generation of Error Message Containing Sensitive Information"]
      owasp: ["A04:2021 - Insecure Design"]
      confidence: MEDIUM
      category: security
      harveySeverity: Low
    message: >
      A caught error's .stack or .message is echoed directly into the JSON response — this
      leaks stack traces, file paths, and library versions to the client. Log the detail
      server-side and return a generic error to the client.
    patterns:
      - pattern-either:
          - pattern: '$RES.json({ ..., $K: $ERR.stack, ... }, ...)'
          - pattern: '$RES.status($CODE).json({ ..., $K: $ERR.stack, ... })'
          - pattern: '$RES.json({ ..., error: $ERR.message, ... }, ...)'
          - pattern: '$RES.status($CODE).json({ ..., error: $ERR.message, ... })'

  # #1184 (cipherx CX-18) — the other half of that endpoint: server internals returned in a response
  # body that are not an error object at all. `process.env` dumps every secret the process holds
  # (service-role keys, DB URLs, third-party tokens); `process.cwd()` discloses the deploy path and
  # with it the hosting layout. cipherx's src/app/api/debug/route.ts returned both, and mechanical
  # caught only the connection string that happened to be embedded in the dump.
  #
  # Scoped to a RESPONSE position, which is the whole precision argument: reading process.env to
  # configure a client is the normal way to use it, and logging process.cwd() server-side is
  # unremarkable — putting either in the body is the bug. Deliberately matches the object as a
  # WHOLE (`process.env`), not a single read (`process.env.NEXT_PUBLIC_URL`), so echoing one
  # already-public config value back to the client does not fire.
  - id: harvey-internal-state-response
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      # CWE-497 (Exposure of Sensitive System Information) is the tighter label, but it is not in
      # the #493-verified official CWE→Top-10-2021 mapping table and asserting a category for it
      # would be a guess. Its parent CWE-200 IS in that table, under A01.
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: HIGH
      category: security
      harveySeverity: Medium
    message: >
      The response body includes process.env or process.cwd() — an information exposure that
      returns the server's environment (every secret it holds) or its filesystem layout to the
      caller. Return only the fields the client needs, and keep debug endpoints out of deployed
      builds. SCOPE OF THIS CHECK: it matches the whole object in a RESPONSE position only.
      Reading a single value (process.env.NEXT_PUBLIC_URL) or configuring a client from
      process.env is not assessed.
    patterns:
      - pattern-either:
          - pattern: '$RES.json({ ..., $K: process.env, ... }, ...)'
          - pattern: '$RES.json({ ..., $K: process.cwd(), ... }, ...)'
          - pattern: '$RES.status($CODE).json({ ..., $K: process.env, ... })'
          - pattern: '$RES.status($CODE).json({ ..., $K: process.cwd(), ... })'
          - pattern: '$RES.send({ ..., $K: process.env, ... })'
          - pattern: '$RES.send({ ..., $K: process.cwd(), ... })'
          - pattern: 'new Response(JSON.stringify({ ..., $K: process.env, ... }), ...)'
          - pattern: 'new Response(JSON.stringify({ ..., $K: process.cwd(), ... }), ...)'

  # The raw Postgres/PostgREST error object (conventionally named `error`, matching Supabase-js's
  # `{ data, error } = await supabase...` destructure) is echoed straight into the JSON response
  # — leaks constraint names, column names, and query internals. Review — matches on the `error`
  # identifier by name, the near-universal supabase-js convention; a generic message object
  # (N-ERROR-GENERIC) is a different shape and is not matched.
  - id: harvey-db-error-disclosure
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-209: Generation of Error Message Containing Sensitive Information"]
      owasp: ["A04:2021 - Insecure Design"]
      confidence: MEDIUM
      category: security
      harveySeverity: Low
    message: >
      The raw database error object is echoed directly into the JSON response — this leaks
      constraint/column names and query internals. Log it server-side and return a generic
      error to the client.
    patterns:
      - pattern-either:
          - pattern: $RES.status($CODE).json(error)
          - pattern: $RES.json(error)
          - pattern: $RES.status($CODE).json({ error })
          - pattern: $RES.json({ error })

  # NODE_ENV is force-assigned to a non-production value in application code — ships dev-mode
  # behavior (verbose errors, disabled optimizations, permissive CORS in some frameworks)
  # regardless of the actual deploy environment. Review — presence isn't automatically
  # exploitable, but it's a config footgun worth a human look.
  - id: harvey-node-env-not-prod
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      # #975: no clean OWASP Top-10-2021 category maps to this CWE; cwe carried, owasp omitted.
      cwe: ["CWE-489: Active Debug Code"]
      confidence: MEDIUM
      category: security
      harveySeverity: Low
    message: >
      NODE_ENV is force-assigned to a non-production value in application code, overriding
      whatever the deploy environment actually set — this can ship dev-mode behavior
      (verbose errors, disabled optimizations) to production.
    patterns:
      - pattern-either:
          - pattern: process.env.NODE_ENV = "development"
          - pattern: process.env.NODE_ENV = 'development'

  # ---- Batch B12 (#71) — Next-config & client-surface misconfig (config/server-response half;
  # the client-surface half lives in xss.yml). See GROUND-TRUTH.md §B12. Verified directly against
  # the config-variants/*.config.js and pages/api fixture pairs with `semgrep --config headers.yml`
  # before wiring in. ----

  # next/image with a wildcard remotePatterns hostname ('**' / '*') turns the built-in image
  # optimizer into an open proxy: it will fetch and re-serve an image from ANY host an attacker
  # names (SSRF to internal endpoints, using your bandwidth/IP as a fetch relay). The precise signal
  # is an all-asterisks hostname literal inside a remotePatterns element; an explicit host or a
  # bounded '*.example.com' subdomain wildcard does not match. HIGH → free count.
  - id: harvey-img-remotepatterns-wild
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      next/image images.remotePatterns has a wildcard hostname ('**'/'*') — the image optimizer
      will fetch and re-serve images from any host (SSRF / open image proxy). Pin remotePatterns to
      an explicit host allowlist.
    patterns:
      - pattern-inside: "{ ..., remotePatterns: [...], ... }"
      - pattern: "{ ..., hostname: $H, ... }"
      - metavariable-regex:
          metavariable: $H
          regex: (?s)^['"]?\*+['"]?$
      - focus-metavariable: $H

  # productionBrowserSourceMaps: true ships the original, un-minified source (and often comments /
  # internal paths / logic) to every browser as .map files. The safe value is false or absent. The
  # literal `true` is an unambiguous, exact config match. HIGH → free count.
  - id: harvey-prod-sourcemaps
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-540: Inclusion of Sensitive Information in Source Code"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: HIGH
      category: security
      harveySeverity: Medium
    message: >
      productionBrowserSourceMaps: true ships readable original source maps to every browser in
      production, exposing your un-minified client source. Remove it (defaults to false) unless you
      intentionally publish source maps.
    patterns:
      - pattern: "{ ..., productionBrowserSourceMaps: true, ... }"

  # Server Actions allowedOrigins: ['*'] disables the origin allowlist that protects Server Action
  # POSTs from cross-site invocation (CSRF). A bare '*' element is the unambiguous signal; an
  # explicit host list does not match. HIGH → free count.
  - id: harvey-serveractions-origin-wild
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-346: Origin Validation Error"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      experimental.serverActions.allowedOrigins includes '*' — this disables the Server Actions
      origin allowlist and lets any site invoke your Server Actions cross-origin (CSRF). List the
      exact allowed origins instead.
    patterns:
      - pattern: "{ ..., allowedOrigins: [..., \"*\", ...], ... }"

  # A Supabase Storage signed URL minted with an excessive numeric TTL (here: > 7 days). Signed URLs
  # are meant to be short-lived; a multi-month/year expiry is effectively a permanent public link
  # that survives any later access revocation. metavariable-comparison fires only on a literal
  # second argument above the threshold; a short TTL (e.g. 300) does not match. HIGH → free count.
  # Distinct from B9's P-SIGNED-URL-TOKEN-SRC (a committed signed-URL token, a gitleaks value match).
  - id: harvey-signed-url-ttl
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-613: Insufficient Session Expiration"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      category: security
      harveySeverity: Medium
    message: >
      createSignedUrl is called with an excessive expiry (> 7 days). A long-lived signed URL is
      effectively a public link that outlives access revocation and leaks via logs/Referer/history.
      Use a short TTL (seconds to minutes) sized to the actual use.
    patterns:
      - pattern: $X.createSignedUrl($P, $N)
      - metavariable-comparison:
          metavariable: $N
          comparison: $N > 604800

  # CRLF / response-splitting: a request-controlled value flows into a response header value. A CR/LF
  # in the value can inject extra headers or split the response. Taint from req.query/req.body/
  # req.headers into a res.setHeader value; a .replace() that strips CR/LF is the sanitizer. Review —
  # a heuristic (some frameworks already reject CR/LF in header values). See N-CRLF-SANITIZED.
  - id: harvey-crlf-header-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      cwe: ["CWE-113: Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Request/Response Splitting')"]
      owasp: ["A03:2021 - Injection"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      A request-controlled value is written into a response header (res.setHeader) with no CR/LF
      stripping — an attacker can inject additional headers or split the response (CRLF injection).
      Strip CR/LF (or reject the value) before setting the header.
      SCOPE OF THIS CHECK (#1342), so its silence elsewhere is not read as a clean bill of health:
      it reports the unstripped write. Some frameworks already reject CR/LF in header values at the
      runtime layer, which a source scan cannot confirm — verify your framework's behaviour before
      treating this as exploitable.
    # #1224 judgment: adopt the canonical block WHOLESALE. The weakness is CR/LF reaching a
    # response-header value, so every attacker-controlled STRING is in class and no source in the
    # block is out of it — there is nothing to weigh. The eight patterns this replaces are all
    # subsumed: `$REQ.query` covers `$REQ.query.$K`, and `$REQ.headers` covers both the dotted and
    # bracket forms, through taint propagation once the base object is a source.
    #
    # This also NARROWS the rule, which is the point: the old free `$REQ.` metavariable made
    # `upstream.headers.etag` a source. The canonical block name-constrains it, so the change is a
    # recall gain (searchParams, the JSON body, cookies()/headers(), the method-form accessors) and
    # a precision gain at once.
    pattern-sources:
      - *request_source
    pattern-sanitizers:
      - pattern: $S.replace(...)
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              # #1363: the same guard with the regex HOISTED to a named constant — how it is normally
              # written once the regex is reused, and until now it read as vulnerable. metavariable-regex
              # reads a metavariable's matched TEXT, so $RE binds to the identifier `OK` and the anchoring
              # constraint has to move to the literal, bound alongside the guard by pattern-inside. `const`
              # deliberately, not a bare `$RE = $LIT`: MEASURED 2026-07-31, the bare form also clears a
              # guard whose regex was reassigned to /.*/ first — a sanitizer that clears a real bug.
              - patterns:
                  - pattern-inside: |
                      const $RE = $LIT;
                      ...
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $LIT
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      # #1027: (a2) SCHEMA-validator guard — zod/valibot `safeParse` + an early return on
      # `!result.success`. Measured as the largest unmodeled sub-population in the #989 census and
      # the idiomatic shape in real Next/Express code, unlike BenchProctor's bare regex guards.
      #
      # What makes it sound is that the sink receives `$P.data` — a value the SCHEMA produced —
      # rather than the original input, so this is closer to a transformation than a gate. But
      # `z.string()` alone accepts every string, i.e. `.data` IS the raw input: the schema must
      # carry a real allowlist. Hence the SAME constraints as the regex form, each with a
      # calibration positive that must still fire: an ANCHORED, POSITIVE-class `.regex(...)`, or a
      # `.enum([...])` membership list; and a failure branch that RETURNS. A guard on one variable
      # while the sink reads another (`$P.data` never used) is untouched by construction.
      # #1236: the braceless `if (!$P.success) return ...;` spelling is matched too — see the
      # (a2) block above.
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
      - *throw_guard
      - *throw_schema_guard
    pattern-sinks:
      - patterns:
          - pattern: $RES.setHeader($NAME, $VAL)
          - focus-metavariable: $VAL

  # On-demand ISR: res.revalidate() rebuilds a request-controlled path with no shared-secret gate in
  # the handler — anyone can force cache purges/rebuilds (stampede DoS, forced content refresh). The
  # safe shape compares req.query.secret against a server secret first; any handler that references
  # req.query.secret is excluded. Review — a heuristic (the secret check could live in shared
  # middleware). See N-ISR-REVALIDATE-SECRET.
  - id: harvey-isr-revalidate-nosecret
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-862: Missing Authorization"]
      owasp: ["A01:2021 - Broken Access Control"]
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
    message: >
      An on-demand ISR revalidation endpoint calls res.revalidate() on a request-controlled path
      with no shared-secret check — anyone can force cache purges/rebuilds (DoS). Require a secret
      token (compared against a server-side value) before revalidating.
      SCOPE OF THIS CHECK (#1342), so its silence elsewhere is not read as a clean bill of health:
      it looks for the secret comparison inside this handler. A check that lives in shared
      middleware or a route wrapper is outside what this rule reads, so confirm none applies before
      treating the endpoint as unprotected.
    patterns:
      - pattern: $RES.revalidate($REQ.query.$P)
      - pattern-not-inside: |
          function $F(...) { ... if (<... $Q.query.secret ...>) {...} ... }
      - pattern-not-inside: |
          ($A, $B) => { ... if (<... $Q.query.secret ...>) {...} ... }
