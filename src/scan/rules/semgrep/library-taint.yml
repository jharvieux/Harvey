# Library-internal parameter-sourced taint (#946). The request-sourced taint rules in injection.yml
# model the APP-LAYER shape: an HTTP request (req.query/body/params/cookies/headers, App-Router
# searchParams) flowing to a sink. That leaves a whole axis dark — the SAME injection sinks reached
# from a LIBRARY ENTRY POINT with no request layer: an exported function whose PARAMETER is the
# untrusted value, or a raw node http/https server whose request callback parameter is. This is the
# axis the SecBench.js corpus exercises (measured 0/600 through the request rules — see
# docs/design/secbench-recall-measurement.md), and the operator scoped it in on 2026-07-26:
# library-internal parameter-sourced taint IS in Harvey's whole-codebase remit.
#
# Two source shapes, both a PARAMETER treated as taint:
#   A — a raw node http/https server callback request param (`http.createServer((req,res)=>…)`), the
#       dominant SecBench path-traversal shape (`var p = "./" + req.url; fs.readFile(p)`);
#   B — an EXPORTED library function's first parameter (module.exports / exports.x / export fn /
#       export default), the canonical "library entry point" the issue names.
#
# PRECISION POSTURE. A function parameter is a far broader source than a request object, so every
# rule here is WARNING + MEDIUM confidence — REVIEW tier, never the free/high count (semgrep.ts maps
# high = ERROR + confidence HIGH). The source is deliberately gated to the PUBLIC API surface
# (exported functions + server request callbacks), not every internal parameter, so a private helper
# that happens to touch a param does not fire; and taint mode still requires the param to REACH a
# sink, unsanitized. path.basename remains the containment sanitizer, as in harvey-path-traversal.
# Recall is bounded by OSS Semgrep's intra-procedural taint (#873): a param that reaches the sink
# only after crossing a helper-function boundary (SecBench's aaptjs list()→promistify()→exec) is not
# followed — that limitation is measured, not worked around. Scored by targets/calibration
# (b3-injection.entries.ts P-LIB-*/N-LIB-*) and, on real CVEs, by the library-source pathway of
# validate-secbench.ts.

# Shape B — an EXPORTED library function's parameter, shared by all three rules below through a
# YAML anchor (#1222). It was hand-copied three times; unifying it is the #1221 lesson applied
# before the divergence happens rather than after.
#
# #1222: `export function $F($P, ...)` also matches `export async function GET(req: Request)`, so
# an App Router ROUTE HANDLER was being read as a library entry point. That is not a save when the
# app-layer rule is blind — it is a severity downgrade (High -> Medium) narrated with the wrong
# story: a client is told their public HTTP route is "an exported library function's parameter".
# Worse, it MASKS: a calibration entry scored on "did a relevant finding appear?" records the gap
# as covered, which is the #1062 shape reached through rule precedence.
#
# The App Router HTTP-method names are therefore excluded, so the app-layer rules own those routes.
# Sequenced deliberately AFTER #1221/#1220/#1223/#1224: doing this first would have converted a
# Medium-with-the-wrong-message into silence, which is worse than either.
x-library-entry-point: &library_entry_point
  patterns:
    - pattern-either:
        - pattern: module.exports = function $F($P, ...) { ... }
        - pattern: module.exports = ($P, ...) => { ... }
        - pattern: module.exports.$N = function ($P, ...) { ... }
        - pattern: module.exports.$N = ($P, ...) => { ... }
        - pattern: exports.$N = function ($P, ...) { ... }
        - pattern: exports.$N = ($P, ...) => { ... }
        - patterns:
            - pattern-either:
                - pattern: export function $F($P, ...) { ... }
                - pattern: export const $F = ($P, ...) => { ... }
            - metavariable-regex:
                metavariable: $F
                regex: ^(?!(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$).*$
        # App Router handlers are always NAMED exports, so the anonymous default stays a library
        # shape. The neighbouring Pages-Router case needs no exclusion: MEASURED 2026-07-27, this
        # ANONYMOUS pattern never matched the named `export default function handler(req, res)`, so
        # a Pages API route was never captured here in the first place.
        - pattern: export default function ($P, ...) { ... }
    - focus-metavariable: $P

# #1631: the (a2) VALIDATOR-GUARD sanitizers, ported to the library-taint family. Until now
# `harvey-lib-command-injection` and `harvey-lib-code-injection` carried NO `pattern-sanitizers`
# block at all and `harvey-lib-path-traversal` carried only `path.basename`, so every guarded shape
# the request-taint side has cleared since #989/#1027/#1236/#1248/#1363 still drew a finding here —
# and harvey-lib-command-injection is `harveySeverity: Critical`, so it is not a quiet over-report.
#
# MEASURED 2026-07-31 (semgrep 1.164.0, three identical runs, `--jobs 1 --timeout 0`, zero errors):
# BEFORE, an exported `runReport(name)` with a correct anchored inline `.test()` guard and an early
# return fired harvey-lib-command-injection, as did the hoisted-const and `Array.includes`
# spellings; the eval and fs siblings fired identically on the same guard, so the gap was never
# confined to one rule — the issue's fourth acceptance bullet, re-measured rather than assumed.
#
# WHY A LOCAL GUARD IS SOUND HERE TOO. The source model differs (an exported function's parameter,
# not a request property) but the sanitizer does not depend on where the value came from: an
# anchored, positive-class allowlist test whose failure branch exits the function makes the sink
# unreachable with a rejected value, whatever bound the parameter. The soundness constraints
# therefore carry over unchanged and unweakened, each with its own calibration positive that must
# still fire: the regex must be ANCHORED (P-LIB-CMD-UNANCHORED-GUARD) and its class POSITIVE
# (P-LIB-CMD-DENYLIST-GUARD), the `const` binding must be a declaration rather than a reassignable
# one, and a throwing guard must not sit inside a try that could swallow it
# (P-LIB-CMD-THROW-SWALLOWED). The blocks are verbatim copies of injection.yml's so the two
# families cannot drift into different soundness.
x-lib-validator-guard: &lib_validator_guard
  by-side-effect: true
  patterns:
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... return; }
                - pattern: |
                    if (!$RE.test($X)) return ...;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... return; }
                - pattern: |
                    if (!$RE.test($X)) return ...;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - pattern: |
            if (!$ARR.includes($X)) { ... return; }
        - pattern: |
            if (!$ARR.includes($X)) return ...;
        - pattern: |
            if (!$SET.has($X)) { ... return; }
        - pattern: |
            if (!$SET.has($X)) return ...;
    - focus-metavariable: $X

# The THROWING failure branch, with #1248's two try exclusions intact — a throw is an exit only if
# nothing between the guard and the sink catches it.
x-lib-throw-guard: &lib_throw_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - pattern: |
            if (!$ARR.includes($X)) { ... throw $E; }
        - pattern: |
            if (!$ARR.includes($X)) throw $E;
        - pattern: |
            if (!$SET.has($X)) { ... throw $E; }
        - pattern: |
            if (!$SET.has($X)) throw $E;
    - focus-metavariable: $X

# The SCHEMA-validator spelling, returning branch — including the #1630 hoisted-const arm, so the
# port does not land already carrying the defect #1630 has just removed from the request side.
x-lib-schema-guard: &lib_schema_guard
  patterns:
    - pattern: $P.data
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern-inside: |
                    $P = $Z.regex($RE).safeParse(...);
                    ...
                    if (!$P.success) { ... return; }
                    ...
                - pattern-inside: |
                    $P = $Z.regex($RE).safeParse(...);
                    ...
                    if (!$P.success) return ...;
                    ...
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-either:
                - pattern-inside: |
                    $P = $Z.regex($RE).safeParse(...);
                    ...
                    if (!$P.success) { ... return; }
                    ...
                - pattern-inside: |
                    $P = $Z.regex($RE).safeParse(...);
                    ...
                    if (!$P.success) return ...;
                    ...
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - pattern-inside: |
            $P = $Z.enum([...]).safeParse(...);
            ...
            if (!$P.success) { ... return; }
            ...
        - pattern-inside: |
            $P = $Z.enum([...]).safeParse(...);
            ...
            if (!$P.success) return ...;
            ...

# The SCHEMA-validator spelling, throwing branch. `by-side-effect` on `$P` rather than a
# `pattern-inside` region, for #1248's reason: semgrep's statement `...` matches DEEPLY, so a region
# form would match a guard nested inside a try while the exclusions sat outside it.
x-lib-throw-schema-guard: &lib_throw_schema_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-inside: |
                $P = $Z.regex($RE).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-inside: |
                $P = $Z.regex($RE).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                $P = $Z.enum([...]).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
    - focus-metavariable: $P

rules:
  # Path traversal from a library entry point: a request-callback param (raw http/https server) or an
  # exported-function param joined into a filesystem path and read/written. path.basename confines it.
  - id: harvey-lib-path-traversal
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: High
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"]
      owasp: ["A01:2021 - Broken Access Control"]
    message: >
      A library entry-point parameter (a raw http/https server request, or an exported function's
      argument) reaches a filesystem read/write unsanitized — path traversal (../ escapes the
      intended directory). Confine the path with path.basename and a base-directory containment check.
    pattern-sources:
      # Shape A — raw node http/https server request callback parameter.
      - patterns:
          - pattern-either:
              - pattern: http.createServer(function ($REQ, $RES) { ... })
              - pattern: http.createServer(($REQ, $RES) => { ... })
              - pattern: https.createServer(function ($REQ, $RES) { ... })
              - pattern: https.createServer(($REQ, $RES) => { ... })
              - pattern: http.createServer($OPT, function ($REQ, $RES) { ... })
              - pattern: http.createServer($OPT, ($REQ, $RES) => { ... })
              - pattern: https.createServer($OPT, function ($REQ, $RES) { ... })
              - pattern: https.createServer($OPT, ($REQ, $RES) => { ... })
          - focus-metavariable: $REQ
      # Shape B — exported library function parameter (public API surface).
      - *library_entry_point
    pattern-sanitizers:
      - pattern: path.basename(...)
      - *lib_validator_guard
      - *lib_throw_guard
      - *lib_schema_guard
      - *lib_throw_schema_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.readFile($P, ...)
              - pattern: fs.readFileSync($P, ...)
              - pattern: fs.createReadStream($P, ...)
              - pattern: fs.writeFile($P, ...)
              - pattern: fs.writeFileSync($P, ...)
              - pattern: fs.createWriteStream($P, ...)
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
          - focus-metavariable: $P

  # OS command injection from a library entry point: an exported-function param reaches a shell-string
  # exec/execSync. Same CWE-78 shell-STRING sink as harvey-command-injection, request layer removed.
  - id: harvey-lib-command-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Critical
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      An exported library function's parameter flows into a shell command (child_process exec/
      execSync) — OS command injection. Use execFile/spawn with an argument array and no shell, and
      validate the argument against an allowlist.
    pattern-sources:
      - *library_entry_point
    pattern-sanitizers:
      - *lib_validator_guard
      - *lib_throw_guard
      - *lib_schema_guard
      - *lib_throw_schema_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
          - focus-metavariable: $CMD

  # Code injection from a library entry point: an exported-function param reaches eval / new Function.
  - id: harvey-lib-code-injection
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Critical
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      An exported library function's parameter reaches eval()/new Function() — arbitrary code
      execution. Parse the argument as data (e.g. JSON.parse) or dispatch against an allowlist; never
      evaluate an untrusted argument.
    pattern-sources:
      - *library_entry_point
    pattern-sanitizers:
      - *lib_validator_guard
      - *lib_throw_guard
      - *lib_schema_guard
      - *lib_throw_schema_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($C)
              - pattern: new Function(..., $C)
          - focus-metavariable: $C
