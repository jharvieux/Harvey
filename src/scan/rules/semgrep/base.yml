# Base custom Semgrep OSS rules for the Next.js/Supabase footgun taxonomy (the original
# dangerouslySetInnerHTML / CORS / service-role-in-client / open-redirect / SSRF set).
#
# CONVENTION: custom rules live in a DIRECTORY (src/scan/rules/semgrep/) loaded as a whole by
# src/scan/semgrep.ts. Each security batch adds its own `<batch>.yml` under this directory — no
# shared rule file, so parallel batches stay conflict-free (a batch touches only its own file).
# Run alongside the maintained registry packs (p/react, p/nextjs, p/owasp-top-ten, p/secrets,
# p/security-audit) — see src/scan/semgrep.ts for the full invocation. Validate the whole set with
# `semgrep --validate --config src/scan/rules/semgrep/` and exercise it against targets/calibration
# via the calibration harness (src/scan/calibration.ts, `pnpm validate:calibration`).
#
# metadata.confidence + severity: ERROR feed the "high" precision-tier trust boundary in
# src/scan/semgrep.ts (docs/design/mechanical-toolchain.md §2/§7) — only HIGH-confidence,
# ERROR-severity, non-`.audit.*` rules enter the free count; MEDIUM/WARNING route to review.
# metadata.harveySeverity overrides the default severity-from-semgrep mapping where the product
# taxonomy disagrees (e.g. a leaked service-role key is Critical, not just "ERROR").
#
# ---------------------------------------------------------------------------------------------
# THE CANONICAL REQUEST-TAINT SOURCE BLOCK (#1221). Rationale lives here; injection.yml and
# headers.yml carry byte-equal copies, because YAML anchors resolve at parse time and do not cross
# documents. `semgrep-shared-sources.test.ts` fails loud if the copies diverge — silent divergence
# IS the defect this block exists to end.
#
# Before #1221 every server-side taint rule carried its own hand-copied source list, and the
# widenings of #570/#984/#987/#601 landed on some copies and not others. MEASURED 2026-07-27
# (semgrep 1.164.0): 17 of 21 server-side taint rules could not see `await req.json()` and 19 of 21
# could not see `searchParams.get()` — the App Router's two commonest request accessors, in a
# scanner whose primary declared target is the App Router.
#
# $REQ is NAME-CONSTRAINED rather than free, and that is a measurement, not caution. A free `$REQ.`
# metavariable (what #1221 recommended) turned `map.get()`, `config.get()`, `response.headers.get()`,
# `formData.get()`, `response.body` and `builder.query` into taint sources — it fired on all six
# benign probes. The name constraint keeps the App Router's conventional `request` parameter, which
# the old literal `req.` form was blind to (#1220), while all six stay silent.
x-request-source: &request_source
  pattern-either:
    # Express / Pages-Router accessors, plus the App Router handler parameter.
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            # #984: cookies/headers are attacker-controllable request sources (session tokens,
            # X-Forwarded-*, User-Agent, custom headers) — a well-known injection entry point.
            - pattern: $REQ.cookies
            - pattern: $REQ.headers
            # #987: method-form request accessors (Express req.get('X-…')/req.header('X-…')). The
            # destructured/bracket/aliased/multi-hop forms propagate through semgrep's taint
            # dataflow once the base object is a source; the method form is a distinct call shape.
            - pattern: $REQ.get(...)
            - pattern: $REQ.header(...)
        - metavariable-regex:
            metavariable: $REQ
            # Keep the alternation noncapturing: Semgrep 1.173 expands unnamed capture `$1` in
            # rule messages, including the literal SQL-parameter example below.
            regex: ^_?(?:req|request|nextReq|nextRequest|httpReq|incoming)$
    # #1221: the App Router query string. `$U.searchParams` subsumes `req.nextUrl.searchParams`
    # AND the split `const u = new URL(req.url); u.searchParams.get(…)` form, so neither needs its
    # own pattern; the `.get(...)` arm carries the inline `new URL(req.url).searchParams.get(…)`
    # call. A BARE `$SP.get(...)` is deliberately NOT used — measured to fire on Map/Headers/
    # config/FormData `.get()` even behind the `^(?!(https?|axios)$)` http-client guard.
    - pattern: $U.searchParams.get(...)
    - pattern: $U.searchParams
    # #1221: the App Router request body — the shape 17 of 21 rules were blind to.
    - pattern: await $REQ.json()
    # #984: App Router next/headers request sources.
    - pattern: cookies()
    - pattern: headers()
    # #1240: the App Router SERVER COMPONENT request props. A page/layout receives its dynamic route
    # segments and query string as DESTRUCTURED PARAMETERS — `{ params }` / `{ searchParams }` — and
    # never as a `req` object, so every arm above is blind to the idiomatic RSC page. Found through
    # the SSRF facet (P-OWASP-REACT-RSC-SSRF), but the gap was never SSRF's: the shared block did not
    # model the source, so all 21 rules missed it.
    #
    # #1544: an earlier version of this comment gave a semgrep OSS capability bound — that a
    # destructured object parameter is unmatchable in JS/TS — as the reason the name is matched
    # WITHOUT its binding form. That bound was ASSUMED, it was copied into five venues, and it is
    # false. MEASURED 2026-07-31, semgrep 1.164.0: both spellings below match the repo's own RSC
    # fixture. The real constraint is a pattern-authoring detail, and it is why the block reads the
    # way it does — the pattern must carry the type annotation to reach a TYPED parameter (so both
    # spellings are listed), and a metavariable unified with the OUTER access stops at the first
    # field of a multi-key object pattern like a layout's `{ children, params }` (so the binding is
    # bound by its own $RSCBIND and regex-filtered instead).
    #
    # The binding form is therefore REQUIRED, not inferred: the access is a request source only
    # inside a scope that destructures `params`/`searchParams` out of an object. MEASURED 2026-07-31
    # over 20 probes — 8 real RSC binding shapes (typed/untyped destructured function parameter,
    # typed/untyped destructured arrow, route-handler second parameter, Next 15 awaited `params`,
    # in-body `const { params } = props`, multi-key layout) and 12 benign `params`/`searchParams`
    # shapes: RSC shapes 8/8 before and 8/8 after, NOTHING newly caught, and three benign shapes no
    # longer read as request input — a for-of loop variable over DB rows, an array-destructured
    # `const [params] = useState()`, and an imported module constant. The three not-insides could
    # see none of those: on all three the pre-#1544 block fired exactly as the unguarded bare name
    # did. They are kept because they only ever narrow further, which makes this block a strict
    # subset of what the name alone reports.
    #
    # WHAT THAT 8/8 DID NOT COVER, and what the ARROW ARMS BELOW ARE ABOUT. The two arrow probes
    # behind it had EXPRESSION bodies (`=> fetch(...)`). MEASURED 2026-07-31, semgrep 1.164.0:
    # `(..., { ..., $B, ... }, ...) => ...` returns 0 matches on a BLOCK-bodied arrow and
    # `=> { ... }` returns 1 — so the two `=> ...` arms alone left `const Page = async ({ params })
    # => { … }` silent, and with it every rule below. That is CLAUDE.md's "a measurement whose
    # probes are drawn from the same intuition as the guard proves only that the intuition is
    # self-consistent", landing inside the fix for a false MEASURED claim in this same block. The
    # `=> { ... }` twins are therefore listed alongside, and are the arms that carry the real-world
    # population: MEASURED 2026-07-31 over all 17 pinned corpus repos at their pins (`pnpm
    # corpus-pins`, `-j 1 --timeout 0`, 3 repeats, identical output each time) the block-bodied
    # spelling occurs 40 times in 33 files (carbon 12, documenso 10, inbox-zero 18) and the
    # expression-bodied spelling occurs ZERO times. NOTHING GATED THIS — the corpus population
    # reaches no sink, so the loss cost 0 findings; validate-calibration had no arrow fixture; and
    # shared-sources.test.ts asserted only that the pattern STRINGS were present. All three are now
    # closed: P-RSC-ARROW-TYPED-BINDING / P-RSC-ARROW-UNTYPED-BINDING are mustCatch corpus rows, and
    # the test runs semgrep over probes instead of grepping this file.
    #
    # The plain-identifier not-insides at the end of this block do NOT have the same defect and must
    # not be "fixed" the same way. MEASURED 2026-07-31: with a bare metavariable in parameter
    # position, `(..., $X, ...) => ...` matches a block-bodied arrow (both shadowed-plain-parameter
    # probes stay silent). Adding a `=> { ... }` twin there would be actively wrong — measured the
    # same day, `(..., $X, ...) => { ... }` MATCHES the destructured RSC arrow itself, binding $X to
    # the object pattern, so the twin would risk excluding the very shape these arms exist to catch.
    #
    # THE COST OF THE BINDING REQUIREMENT, over the reachable population rather than the probes:
    # exactly ONE finding — carbon apps/erp/app/modules/production/ui/Jobs/JobBillOfProcess.tsx:655,
    # harvey-path-traversal on a client component's `const [params] = useUrlParams()` reaching a
    # storage upload path. A true positive the pre-#1544 block reached for the same unsound reason
    # it reached a scheduler's DB rows. Planted as the P-CLIENT-HOOK-URL-PARAM measured gap and
    # tracked on #1708, so the cost is in the gate.
    #
    # HOW THAT ONE IS KNOWN, because the obvious method has a wider noise band than the signal it
    # is being asked to resolve (#1710). A single-pass
    # full-ruleset diff over the 17 repos read 456 -> 454, and a single-pass diff over just the 22
    # rules that consume this block read 194 -> 178 — but 15 of those 16 rows were ENGINE NOISE:
    # semgrep's default parallelism silently drops up to ~36% of findings on a large repo while
    # reporting a clean run, so on carbon the noise band is an order of magnitude wider than the
    # signal. The figure that survives repetition, MEASURED 2026-07-31 by PR #1709's acceptance
    # verifier: 16 of the 17 repos produce SET-IDENTICAL findings under both rule sets, and on
    # carbon 6 repeats per arm at `-j 1 --timeout 0` give a stable core of 74 findings in BOTH arms
    # with zero true gains and zero true losses. The one row above was then isolated and reproduced
    # 3/3 per arm on its own file — re-verified independently for this correction, 2026-07-31,
    # 3/3 per arm at `-j 1 --timeout 0`: present pre-#1544, absent after. Never quote 456 -> 454.
    #
    # THE ARROW FIX'S OWN blast radius, MEASURED 2026-07-31 the sound way rather than the noisy one:
    # OSS taint is intra-file and `pattern-inside` is intra-file, so every finding this widening can
    # add lies in one of the 33 files that carry the newly-matched binding form. All 33 scanned with
    # the full rule directory, 3 arms (pre-#1544 / as-shipped #1544 / with the `=> { ... }` arms),
    # 3 repeats each at `-j 1 --timeout 0`: 7 findings, IDENTICAL in all nine runs. Zero gained,
    # zero lost.
    #
    # `await $RSCPROP` carries the Next 15 shape, where `params` is a Promise the component awaits
    # before destructuring. Corpus: P-OWASP-REACT-RSC-SSRF must keep firing;
    # N-RSC-PARAM-PLAIN-PARAMETER keeps the not-insides falsifiable; N-RSC-PARAM-NON-PARAM-BINDING
    # keeps the destructuring requirement falsifiable.
    - patterns:
        - pattern-either:
            - pattern: $RSCPROP.$RSCFIELD
            - pattern: await $RSCPROP
        - metavariable-regex:
            metavariable: $RSCPROP
            regex: ^(params|searchParams)$
        - pattern-either:
            - pattern-inside: |
                function $RSCFN(..., { ..., $RSCBIND, ... }, ...) { ... }
            - pattern-inside: |
                function $RSCFN(..., { ..., $RSCBIND, ... }: $T, ...) { ... }
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }, ...) => ...
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }: $T, ...) => ...
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }, ...) => { ... }
            - pattern-inside: |
                (..., { ..., $RSCBIND, ... }: $T, ...) => { ... }
            - pattern-inside: |
                const { ..., $RSCBIND, ... } = $SRC;
                ...
        - metavariable-regex:
            metavariable: $RSCBIND
            regex: ^(params|searchParams)$
        # A locally-ASSIGNED `params`/`searchParams` is an options bag, a URLSearchParams the module
        # built itself, or a Map alias — never a request prop. This still earns its place under the
        # binding requirement above: inside a real RSC page, `const searchParams = new
        # URLSearchParams(...)` sits in a scope that DOES destructure `params`, so without this line
        # the module's own URLSearchParams would read as request input. MEASURED 2026-07-31.
        - pattern-not-inside: |
            $RSCPROP = ...
            ...
        # #1344: `function runJob(params: JobSpec)`, a scheduler argument bag with no request
        # anywhere near it, was read as request input, because the assignment guard above was the
        # only exclusion and a function parameter is never assigned. MEASURED 2026-07-27 on two
        # byte-identical files differing only in the parameter name: `params`/`searchParams`
        # produced 6 findings including harvey-command-injection at Critical/precisionTier=high
        # (GRADED), `opts`/`spec` produced 3. That falsified this block's own recorded measurement,
        # which claimed an "RPC argument bag" probe fired on none — all five probes must have bound
        # the name by local assignment. The binding requirement above now spares this shape too, so
        # these two lines are a second, independent narrowing rather than the sole discriminator.
        - pattern-not-inside: |
            function $F(..., $RSCPROP, ...) { ... }
        - pattern-not-inside: |
            (..., $RSCPROP, ...) => ...
# ---------------------------------------------------------------------------------------------

# #1248: the (a2) validator guards, with a failure branch that THROWS instead of returning.
# Throwing is the idiomatic guard in a Next.js Server Action or route handler under an error
# boundary, in Express with http-errors/createError, and in NestJS (BadRequestException) — so
# before this block a correct throwing guard read as a Critical injection. MEASURED 2026-07-31
# (semgrep 1.164.0): the issue's own repro fired harvey-sql-injection-template at Critical.
#
# WHY IT IS A SEPARATE SANITIZER AND NOT A WIDENED ARM. A `return` is unconditionally an exit.
# A `throw` is an exit only if nothing between the guard and the sink catches it: with the guard
# inside a `try` whose `catch` swallows, execution continues into the sink with the rejected
# value live, and a `finally` runs the sink even when the throw propagates. That has no analogue
# on the return path, so the throw spellings carry a constraint the return spellings do not —
# the guard must not be lexically inside a try statement. This is deliberately conservative: a
# guard AND its sink both inside one try (where the throw does skip the sink) is not cleared,
# which costs precision in the safe direction and never clears a live value.
# MEASURED 2026-07-31, both directions: with the two pattern-not-inside conjuncts the swallowed
# and finally-run shapes FIRE; with them deleted both go silent — a real bug cleared by a guard
# that never protected it. Adversarial positives P-SQLI-THROW-SWALLOWED / P-SQLI-THROW-FINALLY.
#
# `throw $E;` rather than `throw ...;`: a throw always carries an operand, so there is no
# valueless twin to cover the way `return;` needed one.
x-throw-guard: &throw_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-either:
                - pattern: |
                    if (!$RE.test($X)) { ... throw $E; }
                - pattern: |
                    if (!$RE.test($X)) throw $E;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - pattern: |
            if (!$ARR.includes($X)) { ... throw $E; }
        - pattern: |
            if (!$ARR.includes($X)) throw $E;
        - pattern: |
            if (!$SET.has($X)) { ... throw $E; }
        - pattern: |
            if (!$SET.has($X)) throw $E;
    - focus-metavariable: $X

# #1248: the SCHEMA-validator (a2) guard whose failure branch throws. Same soundness argument and
# the same two try exclusions as x-throw-guard above, and the same allowlist constraints as the
# return spelling — an ANCHORED, POSITIVE-class `.regex(...)` or an `.enum([...])` membership list,
# because a bare `z.string()` accepts everything and `$P.data` IS then the raw input.
#
# UNLIKE the return spelling it is `by-side-effect` on `$P`, not a `pattern-inside` region ending
# at `$P.data`. MEASURED 2026-07-31: semgrep's statement `...` matches DEEPLY, so a region written
# `safeParse(...); ... if (!$P.success) throw $E; ...` matches a guard nested inside a `try` — and
# the try exclusions, attached to the `$P.data` use site, sat outside that try and cleared it. Both
# swallowed-throw fixtures went silent under that form and fire under this one
# (P-CMD-ZOD-THROW-SWALLOWED, P-CMD-ZOD-ENUM-THROW-SWALLOWED).
x-throw-schema-guard: &throw_schema_guard
  by-side-effect: true
  patterns:
    - pattern-not-inside: |
        try { ... }
    - pattern-not-inside: |
        try { ... } finally { ... }
    - pattern-either:
        - patterns:
            - pattern-inside: |
                $P = $Z.regex($RE).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
            - metavariable-regex:
                metavariable: $RE
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        # #1630: the hoisted-named-const twin, on the THROW spelling. The #1363 fix reached the
        # `.test()` arms in both failure-branch spellings but no zod arm in either, so this one
        # carried the same defect as the return spelling above.
        - patterns:
            - pattern-inside: |
                const $RE = $LIT;
                ...
            - pattern-inside: |
                $P = $Z.regex($RE).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
            - metavariable-regex:
                metavariable: $LIT
                regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
        - patterns:
            - pattern-inside: |
                $P = $Z.enum([...]).safeParse(...);
                ...
            - pattern-either:
                - pattern: |
                    if (!$P.success) { ... throw $E; }
                - pattern: |
                    if (!$P.success) throw $E;
    - focus-metavariable: $P

rules:
  # SQL injection via untrusted input interpolated into a template-literal / concatenated SQL
  # string. Taint mode so it fires whether the interpolation is inline in the .query() call or
  # assembled into a variable first (calibration #4 does the latter). The sink focuses on the
  # SQL text argument only, so a PARAMETERIZED query — pool.query("... $1", [req.x]) — is NOT a
  # finding: the untrusted value is in the params array, never in the (untainted) SQL string.
  - id: harvey-sql-injection-template
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: Critical
      # #455: CWE/OWASP mapping added only where unambiguous — SQL injection's CWE and OWASP
      # Top-10-2021 category are definitional, not inferred.
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      Untrusted request input is interpolated into a raw SQL string reaching .query(). Use
      parameterized queries ($1 placeholders with a params array), never string interpolation.
    pattern-sources:
      - *request_source
    pattern-sanitizers:
      # #986: numeric coercion is a real transformation sanitizer (the (a1) subset) — a value cast to
      # a number cannot carry SQL metacharacters, so the interpolation is safe. Deterministically
      # clears the FP without an LLM pass; parameterized binds are already safe by sink shape.
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              # #1363: the same guard with the regex HOISTED to a named constant — how it is normally
              # written once the regex is reused, and until now it read as vulnerable. metavariable-regex
              # reads a metavariable's matched TEXT, so $RE binds to the identifier `OK` and the anchoring
              # constraint has to move to the literal, bound alongside the guard by pattern-inside. `const`
              # deliberately, not a bare `$RE = $LIT`: MEASURED 2026-07-31, the bare form also clears a
              # guard whose regex was reassigned to /.*/ first — a sanitizer that clears a real bug.
              - patterns:
                  - pattern-inside: |
                      const $RE = $LIT;
                      ...
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $LIT
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      # #1027: (a2) SCHEMA-validator guard — zod/valibot `safeParse` + an early return on
      # `!result.success`. Measured as the largest unmodeled sub-population in the #989 census and
      # the idiomatic shape in real Next/Express code, unlike BenchProctor's bare regex guards.
      #
      # What makes it sound is that the sink receives `$P.data` — a value the SCHEMA produced —
      # rather than the original input, so this is closer to a transformation than a gate. But
      # `z.string()` alone accepts every string, i.e. `.data` IS the raw input: the schema must
      # carry a real allowlist. Hence the SAME constraints as the regex form, each with a
      # calibration positive that must still fire: an ANCHORED, POSITIVE-class `.regex(...)`, or a
      # `.enum([...])` membership list; and a failure branch that RETURNS. A guard on one variable
      # while the sink reads another (`$P.data` never used) is untouched by construction.
      # #1236: the braceless `if (!$P.success) return ...;` spelling is matched too — see the
      # (a2) block above.
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              # #1630: the same SCHEMA guard with the regex HOISTED to a named constant — the zod
              # twin of the #1363 `.test()` fix, which closed that spelling and left this one
              # untouched, so byte-identical logic cleared or drew a Critical depending only on
              # whether the regex was hoisted. Same construction and same reason: metavariable-regex
              # reads a metavariable's matched TEXT, so `$RE` bound the identifier `OK` and the
              # anchoring/positive-class constraint has to move to the literal the const binds.
              # `const` deliberately, not a bare `$RE = $LIT` — see P-CMD-ZOD-REASSIGNED-GUARD.
              - patterns:
                  - pattern-inside: |
                      const $RE = $LIT;
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $LIT
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
      - *throw_guard
      - *throw_schema_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.query($SQL, ...)
              - pattern: $C.query($SQL)
          - focus-metavariable: $SQL

  # Open redirect: a request-controlled value drives a redirect with no host allowlist. Taint
  # (Pages-Router req.query/body and App-Router searchParams as sources; res.redirect /
  # NextResponse.redirect / a Location header as sinks). MEDIUM/WARNING → review tier: a static
  # rule cannot see an allowlist check that may live elsewhere.
  - id: harvey-open-redirect
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
      # #493: CWE-601 is the standard identifier for this exact bug shape. Verified against OWASP's
      # official Top-10-2021 CWE mapping (owasp.org/Top10/2021/A01_2021-Broken_Access_Control/) —
      # CWE-601 IS in A01's mapped-CWE list, so the #455 "no dedicated category" call was wrong;
      # corrected to add the owasp field.
      cwe: ["CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"]
      owasp: ["A01:2021 - Broken Access Control"]
    message: >
      Redirect target derives from a request-controlled value with no host allowlist — a
      classic open-redirect primitive for phishing (and SSRF-shaped if fetched server-side).
      SCOPE OF THIS CHECK (#1342), so its silence elsewhere is not read as a clean bill of health:
      it follows the value within this file only. A host allowlist enforced elsewhere — in shared
      middleware, a route wrapper, or a helper the value passes through — is not something this
      rule reads, so confirm no such guard runs before treating this as unmitigated. A host
      allowlist that rejects by THROWING is recognised (#1248) only when no `try` follows the
      `new URL(...)` projection in the same scope, so a correct guard whose URL parse is itself
      wrapped in try/catch is reported here rather than cleared.
    pattern-sources:
      - *request_source
    pattern-sanitizers:
      # #1057: (a2) PROJECTION guard — the guarded value is a PROJECTION of the tainted string
      # (`new URL(x).hostname`) while the sink receives `x` itself, so a by-side-effect sanitizer
      # on the guarded variable is inert. Anchored on the PROJECTION site instead, with the
      # membership test on the projected variable required lexically in the same scope.
      #
      # What makes it sound is a property of the ONE-ARGUMENT WHATWG constructor specifically:
      # `new URL(x)` is defined only when `x` is an ABSOLUTE URL, and `.hostname` is then exactly
      # the host a WHATWG-compliant consumer (browser following Location, Node's http client,
      # undici) reaches when handed `x`. Every neighbouring shape breaks that property and is
      # excluded syntactically, each with a calibration positive that must still fire:
      #   - a hand-rolled projection (split/replace/regex) is NOT the WHATWG host — the userinfo
      #     form `https://good.host@evil.tld/` reads as `good.host` to a naive extractor and as
      #     `evil.tld` to the browser (P-REDIRECT-HOST-USERINFO);
      #   - `new URL(x, base)` resolves a RELATIVE x against base, so the check passes on the
      #     base's host while x itself carries none — hence the single-argument pattern;
      #   - a guard the sink can be reached WITHOUT (`//evil.tld` throwing into a null-host
      #     branch, or an absolute-looking pre-test) leaves the value live
      #     (P-REDIRECT-HOST-RELATIVE, P-REDIRECT-HOST-BACKSLASH);
      #   - AFFIX membership is unsound the same way an unanchored regex is —
      #     `"evilapi.trusted.example".endsWith("trusted.example")` is true
      #     (P-REDIRECT-HOST-AFFIX), the #1027 class-1 refusal restated on the projection;
      #   - a failure branch that does not return (P-REDIRECT-HOST-NO-RETURN).
      # Only `.hostname`/`.host` qualify: a `.pathname`/`.protocol` allowlist says nothing about
      # where the value goes. The allowlist's own contents are trusted, exactly as in the shipped
      # `.includes`/`.has` arms.
      # #1236: both early-return spellings are matched here too. The two exclusions the widening
      # touches keep their alarms in the braceless form (P-REDIRECT-HOST-AFFIX-BRACELESS,
      # P-REDIRECT-HOST-BRACELESS-NO-RETURN); the three that key on the PROJECTION rather than the
      # consequent are unaffected by it.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $HOST = new URL($X).hostname
              - pattern: $HOST = new URL($X).host
          - pattern-either:
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) { ... return; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) return ...;
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) { ... return; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) return ...;
                  ...
          - focus-metavariable: $X
      # #1248: the same projection guard rejecting by THROW. It gets its own sanitizer entry rather
      # than four more arms above, because MEASURED 2026-07-31 the try exclusion the throw spellings
      # need does not work when it rides on the same conjuncts as the return arms. The guard here is
      # required by a `pattern-inside` REGION, and semgrep's
      # statement `...` matches deeply, so the region spans a guard nested inside a `try` — while
      # the match the exclusion is tested against is the PROJECTION statement, which in the
      # swallowed shape sits outside that try. MEASURED 2026-07-31: `pattern-not-inside: try {...}`
      # alone therefore excludes nothing here, and the swallowed shape is silently cleared. The
      # third exclusion is what closes it — no `try` may follow the projection at all, which is
      # deliberately coarser than "no try between the guard and the sink" and errs toward reporting.
      # Both directions measured on N-REDIRECT-HOST-ALLOWLIST-THROW / P-REDIRECT-HOST-THROW-SWALLOWED.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $HOST = new URL($X).hostname
              - pattern: $HOST = new URL($X).host
          - pattern-either:
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) { ... throw $E; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) throw $E;
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) { ... throw $E; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) throw $E;
                  ...
          - pattern-not-inside: |
              try { ... }
          - pattern-not-inside: |
              try { ... } finally { ... }
          - pattern-not-inside: |
              $H = new URL(...).hostname;
              ...
              try { ... }
              ...
          - pattern-not-inside: |
              $H = new URL(...).host;
              ...
              try { ... }
              ...
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($URL)
              - pattern: $RES.redirect($CODE, $URL)
              - pattern: NextResponse.redirect($URL)
              - pattern: "$RES.writeHead($CODE, { Location: $URL })"
              - pattern: '$RES.setHeader("Location", $URL)'
              # #1273: express `res.location(url)` sets the SAME Location header `res.redirect`
              # sets — it is `res.redirect`'s implementation — and a `res.location(u); res.end()`
              # pair redirects exactly as `res.redirect(u)` does. Measured 2026-07-31: the shape
              # fired on nothing before this arm while `res.redirect` fired.
              - pattern: $RES.location($URL)
          - focus-metavariable: $URL

  # Reflected XSS: request-controlled value flows into dangerouslySetInnerHTML. Taint mode with
  # sanitizer stops (DOMPurify.sanitize / sanitizeHtml / an IMPORT-BOUND sanitize) so a sanitized OR constant
  # value is NOT a finding — only a value tainted from request input is. HIGH → free count.
  - id: harvey-dangerously-set-inner-html
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    metadata:
      confidence: HIGH
      category: security
      harveySeverity: High
      # #455: XSS's CWE and OWASP Top-10-2021 category (Injection, which explicitly folds in XSS)
      # are standard, unambiguous mappings.
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A03:2021 - Injection"]
    message: >
      A request-controlled value reaches dangerouslySetInnerHTML unsanitized — reflected/stored
      XSS. Sanitize (e.g. DOMPurify.sanitize) before it reaches __html, or render as text.
    pattern-sources:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $RT.query.$K
      - pattern: $SP.get(...)
      - pattern: useSearchParams()
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      # #1066: a BARE `sanitize(...)` cleared the sink even when `sanitize` was a pass-through
      # no-op defined three lines below it — the audited party could silence a real XSS by naming
      # a function. The name carries meaning only if it resolves to a library, so require an
      # import binding. Adversarial positive: P-XSS-LOCAL-SANITIZE.
      - patterns:
          - pattern: sanitize(...)
          - pattern-inside: |
              import { sanitize } from "$MOD";
              ...
      # #989: (a2) validator-guard sanitizer — the value is GATED by a control-flow check that
      # returns on failure, not transformed. Matched as a whole STATEMENT (test AND early return),
      # by-side-effect on the guarded variable. Soundness constraints, each with a calibration
      # positive that must still fire: the regex must be ANCHORED (^…$ — an unanchored allowlist
      # matches a prefix and is a broken safeguard) and its class POSITIVE (a negated [^…] class is
      # a denylist, not an allowlist); a failure branch that does not return leaves the value live.
      # #1066: the FLAG group is [isuvy], not [a-z] -- /m makes ^ and $ match at line breaks, so
      # /^[a-z0-9]+$/m.test("abc\n' OR 1=1 --") is TRUE and the anchoring guard above is void.
      # #1236: BOTH early-return spellings are matched. The block form alone missed
      # `if (!ok) return Response.json(...)` — the dominant App Router idiom, and the only
      # spelling open to a handler that must RETURN its error response, so correct code read as
      # vulnerable. A bare `return;`/`return <expr>;` leaves the function exactly as a block
      # containing only that return does; the block form's `...` merely permits statements BEFORE
      # it. The consequent must still BE a return — a braceless statement that isn't one is not a
      # guard (P-SQLI-GUARD-BRACELESS-NO-RETURN).
      - by-side-effect: true
        patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              # #1363: the same guard with the regex HOISTED to a named constant — how it is normally
              # written once the regex is reused, and until now it read as vulnerable. metavariable-regex
              # reads a metavariable's matched TEXT, so $RE binds to the identifier `OK` and the anchoring
              # constraint has to move to the literal, bound alongside the guard by pattern-inside. `const`
              # deliberately, not a bare `$RE = $LIT`: MEASURED 2026-07-31, the bare form also clears a
              # guard whose regex was reassigned to /.*/ first — a sanitizer that clears a real bug.
              - patterns:
                  - pattern-inside: |
                      const $RE = $LIT;
                      ...
                  - pattern-either:
                      - pattern: |
                          if (!$RE.test($X)) { ... return; }
                      - pattern: |
                          if (!$RE.test($X)) return ...;
                  - metavariable-regex:
                      metavariable: $LIT
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern: |
                  if (!$ARR.includes($X)) { ... return; }
              - pattern: |
                  if (!$ARR.includes($X)) return ...;
              # #1027: a Set-backed allowlist is the same exact-match membership test as
              # `.includes` on an array, so it carries exactly the same soundness — and the same
              # dependence on the allowlist itself being correct.
              - pattern: |
                  if (!$SET.has($X)) { ... return; }
              - pattern: |
                  if (!$SET.has($X)) return ...;
          - focus-metavariable: $X
      # #1027: (a2) SCHEMA-validator guard — zod/valibot `safeParse` + an early return on
      # `!result.success`. Measured as the largest unmodeled sub-population in the #989 census and
      # the idiomatic shape in real Next/Express code, unlike BenchProctor's bare regex guards.
      #
      # What makes it sound is that the sink receives `$P.data` — a value the SCHEMA produced —
      # rather than the original input, so this is closer to a transformation than a gate. But
      # `z.string()` alone accepts every string, i.e. `.data` IS the raw input: the schema must
      # carry a real allowlist. Hence the SAME constraints as the regex form, each with a
      # calibration positive that must still fire: an ANCHORED, POSITIVE-class `.regex(...)`, or a
      # `.enum([...])` membership list; and a failure branch that RETURNS. A guard on one variable
      # while the sink reads another (`$P.data` never used) is untouched by construction.
      # #1236: the braceless `if (!$P.success) return ...;` spelling is matched too — see the
      # (a2) block above.
      - patterns:
          - pattern: $P.data
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              # #1630: the same SCHEMA guard with the regex HOISTED to a named constant — the zod
              # twin of the #1363 `.test()` fix, which closed that spelling and left this one
              # untouched, so byte-identical logic cleared or drew a Critical depending only on
              # whether the regex was hoisted. Same construction and same reason: metavariable-regex
              # reads a metavariable's matched TEXT, so `$RE` bound the identifier `OK` and the
              # anchoring/positive-class constraint has to move to the literal the const binds.
              # `const` deliberately, not a bare `$RE = $LIT` — see P-CMD-ZOD-REASSIGNED-GUARD.
              - patterns:
                  - pattern-inside: |
                      const $RE = $LIT;
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) { ... return; }
                          ...
                      - pattern-inside: |
                          $P = $Z.regex($RE).safeParse(...);
                          ...
                          if (!$P.success) return ...;
                          ...
                  - metavariable-regex:
                      metavariable: $LIT
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) { ... return; }
                  ...
              - pattern-inside: |
                  $P = $Z.enum([...]).safeParse(...);
                  ...
                  if (!$P.success) return ...;
                  ...
      - *throw_guard
      - *throw_schema_guard
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $VAL }} />"
              - pattern: "<$EL dangerouslySetInnerHTML={{ __html: $VAL }}>...</$EL>"
          - focus-metavariable: $VAL

  # Permissive CORS: wildcard Access-Control-Allow-Origin TOGETHER WITH a credentials signal —
  # the combination that defeats same-origin protection for authenticated requests. HIGH → free
  # count, graded. #996 made every branch consistent with the #614/#663 both-signals design: the
  # setHeader/headers.set/object-literal shapes now also require Allow-Credentials alongside the
  # wildcard. A bare wildcard with NO credentials signal — the common, intended public-endpoint
  # shape (OAuth .well-known discovery per RFC 8414, public file routes, the Supabase edge-function
  # corsHeaders idiom; measured 7/7 FP on crbnos/carbon) — routes to harvey-permissive-cors-bare
  # below: reported, never graded.
  - id: harvey-permissive-cors
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-942: Permissive Cross-domain Security Policy with Untrusted Domains"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      Access-Control-Allow-Origin is wildcarded AND credentials are allowed on the same
      response — any site can read authenticated responses cross-origin, defeating CORS's
      same-origin protection.
    patterns:
      - pattern-either:
          # #996: the setHeader / headers.set shapes require the credentials header in the same
          # statement sequence (either order) — the wildcard alone is the public-endpoint shape.
          - pattern: |
              $RES.setHeader("Access-Control-Allow-Origin", "*")
              ...
              $RES.setHeader("Access-Control-Allow-Credentials", "true")
          - pattern: |
              $RES.setHeader("Access-Control-Allow-Credentials", "true")
              ...
              $RES.setHeader("Access-Control-Allow-Origin", "*")
          - pattern: |
              $RES.headers.set("Access-Control-Allow-Origin", "*")
              ...
              $RES.headers.set("Access-Control-Allow-Credentials", "true")
          - pattern: |
              $RES.headers.set("Access-Control-Allow-Credentials", "true")
              ...
              $RES.headers.set("Access-Control-Allow-Origin", "*")
          # #570: App Router idiom — the wildcard is declared in an object-literal headers map
          # (`const CORS_HEADERS = { "Access-Control-Allow-Origin": "*", ... }`) then passed to
          # NextResponse.json(body, { headers }) or returned from a Deno edge function. #996:
          # graded only when the same literal also allows credentials.
          - patterns:
              - pattern: '{ ..., "Access-Control-Allow-Origin": "*", ... }'
              - pattern: '{ ..., "Access-Control-Allow-Credentials": "true", ... }'
          # #614: the Express `cors` middleware config idiom — `cors({ origin: "*", credentials:
          # true })`. A wildcard origin TOGETHER WITH credentials is the dangerous combination (the
          # cors lib reflects the origin, defeating same-origin protection for authenticated
          # requests). Both keys are required so a public-API `origin: "*"` with no credentials —
          # the common, intended shape — stays dark.
          - patterns:
              - pattern: '{ ..., origin: "*", ... }'
              - pattern: "{ ..., credentials: true, ... }"
          # #663: the `origin: true` variant — the cors lib reflects the REQUEST's Origin header
          # verbatim (equivalent to a wildcard in effect, since every origin is echoed back), so
          # paired with credentials it is exactly as dangerous as `origin: "*"`. Same both-keys
          # gate as the #614 branch above.
          - patterns:
              - pattern: "{ ..., origin: true, ... }"
              - pattern: "{ ..., credentials: true, ... }"

  # #996 (operator decision on the #934 remainder): the bare wildcard — no credentials signal —
  # is fully REPORTED but NEVER graded. It is the correct configuration for a deliberately-public
  # endpoint (RFC 8414 OAuth discovery metadata REQUIRES public readability; measured on carbon:
  # all 7 graded bare-wildcard Highs were intended-public endpoints — FP rate 7/7). Still ERROR +
  # HIGH confidence (the FACT is exact) so it reaches the free report; metadata.harveyTaxonomy
  # routes it to the non-grading informational section (NON_GRADING_TAXONOMIES, src/quick-scan.ts)
  # with the confirm-intent reason stated. The taxonomy string must stay in sync with
  # CORS_BARE_WILDCARD_TAXONOMY in src/scan/semgrep.ts (pinned by semgrep.test.ts).
  # NOTE: the cors()-middleware bare shapes (origin:"*"/origin:true, no credentials) stay DARK, not
  # informational — they are pinned as calibration negatives (N-CORS-EXPRESS-NOCREDS,
  # N-CORS-EXPRESS-ORIGINTRUE-NOCREDS): a high-tier hit there, even non-grading, would be an FP in
  # the free report. Only the three shapes that previously GRADED a bare wildcard are re-tiered.
  - id: harvey-permissive-cors-bare
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: ["CWE-942: Permissive Cross-domain Security Policy with Untrusted Domains"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      category: security
      harveySeverity: Low
      harveyTaxonomy: "Permissive CORS — wildcard without credentials (confirm intent)"
    message: >
      Access-Control-Allow-Origin is wildcarded with no credentials signal on this response.
      Any site may read it, which is the correct configuration for a deliberately-public
      endpoint — confirm this endpoint is meant to be public. Not counted in the grade: without
      credentials the response cannot be read as a logged-in user cross-origin. SCOPE OF THIS
      CHECK: it covers the response-header and Next.js config forms. The same bare wildcard
      configured through the cors() MIDDLEWARE (origin "*" or origin true, no credentials) is
      deliberately not reported at all, so silence there is a decision and not a clean result.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $RES.setHeader("Access-Control-Allow-Origin", "*")
              - pattern-not-inside: |
                  $RES.setHeader("Access-Control-Allow-Origin", "*")
                  ...
                  $RES.setHeader("Access-Control-Allow-Credentials", "true")
              - pattern-not-inside: |
                  $RES.setHeader("Access-Control-Allow-Credentials", "true")
                  ...
                  $RES.setHeader("Access-Control-Allow-Origin", "*")
          - patterns:
              - pattern: $RES.headers.set("Access-Control-Allow-Origin", "*")
              - pattern-not-inside: |
                  $RES.headers.set("Access-Control-Allow-Origin", "*")
                  ...
                  $RES.headers.set("Access-Control-Allow-Credentials", "true")
              - pattern-not-inside: |
                  $RES.headers.set("Access-Control-Allow-Credentials", "true")
                  ...
                  $RES.headers.set("Access-Control-Allow-Origin", "*")
          - patterns:
              - pattern: '{ ..., "Access-Control-Allow-Origin": "*", ... }'
              - pattern-not: '{ ..., "Access-Control-Allow-Credentials": "true", ... }'

  # Service-role key referenced inside a Client Component ("use client"). Gating on the
  # "use client" directive is the high-precision signal: it means the module (and the key) ships
  # to the browser bundle. A server-only module holding the service-role key (lib/supabaseAdmin.js,
  # lib/cron.js) has no "use client" and is correctly NOT flagged. HIGH → free count.
  - id: harvey-service-role-in-client
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      category: security
      harveySeverity: Critical
    message: >
      SUPABASE_SERVICE_ROLE_KEY is referenced inside a Client Component ("use client"). The
      service-role key ships to the browser bundle — full RLS bypass for anyone who inspects it.
      Move service-role usage to a server-only module.
    patterns:
      - pattern-either:
          - pattern: process.env.SUPABASE_SERVICE_ROLE_KEY
          - pattern: process.env.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY
      - pattern-inside: |
          "use client";
          ...

  # #565: Vite variant of the service-role-in-client footgun. A Vite/no-code (Lovable/Bolt/v0) SPA
  # has no "use client" boundary — ALL of its code is client code — and reads env via
  # import.meta.env.VITE_*. Vite statically INLINES every VITE_-prefixed var into the browser bundle
  # by design, so a service-role key named with the VITE_ prefix ships full RLS-bypass credentials to
  # every visitor. Scoped to a service-role key name (not the anon/publishable key, which is meant to
  # be public) so it stays HIGH-precision → free count. Critical.
  - id: harvey-vite-service-role-in-client
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      category: security
      harveySeverity: Critical
    message: >
      A Supabase service-role key is read from import.meta.env.VITE_* — Vite inlines every
      VITE_-prefixed variable into the browser bundle, so this ships full RLS-bypass credentials to
      every visitor. Never expose a service-role key with the VITE_ prefix; move service-role work to
      a server-side function and keep only the anon/publishable key in the client. SCOPE OF THIS
      CHECK: it fires on a VITE_-prefixed variable whose NAME reads as a service-role key. A
      privileged key inlined under a name this rule does not recognise is not assessed.
    patterns:
      - pattern: import.meta.env.$K
      - metavariable-regex:
          metavariable: $K
          regex: ^VITE_[A-Z0-9_]*(SERVICE_ROLE|SERVICE_KEY)[A-Z0-9_]*$

  # #611 Gap A / #664: a Supabase service_role key HARDCODED as a JWT string literal and passed to
  # createClient used to be matched here by a base64-alignment SIGNATURE (three regex encodings of
  # `role":"service_role`). #664 replaced that with an actual TS/AST detector that base64-decodes
  # the JWT payload and checks the claim exactly (src/scan/service-role-literal.ts, run in
  # runMechanicalScan) — exact regardless of claim spacing/key order, plus real cross-file
  # const-propagation (an exported literal imported into the module that calls createClient) and a
  # decode-based (not signature-based) "supabase-demo" exclusion. Retired here so the two engines
  # don't double-fire on the same construct; see service-role-literal.ts's header for the full gap
  # writeup.

  # #565: a browser LLM client constructed with dangerouslyAllowBrowser: true — the canonical no-code
  # "the AI key is in the bundle" footgun. The SDK requires this flag to run in a browser precisely
  # because doing so exposes the API key to every visitor (it is inlined alongside the client). The
  # literal `true` is an exact, unambiguous signal → HIGH, free count.
  - id: harvey-dangerously-allow-browser
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-522: Insufficiently Protected Credentials"]
      owasp: ["A04:2021 - Insecure Design"]
      confidence: HIGH
      category: security
      harveySeverity: High
    message: >
      An LLM client is constructed with dangerouslyAllowBrowser: true — this runs in the browser and
      exposes the API key to every visitor (the key is inlined into the bundle). Call the LLM from a
      server-side route/function and keep the key server-only; never ship it to the client.
    patterns:
      - pattern: "{ ..., dangerouslyAllowBrowser: true, ... }"

  # SSRF: server fetches a request-controlled URL with no host allow/deny. Review tier —
  # exploitability depends on the deploy network (internal ranges / cloud metadata reachability).
  # #570: sources extended with the App Router request-access idioms — `new URL(req.url).searchParams`
  # / `searchParams.get(...)` and the `await req.json()` body. Sinks extended with a small set of
  # thin fetch-wrapper helper names (fetchRemote/fetchUrl/fetchExternal/proxyFetch): an SSRF is
  # commonly split as "tainted URL in the route, `fetch()` in a shared helper", which OSS Semgrep's
  # single-file taint cannot span — but the wrapper CALL in the route is same-file with the source,
  # so keying the sink on the wrapper name recovers the flow (same curated-callee-name approach as
  # harvey-sql-injection-rpc's exec_sql/run_sql list). A wrapper called with a request-tainted URL
  # is exactly the SSRF entry point.
  # #1342: the rule cannot see a host allowlist applied in another module, and the wrapper-name list
  # is curated — a differently-named helper carrying the URL to the network is not assessed. Stated
  # in the message, not only here.
  - id: harvey-ssrf-fetch
    languages: [javascript, typescript]
    mode: taint
    severity: WARNING
    metadata:
      confidence: MEDIUM
      category: security
      harveySeverity: Medium
      # #455: OWASP A10:2021 is literally titled "Server-Side Request Forgery (SSRF)" — as
      # unambiguous as an OWASP mapping gets.
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A10:2021 - Server-Side Request Forgery (SSRF)"]
    message: >
      A request-controlled URL is fetched server-side with no host allowlist — SSRF. Validate
      the host against an allowlist and block internal/link-local ranges before fetching.
      SCOPE OF THIS CHECK (#1342), so its silence elsewhere is not read as a clean bill of health:
      it follows the value within this file only, and the fetch itself is recognised either as a
      direct `fetch()` or through a short curated list of wrapper names — a request-tainted URL
      reaching the network through a differently-named helper, or through a host allowlist applied
      in another module, is not assessed here. Whether a confirmed SSRF is exploitable also depends
      on the deploy network (which internal ranges and metadata endpoints are reachable), which no
      source scan can determine. A host allowlist that rejects by THROWING is recognised (#1248)
      only when no `try` follows the `new URL(...)` projection in the same scope, so a correct
      guard whose URL parse is itself wrapped in try/catch is reported here rather than cleared.
    pattern-sources:
      - *request_source
    pattern-sanitizers:
      # #1057: (a2) PROJECTION guard — see harvey-open-redirect for the soundness argument and the
      # excluded neighbouring shapes. Measured as 10 of this rule's FPs on the BenchProctor
      # 2026.07.22 JS/Express slice, and the reason extending the plain (a2) block here was inert:
      # the guard sits on `new URL(x).hostname`, never on the value the fetch receives.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $HOST = new URL($X).hostname
              - pattern: $HOST = new URL($X).host
          - pattern-either:
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) { ... return; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) return ...;
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) { ... return; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) return ...;
                  ...
          - focus-metavariable: $X
      # #1248: the same projection guard rejecting by THROW. It gets its own sanitizer entry rather
      # than four more arms above, because MEASURED 2026-07-31 the try exclusion the throw spellings
      # need does not work when it rides on the same conjuncts as the return arms. The guard here is
      # required by a `pattern-inside` REGION, and semgrep's
      # statement `...` matches deeply, so the region spans a guard nested inside a `try` — while
      # the match the exclusion is tested against is the PROJECTION statement, which in the
      # swallowed shape sits outside that try. MEASURED 2026-07-31: `pattern-not-inside: try {...}`
      # alone therefore excludes nothing here, and the swallowed shape is silently cleared. The
      # third exclusion is what closes it — no `try` may follow the projection at all, which is
      # deliberately coarser than "no try between the guard and the sink" and errs toward reporting.
      # Both directions measured on N-REDIRECT-HOST-ALLOWLIST-THROW / P-REDIRECT-HOST-THROW-SWALLOWED.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $HOST = new URL($X).hostname
              - pattern: $HOST = new URL($X).host
          - pattern-either:
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) { ... throw $E; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.includes($HOST)) throw $E;
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) { ... throw $E; }
                  ...
              - pattern-inside: |
                  ...
                  if (!$ALLOW.has($HOST)) throw $E;
                  ...
          - pattern-not-inside: |
              try { ... }
          - pattern-not-inside: |
              try { ... } finally { ... }
          - pattern-not-inside: |
              $H = new URL(...).hostname;
              ...
              try { ... }
              ...
          - pattern-not-inside: |
              $H = new URL(...).host;
              ...
              try { ... }
              ...
          - focus-metavariable: $X
      # #1240: (a2) validator-guard on the value the fetch RECEIVES, which the projection guard
      # above structurally does not reach. Needed once the RSC `{ params }` source landed: the sheet's
      # own correct form validates the route segment itself, so without this the rule would fire on
      # the remedy it recommends. Same soundness constraints as the #989 block — an ANCHORED,
      # POSITIVE-class regex (an unanchored allowlist matches a prefix), or exact membership — plus a
      # failure branch that actually terminates the flow. THROW is admitted alongside return, and
      # both are spelled braced AND braceless (the braceless spelling per #1236's convention),
      # because MEASURED 2026-07-27 (semgrep 1.164.0) `{ ... throw $E; }` does not match a braceless
      # `if (…) throw new Error(…);` — the shape a Server Component uses, since a bare `return` there
      # renders an empty page instead of erroring. This is #1248's class (throw-based guards read as
      # vulnerable) closed for ONE rule ahead of the issue, where the widened source made it urgent;
      # #1248 has since closed it for the rest through the shared `*throw_guard` anchor.
      #
      # THIS BLOCK NEEDS NO TRY EXCLUSION, which is what the *throw_guard anchor carries — MEASURED
      # 2026-07-31, not assumed by symmetry. Its guards open `pattern-inside` REGIONS at the guard,
      # and a region opened inside a `try` does not extend past that try's end, so an RSC page whose
      # throw guard is swallowed by a catch still fires while its unwrapped twin still clears.
      #
      # `pattern-inside` + a consistency-bound `pattern: $X`, NOT `by-side-effect` like the #989
      # copies: the guarded value here is a PROPERTY ACCESS (`params.id`), not a variable, and
      # by-side-effect tracks assignment to an lvalue — MEASURED 2026-07-27, the by-side-effect form
      # left the validated fixture firing. The guard opens the region, so only uses AFTER it clear.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          if (!$RE.test($X)) { ... return; }
                          ...
                      - pattern-inside: |
                          if (!$RE.test($X)) { ... throw $E; }
                          ...
                      - pattern-inside: |
                          if (!$RE.test($X)) return ...;
                          ...
                      - pattern-inside: |
                          if (!$RE.test($X)) throw $E;
                          ...
                  - metavariable-regex:
                      metavariable: $RE
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              # #1363: the same guard with the regex HOISTED to a named constant — how it is normally
              # written once the regex is reused, and until now it read as vulnerable. metavariable-regex
              # reads a metavariable's matched TEXT, so $RE binds to the identifier `OK` and the anchoring
              # constraint has to move to the literal, bound alongside the guard by pattern-inside. `const`
              # deliberately, not a bare `$RE = $LIT`: MEASURED 2026-07-31, the bare form also clears a
              # guard whose regex was reassigned to /.*/ first — a sanitizer that clears a real bug.
              - patterns:
                  - pattern-inside: |
                      const $RE = $LIT;
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          if (!$RE.test($X)) { ... return; }
                          ...
                      - pattern-inside: |
                          if (!$RE.test($X)) { ... throw $E; }
                          ...
                      - pattern-inside: |
                          if (!$RE.test($X)) return ...;
                          ...
                      - pattern-inside: |
                          if (!$RE.test($X)) throw $E;
                          ...
                  - metavariable-regex:
                      metavariable: $LIT
                      regex: ^/\^(?:[^\[]|\[[^^\]][^\]]*\])*\$/[isuvy]*$
              - pattern-inside: |
                  if (!$ALLOW.includes($X)) { ... return; }
                  ...
              - pattern-inside: |
                  if (!$ALLOW.includes($X)) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (!$ALLOW.includes($X)) return ...;
                  ...
              - pattern-inside: |
                  if (!$ALLOW.includes($X)) throw $E;
                  ...
              - pattern-inside: |
                  if (!$ALLOW.has($X)) { ... return; }
                  ...
              - pattern-inside: |
                  if (!$ALLOW.has($X)) { ... throw $E; }
                  ...
              - pattern-inside: |
                  if (!$ALLOW.has($X)) return ...;
                  ...
              - pattern-inside: |
                  if (!$ALLOW.has($X)) throw $E;
                  ...
          - pattern: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              # #985: the node http/https modules and the axios/request HTTP clients are equally
              # SSRF-capable sinks — a request-controlled URL fetched through any of them is the same
              # bug as fetch(). (harvey-ssrf-fetch previously only matched fetch().)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.request($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.get($URL, ...)
              - pattern: axios.post($URL, ...)
              - pattern: request($URL, ...)
              - patterns:
                  - pattern: $FN($URL, ...)
                  - metavariable-regex:
                      metavariable: $FN
                      regex: (?i)^(fetchRemote|fetchUrl|fetchExternal|proxyFetch)$
          - focus-metavariable: $URL
