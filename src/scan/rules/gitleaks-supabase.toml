# Custom gitleaks rules layered on the default ruleset (see src/scan/secrets.ts for the
# invocation). Run with --max-decode-depth 2 so gitleaks base64-decodes matched JWT bodies
# before applying supabase-service-role-jwt — anon and service-role Supabase JWTs are
# structurally identical, so the only reliable signal is the decoded "role" claim.

title = "harvey supabase secret rules"

[extend]
useDefault = true

[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase service_role JWT (decoded role claim)"
regex = '''"role"\s*:\s*"service_role"'''

[[rules]]
id = "supabase-next-public-secret-leak"
description = "NEXT_PUBLIC_ env var whose name implies a secret/key/token/service credential"
regex = '''NEXT_PUBLIC_[A-Z0-9_]*(KEY|SECRET|TOKEN|SERVICE)[A-Z0-9_]*\s*=\s*\S+'''

[[rules]]
id = "supabase-secret-key"
description = "Supabase new-format secret key (sb_secret_...)"
regex = '''sb_secret_[A-Za-z0-9_]{20,}'''

# The anon/publishable key is public by design and is the most credibility-fatal false positive
# (docs/design/mechanical-toolchain.md §3). regexTarget = "line" so any line naming
# NEXT_PUBLIC_SUPABASE_ANON_KEY is suppressed for EVERY rule — including the default JWT/entropy
# rules that would otherwise flag the anon token's `eyJ...` shape. The service_role JWT lives on
# its own line and is NOT suppressed. Paths cover documented sample/example files and deps.
[allowlist]
description = "Public anon key env var, documented sample env files, and dependency trees"
regexTarget = "line"
regexes = [
  '''NEXT_PUBLIC_SUPABASE_ANON_KEY''',
]
paths = [
  '''(^|/)\.env\.example$''',
  '''\.sample$''',
  '''\.template$''',
  '''(^|/)node_modules/''',
]
