# GitGuardian (ggshield) config.
# targets/ holds deliberately-vulnerable calibration fixtures with PLANTED, FAKE,
# inert secrets used as scanner ground truth — the app is never deployed. Exclude it
# from secret scanning so the intentional fixtures don't raise false alarms.
# See docs/design/calibration-corpus-spec.md and targets/calibration/GROUND-TRUTH.md.
version: 2
secret:
  ignored-paths:
    - "targets/calibration/**"
    # dry-run/ is scanner OUTPUT over those same fixtures, and a finding quotes the
    # matched secret back as evidence — so the planted fakes appear here a second time.
    # Excluded for the same reason, one step downstream. Note this only holds while the
    # scanned target is the fixture corpus: evidence strings would carry REAL secrets if
    # a real engagement's findings were ever committed here — see #308.
    - "dry-run/**"
