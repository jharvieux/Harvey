# GitGuardian (ggshield) config.
# targets/ holds deliberately-vulnerable calibration fixtures with PLANTED, FAKE,
# inert secrets used as scanner ground truth — the app is never deployed. Exclude it
# from secret scanning so the intentional fixtures don't raise false alarms.
# See docs/design/calibration-corpus-spec.md and targets/calibration/GROUND-TRUTH.md.
version: 2
secret:
  ignored-paths:
    - "targets/calibration/**"
    # dry-run/ is scanner OUTPUT over those same fixtures. Since #308, evidence redacts the
    # matched value to a short prefix + length, so a finding no longer quotes a full secret
    # back — but a prefix of a planted fake can still surface here, so keep the exclusion.
    # A real engagement's findings must never be committed here regardless.
    - "dry-run/**"
    # secrets.test.ts holds intentional real-shaped but FAKE, inert credential fixtures
    # (a Stripe-shaped sk_test_ key, a postgres:// URI) used to verify #308's redaction
    # actually redacts. Not a real secret; exclude it so the fixtures don't raise alarms.
    - "src/scan/secrets.test.ts"
