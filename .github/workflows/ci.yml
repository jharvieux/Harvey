name: CI

on:
  push:
    branches: [main]
  pull_request:
  # #1498: merge queue. A queue entry is a `merge_group` event, and a required context that does
  # not fire on it HANGS THE QUEUE FOREVER — the check never reports, so nothing merges. This
  # trigger is what makes `verify` reportable on a queue entry. The `changes` router below already
  # fails safe: any non-`pull_request` event sets code=true, so a queue entry runs the FULL verify
  # rather than a filtered subset. That is deliberate — the queue tests the merged state, which is
  # the one thing `strict: true` never did.
  merge_group:
  # #1138: a daily run so heavy-cli (the seven heavy files + real binaries) is exercised on a
  # cadence, not only when a push/PR touches code. A regression from something no PR touches — a
  # transitive dep bump, a runner-image change, a scanner-binary drift — would otherwise never trip
  # it. On a schedule event the `changes` router sets code=true, so heavy-cli (and the full verify)
  # run as a post-merge-style safety net.
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  # #1287: this workflow had NO manual trigger, so heavy-cli's `ci-heavy-cli-alert` path could only
  # ever run on cron — i.e. it could not be proven to work at all. The alert path had in fact never
  # executed. `alert_drill` is the re-runnable proof; a bare dispatch with it off is an ordinary run.
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-heavy-cli-alert path fires end-to-end (#1287). Fails shard 1 on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509/#1569). SKIPS the heavy tests and both scored gates, leaving a shard every one of whose steps succeeds — the guard is then the only thing that can turn it red."
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # #1507: PR runs are superseded by the next push to the same branch and cancelling them is pure
  # savings. A run on `main` is not — it is the ONLY thing that tests the merged pair that
  # `strict: false` never re-tested, and every main push shares one concurrency group (the ref is
  # always refs/heads/main). MEASURED 2026-07-31 over the last 200 push-to-main CI runs: 165
  # success, 3 failure, and **32 CANCELLED** — 16% of merges to main were never verified at all, and
  # a cancelled run reports neither green nor red, so nothing distinguishes it from a clean one.
  # Merges per day over the last 6 days, same measurement: 50, 49, 37, 18, 33, 13 — dense enough that
  # one main run routinely outlives the next merge. It is a hole the alarm below could not have
  # covered, because a cancelled run produces no result to alarm on.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tier router: inspect the change set and decide which jobs are needed.
  # Operating-policy/docs-only PRs (root guidance Markdown, docs/**.md and Codex agent profiles)
  # run only the cheap policy/docs ratchet. Workflow-only PRs need actionlint, not the full JS verify
  # (tsc/eslint/vitest/knip never read workflow YAML). Everything else — code,
  # config, briefs/**, targets/** — runs the full verify. A non-PR event runs every
  # tier as a post-merge or scheduled safety net.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "code=true"
              echo "workflows=true"
              echo "docs=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
          echo "Changed files:"
          echo "$files"
          code=false
          workflows=false
          docs=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*) workflows=true ;;
              # Root operating guidance, Codex agent profiles, and every Markdown file under
              # docs/ are policy/claim venues. Functional/tool-input
              # docs under briefs/, targets/, src/, and project READMEs outside docs/ all
              # fall through to the code catch-all below. Keep this whitelist exact (#1763).
              AGENTS.md|CLAUDE.md|MODULES.md|README.md|SESSION.md|docs/*.md) docs=true ;;
              .codex/agents/*.toml)
                profile=${f#".codex/agents/"}
                case "$profile" in */*) code=true ;; *) docs=true ;; esac
                ;;
              *) code=true ;;
            esac
          done <<< "$files"
          {
            echo "code=$code"
            echo "workflows=$workflows"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"

  # #1763: prose-only changes used to bypass the one ratchet that reads their claims, then reveal
  # the breach only after merge when main ran the full build. Keep the expensive build tiered, but
  # always run this focused test when the exact cheap-docs whitelist above is touched.
  docs-claims:
    name: docs claims
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Parse Codex agent profiles
        run: python3 -c 'import pathlib,tomllib; [tomllib.load(path.open("rb")) for path in pathlib.Path(".codex/agents").glob("*.toml")]'
      - run: pnpm exec vitest run src/local-verify.test.ts src/recorded-reasons.test.ts src/ci-tier-router.test.ts src/corpus-tier-router.test.ts

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # #1120: the seven heavy child-process test files vitest.config.ts keeps out of `pnpm verify`'s
  # shared worker pool. They are not dropped, they are moved here — serialized (maxForks 1, set by
  # the config when HARVEY_HEAVY_CLI_TESTS=1) so they cannot starve each other's worker RPC channel
  # the way they did inside the main suite.
  #
  # This job installs the mechanical binaries and the `build` job deliberately does not, which also
  # closes a standing blind spot: three of these files gate blocks behind
  # skipIf(!MECHANICAL_BINARIES_PRESENT) / skipIf(!SEMGREP_PRESENT), so until now those blocks had
  # never executed in CI at all — main looked green while they ran nowhere.
  #
  # It is in the `verify` gate's needs below, not advisory: these seven files WERE part of the
  # required check until this change, and moving required coverage to a non-blocking job would be
  # the silent-omission failure this repo's coverage guard exists to prevent.
  heavy-cli:
    # Sharded across runners (#1228). The files still run ONE AT A TIME within a shard
    # (poolOptions.forks.maxForks: 1) — that constraint is about contention on a single machine,
    # where these files starve vitest's worker RPC channel (#1120/#1133). Separate runners are
    # separate machines, so sharding preserves it exactly rather than relaxing it.
    #
    # MEASURED (CI run 30272315745, 2026-07-27): serialized on one runner the seven files take 205s
    # of a 236s job, and because they are serial that is the SUM, not the max — run-audit 58.3s,
    # calibration-acceptance 37.7s, quick-scan 28.4s, detector-rerun 25.9s, mutation-scan 21.1s,
    # quality-scan 18.9s, lighthouse-scan 15.0s. Three shards brings wall-clock to ~104s. The floor
    # is the longest single file (run-audit, 58.3s), so a fourth shard buys only ~15s more and pays
    # a whole extra runner's setup for it.
    #
    # The shard's file list is DERIVED, never written here: src/cli/heavy-shard.ts reads the same
    # array vitest.config.ts uses. Listing names in this file would let an eighth heavy test be
    # added to the suite and run in no shard — green CI, silently reduced coverage.
    # src/heavy-cli-tests.test.ts asserts the partition for every width.
    name: heavy CLI tests (shard ${{ matrix.shard }}/3, real binaries)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard runs even when one fails — a red shard 1 must not hide a different failure in
      # shard 3, which would turn two bugs into one round trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # issues: write so a scheduled failure can find-or-update its tracking issue (#1138). A
    # job-level block replaces the default token perms, so contents: read is restated for checkout.
    permissions:
      contents: read
      issues: write
    # The receipt the shard's record step, validate-calibration.ts and validate-source-recall.ts all
    # write to. A literal path, not ${{ runner.temp }}: the `runner` context is not available in a
    # job-level `env:` block. Each shard is its own runner, so each has its own receipt.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      # The mechanical scan these drive reads git history (trufflehog/gitleaks); a shallow clone
      # would quietly narrow what they cover. Same reason as conservation.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Shard 1 only: the alert path is per-job, and three shards racing to open the same tracking
      # issue would make pass 1 of the drill find an issue it was supposed to create. Shards 2 and 3
      # run normally, which also keeps a drill from claiming the heavy suite passed.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill && matrix.shard == 1
        run: |
          echo "::error::Alert-path liveness drill (#1287): failing on purpose so the tracking-issue step runs under the real job token. This is NOT a heavy-cli failure."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same pins as conservation.yml / dry-run-drift.yml — each scanner degrades to "found nothing"
      # rather than failing when its binary is absent, so a missing one here would read as a passing
      # test instead of an unrun one.
      - name: Install mechanical-tier scanner binaries
        uses: ./.github/actions/mechanical-binaries

      # Asserted separately so a broken install reads as a missing binary here rather than as a
      # skipped describe block three steps later — a skipIf is a silent pass by design.
      - name: Assert the binaries the skipIf blocks gate on are actually present
        run: |
          set -euo pipefail
          for b in semgrep trufflehog gitleaks osv-scanner; do
            command -v "$b" >/dev/null || { echo "::error::$b is not on PATH — the heavy tests would skip silently"; exit 1; }
          done

      # `tsx` directly, not `pnpm exec tsx`: pnpm writes "Already up to date / Done in ..." to
      # STDOUT, which would be fed to vitest as filenames. The heavy tests spawn tsx the same way.
      - name: Resolve this shard's files
        id: shard
        run: |
          set -euo pipefail
          files=$(node_modules/.bin/tsx src/cli/heavy-shard.ts --shard '${{ matrix.shard }}' --of 3)
          test -n "$files"   # an empty shard would make vitest exit non-zero for the wrong reason
          echo "This shard runs:"; echo "$files"
          echo "files=$(echo "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # The json reporter rides alongside the default one: it costs nothing on the console and gives
      # the record step below a real number instead of a claim. Three of these files gate blocks
      # behind skipIf(), so "the step succeeded" and "tests executed" are genuinely different facts.
      - name: Heavy CLI tests
        if: ${{ !inputs.liveness_drill }}
        env:
          HARVEY_HEAVY_CLI_TESTS: "1"
        run: pnpm exec vitest run ${{ steps.shard.outputs.files }} --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"

      # #1509: `always()` because a shard whose tests RAN AND FAILED reached its measuring phase and a
      # shard that died before vitest did not — the job is red either way, and only one of them means
      # the suite told us something. A shard that executed zero tests records 0 units, which the
      # action rejects.
      - name: Record how many heavy tests this shard actually executed
        if: always()
        id: heavy-count
        run: |
          set -uo pipefail
          if [ ! -f "$RUNNER_TEMP/vitest-shard.json" ]; then
            echo "no vitest json report — the test step never produced one" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ran=$(jq '(.numPassedTests // 0) + (.numFailedTests // 0)' "$RUNNER_TEMP/vitest-shard.json")
          echo "ran=$ran" >> "$GITHUB_OUTPUT"
      - name: Record the shard's executed-test count
        if: always() && steps.heavy-count.outputs.ran != ''
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: heavy-cli-tests
          units: ${{ steps.heavy-count.outputs.ran }}
          scope: "heavy CLI tests executed in shard ${{ matrix.shard }} of 3 (passed + failed, skipped excluded)"

      # #1301: `validate:calibration` scores the REAL mechanical scan against the corpus answer key
      # and ran in no workflow at all — the gate that would catch "a rule stopped firing on its
      # positive" was never run automatically. It belongs here because this is the only job that
      # installs the mechanical binaries. Shard 1 only: it is one run of one scan, not a sharded
      # test file, and three copies would just burn two runners.
      - name: Calibration gate (real binaries, scored against the corpus answer key)
        if: matrix.shard == 1 && !inputs.liveness_drill
        run: pnpm exec tsx src/cli/validate-calibration.ts

      # #1288: the same hole one gate over. `validate-source-recall` scores the app-layer
      # request→sink SOURCE detectors — the free-tier recall number #868 publishes — and ran in no
      # workflow either. It runs the same runMechanicalScan the calibration gate does, so it needs
      # the binaries this job installs and belongs nowhere else. Shard 2, not 1: shard 1 already
      # carries the calibration gate, and both are single scans (~16s measured locally 2026-07-28),
      # so splitting them keeps either shard from becoming the long pole.
      #
      # Deliberately WITHOUT --real: that mode git-clones six pinned external repos and always exits
      # 0 by design (it reports, it does not gate), so on a cadence it would spend network on a
      # number nothing can fail. The planted-fixture gate below is the one with a pass/fail.
      - name: Source-detector recall gate (real binaries, request→sink answer key)
        if: matrix.shard == 2 && !inputs.liveness_drill
        run: pnpm exec tsx src/cli/validate-source-recall.ts

      # #1483, and the relay #1481 owed. M2 carries the parity exemption whose substitute gates are
      # the conservation plant (daily, required) and THIS — `assertComplete`, which throws naming any
      # enumerated-but-untested M2 target. Until now it ran in no venue at all, so the exemption
      # stood on a gate nothing invoked, which is the #1288/#1301 shape one level up. PR #1481
      # declined the wiring as a supervised-path edit and proposed this exact step; the operator
      # granted workflow edits for the 2026-07-31 sweep, so the relay is DISCHARGED rather than
      # re-recorded.
      #
      # Shard 3, because shards 1 and 2 already carry a scored gate each. Offline and sub-second —
      # MEASURED 2026-07-31: 0.9s wall, exit 0 on `--tested app:root`, exit 1 on `--tested bogus-id`
      # ("Incomplete target coverage — 1 enumerated target(s) untested: app:root"). Both directions,
      # so this is not a step that can only pass.
      - name: M2 target-coverage gate (assertComplete over the discovered manifest)
        if: matrix.shard == 3 && !inputs.liveness_drill
        run: pnpm exec tsx src/cli/pentest.ts --mode=coverage --repo targets/vuln-seam-app --tested app:root

      # #1544: shared-sources.test.ts asserted for months that the canonical request-source block
      # CONTAINED certain pattern strings. A pattern can be present and inert — the two block-bodied
      # arrow arms shipped in a spelling that matched nothing the real world writes, and that test
      # was green throughout. It now also EXECUTES the block against probes with real semgrep, which
      # means it skips in `verify` (that job installs no binaries) and this is the only job where it
      # can run. HARVEY_REQUIRE_SEMGREP=1 makes a missing binary red rather than a silent skip.
      # Shard 3 alongside the M2 coverage gate: shards 1 and 2 carry the two long scans, and this is
      # one 3s vitest file, so it is the cheapest of the four to place.
      - name: Shared request-source block — patterns MATCH probes, not merely present
        id: shared-source-match
        if: matrix.shard == 3 && !inputs.liveness_drill
        env:
          HARVEY_REQUIRE_SEMGREP: "1"
        run: |
          set -euo pipefail
          pnpm exec vitest run src/scan/rules/semgrep/shared-sources.test.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shared-sources.json"
          ran=$(jq '(.numPassedTests // 0) + (.numFailedTests // 0)' "$RUNNER_TEMP/vitest-shared-sources.json")
          echo "ran=$ran" >> "$GITHUB_OUTPUT"
      - name: Record the shared-source match gate's executed-probe count
        if: matrix.shard == 3 && !inputs.liveness_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: shared-source-match
          units: ${{ steps.shared-source-match.outputs.ran }}
          scope: "assertions executed against the canonical x-request-source block with real semgrep (passed + failed, skipped excluded)"

      # #1491 WITHDRAWN from this shard (2026-07-31), and the reason is recorded rather than left as
      # an absent step. A `supabase/setup-cli@v1` + `supabase start -x vector,logflare` pair landed
      # here to give `validate-connected` its first CI cadence, and the stack never came up:
      #
      #   failed to read file: open targets/calibration/supabase/functions/admin-refund/index.ts:
      #   no such file or directory
      #
      # `targets/calibration/supabase/config.toml` declares `[functions.admin-refund]` (the
      # P-EDGEFN-VERIFY-JWT-OFF plant, which is a config-only fixture by design — the detector reads
      # config.toml, not the handler) and `[functions.user-profile]` (its negative control), and
      # NEITHER has a directory in git. A current Supabase CLI refuses to start on a declared function
      # with no source; the 2.102.0 on the authoring machine tolerates it, which is why this shipped
      # green locally and red in CI.
      #
      # Fixing it properly means either adding two real Edge Function directories to the calibration
      # fixture — which changes the scanned corpus, so it drags in a dry-run regeneration and a
      # re-score of the plant it exists to serve — or pinning the CLI to a version chosen for
      # tolerating a broken fixture. Neither belongs in a PR whose subject is alert paths, so the
      # steps are removed rather than made `continue-on-error`: a live-stack gate that is allowed to
      # fail is a green shard that measured nothing, which is the exact defect #1509's liveness
      # assert below exists to catch. `validate-connected` is BACK to `cadence: none` in
      # src/scored-gates.ts with the reason above and a falsifier, so `validate-scored-gates` reports
      # NO CADENCE — the registry must not assert a venue that has never once executed. #1491 stays
      # open with the measured cause on it.

      # #1509: the scored gates above ride inside `if: matrix.shard == N`, and a condition that
      # stopped matching would retire them in complete silence — the shape #1301/#1288 found when each
      # ran in no workflow at all. `expect` is matrix-dependent for the same reason: shard 1 must
      # prove the calibration gate ran, shard 2 the source-recall gate, and neither can be satisfied
      # by the other's record. `always()` so a shard that died in setup names the phase.
      - name: Gate liveness — did this shard actually measure anything?
        if: always() && !(inputs.alert_drill && matrix.shard == 1)
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: heavy-cli-tests ${{ matrix.shard == 1 && 'calibration-gate' || '' }} ${{ matrix.shard == 2 && 'source-recall-gate' || '' }} ${{ matrix.shard == 3 && 'm2-coverage-gate shared-source-match' || '' }}

      # A scheduled heavy-cli failure (#1138) means a regression from something no PR touched. It
      # goes red on main with no PR to surface it, so find-or-update ONE tracking issue by the marker
      # label. Still never fires on PR/push — those failures already gate the `verify` check on the
      # PR — but `workflow_dispatch` is now permanently in the condition (#1287): this path had never
      # executed once, and until this change the workflow had no manual trigger to prove it with.
      - name: Open or update the heavy-cli tracking issue
        if: failure() && !inputs.liveness_drill && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-heavy-cli-alert
          label-description: Auto-opened when the scheduled heavy-cli CI run fails
          title: heavy-cli scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled heavy-cli run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}, shard ${{ matrix.shard }} of 3). This job runs the heavy child-process test files with the real mechanical binaries (semgrep/trufflehog/gitleaks/osv-scanner). A failure here with no code change points at an environment regression — a transitive dep bump, a runner-image change, or a scanner-binary drift. Investigate the run, then close this issue once green."

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color

  # Required status check. Always runs so branch protection's "verify" always gets a
  # result, and fails only if a required job that actually ran failed. Skipped jobs
  # (the whole point of the tiers) leave this green.
  verify:
    name: verify
    needs: [changes, docs-claims, build, heavy-cli, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on required jobs
        run: |
          echo "changes=${{ needs.changes.result }} docs-claims=${{ needs['docs-claims'].result }} build=${{ needs.build.result }} heavy-cli=${{ needs['heavy-cli'].result }} actionlint=${{ needs.actionlint.result }}"
          for r in '${{ needs.changes.result }}' '${{ needs['docs-claims'].result }}' '${{ needs.build.result }}' '${{ needs['heavy-cli'].result }}' '${{ needs.actionlint.result }}'; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not pass."
              exit 1
            fi
          done
          echo "OK"

  # #1507 — the alarm for a RED `main`.
  #
  # Branch protection sets `strict: false`, so a branch is never required to be up to date before
  # merging. That is a deliberate throughput choice at this merge rate, but it means the merged pair
  # is tested for the FIRST time on `main`, after the fact — and #1507 measured that happening:
  # #1445/#1446 added a raw `statSync` walk, #1451 added the repo-wide gate banning it, neither
  # appeared in the other's diff so no conflict was possible, both were green on their own base, and
  # `main` went red in the combination (c597012).
  #
  # What was missing was NOT the test. `on.push.branches: [main]` above already re-runs the full
  # verify on the merged result, and it CAUGHT c597012 — MEASURED 2026-07-31, run 30412823963,
  # conclusion `failure`, one of 3 failures in the last 200 push-to-main runs. What was missing is
  # that a red `main` raised NOTHING: the only alert path in this file is heavy-cli's, and its
  # condition is schedule/dispatch-only, so a failure on push reported to no one and `main` stayed
  # red until the next PR author tripped over it. Re-running verify in a NEW workflow would have
  # duplicated the compute and left that same gap; this raises the alarm on the run that already
  # exists.
  #
  # It watches the AGGREGATE (`verify`), not heavy-cli, deliberately: in run 30412823963 the failing
  # job was `build` (step `Run pnpm verify`), which no alert path covered at all. Also on `schedule`,
  # where the same hole exists for every job except heavy-cli.
  main-red:
    name: a red main raises an alarm
    needs: [verify]
    # The job gates on the RESULT only; which events may alarm lives on the step below. Both halves
    # could sit here, but src/alert-paths.ts reads STEP-level `if:` — deliberately, because that is
    # where a condition can silently narrow an alert path to something nobody can dispatch (#1287's
    # four unfired paths). Splitting them keeps one copy of the event list, in the place the gate
    # checks. Cost: a ~10s checkout job on a red PR, where the step is skipped.
    if: always() && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      # `pull_request` is deliberately absent: a red PR is already in front of its author, and a
      # tracking issue per red PR would bury the real alarm.
      #
      # The drill (`-f alert_drill=true`) fails heavy-cli shard 1, which fails `verify`, which
      # reaches here — so ONE dispatch proves both of this workflow's alert paths, each into its own
      # marker namespace.
      - name: Open or update the red-main tracking issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-main-red-alert
          label-description: Auto-opened when CI fails on the main branch itself
          title: main is red — the merged result does not pass verify
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "CI failed on `main` itself (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}, commit ${{ github.sha }}). Every subsequent PR now inherits this failure, so fix or revert before merging anything else. Note what this usually is NOT: a PR that was wrong. `strict: false` means the merged pair is tested for the first time here, so the common cause is two individually-green PRs whose combination breaks a repo-wide gate — `fs-walk`, `validate-reasons`, `validate-disclosure-venue`, the BOUNDED_RULES ratchet, `selfMatchingMatchKeys`, `test-only-exports` or the parity census — with neither PR appearing in the other's diff (#1507, #1451/#1445). Read the failing job before assuming the last merge is the culprit. Close this issue once `main` is green."
