name: CI

on:
  push:
    branches: [main]
  pull_request:
  # #1498: merge queue. A queue entry is a `merge_group` event, and a required context that does
  # not fire on it HANGS THE QUEUE FOREVER — the check never reports, so nothing merges. This
  # trigger is what makes `verify` reportable on a queue entry. The `changes` router below already
  # fails safe: any non-`pull_request` event sets code=true, so a queue entry runs the FULL verify
  # rather than a filtered subset. That is deliberate — the queue tests the merged state, which is
  # the one thing `strict: true` never did.
  merge_group:
  # #1138: a daily run so heavy-cli (the seven heavy files + real binaries) is exercised on a
  # cadence, not only when a push/PR touches code. A regression from something no PR touches — a
  # transitive dep bump, a runner-image change, a scanner-binary drift — would otherwise never trip
  # it. On a schedule event the `changes` router sets code=true, so heavy-cli (and the full verify)
  # run as a post-merge-style safety net.
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  # #1287: this workflow had NO manual trigger, so heavy-cli's `ci-heavy-cli-alert` path could only
  # ever run on cron — i.e. it could not be proven to work at all. The alert path had in fact never
  # executed. `alert_drill` is the re-runnable proof; a bare dispatch with it off is an ordinary run.
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-heavy-cli-alert path fires end-to-end (#1287). Fails shard 1 on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier router: inspect the change set and decide which heavy jobs are needed.
  # Prose-doc-only PRs (SESSION.md, docs/**.md) skip both. Workflow-only PRs need
  # actionlint, not the full JS verify (tsc/eslint/vitest/knip never read workflow
  # YAML). Everything else — code, config, briefs/**, targets/** — runs the full
  # verify. A push to main runs everything as a post-merge safety net.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
          echo "Changed files:"
          echo "$files"
          code=false
          workflows=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*) workflows=true ;;
              # Everything under docs/ is prose (SESSION.md too) — skip the build.
              # Every functional/tool-input doc lives under briefs/, targets/, or
              # src/, which all fall through to the catch-all below. No per-file
              # exceptions needed (#994).
              SESSION.md|docs/*.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # #1120: the seven heavy child-process test files vitest.config.ts keeps out of `pnpm verify`'s
  # shared worker pool. They are not dropped, they are moved here — serialized (maxForks 1, set by
  # the config when HARVEY_HEAVY_CLI_TESTS=1) so they cannot starve each other's worker RPC channel
  # the way they did inside the main suite.
  #
  # This job installs the mechanical binaries and the `build` job deliberately does not, which also
  # closes a standing blind spot: three of these files gate blocks behind
  # skipIf(!MECHANICAL_BINARIES_PRESENT) / skipIf(!SEMGREP_PRESENT), so until now those blocks had
  # never executed in CI at all — main looked green while they ran nowhere.
  #
  # It is in the `verify` gate's needs below, not advisory: these seven files WERE part of the
  # required check until this change, and moving required coverage to a non-blocking job would be
  # the silent-omission failure this repo's coverage guard exists to prevent.
  heavy-cli:
    # Sharded across runners (#1228). The files still run ONE AT A TIME within a shard
    # (poolOptions.forks.maxForks: 1) — that constraint is about contention on a single machine,
    # where these files starve vitest's worker RPC channel (#1120/#1133). Separate runners are
    # separate machines, so sharding preserves it exactly rather than relaxing it.
    #
    # MEASURED (CI run 30272315745, 2026-07-27): serialized on one runner the seven files take 205s
    # of a 236s job, and because they are serial that is the SUM, not the max — run-audit 58.3s,
    # calibration-acceptance 37.7s, quick-scan 28.4s, detector-rerun 25.9s, mutation-scan 21.1s,
    # quality-scan 18.9s, lighthouse-scan 15.0s. Three shards brings wall-clock to ~104s. The floor
    # is the longest single file (run-audit, 58.3s), so a fourth shard buys only ~15s more and pays
    # a whole extra runner's setup for it.
    #
    # The shard's file list is DERIVED, never written here: src/cli/heavy-shard.ts reads the same
    # array vitest.config.ts uses. Listing names in this file would let an eighth heavy test be
    # added to the suite and run in no shard — green CI, silently reduced coverage.
    # src/heavy-cli-tests.test.ts asserts the partition for every width.
    name: heavy CLI tests (shard ${{ matrix.shard }}/3, real binaries)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard runs even when one fails — a red shard 1 must not hide a different failure in
      # shard 3, which would turn two bugs into one round trip.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # issues: write so a scheduled failure can find-or-update its tracking issue (#1138). A
    # job-level block replaces the default token perms, so contents: read is restated for checkout.
    permissions:
      contents: read
      issues: write
    # The receipt the shard's record step, validate-calibration.ts and validate-source-recall.ts all
    # write to. A literal path, not ${{ runner.temp }}: the `runner` context is not available in a
    # job-level `env:` block. Each shard is its own runner, so each has its own receipt.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      # The mechanical scan these drive reads git history (trufflehog/gitleaks); a shallow clone
      # would quietly narrow what they cover. Same reason as conservation.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Shard 1 only: the alert path is per-job, and three shards racing to open the same tracking
      # issue would make pass 1 of the drill find an issue it was supposed to create. Shards 2 and 3
      # run normally, which also keeps a drill from claiming the heavy suite passed.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill && matrix.shard == 1
        run: |
          echo "::error::Alert-path liveness drill (#1287): failing on purpose so the tracking-issue step runs under the real job token. This is NOT a heavy-cli failure."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same pins as conservation.yml / dry-run-drift.yml — each scanner degrades to "found nothing"
      # rather than failing when its binary is absent, so a missing one here would read as a passing
      # test instead of an unrun one.
      - name: Install mechanical-tier scanner binaries
        uses: ./.github/actions/mechanical-binaries

      # Asserted separately so a broken install reads as a missing binary here rather than as a
      # skipped describe block three steps later — a skipIf is a silent pass by design.
      - name: Assert the binaries the skipIf blocks gate on are actually present
        run: |
          set -euo pipefail
          for b in semgrep trufflehog gitleaks osv-scanner; do
            command -v "$b" >/dev/null || { echo "::error::$b is not on PATH — the heavy tests would skip silently"; exit 1; }
          done

      # `tsx` directly, not `pnpm exec tsx`: pnpm writes "Already up to date / Done in ..." to
      # STDOUT, which would be fed to vitest as filenames. The heavy tests spawn tsx the same way.
      - name: Resolve this shard's files
        id: shard
        run: |
          set -euo pipefail
          files=$(node_modules/.bin/tsx src/cli/heavy-shard.ts --shard '${{ matrix.shard }}' --of 3)
          test -n "$files"   # an empty shard would make vitest exit non-zero for the wrong reason
          echo "This shard runs:"; echo "$files"
          echo "files=$(echo "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # The json reporter rides alongside the default one: it costs nothing on the console and gives
      # the record step below a real number instead of a claim. Three of these files gate blocks
      # behind skipIf(), so "the step succeeded" and "tests executed" are genuinely different facts.
      - name: Heavy CLI tests
        env:
          HARVEY_HEAVY_CLI_TESTS: "1"
        run: pnpm exec vitest run ${{ steps.shard.outputs.files }} --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-shard.json"

      # #1509: `always()` because a shard whose tests RAN AND FAILED reached its measuring phase and a
      # shard that died before vitest did not — the job is red either way, and only one of them means
      # the suite told us something. A shard that executed zero tests records 0 units, which the
      # action rejects.
      - name: Record how many heavy tests this shard actually executed
        if: always()
        id: heavy-count
        run: |
          set -uo pipefail
          if [ ! -f "$RUNNER_TEMP/vitest-shard.json" ]; then
            echo "no vitest json report — the test step never produced one" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ran=$(jq '(.numPassedTests // 0) + (.numFailedTests // 0)' "$RUNNER_TEMP/vitest-shard.json")
          echo "ran=$ran" >> "$GITHUB_OUTPUT"
      - name: Record the shard's executed-test count
        if: always() && steps.heavy-count.outputs.ran != ''
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: heavy-cli-tests
          units: ${{ steps.heavy-count.outputs.ran }}
          scope: "heavy CLI tests executed in shard ${{ matrix.shard }} of 3 (passed + failed, skipped excluded)"

      # #1301: `validate:calibration` scores the REAL mechanical scan against the corpus answer key
      # and ran in no workflow at all — the gate that would catch "a rule stopped firing on its
      # positive" was never run automatically. It belongs here because this is the only job that
      # installs the mechanical binaries. Shard 1 only: it is one run of one scan, not a sharded
      # test file, and three copies would just burn two runners.
      - name: Calibration gate (real binaries, scored against the corpus answer key)
        if: matrix.shard == 1
        run: pnpm exec tsx src/cli/validate-calibration.ts

      # #1288: the same hole one gate over. `validate-source-recall` scores the app-layer
      # request→sink SOURCE detectors — the free-tier recall number #868 publishes — and ran in no
      # workflow either. It runs the same runMechanicalScan the calibration gate does, so it needs
      # the binaries this job installs and belongs nowhere else. Shard 2, not 1: shard 1 already
      # carries the calibration gate, and both are single scans (~16s measured locally 2026-07-28),
      # so splitting them keeps either shard from becoming the long pole.
      #
      # Deliberately WITHOUT --real: that mode git-clones six pinned external repos and always exits
      # 0 by design (it reports, it does not gate), so on a cadence it would spend network on a
      # number nothing can fail. The planted-fixture gate below is the one with a pass/fail.
      - name: Source-detector recall gate (real binaries, request→sink answer key)
        if: matrix.shard == 2
        run: pnpm exec tsx src/cli/validate-source-recall.ts

      # #1509: the two scored gates above ride inside `if: matrix.shard == N`, and a condition that
      # stopped matching would retire them in complete silence — the shape #1301/#1288 found when each
      # ran in no workflow at all. `expect` is matrix-dependent for the same reason: shard 1 must
      # prove the calibration gate ran, shard 2 the source-recall gate, and neither can be satisfied
      # by the other's record. `always()` so a shard that died in setup names the phase.
      - name: Gate liveness — did this shard actually measure anything?
        if: always() && !(inputs.alert_drill && matrix.shard == 1)
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: heavy-cli-tests ${{ matrix.shard == 1 && 'calibration-gate' || '' }} ${{ matrix.shard == 2 && 'source-recall-gate' || '' }}

      # A scheduled heavy-cli failure (#1138) means a regression from something no PR touched. It
      # goes red on main with no PR to surface it, so find-or-update ONE tracking issue by the marker
      # label. Still never fires on PR/push — those failures already gate the `verify` check on the
      # PR — but `workflow_dispatch` is now permanently in the condition (#1287): this path had never
      # executed once, and until this change the workflow had no manual trigger to prove it with.
      - name: Open or update the heavy-cli tracking issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-heavy-cli-alert
          label-description: Auto-opened when the scheduled heavy-cli CI run fails
          title: heavy-cli scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled heavy-cli run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}, shard ${{ matrix.shard }} of 3). This job runs the heavy child-process test files with the real mechanical binaries (semgrep/trufflehog/gitleaks/osv-scanner). A failure here with no code change points at an environment regression — a transitive dep bump, a runner-image change, or a scanner-binary drift. Investigate the run, then close this issue once green."

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - run: ./actionlint -color

  # Required status check. Always runs so branch protection's "verify" always gets a
  # result, and fails only if a heavy job that actually ran failed. Skipped jobs
  # (the whole point of the tiers) leave this green.
  verify:
    name: verify
    needs: [changes, build, heavy-cli, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on required jobs
        run: |
          echo "changes=${{ needs.changes.result }} build=${{ needs.build.result }} heavy-cli=${{ needs['heavy-cli'].result }} actionlint=${{ needs.actionlint.result }}"
          for r in '${{ needs.changes.result }}' '${{ needs.build.result }}' '${{ needs['heavy-cli'].result }}' '${{ needs.actionlint.result }}'; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not pass."
              exit 1
            fi
          done
          echo "OK"
