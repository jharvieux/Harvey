# Layer 2 for the external-repo regression corpus (#222/#263). Clones every PUBLIC target at its
# pinned commit, re-runs the source-tier modules, and scores the result against the recorded
# baselines. (This header said "six" until 2026-07-30; the manifest has grown since — count it,
# don't quote it: `pnpm corpus-pins --out /tmp/pins.txt && wc -l /tmp/pins.txt` for the current count.)
#
# Why this is NOT part of `pnpm verify` (the required per-PR check): it needs network to clone every
# pinned repo and external binaries (semgrep/trufflehog/osv-scanner) to run the mechanical tier. `verify`
# stays deterministic and offline so it's fast and never flakes on someone else's infrastructure;
# Layer 1 (src/scan/external-corpus.test.ts) covers the scorers there.
#
# The targets are frozen at exact commits. Pushes to main, schedules, and explicit dispatches always
# run the full corpus. Pull requests and merge-queue entries first execute the production-owned
# dependency closure from src/cli/corpus-drift-relevance.ts. A proven-disjoint change declares an
# explicit nothing-assessed no-op; a change that reaches a corpus input, or any uncertainty in the
# proof, launches the complete pinned population. workflow_dispatch remains the manual escape hatch.
#
# The context remains required on `main` so every PR reports and branch protection never waits for a
# context that was filtered out. On a classified no-op its green result means exactly "the immutable
# runtime closure proved this diff disjoint; nothing was assessed", not "the pinned population was
# scanned"; the liveness and relevance receipts preserve that distinction.
#
# Being required is why this workflow has NO `paths:` filter on `pull_request` any more. GitHub
# waits forever for a required context that never reports, so a path-filtered required check
# deadlocks every PR outside its filter (#1107, and gotcha 5 on #1379). Relevance therefore runs
# INSIDE the workflow's preparation job: the required aggregate always reports, and only a proven
# full-scan receipt allocates the expensive shard.
#
# There is deliberately no hand-maintained PR path router here. Runtime roots, live mechanical
# producers, pinned targets, workflow commands, and registered non-import inputs build one exact
# ownership receipt. Both Git sides are walked with rename-aware closure; unknown input fails open.
#
# On failure: the job names the module and target that drifted. A drift is EITHER an intended
# precision fix — rebaseline that target in src/scan/external-corpus.ts with the measured note —
# OR a regression, which is a scanner bug to fix. It is never something to silence.
#
# M8 mutation scoring is NOT this job's work (#470): no Stryker is provisioned here, corpus-drift
# invokes mutation-scan --detect-only (suite-absent finding only), and each mutation-baseline
# target gets an explicit "deferred to corpus-m8.yml" row. So this job goes green when M8's
# mutation tier can't run here — while a real M4/M5/M7/M9/M10 baseline drift still fails it.

name: corpus-drift

on:
  schedule:
    - cron: "17 7 * * *" # daily 07:17 UTC (#1883: moved off minute zero; #1138: was weekly "0 7 * * 1")
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-corpus-drift-alert path fires end-to-end (#1287). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509). SKIPS the scoring step, leaving a job every one of whose steps succeeds — the guard is then the only thing that can turn it red."
        type: boolean
        default: false
      force_cold_cache:
        description: "Run the executable cold-vs-restored equivalence control for every deterministic phase. Expensive; daily provider validation stays warm."
        type: boolean
        default: false
  pull_request:
  # #1867: the default branch is the only Actions-cache scope every PR can read. The post-merge push
  # now owns both full-corpus validation and cache seeding. The required aggregate context still
  # reports on every PR because pull_request remains unconditional.
  push:
    branches: [main]
  # #1498: merge queue. Without this the required context never reports on a queue entry and the
  # queue deadlocks. Like pull_request, merge_group classifies its exact range and either proves a
  # nothing-assessed no-op or runs the full corpus; the resulting main push is always full again.
  merge_group:

# A scheduled drift check has no reason to run twice concurrently, and a re-dispatch means the
# newer run is the interesting one. Safe on a required check: a cancellation here is only ever
# caused by a NEWER run on the same `github.ref` — for a PR that is `refs/pull/N/merge`, so the
# superseding run reports against the newer head commit, which is the commit branch protection
# actually evaluates. A `cancelled` conclusion is therefore never the latest result for the head
# SHA and cannot strand a merge. (Same posture dry-run-drift.yml and ci.yml already take.)
concurrency:
  group: corpus-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every event prepares one exact ownership/routing receipt. PR/merge-group runs classify their
  # immutable Git range; push/schedule/manual bypass classification and remain unconditional full.
  # A relevant run then fetches the exact six-file Semgrep input once for every producer shard.
  prepare-current-inputs:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.route.outputs.relevant }}
      decision: ${{ steps.route.outputs.decision }}
      closure-digest: ${{ steps.route.outputs.closure-digest }}
      target-count: ${{ steps.route.outputs.target-count }}
      target-slugs: ${{ steps.route.outputs.target-slugs }}
      scope: ${{ steps.route.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate live corpus ownership and classify the exact Git range
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ownership="$RUNNER_TEMP/corpus-drift-ownership.json"
          receipt="$RUNNER_TEMP/corpus-drift-relevance.json"
          pnpm exec tsx src/cli/corpus-drift-relevance.ts ownership --out "$ownership"
          target_count=$(jq -er '.consumers[0].targetSelection.targets | length | select(. > 0)' "$ownership")
          target_slugs=$(jq -cer '.consumers[0].targetSelection.targets | sort' "$ownership")

          if [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; then
            base="$PR_BASE_SHA"
            [ "$EVENT_NAME" = merge_group ] && base="$MERGE_GROUP_BASE_SHA"
            [ -n "$base" ] || { echo "::error::corpus relevance has no base SHA for $EVENT_NAME"; exit 2; }
            pnpm exec tsx src/cli/corpus-drift-relevance.ts classify \
              --root "$GITHUB_WORKSPACE" \
              --base "$base" \
              --head "$HEAD_SHA" \
              --ownership "$ownership" \
              --out "$receipt"
            decision=$(jq -er '.decision | select(. == "full-scan" or . == "declared-no-op")' "$receipt")
            closure_digest=$(jq -r '.closureDigest // "unavailable"' "$receipt")
            if [ "$decision" = full-scan ]; then
              relevant=true
              scope="all $target_count pinned targets; relevance receipt requires the hosted full-population backstop"
            else
              relevant=false
              target_count=0
              target_slugs='[]'
              scope="nothing assessed; exact Git change is disjoint from immutable closure $closure_digest"
            fi
          else
            decision=unconditional-full
            closure_digest=not-classified
            relevant=true
            scope="all $target_count pinned targets; $EVENT_NAME bypasses PR relevance classification"
          fi

          {
            echo "relevant=$relevant"
            echo "decision=$decision"
            echo "closure-digest=$closure_digest"
            echo "target-count=$target_count"
            echo "target-slugs=$target_slugs"
            echo "scope=$scope"
          } >> "$GITHUB_OUTPUT"
          echo "Corpus route: decision=$decision relevant=$relevant target-count=$target_count closure=$closure_digest"
          mkdir -p .harvey-corpus-relevance
          cp "$ownership" .harvey-corpus-relevance/ownership.json
          [ ! -f "$receipt" ] || cp "$receipt" .harvey-corpus-relevance/receipt.json
      - name: Retain the PR/merge-group relevance proof
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-drift-relevance
          path: .harvey-corpus-relevance
          include-hidden-files: true
          if-no-files-found: error
      - name: Materialize the one current Semgrep registry input
        if: steps.route.outputs.relevant == 'true'
        run: pnpm materialize:current-semgrep --dir .harvey-current-semgrep --out .harvey-current-semgrep/receipt.json
      - name: Retain exact registry bytes and their receipt
        if: steps.route.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: current-mechanical-semgrep-pack
          path: .harvey-current-semgrep
          include-hidden-files: true
          if-no-files-found: error

  # #1586: the scoring work, split across runners. This job is NOT the required context — a matrix
  # job's checks are named `<name> (1)`, `<name> (2)`, ... so the bare name would stop reporting and
  # deadlock every PR (#1107). The `drift` job below keeps that name and gates on these.
  #
  # SHARD COUNT VARIES BY EVENT. Main pushes and relevant PR/queue runs use four scorers, each
  # owning one canonical cache namespace. Proven-disjoint PRs/queues allocate no scorer and the
  # required aggregate declares their nothing-assessed no-op. Four-way execution replaced the main seed that timed out before
  # it could publish a complete trusted transport
  # (runs 31601042773/31602706320).
  # .github/actions/corpus-clone-cache keys on the whole 14-target pin set, and a cache key is
  # IMMUTABLE once written — its `mode: save` therefore writes only when the run holds EVERY pinned
  # clone, a guard that exists because corpus-m8 once wrote a 4-of-14 tree under that key and
  # poisoned it beyond repair by re-running. No shard holds all 17, so a sharded run can never save.
  #   * push / relevant pull_request / merge_group -> 4 disjoint, exhaustive shards.
  #   * declared-no-op pull_request / merge_group -> no shard.
  #   * schedule / workflow_dispatch -> ONE shard holding all 17, which still saves the cache and
  #     still writes the canonical `corpus-drift-scorecard` artifact that #1564's prior-snapshot
  #     fetch reads. Sharded runs merge the same complete population into the canonical artifact.
  #
  # Four, re-measured on pinned-toolchain runs 32578027739/32576123221: Carbon is an indivisible
  # 1409s, while the old three-way assignment put 1454 measured seconds plus setup on one runner and
  # hit the unchanged 30-minute timeout during Documenso. Four keeps Carbon alone and all other
  # measured shard loads below 990s. The split itself lives in src/scan/corpus-shards.ts, which
  # asserts it is exhaustive and disjoint — a target silently dropped from the partition would stop
  # being scored while every shard still exited 0.
  shard:
    name: corpus shard ${{ matrix.shard }}
    needs: prepare-current-inputs
    if: needs.prepare-current-inputs.result == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A drifted baseline in one shard must not cancel the others: the scorecard is most useful when
      # it shows everything that moved, not the first thing.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[1,2,3,4]' || '[1]') }}
    # issues: write so a scheduled failure can find-or-update its tracking issue (#1138).
    # actions: read (#1564) so `gh run download` can fetch the PRIOR run's own scorecard
    # artifact — see "Fetch prior scorecard" below.
    # contents: read is restated because a job-level block replaces (not extends) the top-level one.
    permissions:
      contents: read
      issues: write
      actions: read
    # Run 32940913828 hit 30m on the Carbon-only shard after a 1365.7s cold Semgrep phase.
    # Allow 45m for that four-way arm; retain 30m for the other shards and the distinct
    # schedule/manual all-target arm. Complete cold scoring and liveness still gate success.
    timeout-minutes: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group') && matrix.shard == 1 && 45 || 30 }}
    # The receipt both the gate CLI and .github/actions/gate-liveness read. A literal path, not
    # ${{ runner.temp }}: the `runner` context is not available in a job-level `env:` block, and
    # producer and asserter agreeing on ONE path is the whole point.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      - uses: actions/checkout@v4

      # Before the clones and installs on purpose: the drill proves the ALERT path, not the
      # corpus, so it must not pay 30 minutes to reach it. Everything below is skipped once it fails.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287): failing on purpose so the tracking-issue step runs under the real job token. This is NOT a corpus-drift failure."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Authenticate private corpus mirrors
        uses: ./.github/actions/corpus-mirror-auth
        with:
          private-key: ${{ secrets.CORPUS_MIRROR_DEPLOY_KEY }}

      # The baseline modules (M4/M5/M7/M8/M9) run on this repo's own devDependencies, but #261's
      # free-tier invariant scores a real quick-scan, whose mechanical tier shells out to these.
      # Each scanner degrades to "found nothing" without its binary rather than failing loudly —
      # which on a must-raise-an-indicator target would look like the free tier staying quiet. So
      # they are installed explicitly rather than left to chance.
      - name: Install mechanical-tier scanner binaries
        uses: ./.github/actions/mechanical-binaries

      # #1571: cache the pinned clones themselves (not the --install tree), keyed on the pin set
      # so editing a pin is a miss by construction. A restored cache is verified against every
      # pinned commit before `pnpm corpus-drift` ever reads it — see the action's own comments for
      # why a poisoned hit fails loud rather than silently rescanning fewer targets. The matching
      # `mode: save` step is at the END of this job, after the clones exist.
      - name: Corpus clone cache
        id: corpus-cache
        uses: ./.github/actions/corpus-clone-cache

      # #1864/#1871/#1872: phase/scanner artifacts and dependency-preparation receipts are
      # individually content-addressed inside this directory. Package-manager stores are
      # relocatable transport used only for an offline rematerialization into each fresh clone;
      # node_modules is never restored. The
      # outer Actions cache is only transport between runs. Cache ownership is always the canonical
      # four-way partition, even when schedule/manual uses one all-target scorer for canonical
      # scorecard/clone-cache lineage. PR/queue/push legs touch their one owner root; the single
      # scheduled/manual leg touches all four. Scope-bound keys prevent an older partition from
      # being restored into a reused numeric namespace and growing it with another owner's bytes.
      # A restored artifact is never trusted by presence:
      # corpus-drift validates its schema, key, findings, and examined-scope metadata, rejecting
      # and recomputing corrupt/incomplete entries with a visible CACHE/DEPENDENCY PREP REJECT line.
      - name: Compute canonical corpus cache ownership scopes
        id: phase-cache-scopes
        if: needs.prepare-current-inputs.outputs.relevant == 'true'
        run: pnpm exec tsx src/cli/corpus-cache-transport.ts scopes >> "$GITHUB_OUTPUT"

      - name: Restore content-addressed corpus phase results — owner 1
        id: phase-cache-1
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 1 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard1
          # Retry attempts request attempt 1's exact key. `cache-hit` below distinguishes that
          # artifact from an older rolling-prefix fallback, whose registry bytes have no lineage
          # to this run and therefore may not be reused as though they did.
          key: corpus-phase-run-v6-${{ runner.os }}-shard1-scope${{ steps.phase-cache-scopes.outputs.scope1 }}-${{ github.run_id }}-1-${{ github.sha }}

      - name: Restore content-addressed corpus phase results — owner 2
        id: phase-cache-2
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 2 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard2
          key: corpus-phase-run-v6-${{ runner.os }}-shard2-scope${{ steps.phase-cache-scopes.outputs.scope2 }}-${{ github.run_id }}-1-${{ github.sha }}

      - name: Restore content-addressed corpus phase results — owner 3
        id: phase-cache-3
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 3 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard3
          key: corpus-phase-run-v6-${{ runner.os }}-shard3-scope${{ steps.phase-cache-scopes.outputs.scope3 }}-${{ github.run_id }}-1-${{ github.sha }}

      - name: Restore content-addressed corpus phase results — owner 4
        id: phase-cache-4
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 4 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard4
          key: corpus-phase-run-v6-${{ runner.os }}-shard4-scope${{ steps.phase-cache-scopes.outputs.scope4 }}-${{ github.run_id }}-1-${{ github.sha }}

      # A PR-prefix fallback can be newer than main and shadow the trusted seed, only to be rejected
      # by provenance after restore. Separate key families make that impossible: retries get only
      # their exact current-run artifact above; all other fallback transport comes from main.
      - name: Restore trusted-main corpus phase results — owner 1
        id: main-phase-cache-1
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 1 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.phase-cache-1.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard1
          key: corpus-phase-main-v6-${{ runner.os }}-shard1-scope${{ steps.phase-cache-scopes.outputs.scope1 }}-${{ github.sha }}
          restore-keys: |
            corpus-phase-main-v6-${{ runner.os }}-shard1-scope${{ steps.phase-cache-scopes.outputs.scope1 }}-

      - name: Restore trusted-main corpus phase results — owner 2
        id: main-phase-cache-2
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 2 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.phase-cache-2.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard2
          key: corpus-phase-main-v6-${{ runner.os }}-shard2-scope${{ steps.phase-cache-scopes.outputs.scope2 }}-${{ github.sha }}
          restore-keys: |
            corpus-phase-main-v6-${{ runner.os }}-shard2-scope${{ steps.phase-cache-scopes.outputs.scope2 }}-

      - name: Restore trusted-main corpus phase results — owner 3
        id: main-phase-cache-3
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 3 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.phase-cache-3.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard3
          key: corpus-phase-main-v6-${{ runner.os }}-shard3-scope${{ steps.phase-cache-scopes.outputs.scope3 }}-${{ github.sha }}
          restore-keys: |
            corpus-phase-main-v6-${{ runner.os }}-shard3-scope${{ steps.phase-cache-scopes.outputs.scope3 }}-

      - name: Restore trusted-main corpus phase results — owner 4
        id: main-phase-cache-4
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (matrix.shard == 4 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.phase-cache-4.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache/shard4
          key: corpus-phase-main-v6-${{ runner.os }}-shard4-scope${{ steps.phase-cache-scopes.outputs.scope4 }}-${{ github.sha }}
          restore-keys: |
            corpus-phase-main-v6-${{ runner.os }}-shard4-scope${{ steps.phase-cache-scopes.outputs.scope4 }}-

      - name: Restore the run's exact shared Semgrep bytes
        if: needs.prepare-current-inputs.outputs.relevant == 'true'
        uses: actions/download-artifact@v4
        with:
          name: current-mechanical-semgrep-pack
          # Download-by-name writes the artifact's CONTENTS directly here; upload-artifact stripped
          # the `.harvey-current-semgrep` common root. Keep this immutable input outside the mutable
          # phase-cache directory, whose rejected transport is recursively cleared below.
          path: .harvey-current-semgrep

      - name: Validate the exact shared Semgrep artifact layout
        if: needs.prepare-current-inputs.outputs.relevant == 'true'
        run: pnpm materialize:current-semgrep --dir .harvey-current-semgrep --validate-only

      # Actions cache visibility is a transport boundary, not an authenticity claim. The inner
      # artifacts validate their content identities, and this manifest independently proves the
      # restored directory came from main or this exact run. A cache from another PR ref is
      # deleted visibly before any scanner can read it; a miss remains a normal recompute.
      - name: Validate corpus phase-cache transport provenance
        if: needs.prepare-current-inputs.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          for namespace in 1 2 3 4; do
            active=false
            [ "$namespace" = '${{ matrix.shard }}' ] && active=true
            if [ '${{ github.event_name }}' = schedule ] || [ '${{ github.event_name }}' = workflow_dispatch ]; then active=true; fi
            [ "$active" = true ] || continue
            case "$namespace" in
              1) matched='${{ steps.phase-cache-1.outputs.cache-matched-key || steps.main-phase-cache-1.outputs.cache-matched-key }}' ;;
              2) matched='${{ steps.phase-cache-2.outputs.cache-matched-key || steps.main-phase-cache-2.outputs.cache-matched-key }}' ;;
              3) matched='${{ steps.phase-cache-3.outputs.cache-matched-key || steps.main-phase-cache-3.outputs.cache-matched-key }}' ;;
              4) matched='${{ steps.phase-cache-4.outputs.cache-matched-key || steps.main-phase-cache-4.outputs.cache-matched-key }}' ;;
            esac
            pnpm exec tsx src/cli/corpus-cache-transport.ts restore \
              --dir ".harvey-corpus-phase-cache/shard$namespace" \
              --matched-key "$matched" \
              --event '${{ github.event_name }}' \
              --ref '${{ github.ref }}' \
              --run-id '${{ github.run_id }}' \
              --default-ref 'refs/heads/${{ github.event.repository.default_branch }}' \
              --platform '${{ runner.os }}' \
              --namespace "$namespace" \
              --head-sha '${{ github.sha }}'
          done

      # --install (#251): installs each clone's own dependency tree before the scanners — with the
      # package manager that clone's lockfile implies, since #1268 — which is what lets knip
      # resolve each target's config (CLAUDE.md's M5 prereq) — without it M5-knip scores on 2 of 6
      # targets instead of 4. It is what pushes this job past its old ~2m: six real installs.
      # #1872: the install first validates a content-addressed receipt keyed by the target tree,
      # lock/install inputs, exact package manager, Node/ABI, platform and bounded environment.
      # A hit still performs a frozen offline rematerialization from the relocatable manager store;
      # a miss/corruption performs a clean install. #1871 then keys quality-scan on that validated
      # receipt rather than hashing or restoring the checkout-bound installed tree.
      # Current producer↔replay equivalence is a population claim. A manifest-only change therefore
      # cannot narrow to its edited slug: both fresh sides must own every pinned target or the union
      # comparison would prove less than the required context says. This deliberately supersedes
      # #1498's manifest-only narrowing for relevant PRs; prose/test-only changes still short-circuit.
      - name: Declare the complete target population
        id: targets
        if: needs.prepare-current-inputs.outputs.relevant == 'true'
        run: |
          echo "scope=all" >> "$GITHUB_OUTPUT"
          echo "Scoring every target: the required current readiness comparator rejects a partial population."

      # #1564: a DRIFT line names a count moving; it does not say WHICH findings moved,
      # and both 2026-07-30 incidents this closes (carbon M7 -1, M5-slop -653) were resolved only by
      # a human cloning the target and diffing by hand. corpus-drift.ts's --baseline-findings flag
      # turns that into a real added/removed row list — but it needs a PRIOR run's own --json
      # output to diff against, never a second scan. Every run now writes one (the `findings` key
      # alongside `rows`, see corpus-drift.ts), so the source is just YESTERDAY's own scorecard
      # artifact, fetched here and never a fresh clone-and-scan.
      #
      # Fail-open, in the safe direction: no prior successful run (first-ever run), an expired
      # artifact, or a `gh` hiccup all fall through to "not found" rather than failing the job —
      # corpus-drift.ts already handles a missing/partial prior snapshot by disclosing the fallback
      # (naming the module's CURRENT findings) rather than staying silent, so the worst case here is
      # a less detailed explanation, never a broken run.
      - name: Fetch prior scorecard for --baseline-findings (#1564)
        if: needs.prepare-current-inputs.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior-drift
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow=corpus-drift.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -z "$run_id" ]; then
            echo "No prior successful corpus-drift run found — proceeding without a baseline snapshot."
            exit 0
          fi
          if gh run download "$run_id" --repo "${{ github.repository }}" -n corpus-drift-scorecard -D prior-drift 2>/dev/null; then
            echo "Downloaded the corpus-drift-scorecard artifact from run $run_id."
          else
            echo "Run $run_id has no corpus-drift-scorecard artifact (expired, or that run errored before uploading) — proceeding without it."
          fi

      - name: Score the corpus against its baselines
        id: score
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill
        env:
          HARVEY_CORPUS_CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
          HARVEY_CORPUS_PHASE_CACHE_DIR: .harvey-corpus-phase-cache
          HARVEY_SEMGREP_REGISTRY_SNAPSHOT_DIR: .harvey-current-semgrep
          # `prepare-current-inputs` fetched these exact six YAML files once for the whole run.
          # Producers are reuse-only: no shard may race the live registry independently.
          HARVEY_SEMGREP_REGISTRY_SNAPSHOT_MODE: reuse
          # Main-push runs measure Harvey against immutable external inputs so producer/replay
          # equivalence has one frozen boundary. The daily/manual lane uses current providers and
          # compares live OSV bytes with the committed snapshot;
          # client audit CLIs do not set this corpus-only variable and keep their live defaults.
          HARVEY_CORPUS_EXTERNAL_STATE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'live-verify' || 'snapshot' }}
          HARVEY_CURRENT_MECHANICAL_READINESS: ${{ github.event_name == 'push' && '1' || '0' }}
          SHARD: ${{ matrix.shard }}
          # Match the producer matrix: four on push/relevant PR/queue; one on schedule/manual.
          # A cache miss still recomputes within the same exhaustive partition.
          SHARD_COUNT: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group') && 4 || 1 }}
        run: |
          set -euo pipefail
          cold_flag=()
          if [ "${{ inputs.force_cold_cache }}" = "true" ]; then
            cold_flag=(--force-cold-cache)
            echo "Explicit forced-cold cache equivalence is enabled: every deterministic phase must compare with a restored artifact. Daily live-provider validation is warm."
          fi
          # A single-shard run writes the CANONICAL name: it is the one whose artifact #1564's
          # prior-snapshot fetch consumes, and the aggregate job below reassembles the sharded case
          # into that same name so the lineage is unbroken either way.
          out="corpus-drift.json"
          [ "$SHARD_COUNT" != "1" ] && out="corpus-drift-shard$SHARD.json"
          # An array, not a string: an empty baseline_flag expands to zero arguments and a populated
          # one carries its flag and path as separate words without shell splitting.
          baseline_flag=()
          [ -f prior-drift/corpus-drift.json ] && baseline_flag=(--baseline-findings prior-drift/corpus-drift.json)
          pnpm corpus-drift --install --shard "$SHARD/$SHARD_COUNT" --json "$out" "${baseline_flag[@]}" "${cold_flag[@]}"

      - name: Measure content-addressed cache size
        if: always() && steps.phase-cache-scopes.outcome == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill
        run: |
          set -euo pipefail
          for namespace in 1 2 3 4; do
            dir=".harvey-corpus-phase-cache/shard$namespace"
            [ -d "$dir" ] || continue
            bytes=$(du -sk "$dir" | awk '{print $1 * 1024}')
            receipts=0
            if [ -d "$dir/dependency-preparation/receipts" ]; then
              receipts=$(find "$dir/dependency-preparation/receipts" -type f -name '*.json' | wc -l)
            fi
            echo "CORPUS CACHE OWNER $namespace SIZE: ${bytes} bytes; dependency preparation receipts: ${receipts}; node_modules is rematerialized per disposable clone and is not in this transport."
          done

      - name: Record corpus phase-cache transport provenance
        if: success() && steps.score.outcome == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && (steps.targets.outputs.scope == 'all' || matrix.shard == 1)
        run: |
          set -euo pipefail
          for namespace in 1 2 3 4; do
            active=false
            [ "$namespace" = '${{ matrix.shard }}' ] && active=true
            if [ '${{ github.event_name }}' = schedule ] || [ '${{ github.event_name }}' = workflow_dispatch ]; then active=true; fi
            [ "$active" = true ] || continue
            pnpm exec tsx src/cli/corpus-cache-transport.ts save \
              --dir ".harvey-corpus-phase-cache/shard$namespace" \
              --event '${{ github.event_name }}' \
              --ref '${{ github.ref }}' \
              --run-id '${{ github.run_id }}' \
              --run-attempt '${{ github.run_attempt }}' \
              --head-sha '${{ github.sha }}' \
              --platform '${{ runner.os }}' \
              --family '${{ github.event_name == 'push' && 'main' || 'run' }}' \
              --namespace "$namespace"
          done

      - name: Save current-run corpus phase results for an exact retry — owner 1
        if: success() && steps.score.outcome == 'success' && github.event_name != 'push' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && (matrix.shard == 1 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard1
          key: corpus-phase-run-v6-${{ runner.os }}-shard1-scope${{ steps.phase-cache-scopes.outputs.scope1 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Save current-run corpus phase results for an exact retry — owner 2
        if: success() && steps.score.outcome == 'success' && github.event_name != 'push' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && (matrix.shard == 2 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard2
          key: corpus-phase-run-v6-${{ runner.os }}-shard2-scope${{ steps.phase-cache-scopes.outputs.scope2 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Save current-run corpus phase results for an exact retry — owner 3
        if: success() && steps.score.outcome == 'success' && github.event_name != 'push' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && (matrix.shard == 3 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard3
          key: corpus-phase-run-v6-${{ runner.os }}-shard3-scope${{ steps.phase-cache-scopes.outputs.scope3 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Save current-run corpus phase results for an exact retry — owner 4
        if: success() && steps.score.outcome == 'success' && github.event_name != 'push' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && (matrix.shard == 4 || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard4
          key: corpus-phase-run-v6-${{ runner.os }}-shard4-scope${{ steps.phase-cache-scopes.outputs.scope4 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      # Only a successful default-branch shard can publish a trusted rolling seed. A cancelled,
      # timed-out, drifted or setup-failed leg never reaches this step and cannot shadow the prior
      # trusted key. Each matrix leg writes only its own namespace.
      - name: Save successful main-shard corpus phase results — owner 1
        if: success() && steps.score.outcome == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard1
          key: corpus-phase-main-v6-${{ runner.os }}-shard1-scope${{ steps.phase-cache-scopes.outputs.scope1 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Save successful main-shard corpus phase results — owner 2
        if: success() && steps.score.outcome == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.shard == 2
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard2
          key: corpus-phase-main-v6-${{ runner.os }}-shard2-scope${{ steps.phase-cache-scopes.outputs.scope2 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Save successful main-shard corpus phase results — owner 3
        if: success() && steps.score.outcome == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.shard == 3
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard3
          key: corpus-phase-main-v6-${{ runner.os }}-shard3-scope${{ steps.phase-cache-scopes.outputs.scope3 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Save successful main-shard corpus phase results — owner 4
        if: success() && steps.score.outcome == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.shard == 4
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache/shard4
          key: corpus-phase-main-v6-${{ runner.os }}-shard4-scope${{ steps.phase-cache-scopes.outputs.scope4 }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      # #1571: the ONLY place the pin-set cache key is written, and only when this run actually
      # cloned every pinned target — the action re-reads the tree and refuses otherwise. corpus-m8
      # and each PR shard own only subsets, so they restore but never save; this stops a partial tree
      # from claiming the whole-population key
      # and locking every later run out of it (a cache key is immutable once written).
      #
      # `always()` is safe HERE precisely because the guard reads the CLONE TREE rather than the job
      # status: the common failure of this job is a real baseline drift, on which all fourteen
      # clones are present and pristine and the cache is worth warming. A failure that left the set
      # incomplete reports complete=false and writes nothing. The `outcome == 'success'` clause only
      # keeps this from adding a second, confusing red step on a job that died before setup
      # finished (no pnpm, so no pin file to check the tree against).
      - name: Save the corpus clone cache
        if: always() && steps.corpus-cache.outcome == 'success'
        uses: ./.github/actions/corpus-clone-cache
        with:
          mode: save

      # The scorecard is the artifact worth keeping on a failure: it's the per-module, per-target
      # table showing exactly what moved. Skipped on a declared no-op, where there is no scorecard
      # and `if-no-files-found: warn` would hang an annotation on an otherwise clean required check.
      # #1586: artifact names must be unique within a run, so a sharded run uploads per-shard parts
      # and the aggregate job below merges them back into `corpus-drift-scorecard`. A single-shard
      # run (schedule/dispatch) writes that canonical name directly, so nothing about the
      # prior-snapshot lineage changes on the path that feeds it.
      - name: Upload drift scorecard
        if: always() && needs.prepare-current-inputs.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('corpus-drift-scorecard-part-{0}', matrix.shard) || 'corpus-drift-scorecard' }}
          path: corpus-drift*.json
          if-no-files-found: warn

      # #1509: this job failed at SETUP for days (the poisoned pipx cache) and reported nothing a
      # reader could tell apart from "ran and found no drift", while PR #1447 merged on three green
      # required checks. `pnpm corpus-drift` writes a receipt AFTER it scores; without that record
      # this step fails naming the phase that never ran. `always()` so it still reports when an
      # earlier step already failed — that is exactly the case it exists to explain. Excluded on the
      # alert drill, which fails on purpose before anything is scored. Proven-disjoint runs never
      # allocate this job; their nothing-assessed receipt is asserted by the required aggregate.
      - name: Gate liveness — did this job actually score anything?
        if: always() && !inputs.alert_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: corpus-drift

  # A separate post-merge process and clone/preparation path. It consumes the exact pack artifact
  # but no hosted phase artifacts, so the final comparison is not the scorecard comparing with
  # itself. It runs beside the main-push producer matrix; PR and merge-group events skip it.
  current-replay:
    needs: prepare-current-inputs
    if: needs.prepare-current-inputs.result == 'success' && github.event_name == 'push'
    name: current independent replay ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install mechanical-tier scanner binaries
        uses: ./.github/actions/mechanical-binaries
      - name: Authenticate private corpus mirrors
        uses: ./.github/actions/corpus-mirror-auth
        with:
          private-key: ${{ secrets.CORPUS_MIRROR_DEPLOY_KEY }}
      - name: Corpus clone cache
        id: corpus-cache
        uses: ./.github/actions/corpus-clone-cache
      - name: Restore the run's exact shared Semgrep bytes
        uses: actions/download-artifact@v4
        with:
          name: current-mechanical-semgrep-pack
          path: .harvey-current-semgrep
      - name: Validate the exact shared Semgrep artifact layout
        run: pnpm materialize:current-semgrep --dir .harvey-current-semgrep --validate-only
      - name: Execute the independent exact-head replay
        env:
          HARVEY_CORPUS_CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
          SHARD_COUNT: 4
        run: pnpm replay:current-mechanical --shard "${{ matrix.shard }}/$SHARD_COUNT" --registry-dir .harvey-current-semgrep --out "current-replay-${{ matrix.shard }}.json"
      - name: Upload independent raw replay
        uses: actions/upload-artifact@v4
        with:
          name: current-mechanical-replay-part-${{ matrix.shard }}
          path: current-replay-${{ matrix.shard }}.json
          if-no-files-found: error

  # #1586: THE REQUIRED CONTEXT. Branch protection on `main` names this job, so it must keep this
  # exact name and must report on every PR — a required context that stops reporting deadlocks every
  # pull request (#1107), which is the failure mode this whole shape has to avoid. It carries no
  # scoring of its own: it gates on the shard matrix and reassembles its parts.
  #
  # `if: always()` so it still reports when a shard failed — a required check that silently vanishes
  # on failure is indistinguishable to branch protection from one that never ran.
  drift:
    name: clone pinned commits + score baselines
    needs: [prepare-current-inputs, shard, current-replay]
    if: always()
    runs-on: ubuntu-latest
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Shared preparation and relevance classification must have succeeded
        run: |
          set -euo pipefail
          if [ '${{ needs.prepare-current-inputs.result }}' != success ]; then
            echo "::error::corpus-drift relevance/shared-input preparation reported '${{ needs.prepare-current-inputs.result }}'; a missing or malformed classifier receipt can never become a green no-op."
            exit 1
          fi
          echo "Corpus route: decision=${{ needs.prepare-current-inputs.outputs.decision }} relevant=${{ needs.prepare-current-inputs.outputs.relevant }} closure=${{ needs.prepare-current-inputs.outputs.closure-digest }}"

      # A no-op is a machine conclusion from the exact immutable closure, never an event policy.
      # It says nothing was assessed and carries the classifier digest a reviewer can retrieve.
      - name: Declare the proven-disjoint no-op
        if: needs.prepare-current-inputs.result == 'success' && needs.prepare-current-inputs.outputs.relevant != 'true'
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: corpus-drift
          status: declared-no-op
          scope: "${{ needs.prepare-current-inputs.outputs.scope }}; decision=${{ needs.prepare-current-inputs.outputs.decision }}; relevance artifact closure=${{ needs.prepare-current-inputs.outputs.closure-digest }}. This is not evidence that any external target was clean."

      # `needs.<matrix-job>.result` is the AGGREGATE over every leg: 'success' only when all of them
      # succeeded. Anything else — a real baseline drift, a died-in-setup shard, a cancellation — is
      # a red required check, exactly as the single job behaved before it was split.
      - name: Every required corpus execution must have succeeded
        if: needs.prepare-current-inputs.result == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          result='${{ needs.shard.result }}'
          echo "shard matrix aggregate result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::corpus-drift: the shard matrix reported '$result'. A baseline drifted, or a shard errored before it could score. Open the individual 'corpus shard N' jobs and the corpus-drift-scorecard artifact. For a counted drift, remeasure the complete matching/loading/resolution/reachability/invocation blast radius before changing baselines; see docs/design/corpus-drift.md."
            exit 1
          fi
          if [ '${{ github.event_name }}' = 'push' ] \
            && [ '${{ needs.current-replay.result }}' != 'success' ]; then
            echo "::error::the independent current replay matrix did not succeed"
            exit 1
          fi
          echo "Every shard succeeded."

      - name: Record the measured full-population outcome
        if: needs.prepare-current-inputs.result == 'success' && needs.prepare-current-inputs.outputs.relevant == 'true' && needs.shard.result == 'success'
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: corpus-drift
          units: ${{ needs.prepare-current-inputs.outputs.target-count }}
          status: measured
          scope: "${{ needs.prepare-current-inputs.outputs.scope }}; every selected shard completed"

      - name: Gate liveness — did this required context declare its outcome?
        if: always()
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: corpus-drift

      # The always-running aggregate is the single alert owner. Keeping this after both the shared
      # preparation guard and the shard-result guard means a genuine schedule reports setup failures
      # as well as counted drift, without duplicate comments from matrix legs. Ordinary manual runs
      # are evidence campaigns, not scheduled alarms; only the isolated alert drill may exercise the
      # workflow_dispatch path. A liveness drill never opens either namespace.
      - name: Open or update the drift tracking issue
        if: failure() && !inputs.liveness_drill && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.alert_drill))
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-corpus-drift-alert
          label-description: Auto-opened when the scheduled corpus-drift CI run fails
          title: corpus-drift scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled `corpus-drift` run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). A counted drift or setup failure needs classification before any baseline edit: remeasure the complete matching/loading/resolution/reachability/invocation blast radius, then distinguish incomplete population, precision fix, real regression, and setup failure. See the corpus-drift-scorecard artifact and docs/design/corpus-drift.md; close this issue once the owning fix and full-population rerun are green."

      # Reassemble push/relevant-PR/queue parts into the canonical scorecard. Schedule/manual
      # already upload that name directly; a proven no-op retains only relevance evidence.
      - name: Collect the shard scorecards
        id: parts
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: corpus-drift-scorecard-part-*
          merge-multiple: true
          path: parts

      - name: Collect the independent replay parts
        id: replay-parts
        if: github.event_name == 'push'
        uses: actions/download-artifact@v4
        with:
          pattern: current-mechanical-replay-part-*
          merge-multiple: true
          path: replay-parts

      # The shards are disjoint by construction (src/scan/corpus-shards.ts asserts the partition is
      # exhaustive and non-overlapping), so `rows` concatenates and the `findings` maps merge with no
      # key collisions. Validate the exact four files and their complete live target population
      # before writing any canonical scorecard; a missing artifact is not a valid short-circuit.
      - name: Merge the shard scorecards into corpus-drift.json
        id: merge
        if: needs.prepare-current-inputs.outputs.relevant == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          EXPECTED_TARGET_SLUGS: ${{ needs.prepare-current-inputs.outputs.target-slugs }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(parts/corpus-drift-shard*.json)
          expected_parts=(parts/corpus-drift-shard{1..4}.json)
          if [ "${#parts[@]}" -ne 4 ] || [ "${parts[*]}" != "${expected_parts[*]}" ]; then
            echo "::error::expected exactly corpus-drift-shard1.json through corpus-drift-shard4.json; refusing an incomplete or extra producer population"
            exit 1
          fi
          jq -e -s --argjson expected "$EXPECTED_TARGET_SLUGS" '
            ($expected | type == "array" and length > 0 and all(.[]; type == "string" and length > 0)) and
            (($expected | sort) == ($expected | unique)) and
            all(.[];
              (.rows | type == "array" and length > 0) and
              (.findings | type == "object" and length > 0) and
              (.detectors | type == "object") and
              (.mechanicalContexts | type == "object") and
              (.findings | all(.[]; type == "array")) and
              (.findings | keys) as $slugs |
              ([.rows[].slug] | unique) == $slugs and
              (.detectors | keys) == $slugs and
              (.mechanicalContexts | keys) == $slugs
            ) and
            ([.[].findings | keys[]] | sort) == ($expected | sort)
          ' "${parts[@]}" > /dev/null || {
            echo "::error::producer scorecard parts do not preserve the exact live target population and per-target evidence maps"
            exit 1
          }
          echo "Merging ${#parts[@]} shard scorecard(s): ${parts[*]}"
          jq -s '{
            rows: (map(.rows) | add),
            findings: (map(.findings) | add),
            detectors: (map(.detectors) | add),
            mechanicalContexts: (map(.mechanicalContexts) | add)
          }' "${parts[@]}" > corpus-drift.json
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Merged scorecard: $(jq '.rows | length' corpus-drift.json) rows over $(jq '.findings | keys | length' corpus-drift.json) target(s)."

      - uses: actions/checkout@v4
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'push'
        with:
          path: source
      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'push'
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'push'
        with:
          node-version-file: source/.nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'push'
        working-directory: source
      - name: Current registry producer ↔ independent replay equivalence/readiness
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'push'
        run: |
          set -euo pipefail
          producer_parts=(../parts/corpus-drift-shard*.json)
          replay_parts=(../replay-parts/current-replay-*.json)
          for part in "${producer_parts[@]}"; do jq -e '.currentMechanicalExecution' "$part" > "$part.current.json"; done
          printf -v producer_csv '%s,' "${producer_parts[@]/%/.current.json}"
          producer_csv=${producer_csv%,}
          printf -v replay_csv '%s,' "${replay_parts[@]}"
          replay_csv=${replay_csv%,}
          pnpm validate:current-mechanical-readiness --merge "$producer_csv" --out ../current-hosted-producer.json
          pnpm validate:current-mechanical-readiness --merge "$replay_csv" --out ../current-independent-replay.json
          pnpm validate:current-mechanical-readiness --producer ../current-hosted-producer.json --replay ../current-independent-replay.json
          echo "This proves two fresh current registry executions agree. It is NOT #1851.6/.7 historical manual→registry proof; #1886 remains open and exclusive."
        working-directory: source

      - name: Upload the merged drift scorecard
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-drift-scorecard
          path: |
            corpus-drift.json
            current-hosted-producer.json
            current-independent-replay.json
          if-no-files-found: error
