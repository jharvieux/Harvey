# Layer 2 for the external-repo regression corpus (#222/#263). Clones every PUBLIC target at its
# pinned commit, re-runs the source-tier modules, and scores the result against the recorded
# baselines. (This header said "six" until 2026-07-30; the manifest has grown since — count it,
# don't quote it: `pnpm corpus-pins --out /tmp/pins.txt && wc -l /tmp/pins.txt` for the current count.)
#
# Why this is NOT part of `pnpm verify` (the required per-PR check): it needs network to clone every
# pinned repo and external binaries (semgrep/trufflehog/osv-scanner) to run the mechanical tier. `verify`
# stays deterministic and offline so it's fast and never flakes on someone else's infrastructure;
# Layer 1 (src/scan/external-corpus.test.ts) covers the scorers there.
#
# Scheduled AND per-PR: the targets are frozen at a commit, so nothing changes between runs except
# OUR scanners. Daily (was weekly until #1138) shrinks the drift-accumulation window from 7 days to
# 1 — the systemic fix behind #1128, where 12 baselines drifted unseen for up to a week.
# workflow_dispatch is for checking a scanner change on demand. A scheduled failure find-or-updates
# a tracking issue (label ci-corpus-drift-alert) so red on this branch that nobody watches can't be
# scrolled past.
#
# BECOMING A REQUIRED STATUS CHECK on `main` (operator-approved 2026-07-30). "Not required" is not
# "not important": this job died at SETUP for days (#1509's poisoned pipx cache) and PR #1447 merged
# on three green required checks while the gate measuring its blast radius had never executed — 653
# M5-slop findings silently suppressed and a live regression on `main`.
#
# Being required is why this workflow has NO `paths:` filter on `pull_request` any more. GitHub
# waits forever for a required context that never reports, so a path-filtered required check
# deadlocks every PR outside its filter (#1107, and gotcha 5 on #1379). The filter moved INSIDE the
# job (the `filter` step below), same shape conservation.yml and dry-run-drift.yml already use: the
# job always runs and always reports, and only the expensive work is conditional.
#
# THE RELEVANCE RULE IS A DENY-LIST, NOT AN ALLOW-LIST — and that polarity is the point. The old
# three-path `pull_request` filter (src/scan/external-corpus.ts, src/cli/corpus-drift.ts, this file)
# was scoped for an advisory check and is far too narrow to gate a merge: what a corpus baseline
# scores is the OUTPUT OF THE SCANNERS, so a change to any detector, rule, taxonomy or scan helper
# moves a baseline without touching one of those three files. Enumerating the reachable set would be
# a transitive-import guess that decays silently — exactly the failure this promotion exists to
# prevent — so the job instead names the directories it can show are UNREACHABLE from clone →
# detect-static/quality-scan/mutation-scan/quick-scan → score, and treats everything else as
# relevant. FAIL OPEN: an unknown path scores. A false "relevant" costs ~23 minutes; a false "not
# relevant" is a silently unscored regression.
#
# On failure: the job names the module and target that drifted. A drift is EITHER an intended
# precision fix — rebaseline that target in src/scan/external-corpus.ts with the measured note —
# OR a regression, which is a scanner bug to fix. It is never something to silence.
#
# M8 mutation scoring is NOT this job's work (#470): no Stryker is provisioned here, corpus-drift
# invokes mutation-scan --detect-only (suite-absent finding only), and each mutation-baseline
# target gets an explicit "deferred to corpus-m8.yml" row. So this job goes green when M8's
# mutation tier can't run here — while a real M4/M5/M7/M9/M10 baseline drift still fails it.

name: corpus-drift

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC (#1138: was weekly "0 7 * * 1")
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-corpus-drift-alert path fires end-to-end (#1287). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509). SKIPS the scoring step, leaving a job every one of whose steps succeeds — the guard is then the only thing that can turn it red."
        type: boolean
        default: false
  pull_request:
  # #1867: the default branch is the only Actions-cache scope every PR can read. A push after
  # merge therefore runs the full corpus once in seeding mode; scheduled/dispatch runs remain the
  # forced-cold freshness/parity lane below. The required aggregate context still reports on every
  # PR because pull_request remains unconditional.
  push:
    branches: [main]
  # #1498: merge queue. Without this the required context never reports on a queue entry and the
  # queue deadlocks — a lesson already learned twice in these same workflows. The relevance filter
  # below sets relevant=true on any non-`pull_request` event, so a queue entry scores for real.
  merge_group:

# A scheduled drift check has no reason to run twice concurrently, and a re-dispatch means the
# newer run is the interesting one. Safe on a required check: a cancellation here is only ever
# caused by a NEWER run on the same `github.ref` — for a PR that is `refs/pull/N/merge`, so the
# superseding run reports against the newer head commit, which is the commit branch protection
# actually evaluates. A `cancelled` conclusion is therefore never the latest result for the head
# SHA and cannot strand a merge. (Same posture dry-run-drift.yml and ci.yml already take.)
concurrency:
  group: corpus-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # #1586: the scoring work, split across runners. This job is NOT the required context — a matrix
  # job's checks are named `<name> (1)`, `<name> (2)`, ... so the bare name would stop reporting and
  # deadlock every PR (#1107). The `drift` job below keeps that name and gates on these.
  #
  # SHARD COUNT VARIES BY EVENT, and the reason is the clone cache's key contract, not taste.
  # .github/actions/corpus-clone-cache keys on the whole 14-target pin set, and a cache key is
  # IMMUTABLE once written — its `mode: save` therefore writes only when the run holds EVERY pinned
  # clone, a guard that exists because corpus-m8 once wrote a 4-of-14 tree under that key and
  # poisoned it beyond repair by re-running. No shard holds all 14, so a sharded run can never save.
  #   * pull_request / merge_group -> 3 shards. Wall clock is what matters here, and this path
  #     already restores-without-saving today under #1498's narrowing, so nothing is lost.
  #   * schedule / workflow_dispatch -> ONE shard holding all 14, which still saves the cache and
  #     still writes the canonical `corpus-drift-scorecard` artifact that #1564's prior-snapshot
  #     fetch reads. The baseline lineage flows through the daily run, never through a PR's shard.
  #
  # Three, from the per-target cost measured in #1586 (runs 30584074986 and 30588890377, in
  # agreement): carbon is 564-587s of a ~1290s total and is indivisible, so the longest shard is
  # carbon's own and a 4th shard buys nothing. The split itself lives in src/scan/corpus-shards.ts,
  # which asserts it is exhaustive and disjoint — a target silently dropped from the partition would
  # stop being scored while every shard still exited 0.
  shard:
    name: corpus shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # A drifted baseline in one shard must not cancel the others: the scorecard is most useful when
      # it shows everything that moved, not the first thing.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[1,2,3]' || '[1]') }}
    # issues: write so a scheduled failure can find-or-update its tracking issue (#1138).
    # actions: read (#1564) so `gh run download` can fetch the PRIOR run's own scorecard
    # artifact — see "Fetch prior scorecard" below.
    # contents: read is restated because a job-level block replaces (not extends) the top-level one.
    permissions:
      contents: read
      issues: write
      actions: read
    # 30m still holds with #251's six per-target installs added: measured locally they total ~1m
    # (largest: proposit's 1010 packages in 33s), and CI's cold npm cache is the slack this covers.
    # M8's mutation runs are what genuinely didn't fit here — those are corpus-m8.yml.
    timeout-minutes: 30
    # The receipt both the gate CLI and .github/actions/gate-liveness read. A literal path, not
    # ${{ runner.temp }}: the `runner` context is not available in a job-level `env:` block, and
    # producer and asserter agreeing on ONE path is the whole point.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      # fetch-depth: 0 so the two diff-reading steps below can reach the PR base. MEASURED
      # 2026-07-30 on run 30569519496: at the default depth 1 the #1498 narrowing step printed
      # `fatal: bad object <base.sha>` and fell open to "Empty diff — scoring every target" on EVERY
      # pull request, so the per-target narrowing it added has never once applied. The relevance
      # filter reads the same diff and would have degraded the same way — permanently relevant, the
      # short-circuit unreachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the six clones and installs on purpose: the drill proves the ALERT path, not the
      # corpus, so it must not pay 30 minutes to reach it. Everything below is skipped once it fails.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287): failing on purpose so the tracking-issue step runs under the real job token. This is NOT a corpus-drift failure."
          exit 1

      # The `paths:` filter that used to live on the `pull_request` trigger, moved in-job so this
      # context reports on EVERY PR (see the header note on the #1107 deadlock).
      #
      # A DENY-LIST, deliberately inverted from conservation.yml's allow-list, because the two jobs
      # have opposite reachability: conservation names a short pipeline it can enumerate, while a
      # corpus baseline scores the output of the whole scanner tree, which is nearly all of `src/`.
      # So this lists only what it can show is UNREACHABLE from clone → detect-static / quality-scan
      # / mutation-scan / quick-scan → scoreExternalBaseline, and everything else — src/**,
      # targets/**, tools/**, briefs/**, package.json, pnpm-lock.yaml, the root tool configs
      # (.jscpd.json, knip.json — the scanner CLIs run with cwd=repoRoot, so they are live inputs),
      # and any path nobody has classified yet — is RELEVANT. `case` patterns, not pathspecs: in
      # `case` a `*` matches `/` too, so `docs/*` covers the whole subtree.
      #
      # The two forced-relevant entries come first because `.github/*` below would otherwise swallow
      # them: this workflow itself, and `.github/actions/**` (mechanical-binaries provisions the
      # scanner binaries the free-tier invariant shells out to; gate-liveness is this job's own
      # receipt machinery).
      #
      # Schedule, workflow_dispatch and merge_group always run the full job. A merge-queue entry is
      # the last gate before `main` and its diff is the whole batch, so it scores rather than
      # inheriting any PR's verdict.
      - id: filter
        name: Does this change set touch anything that can move a corpus baseline?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD || true)
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "manifest_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not read the diff — scoring everything. A narrowing that cannot see the change set must cost time, never coverage."
            exit 0
          fi
          # manifest_only feeds the #1498 per-target narrowing below: it may fire ONLY when the
          # manifest is the sole relevant edit. A PR that touches the manifest AND a detector must
          # score every target — the detector can move a baseline the changed slugs don't name.
          relevant=false
          manifest_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/scan/external-corpus.ts) relevant=true ;;
              .github/workflows/corpus-drift.yml|.github/actions/*) relevant=true; manifest_only=false ;;
              # .agents/* and AGENTS.md are the Codex-side mirrors of .claude/** and CLAUDE.md
              # (tracked by #1578). Read by no part of the clone-and-score pipeline, exactly like the
              # Claude-side originals two entries along. #1584: they were missing from this list, so a
              # PR touching only them fell through to *) and paid a full 22m12s score (run
              # 30584074986) while the equivalent CLAUDE.md-only PR short-circuited (run 30585661475).
              .agents/*|.claude/*|.github/*|breadth-sweep/*|docs/*|epic-builder-web/*|intake-site/*|report-template/*|reports/*|site/*) ;;
              AGENTS.md|CLAUDE.md|README.md|SESSION.md) ;;
              # Test modules are never imported by the production scanner graph. Keep unknown
              # production src/** fail-open below, while a focused test-only edit (PR #1860's
              # sync-stdio.test.ts case) declares a no-op instead of spending the carbon shard.
              src/*.test.ts) ;;
              *) relevant=true; manifest_only=false ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "manifest_only=$manifest_only" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "false" ]; then
            echo "Every changed path is prose, site or agent-config — none of it is read by the clone-and-score pipeline, so no baseline can have moved from this PR. The daily scheduled run covers the tree regardless."
          fi

      # #1509: a short-circuited job and a job that died in setup are both "nothing was scored", and
      # from outside they look identical — which is how #1447 merged past a gate that had never run.
      # The no-op is DECLARED, with its reason, so the assert step at the end can pass it while
      # printing something a reader cannot mistake for a scoring run.
      - name: Declare the no-op (a short-circuit must not read like a scoring run)
        if: steps.filter.outputs.relevant != 'true'
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: corpus-drift
          status: declared-no-op
          scope: "in-job filter found no changed path that the clone-and-score pipeline reads — every one is prose, site or agent config, so no corpus baseline can have moved from this PR. Nothing was cloned and nothing was scored; this run is evidence about nothing. The daily scheduled run covers the tree regardless."

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.relevant == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.relevant == 'true'

      - name: Authenticate private corpus mirrors
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/corpus-mirror-auth
        with:
          private-key: ${{ secrets.CORPUS_MIRROR_DEPLOY_KEY }}

      # The baseline modules (M4/M5/M7/M8/M9) run on this repo's own devDependencies, but #261's
      # free-tier invariant scores a real quick-scan, whose mechanical tier shells out to these.
      # Each scanner degrades to "found nothing" without its binary rather than failing loudly —
      # which on a must-raise-an-indicator target would look like the free tier staying quiet. So
      # they are installed explicitly rather than left to chance.
      - name: Install mechanical-tier scanner binaries
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/mechanical-binaries

      # #1571: cache the pinned clones themselves (not the --install tree), keyed on the pin set
      # so editing a pin is a miss by construction. A restored cache is verified against every
      # pinned commit before `pnpm corpus-drift` ever reads it — see the action's own comments for
      # why a poisoned hit fails loud rather than silently rescanning fewer targets. The matching
      # `mode: save` step is at the END of this job, after the clones exist.
      - name: Corpus clone cache
        id: corpus-cache
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/corpus-clone-cache

      # #1864: phase artifacts are individually content-addressed inside this directory. The
      # outer Actions cache is only transport between runs; its per-shard rolling key avoids
      # concurrent matrix legs overwriting one another. Scheduled/manual runs retain one all-target
      # shard; a main push promotes that complete directory into all three namespaces PRs consume.
      # A restored artifact is never trusted by presence:
      # corpus-drift validates its schema, key, findings, and examined-scope metadata, rejecting
      # and recomputing corrupt/incomplete entries with a visible CACHE REJECT line.
      - name: Restore content-addressed corpus phase results
        id: phase-cache
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache
          # Retry attempts request attempt 1's exact key. `cache-hit` below distinguishes that
          # artifact from an older rolling-prefix fallback, whose registry bytes have no lineage
          # to this run and therefore may not be reused as though they did.
          key: corpus-phase-v4-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt > 1 && 1 || github.run_attempt }}-${{ github.sha }}
          restore-keys: |
            corpus-phase-v4-${{ runner.os }}-shard${{ matrix.shard }}-

      # Actions cache visibility is a transport boundary, not an authenticity claim. The inner
      # artifacts validate their content identities, and this manifest independently proves the
      # restored directory came from main or this exact run. A cache from another PR ref is
      # deleted visibly before any scanner can read it; a miss remains a normal recompute.
      - name: Validate corpus phase-cache transport provenance
        id: phase-cache-transport
        if: steps.filter.outputs.relevant == 'true'
        run: |
          pnpm exec tsx src/cli/corpus-cache-transport.ts restore \
            --dir .harvey-corpus-phase-cache \
            --matched-key '${{ steps.phase-cache.outputs.cache-matched-key }}' \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --default-ref 'refs/heads/${{ github.event.repository.default_branch }}' \
            --platform '${{ runner.os }}' \
            --namespace '${{ matrix.shard }}' \
            --head-sha '${{ github.sha }}'

      # --install (#251): installs each clone's own dependency tree before the scanners — with the
      # package manager that clone's lockfile implies, since #1268 — which is what lets knip
      # resolve each target's config (CLAUDE.md's M5 prereq) — without it M5-knip scores on 2 of 6
      # targets instead of 4. It is what pushes this job past its old ~2m: six real installs.
      # #1498: on a PULL REQUEST whose ONLY relevant edit is the manifest, score just the targets
      # whose baselines the diff actually touches.
      #
      # MEASURED 2026-07-28: this job ran 37 times on pull requests that day against ONE scheduled
      # run, ~23 minutes each — roughly 14 hours of runner time. Six separate batches edited
      # src/scan/external-corpus.ts, and every one re-cloned and re-installed all 13 pinned repos to
      # re-score the one or two baselines it had changed.
      #
      # The full sweep is NOT weakened: it still runs on the daily schedule, on workflow_dispatch,
      # on a merge-queue entry and on any PR that touches a scanner. What narrows is only the
      # manifest-only edit, where the changed slugs ARE the change.
      #
      # FAIL-OPEN BY DESIGN, in the safe direction: if anything besides the manifest was touched, if
      # the diff cannot be read, or if no slug can be attributed, this scores EVERYTHING. A narrowing
      # that guesses wrong must cost time, never coverage.
      - name: Which targets does this diff touch?
        id: targets
        if: steps.filter.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"; echo "Not a PR — scoring every target."; exit 0
          fi
          if [ "${{ steps.filter.outputs.manifest_only }}" != "true" ]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"; echo "This PR touches more than the manifest — a scanner change can move a baseline the changed slugs don't name, so scoring every target."; exit 0
          fi
          # Attribute changed lines to slugs: every target block opens with `slug: "<name>"`, so the
          # nearest preceding slug above a changed line is that line's target.
          slugs=$(git diff -U0 '${{ github.event.pull_request.base.sha }}' HEAD -- src/scan/external-corpus.ts \
            | grep -E '^@@' | sed -E 's/.*\+([0-9]+).*/\1/' \
            | while read -r ln; do
                head -n "$ln" src/scan/external-corpus.ts | grep -oE 'slug: "[a-z0-9-]+"' | tail -1 | sed -E 's/slug: "(.*)"/\1/'
              done | sort -u | grep -v '^$' || true)
          if [ -z "$slugs" ]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"; echo "No slug attributable — scoring every target."; exit 0
          fi
          echo "scope=some" >> "$GITHUB_OUTPUT"
          echo "slugs=$(echo "$slugs" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "Scoring only: $(echo "$slugs" | tr '\n' ' ')"

      # #1564: a DRIFT line names a count moving; it does not say WHICH findings moved,
      # and both 2026-07-30 incidents this closes (carbon M7 -1, M5-slop -653) were resolved only by
      # a human cloning the target and diffing by hand. corpus-drift.ts's --baseline-findings flag
      # turns that into a real added/removed row list — but it needs a PRIOR run's own --json
      # output to diff against, never a second scan. Every run now writes one (the `findings` key
      # alongside `rows`, see corpus-drift.ts), so the source is just YESTERDAY's own scorecard
      # artifact, fetched here and never a fresh clone-and-scan.
      #
      # Fail-open, in the safe direction: no prior successful run (first-ever run), an expired
      # artifact, or a `gh` hiccup all fall through to "not found" rather than failing the job —
      # corpus-drift.ts already handles a missing/partial prior snapshot by disclosing the fallback
      # (naming the module's CURRENT findings) rather than staying silent, so the worst case here is
      # a less detailed explanation, never a broken run.
      - name: Fetch prior scorecard for --baseline-findings (#1564)
        if: steps.filter.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior-drift
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow=corpus-drift.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -z "$run_id" ]; then
            echo "No prior successful corpus-drift run found — proceeding without a baseline snapshot."
            exit 0
          fi
          if gh run download "$run_id" --repo "${{ github.repository }}" -n corpus-drift-scorecard -D prior-drift 2>/dev/null; then
            echo "Downloaded the corpus-drift-scorecard artifact from run $run_id."
          else
            echo "Run $run_id has no corpus-drift-scorecard artifact (expired, or that run errored before uploading) — proceeding without it."
          fi

      # #1586: under the #1498 narrowing the changed slugs ARE the change, and there are usually one
      # or two of them — far fewer than the shard count. Sharding those would leave most shards with
      # nothing, so shard 1 scores them all and the rest declare a no-op. Declaring matters: a shard
      # that simply exited 0 having scored nothing is indistinguishable from one that ran clean, and
      # the gate-liveness assert below would fail it — correctly, which is why the no-op is recorded
      # rather than the assert being weakened.
      - name: Declare the no-op (narrowed run — shard 1 covers the touched slugs)
        if: steps.filter.outputs.relevant == 'true' && steps.targets.outputs.scope != 'all' && matrix.shard != 1
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: corpus-drift
          status: declared-no-op
          scope: "#1498 narrowed this run to the manifest's touched slugs, which shard 1 scores in full. There are fewer touched slugs than shards, so this shard has no targets to score. Nothing was cloned and nothing was scored here; this shard is evidence about nothing, and shard 1 carries the verdict."

      - name: Score the corpus against its baselines
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && (steps.targets.outputs.scope == 'all' || matrix.shard == 1)
        env:
          HARVEY_CORPUS_CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
          HARVEY_CORPUS_PHASE_CACHE_DIR: .harvey-corpus-phase-cache
          # Attempt 1 snapshots the exact registry YAML it scans. A retry reuses it only when the
          # attempt-1 key was an exact hit. A rolling-prefix fallback is usable for phase artifacts,
          # but its registry snapshot is marked unavailable rather than assigned false provenance.
          HARVEY_SEMGREP_REGISTRY_SNAPSHOT_MODE: ${{ github.run_attempt == 1 && 'refresh' || (steps.phase-cache.outputs.cache-hit == 'true' && 'reuse' || 'unavailable') }}
          # PR/queue/push runs measure Harvey against immutable external inputs. The daily/manual
          # lane uses current providers and compares live OSV bytes with the committed snapshot;
          # client audit CLIs do not set this corpus-only variable and keep their live defaults.
          HARVEY_CORPUS_EXTERNAL_STATE_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'live-verify' || 'snapshot' }}
          SHARD: ${{ matrix.shard }}
          # Kept in step with the matrix above: 3 on a PR or queue entry, 1 elsewhere so the run
          # holds every clone and the cache-save guard is satisfied.
          SHARD_COUNT: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 3 || 1 }}
        run: |
          set -euo pipefail
          cold_flag=()
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cold_flag=(--force-cold-cache)
            echo "Forced-cold cache equivalence is enabled: every deterministic phase must compare with a restored artifact; a miss seeds a later run but fails this one."
          fi
          # A single-shard run writes the CANONICAL name: it is the one whose artifact #1564's
          # prior-snapshot fetch consumes, and the aggregate job below reassembles the sharded case
          # into that same name so the lineage is unbroken either way.
          out="corpus-drift.json"
          [ "$SHARD_COUNT" != "1" ] && out="corpus-drift-shard$SHARD.json"
          if [ "${{ steps.targets.outputs.scope }}" = "all" ]; then
            # An array, not a string: an empty baseline_flag expands to zero arguments
            # (still vanishing when no prior snapshot exists) and a populated one carries
            # its flag and path as separate words WITHOUT the unquoted-splitting shellcheck
            # (SC2086) flags on a plain "$baseline_flag" — quoting that string would instead
            # pass a single glued argument and break the flag.
            baseline_flag=()
            [ -f prior-drift/corpus-drift.json ] && baseline_flag=(--baseline-findings prior-drift/corpus-drift.json)
            pnpm corpus-drift --install --shard "$SHARD/$SHARD_COUNT" --json "$out" "${baseline_flag[@]}" "${cold_flag[@]}"
          else
            for t in ${{ steps.targets.outputs.slugs }}; do
              echo "::group::$t"
              baseline_flag=()
              if [ -f "prior-drift/corpus-drift-$t.json" ]; then
                baseline_flag=(--baseline-findings "prior-drift/corpus-drift-$t.json")
              elif [ -f prior-drift/corpus-drift.json ]; then
                baseline_flag=(--baseline-findings prior-drift/corpus-drift.json)
              fi
              pnpm corpus-drift --target "$t" --install --json "corpus-drift-$t.json" "${baseline_flag[@]}" "${cold_flag[@]}"
              echo "::endgroup::"
            done
          fi

      - name: Record corpus phase-cache transport provenance
        if: always() && steps.phase-cache.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && (steps.targets.outputs.scope == 'all' || matrix.shard == 1)
        run: |
          pnpm exec tsx src/cli/corpus-cache-transport.ts save \
            --dir .harvey-corpus-phase-cache \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --head-sha '${{ github.sha }}' \
            --platform '${{ runner.os }}' \
            --namespace '${{ matrix.shard }}'

      - name: Save content-addressed corpus phase results
        if: always() && steps.phase-cache.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && (steps.targets.outputs.scope == 'all' || matrix.shard == 1)
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache
          key: corpus-phase-v4-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      # A default-branch push runs as one all-target shard so it retains the scheduled lane's
      # clone-cache save contract, but PR/merge runs consume three phase-cache namespaces. Seed the
      # same complete content-addressed directory under shard2 and shard3 as well: inner artifact
      # identities decide which target/scanner entries are usable, while each outer transport gets
      # its own self-consistent provenance manifest and immutable key.
      - name: Record shard2 main-seed transport provenance
        if: always() && steps.phase-cache.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          pnpm exec tsx src/cli/corpus-cache-transport.ts save \
            --dir .harvey-corpus-phase-cache \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --head-sha '${{ github.sha }}' \
            --platform '${{ runner.os }}' \
            --namespace '2'

      - name: Save shard2 main-visible corpus phase results
        if: always() && steps.phase-cache.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache
          key: corpus-phase-v4-${{ runner.os }}-shard2-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Record shard3 main-seed transport provenance
        if: always() && steps.phase-cache.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          pnpm exec tsx src/cli/corpus-cache-transport.ts save \
            --dir .harvey-corpus-phase-cache \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --head-sha '${{ github.sha }}' \
            --platform '${{ runner.os }}' \
            --namespace '3'

      - name: Save shard3 main-visible corpus phase results
        if: always() && steps.phase-cache.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache
          key: corpus-phase-v4-${{ runner.os }}-shard3-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      # #1571: the ONLY place the pin-set cache key is written, and only when this run actually
      # cloned every pinned target — the action re-reads the tree and refuses otherwise. corpus-m8
      # (4 targets) and this job's own #1498 narrowed PR path (only the touched slugs) therefore
      # restore but never save, which is what stops a 4-of-14 tree from claiming the 14-target key
      # and locking every later run out of it (a cache key is immutable once written).
      #
      # `always()` is safe HERE precisely because the guard reads the CLONE TREE rather than the job
      # status: the common failure of this job is a real baseline drift, on which all fourteen
      # clones are present and pristine and the cache is worth warming. A failure that left the set
      # incomplete reports complete=false and writes nothing. The `outcome == 'success'` clause only
      # keeps this from adding a second, confusing red step on a job that died before setup
      # finished (no pnpm, so no pin file to check the tree against).
      - name: Save the corpus clone cache
        if: always() && steps.corpus-cache.outcome == 'success'
        uses: ./.github/actions/corpus-clone-cache
        with:
          mode: save

      # The scorecard is the artifact worth keeping on a failure: it's the per-module, per-target
      # table showing exactly what moved. Skipped on a declared no-op, where there is no scorecard
      # and `if-no-files-found: warn` would hang an annotation on an otherwise clean required check.
      # #1586: artifact names must be unique within a run, so a sharded run uploads per-shard parts
      # and the aggregate job below merges them back into `corpus-drift-scorecard`. A single-shard
      # run (schedule/dispatch) writes that canonical name directly, so nothing about the
      # prior-snapshot lineage changes on the path that feeds it.
      - name: Upload drift scorecard
        if: always() && steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('corpus-drift-scorecard-part-{0}', matrix.shard) || 'corpus-drift-scorecard' }}
          path: corpus-drift*.json
          if-no-files-found: warn

      # #1509: this job failed at SETUP for days (the poisoned pipx cache) and reported nothing a
      # reader could tell apart from "ran and found no drift", while PR #1447 merged on three green
      # required checks. `pnpm corpus-drift` writes a receipt AFTER it scores; without that record
      # this step fails naming the phase that never ran. `always()` so it still reports when an
      # earlier step already failed — that is exactly the case it exists to explain. Excluded on the
      # alert drill, which fails on purpose before anything is scored. A short-circuited run reaches
      # here too and passes on the DECLARED NO-OP record above, printing its reason rather than a
      # count — which is what stops "the filter skipped it" reading like "it scored and found none".
      - name: Gate liveness — did this job actually score anything?
        if: always() && !inputs.alert_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: corpus-drift

      # Scheduled runs go red on a branch nobody watches (#1128/#1138). On a scheduled failure,
      # find-or-update ONE tracking issue by the marker label. Still never fires on PR/push — those
      # failures are already visible on the PR — but `workflow_dispatch` is now permanently in the
      # condition (#1287), because this path had never executed once and a cron-only alert cannot be
      # proven to work.
      #
      # EXCLUDED on a liveness drill (#1586 criterion 4, #1569). The two drills each switch off the
      # other's machinery: `alert_drill` skips the liveness assert above, and `liveness_drill` skips
      # this alert. Without this clause, proving the liveness guard under `workflow_dispatch` opens a
      # REAL `ci-corpus-drift-alert` issue — a false alarm indistinguishable from a genuine corpus
      # failure — which is why #1586's criterion 4 was left unproven rather than dispatched.
      - name: Open or update the drift tracking issue
        if: failure() && !inputs.liveness_drill && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-corpus-drift-alert
          label-description: Auto-opened when the scheduled corpus-drift CI run fails
          title: corpus-drift scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled `corpus-drift` run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). A baseline drifted or the job errored — see the corpus-drift-scorecard artifact for the per-module, per-target table. Either rebaseline the drifted target in src/scan/external-corpus.ts with a measured note, or fix the scanner regression. Close this issue once green."

  # #1586: THE REQUIRED CONTEXT. Branch protection on `main` names this job, so it must keep this
  # exact name and must report on every PR — a required context that stops reporting deadlocks every
  # pull request (#1107), which is the failure mode this whole shape has to avoid. It carries no
  # scoring of its own: it gates on the shard matrix and reassembles its parts.
  #
  # `if: always()` so it still reports when a shard failed — a required check that silently vanishes
  # on failure is indistinguishable to branch protection from one that never ran.
  drift:
    name: clone pinned commits + score baselines
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `needs.<matrix-job>.result` is the AGGREGATE over every leg: 'success' only when all of them
      # succeeded. Anything else — a real baseline drift, a died-in-setup shard, a cancellation — is
      # a red required check, exactly as the single job behaved before it was split.
      - name: Every shard must have succeeded
        run: |
          set -euo pipefail
          result='${{ needs.shard.result }}'
          echo "shard matrix aggregate result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::corpus-drift: the shard matrix reported '$result'. A baseline drifted, or a shard errored before it could score. Open the individual 'corpus shard N' jobs for the per-module table, and see the corpus-drift-scorecard artifact."
            exit 1
          fi
          echo "Every shard succeeded."

      # Reassemble the per-shard parts into the ONE artifact name #1564's prior-snapshot fetch reads,
      # so a PR run leaves the same lineage a single-shard run does. Only on the sharded path: a
      # single-shard run already uploaded that name itself.
      - name: Collect the shard scorecards
        id: parts
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: corpus-drift-scorecard-part-*
          merge-multiple: true
          path: parts

      # The shards are disjoint by construction (src/scan/corpus-shards.ts asserts the partition is
      # exhaustive and non-overlapping), so `rows` concatenates and the `findings` maps merge with no
      # key collisions. A short-circuited run uploads no parts at all, which is not a failure — there
      # is simply nothing to merge, and the declared no-op is the record.
      - name: Merge the shard scorecards into corpus-drift.json
        id: merge
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(parts/corpus-drift-shard*.json)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "No shard scorecards to merge — this run short-circuited or scored nothing. Nothing to reassemble."
            exit 0
          fi
          echo "Merging ${#parts[@]} shard scorecard(s): ${parts[*]}"
          jq -s '{
            rows: (map(.rows) | add),
            findings: (map(.findings) | add),
            mechanicalPopulation: (map(.mechanicalPopulation) | unique | if length == 1 then .[0] else error("shards disagree on mechanical population provenance") end),
            mechanicalFindings: (map(.mechanicalFindings // {}) | add),
            detectors: (map(.detectors // {}) | add)
          }' "${parts[@]}" > corpus-drift.json
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Merged scorecard: $(jq '.rows | length' corpus-drift.json) rows over $(jq '.findings | keys | length' corpus-drift.json) target(s)."

      - uses: actions/checkout@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          path: source
      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          node-version-file: source/.nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.merge.outputs.merged == 'true'
        working-directory: source
      - name: Old orchestrator → registry ordered mechanical parity
        if: steps.merge.outputs.merged == 'true'
        run: pnpm validate:mechanical-corpus-parity --current ../corpus-drift.json
        working-directory: source

      - name: Upload the merged drift scorecard
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-drift-scorecard
          path: corpus-drift.json
          if-no-files-found: warn
