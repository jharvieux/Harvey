# Layer 2 for the external-repo regression corpus (#222/#263). Clones every PUBLIC target at its
# pinned commit, re-runs the source-tier modules, and scores the result against the recorded
# baselines. (This header said "six" until 2026-07-30; the manifest has grown since — count it,
# don't quote it: `pnpm corpus-pins --out /tmp/pins.txt && wc -l /tmp/pins.txt` for the current count.)
#
# Why this is NOT part of `pnpm verify` (the required per-PR check): it needs network to clone every
# pinned repo and external binaries (semgrep/trufflehog/osv-scanner) to run the mechanical tier. `verify`
# stays deterministic and offline so it's fast and never flakes on someone else's infrastructure;
# Layer 1 (src/scan/external-corpus.test.ts) covers the scorers there.
#
# Scheduled AND per-PR: the targets are frozen at a commit, so nothing changes between runs except
# OUR scanners. Daily (was weekly until #1138) shrinks the drift-accumulation window from 7 days to
# 1 — the systemic fix behind #1128, where 12 baselines drifted unseen for up to a week.
# workflow_dispatch is for checking a scanner change on demand. A scheduled failure find-or-updates
# a tracking issue (label ci-corpus-drift-alert) so red on this branch that nobody watches can't be
# scrolled past.
#
# BECOMING A REQUIRED STATUS CHECK on `main` (operator-approved 2026-07-30). "Not required" is not
# "not important": this job died at SETUP for days (#1509's poisoned pipx cache) and PR #1447 merged
# on three green required checks while the gate measuring its blast radius had never executed — 653
# M5-slop findings silently suppressed and a live regression on `main`.
#
# Being required is why this workflow has NO `paths:` filter on `pull_request` any more. GitHub
# waits forever for a required context that never reports, so a path-filtered required check
# deadlocks every PR outside its filter (#1107, and gotcha 5 on #1379). The filter moved INSIDE the
# job (the `filter` step below), same shape conservation.yml and dry-run-drift.yml already use: the
# job always runs and always reports, and only the expensive work is conditional.
#
# #1870: one discovered base+head implementation closure decides PR relevance. It starts at the
# real corpus executables, follows the same graph mechanical phase identities use, and adds one
# explicit registry for non-import inputs. Relevant deletions stay relevant through the base
# closure. Unknown paths and any dynamic/unresolved/unreadable discovery edge fail open; a no-op
# retains the complete category/path/digest/consumer receipt.
#
# On failure: the job names the module and target that drifted. A drift is EITHER an intended
# precision fix — rebaseline that target in src/scan/external-corpus.ts with the measured note —
# OR a regression, which is a scanner bug to fix. It is never something to silence.
#
# M8 mutation scoring is NOT this job's work (#470): no Stryker is provisioned here, corpus-drift
# invokes mutation-scan --detect-only (suite-absent finding only), and each mutation-baseline
# target gets an explicit "deferred to corpus-m8.yml" row. So this job goes green when M8's
# mutation tier can't run here — while a real M4/M5/M7/M9/M10 baseline drift still fails it.

name: corpus-drift

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC (#1138: was weekly "0 7 * * 1")
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-corpus-drift-alert path fires end-to-end (#1287). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509). SKIPS the scoring step, leaving a job every one of whose steps succeeds — the guard is then the only thing that can turn it red."
        type: boolean
        default: false
      force_cold_cache:
        description: "Run the executable cold-vs-restored equivalence control for every deterministic phase. Expensive; daily provider validation stays warm."
        type: boolean
        default: false
      cache_profile:
        description: "Benchmark cache profile. cold recomputes every deterministic phase against a restored artifact; warm consumes validated hits."
        type: choice
        options: [warm, cold]
        default: warm
      target_concurrency:
        description: "Benchmark task bound; admission may lower it from measured CPU/RSS limits."
        type: choice
        options: ['1', '2', '3']
        default: '1'
      execution_design:
        description: "Benchmark implementation shape. Ordinary relevant PRs separately run the target-workers/2 canary; this input does not change that route."
        type: choice
        options: [serial, target-workers, intra-target-overlap]
        default: serial
      shard_count:
        description: "Benchmark PR-shape shard count. Production remains three until the committed evaluator qualifies four."
        type: choice
        options: ['3', '4']
        default: '3'
      benchmark_seed:
        description: "Exact cohort seed shared by every matched design/profile/concurrency run."
        type: string
        default: ""
      benchmark_repeat:
        description: "1-based repeat within the unchanged-head cohort."
        type: string
        default: ""
      benchmark_run_identity:
        description: "Non-empty only for a benchmark run; makes dispatch concurrency non-colliding and binds the evidence envelope."
        type: string
        default: ""
      benchmark_runner_role:
        description: "Apply the independently configured PR or schedule runner objective to this benchmark."
        type: choice
        options: [pr, schedule]
        default: pr
      benchmark_runner_shape:
        description: "Use the role's current selector or the repository-visible larger-runner label."
        type: choice
        options: [current, configured-larger]
        default: current
      benchmark_seed_bundle:
        description: "Author the exact warm transport bundle for this seed; this setup run is not a performance sample."
        type: boolean
        default: false
      benchmark_seed_run_id:
        description: "Immutable workflow run id that authored this seed bundle. Required on every performance sample; empty only while authoring the bundle."
        type: string
        default: ""
      benchmark_seed_run_attempt:
        description: "Workflow run attempt that authored the immutable seed bundle. Required with benchmark_seed_run_id."
        type: string
        default: ""
      cache_seed_shards:
        description: "Source partition whose trusted content-addressed transports are merged before a benchmark sample."
        type: choice
        options: ['3', '4']
        default: '3'
      fail_after_start:
        description: "Named target for the all-settled post-start failure drill; empty on performance samples."
        type: string
        default: ""
      replay_relevance_history:
        description: "Re-run the latest-50 merged-PR relevance measurement and retain raw revisions/job rows."
        type: boolean
        default: false
  pull_request:
  # #1867: the default branch is the only Actions-cache scope every PR can read. A push after
  # merge therefore runs the full corpus once in seeding mode; scheduled/dispatch runs remain the
  # forced-cold freshness/parity lane below. The required aggregate context still reports on every
  # PR because pull_request remains unconditional.
  push:
    branches: [main]
  # #1498: merge queue. Without this the required context never reports on a queue entry and the
  # queue deadlocks — a lesson already learned twice in these same workflows. The relevance filter
  # below sets relevant=true on any non-`pull_request` event, so a queue entry scores for real.
  merge_group:

# A scheduled drift check has no reason to run twice concurrently, and a re-dispatch means the
# newer run is the interesting one. Safe on a required check: a cancellation here is only ever
# caused by a NEWER run on the same `github.ref` — for a PR that is `refs/pull/N/merge`, so the
# superseding run reports against the newer head commit, which is the commit branch protection
# actually evaluates. A `cancelled` conclusion is therefore never the latest result for the head
# SHA and cannot strand a merge. (Same posture dry-run-drift.yml and ci.yml already take.)
concurrency:
  group: corpus-drift-${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != '' && format('benchmark-{0}-{1}', github.run_id, inputs.benchmark_run_identity) || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != '') }}

permissions:
  contents: read

jobs:
  # One run, one exact six-file registry input. The bytes are fetched once, checksummed once, and
  # uploaded; every hosted producer shard and every independent replay consumes this artifact in
  # reuse-only mode. A registry release between shard starts can therefore never create a mixed run.
  prepare-current-inputs:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      verdict: ${{ steps.filter.outputs.verdict }}
      runner: ${{ steps.runner.outputs.runner }}
      runner-role: ${{ steps.runner.outputs.role }}
      benchmark-seed-digest: ${{ steps.runner.outputs.seed-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: runner
        name: Resolve independent PR/schedule runner and exact benchmark seed
        env:
          PR_RUNNER: ${{ vars.CORPUS_PR_RUNNER_LABEL }}
          SCHEDULE_RUNNER: ${{ vars.CORPUS_SCHEDULE_RUNNER_LABEL }}
          LARGER_RUNNER: ${{ vars.CORPUS_BENCHMARK_RUNNER_LABEL }}
        run: |
          set -euo pipefail
          role='pr'
          [ "${{ github.event_name }}" = "schedule" ] && role='schedule'
          if [ "${{ inputs.benchmark_seed_bundle }}" = "true" ] && [ "${{ inputs.force_cold_cache }}" = "true" ]; then
            echo "::error::benchmark_seed_bundle=true cannot be combined with force_cold_cache=true; seed authoring creates a cache and cannot verify an already-restored cold sample"
            exit 2
          fi
          if [ -n "${{ inputs.benchmark_run_identity }}" ]; then
            role='${{ inputs.benchmark_runner_role }}'
            if ! [[ '${{ inputs.benchmark_repeat }}' =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::benchmark_repeat must be a positive integer for a benchmark run"
              exit 2
            fi
            if [ -z '${{ inputs.benchmark_seed }}' ]; then
              echo "::error::benchmark_seed must be non-empty for a benchmark run"
              exit 2
            fi
            if [ "${{ inputs.benchmark_seed_bundle }}" != "true" ] && ! [[ '${{ inputs.benchmark_seed_run_id }}' =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::benchmark_seed_run_id must name the immutable seed-bundle workflow run for every performance sample"
              exit 2
            fi
            if [ "${{ inputs.benchmark_seed_bundle }}" != "true" ] && ! [[ '${{ inputs.benchmark_seed_run_attempt }}' =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::benchmark_seed_run_attempt must name the immutable seed-bundle workflow attempt for every performance sample"
              exit 2
            fi
          fi
          runner=ubuntu-latest
          if [ "$role" = schedule ] && [ -n "$SCHEDULE_RUNNER" ]; then runner=$SCHEDULE_RUNNER; fi
          if [ "$role" = pr ] && [ -n "$PR_RUNNER" ]; then runner=$PR_RUNNER; fi
          if [ "${{ inputs.benchmark_runner_shape }}" = configured-larger ]; then
            if [ -z "$LARGER_RUNNER" ]; then
              echo "::error::configured-larger was requested but repository variable CORPUS_BENCHMARK_RUNNER_LABEL is empty; no runner claim is permitted"
              exit 2
            fi
            runner=$LARGER_RUNNER
          fi
          seed_digest=none
          if [ -n '${{ inputs.benchmark_seed }}' ]; then seed_digest=$(printf '%s' '${{ inputs.benchmark_seed }}' | sha256sum | cut -c1-16); fi
          {
            echo "runner=$runner"
            echo "role=$role"
            echo "seed-digest=$seed_digest"
          } >> "$GITHUB_OUTPUT"
          echo "CORPUS RUNNER SELECTOR: role=$role runner=$runner; PR and schedule defaults are independently configurable and fall back to ubuntu-latest."
      - id: filter
        name: Discover the base + head corpus implementation closure
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='HEAD^'
          fi
          pnpm corpus-relevance --base "$base" --head HEAD --out corpus-relevance.json --github-output "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "verdict=full-scan" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain the complete relevance receipt
        uses: actions/upload-artifact@v4
        with:
          name: corpus-relevance-receipt
          path: corpus-relevance.json
          if-no-files-found: error
      - name: Materialize the one current Semgrep registry input
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm materialize:current-semgrep --dir .harvey-current-semgrep --out .harvey-current-semgrep/receipt.json
      - name: Retain exact registry bytes and their receipt
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: current-mechanical-semgrep-pack
          path: .harvey-current-semgrep
          include-hidden-files: true
          if-no-files-found: error

  relevance-history:
    if: github.event_name == 'workflow_dispatch' && inputs.replay_relevance_history
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay the latest 50 merged PRs against the discovered closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm corpus-relevance-history --repo "${{ github.repository }}" --out corpus-relevance-history.json --limit 50
      - name: Retain cutoff, revisions, raw API rows, and separate savings arithmetic
        uses: actions/upload-artifact@v4
        with:
          name: corpus-relevance-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: corpus-relevance-history.json
          if-no-files-found: error

  # #1586: the scoring work, split across runners. This job is NOT the required context — a matrix
  # job's checks are named `<name> (1)`, `<name> (2)`, ... so the bare name would stop reporting and
  # deadlock every PR (#1107). The `drift` job below keeps that name and gates on these.
  #
  # SHARD COUNT VARIES BY EVENT. PRs, merge groups and default-branch pushes use the same three
  # namespaces: each successful main leg seeds exactly the transport its corresponding PR leg
  # consumes. This replaced the single 29m30s main seed that timed out before it could publish a
  # complete trusted transport (runs 31601042773/31602706320).
  # .github/actions/corpus-clone-cache keys on the whole resolved pin set, and a cache key is
  # IMMUTABLE once written — its `mode: save` therefore writes only when the run holds EVERY pinned
  # clone, a guard that exists because corpus-m8 once wrote a 4-of-14 tree under that key and
  # poisoned it beyond repair by re-running. No PR shard holds the whole set, so a sharded run can
  # never save that whole-population key.
  #   * pull_request / merge_group / push -> 3 shards.
  #     Each shard owns an exhaustive slice for the current producer↔replay population comparison.
  #   * schedule / ordinary workflow_dispatch -> ONE shard holding the whole population, which
  #     still saves the cache and
  #     still writes the canonical `corpus-drift-scorecard` artifact that #1564's prior-snapshot
  #     fetch reads. The baseline lineage flows through the daily run, never through a PR's shard.
  #
  # Production remains three fail-safe cold-profile shards while the hosted comparison is pending.
  # Inside those shards, an ordinary relevant PR is the target-workers/2 canary approved under
  # #1873. Every queue/push/schedule/ordinary-dispatch path remains serial, and one canary does not
  # satisfy #1873's multi-run acceptance campaign or authorize a production-wide switch.
  # The committed cold and warm weights come from the exact-head run 31549148174 attempts 1 and 2;
  # they are selected only with matching target/cache provenance. Benchmark dispatch may request
  # four shards, but the evaluator must qualify it before production changes. The split itself lives
  # in src/scan/corpus-shards.ts, which asserts it is exhaustive and disjoint — a target silently
  # dropped from the partition would stop being scored while every shard still exited 0.
  shard:
    name: corpus shard ${{ matrix.shard }}
    needs: prepare-current-inputs
    runs-on: ${{ needs.prepare-current-inputs.outputs.runner }}
    strategy:
      # A drifted baseline in one shard must not cancel the others: the scorecard is most useful when
      # it shows everything that moved, not the first thing.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != '' && (inputs.shard_count == '4' && '[1,2,3,4]' || '[1,2,3]') || ((github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') && '[1,2,3]' || '[1]')) }}
    # issues: write so a scheduled failure can find-or-update its tracking issue (#1138).
    # actions: read (#1564) so ordinary lanes can download the latest prior scorecard. Benchmark
    # identities disable that diagnostic-only input entirely; see the policy receipt below.
    # contents: read is restated because a job-level block replaces (not extends) the top-level one.
    permissions:
      contents: read
      issues: write
      actions: read
    # 30m still covers the per-target installs added by #251; CI's cold package-manager cache is the
    # slack this bound covers. Do not infer the current target population from this timeout.
    # M8's mutation runs are what genuinely didn't fit here — those are corpus-m8.yml.
    timeout-minutes: 30
    # The receipt both the gate CLI and .github/actions/gate-liveness read. A literal path, not
    # ${{ runner.temp }}: the `runner` context is not available in a job-level `env:` block, and
    # producer and asserter agreeing on ONE path is the whole point.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      # fetch-depth: 0 so the relevance filter can reach the PR base. A shallow checkout previously
      # made that diff unreadable and forced every prose-only PR through the expensive lane.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Reuse the one discovered corpus relevance verdict
        run: |
          echo "relevant=${{ needs.prepare-current-inputs.outputs.relevant }}" >> "$GITHUB_OUTPUT"
          echo "verdict=${{ needs.prepare-current-inputs.outputs.verdict }}" >> "$GITHUB_OUTPUT"

      # Before the corpus clones and installs on purpose: the drill proves the ALERT path, not the
      # corpus, so it must not pay 30 minutes to reach it. Everything below is skipped once it fails.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287): failing on purpose so the tracking-issue step runs under the real job token. This is NOT a corpus-drift failure."
          exit 1

      # #1509: a short-circuited job and a job that died in setup are both "nothing was scored", and
      # from outside they look identical — which is how #1447 merged past a gate that had never run.
      # The no-op is DECLARED, with its reason, so the assert step at the end can pass it while
      # printing something a reader cannot mistake for a scoring run.
      - name: Declare the no-op (a short-circuit must not read like a scoring run)
        if: needs.prepare-current-inputs.outputs.relevant != 'true'
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: corpus-drift
          status: declared-no-op
          scope: "the retained base+head implementation-closure receipt declared every changed path disjoint. Nothing was cloned and nothing was scored; this is declared-no-op evidence, not assessed-clean. The daily scheduled run still covers the full corpus."

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.relevant == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.relevant == 'true'

      - name: Authenticate private corpus mirrors
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/corpus-mirror-auth
        with:
          private-key: ${{ secrets.CORPUS_MIRROR_DEPLOY_KEY }}

      # The baseline modules (M4/M5/M7/M8/M9) run on this repo's own devDependencies, but #261's
      # free-tier invariant scores a real quick-scan, whose mechanical tier shells out to these.
      # Each scanner degrades to "found nothing" without its binary rather than failing loudly —
      # which on a must-raise-an-indicator target would look like the free tier staying quiet. So
      # they are installed explicitly rather than left to chance.
      - name: Install mechanical-tier scanner binaries
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/mechanical-binaries

      # #1571: cache the pinned clones themselves (not the --install tree), keyed on the pin set
      # so editing a pin is a miss by construction. A restored cache is verified against every
      # pinned commit before `pnpm corpus-drift` ever reads it — see the action's own comments for
      # why a poisoned hit fails loud rather than silently rescanning fewer targets. The matching
      # `mode: save` step is at the END of this job, after the clones exist.
      - name: Corpus clone cache
        id: corpus-cache
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/corpus-clone-cache

      # #1864/#1871/#1872: phase/scanner artifacts and dependency-preparation receipts are
      # individually content-addressed inside this directory. Package-manager stores are
      # relocatable transport used only for an offline rematerialization into each fresh clone;
      # node_modules is never restored. The
      # outer Actions cache is only transport between runs; its per-shard rolling key avoids
      # concurrent matrix legs overwriting one another. Scheduled/manual runs retain one all-target
      # shard for canonical scorecard/clone-cache lineage; main pushes seed three transports in
      # parallel and never promote a partial all-target directory across namespaces.
      # A restored artifact is never trusted by presence:
      # corpus-drift validates its schema, key, findings, and examined-scope metadata, rejecting
      # and recomputing corrupt/incomplete entries with a visible CACHE/DEPENDENCY PREP REJECT line.
      - name: Restore content-addressed corpus phase results
        id: phase-cache
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity == ''
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache
          # Retry attempts request attempt 1's exact key. `cache-hit` below distinguishes that
          # artifact from an older rolling-prefix fallback, whose registry bytes have no lineage
          # to this run and therefore may not be reused as though they did.
          key: corpus-phase-run-v7-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.run_id }}-1-${{ github.sha }}

      # A PR-prefix fallback can be newer than main and shadow the trusted seed, only to be rejected
      # by provenance after restore. Separate key families make that impossible: retries get only
      # their exact current-run artifact above; all other fallback transport comes from main.
      - name: Restore trusted-main corpus phase results
        id: main-phase-cache
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity == '' && steps.phase-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .harvey-corpus-phase-cache
          key: corpus-phase-main-v7-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            corpus-phase-main-v7-${{ runner.os }}-shard${{ matrix.shard }}-

      - name: Restore exact benchmark seed shard 1
        id: benchmark-cache-1
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle
        uses: actions/cache/restore@v4
        with:
          path: .harvey-benchmark-seed-shard-1
          key: corpus-phase-benchmark-v7-${{ runner.os }}-seed${{ needs.prepare-current-inputs.outputs.benchmark-seed-digest }}-shard1-${{ inputs.benchmark_seed_run_id }}-${{ inputs.benchmark_seed_run_attempt }}-${{ github.sha }}

      - name: Restore exact benchmark seed shard 2
        id: benchmark-cache-2
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle
        uses: actions/cache/restore@v4
        with:
          path: .harvey-benchmark-seed-shard-2
          key: corpus-phase-benchmark-v7-${{ runner.os }}-seed${{ needs.prepare-current-inputs.outputs.benchmark-seed-digest }}-shard2-${{ inputs.benchmark_seed_run_id }}-${{ inputs.benchmark_seed_run_attempt }}-${{ github.sha }}

      - name: Restore exact benchmark seed shard 3
        id: benchmark-cache-3
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle
        uses: actions/cache/restore@v4
        with:
          path: .harvey-benchmark-seed-shard-3
          key: corpus-phase-benchmark-v7-${{ runner.os }}-seed${{ needs.prepare-current-inputs.outputs.benchmark-seed-digest }}-shard3-${{ inputs.benchmark_seed_run_id }}-${{ inputs.benchmark_seed_run_attempt }}-${{ github.sha }}

      - name: Restore exact benchmark seed shard 4
        id: benchmark-cache-4
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle && inputs.cache_seed_shards == '4'
        uses: actions/cache/restore@v4
        with:
          path: .harvey-benchmark-seed-shard-4
          key: corpus-phase-benchmark-v7-${{ runner.os }}-seed${{ needs.prepare-current-inputs.outputs.benchmark-seed-digest }}-shard4-${{ inputs.benchmark_seed_run_id }}-${{ inputs.benchmark_seed_run_attempt }}-${{ github.sha }}

      - name: Merge every trusted old shard at the content-addressed layer
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle
        run: |
          set -euo pipefail
          jq -n \
            --arg d1 .harvey-benchmark-seed-shard-1 --arg k1 '${{ steps.benchmark-cache-1.outputs.cache-matched-key }}' \
            --arg d2 .harvey-benchmark-seed-shard-2 --arg k2 '${{ steps.benchmark-cache-2.outputs.cache-matched-key }}' \
            --arg d3 .harvey-benchmark-seed-shard-3 --arg k3 '${{ steps.benchmark-cache-3.outputs.cache-matched-key }}' \
            --arg d4 .harvey-benchmark-seed-shard-4 --arg k4 '${{ steps.benchmark-cache-4.outputs.cache-matched-key }}' \
            '[{dir:$d1,matchedKey:$k1,namespace:"1"},{dir:$d2,matchedKey:$k2,namespace:"2"},{dir:$d3,matchedKey:$k3,namespace:"3"},{dir:$d4,matchedKey:$k4,namespace:"4"}] | map(select(.matchedKey != ""))' \
            > benchmark-cache-sources.json
          pnpm exec tsx src/cli/corpus-cache-transport.ts merge \
            --dir .harvey-corpus-phase-cache \
            --sources-json benchmark-cache-sources.json \
            --required-namespaces "$(seq -s, 1 '${{ inputs.cache_seed_shards }}')" \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --default-ref 'refs/heads/${{ github.event.repository.default_branch }}' \
            --platform '${{ runner.os }}' \
            --head-sha '${{ github.sha }}' \
            --benchmark-seed '${{ inputs.benchmark_seed }}' \
            --benchmark-seed-run-id '${{ inputs.benchmark_seed_run_id }}' \
            --benchmark-seed-run-attempt '${{ inputs.benchmark_seed_run_attempt }}' \
            --out benchmark-cache-merge-receipt.json

      - name: Restore the run's exact shared Semgrep bytes
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/download-artifact@v4
        with:
          name: current-mechanical-semgrep-pack
          # Download-by-name writes the artifact's CONTENTS directly here; upload-artifact stripped
          # the `.harvey-current-semgrep` common root. Keep this immutable input outside the mutable
          # phase-cache directory, whose rejected transport is recursively cleared below.
          path: .harvey-current-semgrep

      - name: Validate the exact shared Semgrep artifact layout
        if: steps.filter.outputs.relevant == 'true'
        run: pnpm materialize:current-semgrep --dir .harvey-current-semgrep --validate-only

      # Actions cache visibility is a transport boundary, not an authenticity claim. The inner
      # artifacts validate their content identities, and this manifest independently proves the
      # restored directory came from main or this exact run. A cache from another PR ref is
      # deleted visibly before any scanner can read it; a miss remains a normal recompute.
      - name: Validate corpus phase-cache transport provenance
        id: phase-cache-transport
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity == ''
        run: |
          pnpm exec tsx src/cli/corpus-cache-transport.ts restore \
            --dir .harvey-corpus-phase-cache \
            --matched-key '${{ steps.phase-cache.outputs.cache-matched-key || steps.main-phase-cache.outputs.cache-matched-key }}' \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --default-ref 'refs/heads/${{ github.event.repository.default_branch }}' \
            --platform '${{ runner.os }}' \
            --namespace '${{ matrix.shard }}' \
            --head-sha '${{ github.sha }}'

      # --install (#251): installs each clone's own dependency tree before the scanners — with the
      # package manager that clone's lockfile implies, since #1268 — which is what lets knip
      # resolve each target's config (CLAUDE.md's M5 prereq) — without it M5-knip scores on 2 of 6
      # targets instead of 4. It is what pushes this job past its old ~2m: six real installs.
      # #1872: the install first validates a content-addressed receipt keyed by the target tree,
      # lock/install inputs, exact package manager, Node/ABI, platform and bounded environment.
      # A hit still performs a frozen offline rematerialization from the relocatable manager store;
      # a miss/corruption performs a clean install. #1871 then keys quality-scan on that validated
      # receipt rather than hashing or restoring the checkout-bound installed tree.
      # Current producer↔replay equivalence is a population claim. A manifest-only change therefore
      # cannot narrow to its edited slug: both fresh sides must own every pinned target or the union
      # comparison would prove less than the required context says. This deliberately supersedes
      # #1498's manifest-only narrowing for relevant PRs; prose/test-only changes still short-circuit.
      - name: Declare the complete target population
        id: targets
        if: steps.filter.outputs.relevant == 'true'
        run: |
          echo "scope=all" >> "$GITHUB_OUTPUT"
          echo "Scoring every target: the required current readiness comparator rejects a partial population."

      # #1564: a DRIFT line names a count moving; it does not say WHICH findings moved,
      # and both 2026-07-30 incidents this closes (carbon M7 -1, M5-slop -653) were resolved only by
      # a human cloning the target and diffing by hand. corpus-drift.ts's --baseline-findings flag
      # turns that into a real added/removed row list — but it needs a PRIOR run's own --json
      # output to diff against, never a second scan. Every run now writes one (the `findings` key
      # alongside `rows`, see corpus-drift.ts), so the source is just YESTERDAY's own scorecard
      # artifact, fetched here and never a fresh clone-and-scan.
      #
      # Ordinary PR/push/schedule/manual semantics stay fail-open: no prior successful run, an
      # expired artifact, or a `gh` hiccup yields the existing current-findings fallback. Benchmark
      # seed, sample, and all-settled-drill identities never enter this step: the prior snapshot is
      # diagnostic attribution only, while its mutable lookup polluted the measured setup envelope.
      - name: Fetch the latest prior scorecard for ordinary drift attribution (#1564)
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior-drift
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow=corpus-drift.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -z "$run_id" ]; then
            echo "No prior successful corpus-drift run found — proceeding without a baseline snapshot."
            exit 0
          fi
          if gh run download "$run_id" --repo "${{ github.repository }}" -n corpus-drift-scorecard -D prior-drift 2>/dev/null; then
            echo "Downloaded the corpus-drift-scorecard artifact from run $run_id."
          else
            echo "Run $run_id has no corpus-drift-scorecard artifact (expired, or that run errored before uploading) — proceeding without it."
          fi

      - name: Record disabled benchmark prior-scorecard policy
        if: steps.filter.outputs.relevant == 'true' && inputs.benchmark_run_identity != ''
        run: |
          set -euo pipefail
          jq -n '{schema:1,mode:"disabled-for-benchmark",reason:"prior-scorecard-is-diagnostic-only"}' \
            > 'benchmark-prior-scorecard-policy-${{ matrix.shard }}.json'

      - name: Score the corpus against its baselines
        id: score
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        env:
          HARVEY_CORPUS_CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
          HARVEY_CORPUS_PHASE_CACHE_DIR: .harvey-corpus-phase-cache
          HARVEY_SEMGREP_REGISTRY_SNAPSHOT_DIR: .harvey-current-semgrep
          # `prepare-current-inputs` fetched these exact six YAML files once for the whole run.
          # Producers are reuse-only: no shard may race the live registry independently.
          HARVEY_SEMGREP_REGISTRY_SNAPSHOT_MODE: reuse
          # PR/queue/push runs and every provenance-bound benchmark seed/sample measure Harvey
          # against committed external inputs. Only the daily and ORDINARY manual freshness lanes
          # compare live OSV bytes with the committed snapshot. A non-empty benchmark identity is
          # also passed to the CLI as a second fail-closed guard against mutable cohort input.
          # Client audit CLIs do not set either corpus-only variable and keep their live defaults.
          HARVEY_CORPUS_EXTERNAL_STATE_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity == '')) && 'live-verify' || 'snapshot' }}
          HARVEY_CORPUS_BENCHMARK_RUN_IDENTITY: ${{ inputs.benchmark_run_identity }}
          HARVEY_CURRENT_MECHANICAL_READINESS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '1' || '0' }}
          SHARD: ${{ matrix.shard }}
          # Kept in step with the matrix above: 3 on a PR, queue entry, or main push; 1 on the
          # scheduled/manual canonical-scorecard lane, which still holds every clone.
          SHARD_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != '' && inputs.shard_count || ((github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') && 3 || 1) }}
        run: |
          set -euo pipefail
          cold_flag=()
          if [ "${{ inputs.force_cold_cache }}" = "true" ] || { [ -n "${{ inputs.benchmark_run_identity }}" ] && [ "${{ inputs.cache_profile }}" = "cold" ] && [ "${{ inputs.benchmark_seed_bundle }}" != "true" ]; }; then
            cold_flag=(--force-cold-cache)
            echo "Explicit forced-cold cache equivalence is enabled: every deterministic phase must compare with a restored artifact. Daily live-provider validation is warm."
          fi
          candidate_flags=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -z "${{ inputs.benchmark_run_identity }}" ]; then
            candidate_flags=(
              --target-concurrency 2
              --execution-design target-workers
              --cache-profile warm
            )
          fi
          benchmark_flags=()
          shard_profile_flags=(--shard-profile auto --shard-cache-provenance uncertain)
          if [ -n "${{ inputs.benchmark_run_identity }}" ]; then
            benchmark_flags=(
              --target-concurrency "${{ inputs.target_concurrency }}"
              --execution-design "${{ inputs.execution_design }}"
              --cache-profile "${{ inputs.cache_profile }}"
            )
            if [ "${{ inputs.cache_profile }}" = "warm" ]; then
              shard_profile_flags=(--shard-profile warm --shard-cache-provenance verified-warm)
            else
              shard_profile_flags=(--shard-profile cold --shard-cache-provenance uncertain)
            fi
            if [ -n "${{ inputs.fail_after_start }}" ]; then
              benchmark_flags+=(--fail-after-start "${{ inputs.fail_after_start }}")
            fi
          fi
          # A single-shard run writes the CANONICAL name: it is the one whose artifact #1564's
          # prior-snapshot fetch consumes, and the aggregate job below reassembles the sharded case
          # into that same name so the lineage is unbroken either way.
          out="corpus-drift.json"
          [ "$SHARD_COUNT" != "1" ] && out="corpus-drift-shard$SHARD.json"
          # An array, not a string: an empty baseline_flag expands to zero arguments and a populated
          # one carries its flag and path as separate words without shell splitting.
          baseline_flag=()
          if [ -z '${{ inputs.benchmark_run_identity }}' ] && [ -f prior-drift/corpus-drift.json ]; then
            baseline_flag=(--baseline-findings prior-drift/corpus-drift.json)
          fi
          pnpm corpus-drift --install --shard "$SHARD/$SHARD_COUNT" --json "$out" "${baseline_flag[@]}" "${cold_flag[@]}" "${candidate_flags[@]}" "${benchmark_flags[@]}" "${shard_profile_flags[@]}"

      - name: Measure content-addressed cache size
        if: always() && steps.score.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        run: |
          set -euo pipefail
          bytes=$(du -sk .harvey-corpus-phase-cache | awk '{print $1 * 1024}')
          receipts=0
          if [ -d .harvey-corpus-phase-cache/dependency-preparation/receipts ]; then
            receipts=$(find .harvey-corpus-phase-cache/dependency-preparation/receipts -type f -name '*.json' | wc -l)
          fi
          echo "CORPUS CACHE SIZE: ${bytes} bytes; dependency preparation receipts: ${receipts}; node_modules is rematerialized per disposable clone and is not in this transport."

      - name: Record corpus phase-cache transport provenance
        id: write-transport
        if: success() && steps.score.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && (steps.targets.outputs.scope == 'all' || matrix.shard == 1)
        run: |
          set -euo pipefail
          transport_seed=()
          if [ -n '${{ inputs.benchmark_run_identity }}' ]; then transport_seed=(--benchmark-seed '${{ inputs.benchmark_seed }}'); fi
          pnpm exec tsx src/cli/corpus-cache-transport.ts save \
            --dir .harvey-corpus-phase-cache \
            --event '${{ github.event_name }}' \
            --ref '${{ github.ref }}' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --head-sha '${{ github.sha }}' \
            --platform '${{ runner.os }}' \
            --family '${{ inputs.benchmark_run_identity != '' && 'benchmark' || (github.event_name == 'push' && 'main' || 'run') }}' \
            --namespace '${{ matrix.shard }}' \
            "${transport_seed[@]}"
          if [ -n '${{ inputs.benchmark_run_identity }}' ]; then
            cp .harvey-corpus-phase-cache/transport-provenance.json "benchmark-transport-${{ matrix.shard }}.json"
          fi

      - name: Retain benchmark cache, transport, runner, and resource provenance
        if: always() && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle && steps.score.outcome == 'success'
        run: |
          set -euo pipefail
          cp benchmark-cache-merge-receipt.json "benchmark-cache-merge-receipt-${{ matrix.shard }}.json"
          image_os=${ImageOS:?runner image OS receipt is missing}
          image_version=${ImageVersion:?runner image version receipt is missing}
          jq -n \
            --argjson shard '${{ matrix.shard }}' \
            --arg imageOS "$image_os" \
            --arg imageVersion "$image_version" \
            --arg runnerOS '${{ runner.os }}' \
            --arg runnerArch '${{ runner.arch }}' \
            '{schema:1,shard:$shard,imageOS:$imageOS,imageVersion:$imageVersion,runnerOS:$runnerOS,runnerArch:$runnerArch}' \
            > "benchmark-runner-${{ matrix.shard }}.json"

      # Raw check-in evidence, not a derived "cache hit" count. The aggregate sealer also keeps
      # the attempt-specific Actions job rows, whose runner group/labels complement this image
      # receipt. Exact matched cache keys remain visible even when the inner content-addressed
      # records later report a rejected/recomputed phase.
      - name: Retain ordinary PR runner and cache provenance
        if: always() && github.event_name == 'pull_request' && inputs.benchmark_run_identity == '' && steps.score.outcome == 'success'
        env:
          REQUESTED_RUNNER: ${{ needs.prepare-current-inputs.outputs.runner }}
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CLONE_CACHE_HIT: ${{ steps.corpus-cache.outputs.cache-hit }}
          RUN_PHASE_MATCHED_KEY: ${{ steps.phase-cache.outputs.cache-matched-key }}
          MAIN_PHASE_MATCHED_KEY: ${{ steps.main-phase-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -s corpus-pins.txt
          pin_digest=$(sha256sum corpus-pins.txt | cut -d' ' -f1)
          clone_key="corpus-clone-cache-v2-${pin_digest}"
          selected_phase_key=$RUN_PHASE_MATCHED_KEY
          [ -n "$selected_phase_key" ] || selected_phase_key=$MAIN_PHASE_MATCHED_KEY
          image_os=${ImageOS-}
          image_version=${ImageVersion-}
          jq -n \
            --argjson shard '${{ matrix.shard }}' \
            --arg requestedRunner "$REQUESTED_RUNNER" \
            --arg name "$ACTUAL_RUNNER_NAME" \
            --arg os "$ACTUAL_RUNNER_OS" \
            --arg arch "$ACTUAL_RUNNER_ARCH" \
            --arg environment "$ACTUAL_RUNNER_ENVIRONMENT" \
            --arg imageOS "$image_os" \
            --arg imageVersion "$image_version" \
            '{schema:1,shard:$shard,requestedRunner:$requestedRunner,actual:{name:$name,os:$os,arch:$arch,environment:$environment,imageOS:$imageOS,imageVersion:$imageVersion}}' \
            > "corpus-checkin-runner-${{ matrix.shard }}.json"
          jq -n \
            --argjson shard '${{ matrix.shard }}' \
            --arg cloneKey "$clone_key" \
            --arg cloneHit "$CLONE_CACHE_HIT" \
            --arg runPhaseMatchedKey "$RUN_PHASE_MATCHED_KEY" \
            --arg mainPhaseMatchedKey "$MAIN_PHASE_MATCHED_KEY" \
            --arg selectedPhaseKey "$selected_phase_key" \
            '{schema:1,shard:$shard,clone:{key:$cloneKey,hit:($cloneHit == "true")},phase:{runMatchedKey:$runPhaseMatchedKey,mainMatchedKey:$mainPhaseMatchedKey,selectedMatchedKey:$selectedPhaseKey}}' \
            > "corpus-checkin-cache-${{ matrix.shard }}.json"

      - name: Save current-run corpus phase results for an exact retry
        if: success() && steps.score.outcome == 'success' && github.event_name != 'push' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && inputs.benchmark_run_identity == ''
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache
          key: corpus-phase-run-v7-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Save exact benchmark-seed corpus phase results
        if: success() && steps.score.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && inputs.benchmark_run_identity != '' && inputs.benchmark_seed_bundle
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache
          key: corpus-phase-benchmark-v7-${{ runner.os }}-seed${{ needs.prepare-current-inputs.outputs.benchmark-seed-digest }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      # Only a successful default-branch shard can publish a trusted rolling seed. A cancelled,
      # timed-out, drifted or setup-failed leg never reaches this step and cannot shadow the prior
      # trusted key. Each matrix leg writes only its own namespace.
      - name: Save successful main-shard corpus phase results
        if: success() && steps.score.outcome == 'success' && steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: .harvey-corpus-phase-cache
          key: corpus-phase-main-v7-${{ runner.os }}-shard${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      # #1571: the ONLY place the pin-set cache key is written, and only when this run actually
      # cloned every pinned target — the action re-reads the tree and refuses otherwise. corpus-m8
      # and each PR shard own only subsets, so they restore but never save; this stops a partial tree
      # from claiming the whole-population key
      # and locking every later run out of it (a cache key is immutable once written).
      #
      # `always()` is safe HERE precisely because the guard reads the CLONE TREE rather than the job
      # status: the common failure of this job is a real baseline drift, on which the complete pin
      # set is present and pristine and the cache is worth warming. A failure that left the set
      # incomplete reports complete=false and writes nothing. The `outcome == 'success'` clause only
      # keeps this from adding a second, confusing red step on a job that died before setup
      # finished (no pnpm, so no pin file to check the tree against).
      - name: Save the corpus clone cache
        if: always() && steps.corpus-cache.outcome == 'success'
        uses: ./.github/actions/corpus-clone-cache
        with:
          mode: save

      # The scorecard is the artifact worth keeping on a failure: it's the per-module, per-target
      # table showing exactly what moved. Skipped on a declared no-op, where there is no scorecard
      # and `if-no-files-found: warn` would hang an annotation on an otherwise clean required check.
      # #1586: artifact names must be unique within a run, so a sharded run uploads per-shard parts
      # and the aggregate job below merges them back into `corpus-drift-scorecard`. A single-shard
      # run (schedule/dispatch) writes that canonical name directly, so nothing about the
      # prior-snapshot lineage changes on the path that feeds it.
      - name: Upload drift scorecard
        if: always() && steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ ((github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != '')) && format('corpus-drift-scorecard-part-{0}', matrix.shard) || 'corpus-drift-scorecard' }}
          path: |
            corpus-drift*.json
            corpus-drift*.json.workers/**
            benchmark-cache-merge-receipt-*.json
            benchmark-prior-scorecard-policy-*.json
            benchmark-transport-*.json
            benchmark-runner-*.json
            corpus-checkin-runner-*.json
            corpus-checkin-cache-*.json
          if-no-files-found: warn

      # #1509: this job failed at SETUP for days (the poisoned pipx cache) and reported nothing a
      # reader could tell apart from "ran and found no drift", while PR #1447 merged on three green
      # required checks. `pnpm corpus-drift` writes a receipt AFTER it scores; without that record
      # this step fails naming the phase that never ran. `always()` so it still reports when an
      # earlier step already failed — that is exactly the case it exists to explain. Excluded on the
      # alert drill, which fails on purpose before anything is scored. A short-circuited run reaches
      # here too and passes on the DECLARED NO-OP record above, printing its reason rather than a
      # count — which is what stops "the filter skipped it" reading like "it scored and found none".
      - name: Gate liveness — did this job actually score anything?
        if: always() && !inputs.alert_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: corpus-drift

      # Scheduled runs go red on a branch nobody watches (#1128/#1138). On a scheduled failure,
      # find-or-update ONE tracking issue by the marker label. Still never fires on PR/push — those
      # failures are already visible on the PR. An ORDINARY `workflow_dispatch` remains in the
      # condition (#1287), because this path had never executed once and a cron-only alert cannot be
      # proven to work. Provenance-bound benchmark dispatches are evidence collection, not the
      # scheduled freshness signal, and must not mutate its production alert issue.
      #
      # EXCLUDED on a liveness drill (#1586 criterion 4, #1569). The two drills each switch off the
      # other's machinery: `alert_drill` skips the liveness assert above, and `liveness_drill` skips
      # this alert. Without this clause, proving the liveness guard under `workflow_dispatch` opens a
      # REAL `ci-corpus-drift-alert` issue — a false alarm indistinguishable from a genuine corpus
      # failure — which is why #1586's criterion 4 was left unproven rather than dispatched.
      - name: Open or update the drift tracking issue
        if: failure() && !inputs.liveness_drill && inputs.benchmark_run_identity == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-corpus-drift-alert
          label-description: Auto-opened when the scheduled corpus-drift CI run fails
          title: corpus-drift scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled `corpus-drift` run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). A baseline drifted or the job errored — see the corpus-drift-scorecard artifact for the per-module, per-target table. Either rebaseline the drifted target in src/scan/external-corpus.ts with a measured note, or fix the scanner regression. Close this issue once green."

  # A separate process and separate clone/preparation path. It consumes the exact pack artifact but
  # no hosted phase artifacts, so the final comparison is not the scorecard comparing with itself.
  # It starts beside the real producer matrix; the stronger evidence costs runner minutes, not an
  # additional serial critical path.
  current-replay:
    needs: prepare-current-inputs
    if: needs.prepare-current-inputs.outputs.relevant == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    name: current independent replay ${{ matrix.shard }}
    runs-on: ${{ needs.prepare-current-inputs.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[1,2,3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install mechanical-tier scanner binaries
        uses: ./.github/actions/mechanical-binaries
      - name: Authenticate private corpus mirrors
        uses: ./.github/actions/corpus-mirror-auth
        with:
          private-key: ${{ secrets.CORPUS_MIRROR_DEPLOY_KEY }}
      - name: Corpus clone cache
        id: corpus-cache
        uses: ./.github/actions/corpus-clone-cache
      - name: Restore the run's exact shared Semgrep bytes
        uses: actions/download-artifact@v4
        with:
          name: current-mechanical-semgrep-pack
          path: .harvey-current-semgrep
      - name: Validate the exact shared Semgrep artifact layout
        run: pnpm materialize:current-semgrep --dir .harvey-current-semgrep --validate-only
      - name: Execute the independent exact-head replay
        env:
          HARVEY_CORPUS_CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
          SHARD_COUNT: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 3 || 1 }}
        run: pnpm replay:current-mechanical --shard "${{ matrix.shard }}/$SHARD_COUNT" --registry-dir .harvey-current-semgrep --out "current-replay-${{ matrix.shard }}.json"
      - name: Upload independent raw replay
        uses: actions/upload-artifact@v4
        with:
          name: current-mechanical-replay-part-${{ matrix.shard }}
          path: current-replay-${{ matrix.shard }}.json
          if-no-files-found: error

  # #1586: THE REQUIRED CONTEXT. Branch protection on `main` names this job, so it must keep this
  # exact name and must report on every PR — a required context that stops reporting deadlocks every
  # pull request (#1107), which is the failure mode this whole shape has to avoid. It carries no
  # scoring of its own: it gates on the shard matrix and reassembles its parts.
  #
  # `if: always()` so it still reports when a shard failed — a required check that silently vanishes
  # on failure is indistinguishable to branch protection from one that never ran.
  drift:
    name: clone pinned commits + score baselines
    needs: [prepare-current-inputs, shard, current-replay]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # `needs.<matrix-job>.result` is the AGGREGATE over every leg: 'success' only when all of them
      # succeeded. Anything else — a real baseline drift, a died-in-setup shard, a cancellation — is
      # a red required check, exactly as the single job behaved before it was split.
      - name: Every shard must have succeeded
        run: |
          set -euo pipefail
          result='${{ needs.shard.result }}'
          echo "shard matrix aggregate result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::corpus-drift: the shard matrix reported '$result'. A baseline drifted, or a shard errored before it could score. Open the individual 'corpus shard N' jobs for the per-module table, and see the corpus-drift-scorecard artifact."
            exit 1
          fi
          if [ '${{ needs.prepare-current-inputs.result }}' != 'success' ]; then
            echo "::error::the shared-input preparation job did not succeed"
            exit 1
          fi
          if { [ '${{ github.event_name }}' = 'pull_request' ] || [ '${{ github.event_name }}' = 'merge_group' ]; } \
            && [ '${{ needs.prepare-current-inputs.outputs.relevant }}' = 'true' ] \
            && [ '${{ needs.current-replay.result }}' != 'success' ]; then
            echo "::error::the independent current replay matrix did not succeed"
            exit 1
          fi
          echo "Every shard succeeded."

      # Reassemble the per-shard parts into the ONE artifact name #1564's prior-snapshot fetch reads,
      # so a PR run leaves the same lineage a single-shard run does. Only on the sharded path: a
      # single-shard run already uploaded that name itself.
      - name: Collect the shard scorecards
        id: parts
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != ''))
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: corpus-drift-scorecard-part-*
          merge-multiple: true
          path: parts

      - name: Collect the independent replay parts
        id: replay-parts
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.prepare-current-inputs.outputs.relevant == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: current-mechanical-replay-part-*
          merge-multiple: true
          path: replay-parts

      # The shards are disjoint by construction (src/scan/corpus-shards.ts asserts the partition is
      # exhaustive and non-overlapping), so `rows` concatenates and the `findings` maps merge with no
      # key collisions. A short-circuited run uploads no parts at all, which is not a failure — there
      # is simply nothing to merge, and the declared no-op is the record.
      - name: Merge the shard scorecards into corpus-drift.json
        id: merge
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != ''))
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(parts/corpus-drift-shard*.json)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "No shard scorecards to merge — this run short-circuited or scored nothing. Nothing to reassemble."
            exit 0
          fi
          echo "Merging ${#parts[@]} shard scorecard(s): ${parts[*]}"
          jq -s '{
            rows: (map(.rows) | add),
            findings: (map(.findings) | add),
            detectors: (map(.detectors // {}) | add),
            mechanicalContexts: (map(.mechanicalContexts // {}) | add),
            mechanicalRuns: (map(.mechanicalRuns // {}) | add),
            scannerRecords: (map(.scannerRecords // {}) | add),
            dependencyPreparations: (map(.dependencyPreparations // {}) | add),
            phaseSeconds: (map(.phaseSeconds // {}) | add),
            runtimeReceipts: (map(.runtimeReceipts // {}) | add),
            conservation: (map(.conservation // []) | add),
            shardProfiles: map(.shardProfile),
            executions: map(.execution // null)
          }' "${parts[@]}" > corpus-drift.json
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Merged scorecard: $(jq '.rows | length' corpus-drift.json) rows over $(jq '.findings | keys | length' corpus-drift.json) target(s)."

      - uses: actions/checkout@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          path: source
      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.merged == 'true'
        with:
          node-version-file: source/.nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.merge.outputs.merged == 'true'
        working-directory: source
      - name: Current registry producer ↔ independent replay equivalence/readiness
        if: steps.merge.outputs.merged == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: |
          set -euo pipefail
          producer_parts=(../parts/corpus-drift-shard*.json)
          replay_parts=(../replay-parts/current-replay-*.json)
          for part in "${producer_parts[@]}"; do jq -e '.currentMechanicalExecution' "$part" > "$part.current.json"; done
          printf -v producer_csv '%s,' "${producer_parts[@]/%/.current.json}"
          producer_csv=${producer_csv%,}
          printf -v replay_csv '%s,' "${replay_parts[@]}"
          replay_csv=${replay_csv%,}
          pnpm validate:current-mechanical-readiness --merge "$producer_csv" --out ../current-hosted-producer.json
          pnpm validate:current-mechanical-readiness --merge "$replay_csv" --out ../current-independent-replay.json
          pnpm validate:current-mechanical-readiness --producer ../current-hosted-producer.json --replay ../current-independent-replay.json
          echo "This proves two fresh current registry executions agree. It is NOT #1851.6/.7 historical manual→registry proof; #1886 remains open and exclusive."
        working-directory: source

      - name: Collect the executed-head relevance receipt for PR check-in
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'pull_request' && needs.prepare-current-inputs.outputs.relevant == 'true'
        uses: actions/download-artifact@v4
        with:
          name: corpus-relevance-receipt
          path: checkin-relevance

      # Query the current attempt, not the run's latest/default attempt. At this point all three
      # producer shards and all three replay jobs are terminal; this aggregate job necessarily is
      # not, so the sample records aggregateFinalCompletedAt=null and makes no required-context
      # duration claim. The retained raw row lets a later campaign attach that terminal interval.
      - name: Read raw Actions jobs for the PR check-in envelope
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'pull_request' && needs.prepare-current-inputs.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            | jq '{jobs: map(.jobs) | add}' > corpus-checkin-jobs.json

      - name: Build the provenance-bound PR check-in sample
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'pull_request' && needs.prepare-current-inputs.outputs.relevant == 'true'
        run: |
          pnpm exec tsx src/cli/corpus-checkin-sample.ts \
            --scorecard ../corpus-drift.json \
            --relevance ../checkin-relevance/corpus-relevance.json \
            --jobs ../corpus-checkin-jobs.json \
            --evidence-dir ../parts \
            --producer ../current-hosted-producer.json \
            --replay ../current-independent-replay.json \
            --out ../corpus-checkin-performance-sample.json \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --actions-head-sha '${{ github.event.pull_request.head.sha }}' \
            --execution-head-sha '${{ github.sha }}' \
            --event pull_request \
            --ref '${{ github.ref }}' \
            --requested-runner '${{ needs.prepare-current-inputs.outputs.runner }}'
        working-directory: source

      - name: Upload the PR check-in sample and every raw input
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'pull_request' && needs.prepare-current-inputs.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-checkin-performance-sample
          path: |
            corpus-checkin-performance-sample.json
            corpus-checkin-jobs.json
            corpus-drift.json
            current-hosted-producer.json
            current-independent-replay.json
            checkin-relevance/corpus-relevance.json
            parts/**
          if-no-files-found: error

      - name: Read raw Actions jobs for the benchmark timing envelope
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            | jq '{jobs: map(.jobs) | add}' > corpus-benchmark-jobs.json

      - name: Build the provenance-bound benchmark sample
        if: steps.merge.outputs.merged == 'true' && github.event_name == 'workflow_dispatch' && inputs.benchmark_run_identity != '' && !inputs.benchmark_seed_bundle
        run: |
          pnpm corpus-benchmark-sample \
            --scorecard ../corpus-drift.json \
            --jobs ../corpus-benchmark-jobs.json \
            --evidence-dir ../parts \
            --out ../corpus-benchmark-sample.json \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --head-sha '${{ github.sha }}' \
            --benchmark-seed '${{ inputs.benchmark_seed }}' \
            --benchmark-seed-run-id '${{ inputs.benchmark_seed_run_id }}' \
            --benchmark-seed-run-attempt '${{ inputs.benchmark_seed_run_attempt }}' \
            --repeat '${{ inputs.benchmark_repeat }}' \
            --runner-role '${{ needs.prepare-current-inputs.outputs.runner-role }}' \
            --requested-runner '${{ needs.prepare-current-inputs.outputs.runner }}' \
            --profile '${{ inputs.cache_profile }}' \
            --design '${{ inputs.execution_design }}' \
            --concurrency '${{ inputs.target_concurrency }}' \
            --shard-count '${{ inputs.shard_count }}' \
            --workflow-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}'
        working-directory: source

      - name: Upload the merged drift scorecard
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-drift-scorecard
          path: |
            corpus-drift.json
            current-hosted-producer.json
            current-independent-replay.json
            corpus-benchmark-jobs.json
            corpus-benchmark-sample.json
          if-no-files-found: warn
