# The conservation gate on a schedule (#1064's invariants 4/5 and #1096's invariant 1). Runs the
# REAL ten-module orchestrator against targets/calibration, assembles the REAL deliverable, and
# asserts (a) every module's planted finding survived probe → deliverable and (b) the arithmetic:
# produced == delivered + deduped + suppressed + capped, with any unaccounted delta a failure.
#
# Why this is NOT part of `pnpm verify` (the required per-PR check): validate-conservation drives
# the mechanical tier, so it needs semgrep/trufflehog/gitleaks/osv-scanner on PATH, the `vitals`
# plugin for M3's full tier, plus full git history for the target — none of which the `verify` job
# has, on exactly the precedent dry-run-drift.yml and corpus-drift.yml set. What IS under `verify`
# is the gate's LOGIC (src/audit-conservation.test.ts, src/conservation-ledger.test.ts, each
# violation seeded and proven to fail) and one wiring run through the CLI. This job proves the
# wiring against the real binaries.
#
# Until this existed the gate ran only when a human ran it — the shape #350 is about: a guard that
# is true of the code, has tests, and is never actually executed.
#
# THE NEGATIVE CONTROL IS PART OF THE JOB. Step 2 seeds a loss (--seed-loss M7 discards everything
# M7's probe produced) and step 3 seeds an unaccounted drop (--seed-unaccounted removes one row from
# the assembled deliverable with no disposition); both MUST exit non-zero. A green run therefore
# means "the gate passed AND the gate can still fail", which is a different and much stronger claim
# than "the gate passed" — #1065 found a guard that had been unable to fire for nine months.
#
# On failure of step 1: a finding was produced and did not reach the deliverable, or a module
# produced nothing for its plant. That is a scanner or pipeline bug (the #1040/#1050/#1061/#1062
# class), never something to rebaseline — there is no baseline here to move.
# On failure of step 2 or 3: the gate itself stopped working. Fix the gate before trusting step 1.

name: conservation

on:
  schedule:
    - cron: "30 7 * * *" # Daily 07:30 UTC — after dry-run-drift
  workflow_dispatch:
  pull_request:
    paths:
      - "src/audit-conservation.ts"
      - "src/conservation-ledger.ts"
      - "src/audit-runner.ts"
      - "src/audit-runners.ts"
      - "src/audit-report.ts"
      - "src/cli/validate-conservation.ts"
      - "src/cli/run-audit.ts"
      - "targets/calibration/**"
      - ".github/workflows/conservation.yml"

concurrency:
  group: conservation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conservation:
    name: plant → deliverable, and the produced/delivered arithmetic
    runs-on: ubuntu-latest
    # issues: write so a scheduled failure can find-or-update its tracking issue (#1142, mirroring
    # #1138). contents: read is restated because a job-level block replaces (not extends) the
    # top-level one.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 20
    steps:
      # The M3 probe reads the target's authorship history and the M1 secrets tier reads git history,
      # so a shallow clone would degrade both into honest-but-useless not-run rows.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Same pins as dry-run-drift.yml / corpus-drift.yml — each scanner degrades to "found nothing"
      # without its binary rather than failing loudly, which here would look like a module that
      # legitimately produced nothing instead of the missing toolchain it is.
      - name: Install mechanical-tier scanner binaries
        run: |
          set -euo pipefail
          pipx install semgrep
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          chmod +x "$HOME/.local/bin/osv-scanner"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # M3's FULL tier is the `vitals` plugin. Without it hotspot-scan drops to the reduced
      # churn×complexity tier (#807), which computes a ranking but no knowledge-risk analysis — so
      # it structurally cannot produce M3's planted truck-factor-1 row and the gate correctly
      # reported `GONE M3` on this workflow's first run. vitals is not on npm/PyPI, but it is a
      # public zero-dependency Python 3 repo, so CI can have the real thing rather than an excuse.
      #
      # Pinned by commit, not by branch: src/cli/hotspot-scan.ts asserts the install reports
      # EXPECTED_VITALS_VERSION (0.2.0), the version src/hotspot-scan.ts's report schema was
      # verified against (#94/#369/#808). A floating clone that moved to 0.3.0 would exit 1 on that
      # check — loud, and correct, but it would block this job on an unrelated upstream release.
      # Bumping the pin means re-verifying the schema first.
      - name: Install the vitals plugin (M3's full tier)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/vitals"
          git -C "$HOME/vitals" init -q
          git -C "$HOME/vitals" fetch -q --depth 1 https://github.com/chopratejas/vitals.git 9c580c8160c7c58cbf2cef821a8d92cfcbb2fd62
          git -C "$HOME/vitals" checkout -q FETCH_HEAD
          echo "$HOME/vitals/scripts" >> "$GITHUB_PATH"

      # Asserted in its own step so a broken install (upstream gone, network, a bad pin) reads as
      # "vitals is missing" here rather than as `GONE M3` three steps later. The gate's own message
      # does quote the probe's reason, so nothing is lost either way — this just puts the toolchain
      # failure where a toolchain failure belongs, one step after the install.
      - name: Assert vitals resolves at the pinned version
        run: |
          set -euo pipefail
          vitals_cli.py version

      - name: Conservation gate (must PASS)
        run: pnpm exec tsx src/cli/validate-conservation.ts

      # #1105: the vitest wiring test for this gate (src/cli/validate-conservation.test.ts) is
      # opt-in behind HARVEY_CONSERVATION_E2E — inside `pnpm verify`'s shared worker pool its
      # ~30-50s synchronous child-process run intermittently starved vitest's worker RPC channel
      # ("Timeout calling onTaskUpdate", exit 1 with zero failing tests). Run it here instead,
      # alone, with the toolchain already on PATH from the steps above.
      - name: Conservation gate — vitest wiring test (isolated from pnpm verify)
        env:
          HARVEY_CONSERVATION_E2E: "1"
        run: pnpm exec vitest run src/cli/validate-conservation.test.ts

      - name: Negative control — a seeded producer loss must FAIL the gate
        run: |
          if pnpm exec tsx src/cli/validate-conservation.ts --seed-loss M7; then
            echo "::error::--seed-loss M7 discarded everything the M7 probe produced and the gate still exited 0. The gate cannot fail, so its PASS above means nothing (#350/#1065)."
            exit 1
          fi

      - name: Negative control — a seeded unaccounted drop must FAIL the ledger
        run: |
          if pnpm exec tsx src/cli/validate-conservation.ts --seed-unaccounted; then
            echo "::error::--seed-unaccounted removed a finding from the assembled deliverable with no disposition and the conservation ledger still exited 0. The arithmetic is not being asserted (#1096)."
            exit 1
          fi

      # Scheduled runs go red on a branch nobody watches (#1128/#1138's precedent, applied here by
      # #1142). On a scheduled failure, find-or-update ONE tracking issue by the marker label:
      # comment on the open one if it exists, otherwise create it. Never fires on PR/push — those
      # failures are already visible on the PR.
      - name: Open or update the conservation tracking issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ci-conservation-alert
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "$MARKER" --color B60205 \
            --description "Auto-opened when the scheduled conservation CI run fails" 2>/dev/null || true
          body="The scheduled \`conservation\` run failed (run: $RUN_URL). Either a planted finding didn't survive probe → deliverable, the produced/delivered arithmetic came up unaccounted, or a negative control stopped failing — see the job log for which step. This is a scanner or pipeline bug (or the gate itself broke); there is no baseline here to move. Close this issue once green."
          existing=$(gh issue list --state open --label "$MARKER" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "conservation scheduled run failing" --label "$MARKER" --body "$body"
          fi
