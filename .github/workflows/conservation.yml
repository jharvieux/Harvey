# The conservation gate on a schedule (#1064's invariants 4/5 and #1096's invariant 1). Runs the
# REAL ten-module orchestrator against targets/calibration, assembles the REAL deliverable, and
# asserts (a) every module's planted finding survived probe → deliverable and (b) the arithmetic:
# produced == delivered + deduped + suppressed + capped, with any unaccounted delta a failure.
#
# Why this is NOT part of `pnpm verify` (the required per-PR check): validate-conservation drives
# the mechanical tier, so it needs semgrep/trufflehog/gitleaks/osv-scanner on PATH, the `vitals`
# plugin for M3's full tier, plus full git history for the target — none of which the `verify` job
# has, on exactly the precedent dry-run-drift.yml and corpus-drift.yml set. What IS under `verify`
# is the gate's LOGIC (src/audit-conservation.test.ts, src/conservation-ledger.test.ts, each
# violation seeded and proven to fail) and one wiring run through the CLI. This job proves the
# wiring against the real binaries.
#
# Until this existed the gate ran only when a human ran it — the shape #350 is about: a guard that
# is true of the code, has tests, and is never actually executed.
#
# THE NEGATIVE CONTROL IS PART OF THE JOB. Step 2 seeds a loss (--seed-loss M7 discards everything
# M7's probe produced) and step 3 seeds an unaccounted drop (--seed-unaccounted removes one row from
# the assembled deliverable with no disposition); both MUST exit non-zero. A green run therefore
# means "the gate passed AND the gate can still fail", which is a different and much stronger claim
# than "the gate passed" — #1065 found a guard that had been unable to fire for nine months.
#
# On failure of step 1: a finding was produced and did not reach the deliverable, or a module
# produced nothing for its plant. That is a scanner or pipeline bug (the #1040/#1050/#1061/#1062
# class), never something to rebaseline — there is no baseline here to move.
# On failure of step 2 or 3: the gate itself stopped working. Fix the gate before trusting step 1.
#
# REQUIRED STATUS CHECK on `main` since #1205 (operator ruling 2026-07-27). PR #1199 squash-merged
# while this job was RED: a gate built to stop silent drops was itself advisory on the merge path,
# which is the very shape it exists to prevent. The daily schedule plus `ci-conservation-alert`
# (#1142) catches a red run afterwards — that is detection, not prevention. The precondition was
# #1206's flakiness (4 red in 8 runs, the vitals fixture-drift step); five consecutive green runs
# were measured before this flipped.
#
# Being required is why this workflow has NO `paths:` filter on `pull_request` any more. GitHub
# waits forever for a required context that never reports, so a path-filtered required check
# deadlocks every PR outside its filter — the exact deadlock #1107 hit when dry-run-drift became
# required. The filter therefore moved INSIDE the job (the `filter` step below): the job always
# runs and always reports, and only the expensive work is conditional. The path list is unchanged
# by that move — same set, evaluated one layer down.
#
# THE FILTER HAS TWO TIERS, because this job does two unrelated things.
#   `relevant` — the GATE (orchestrator + ledger + negative controls, ~245s). Change-based: it
#                asks whether THIS diff could have altered a planted finding's route to the
#                deliverable. Correct to gate on the change set.
#   `drift`    — the nine CAPTURED-FIXTURE checks (#1266 added semgrep + gitleaks to the prior
#                seven). TIME-based, not change-based: each re-runs a pinned external tool and
#                asserts the FRESH output still satisfies the committed contract, so what they
#                detect is an UPSTREAM release changing a tool's output schema (the #1063
#                invariant). Nothing in a diff that touches no fixture, no contract and no drift
#                CLI can make them say anything about that PR — measured 2026-07-27 (pre-#1266,
#                seven checks): 10 of the last 50 commits ran all of them with no possible relevance.
#                They now run on the daily schedule (which is what upstream drift is a function of)
#                and on PRs only when the fixtures or their machinery actually move.
# This also takes #1206's flake off the merge path — and this job is now a REQUIRED check, so a
# flaky step that carries no PR-relevant signal was sitting where it could block a merge for reasons
# unrelated to the change. That flake was ROOT-CAUSED by #1703 (2026-07-31): git >= 2.54 detaches
# `git maintenance run --auto` after every commit, and one of those background processes repacks and
# unlinks the loose objects the vitals re-capture seed is still writing to. `src/__fixtures__/
# vitals-recapture/seed.py` now disables auto maintenance in the throwaway corpus and asserts nothing
# packed it; the 85 local runs that failed to reproduce it in 2026-07-27 were on git 2.43, which does
# not detach at all.
#
# THE TWO TIERS RUN INDEPENDENTLY, AND THE GATE GOES FIRST (#1703). Steps below the `toolchain`
# marker use `!cancelled()` rather than GitHub's default `success()`, so a failure in either tier can
# no longer skip the other — the shape that let a vitals schema-drift failure suppress the gate this
# context is NAMED for, plus both negative controls and four sibling drift checks, on run
# 30644789486. Every step still fails the job; nothing is `continue-on-error`.

name: conservation

on:
  schedule:
    - cron: "30 7 * * *" # Daily 07:30 UTC — after dry-run-drift
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-conservation-alert path fires end-to-end (#1287). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509). SKIPS the gate and its negative controls, leaving a job every one of whose steps succeeds — the guard is then the only thing that can turn it red."
        type: boolean
        default: false
  pull_request:
  # #1498: merge queue. Without this the required `plant → deliverable, and the produced/delivered
  # arithmetic` context never reports on a queue entry and the queue deadlocks.
  merge_group:

# A cancellation here is only ever caused by a NEWER run on the same `github.ref` — for a PR that
# is `refs/pull/N/merge`, so the superseding run reports against the newer head commit, which is
# the commit branch protection actually evaluates. A `cancelled` conclusion is therefore never the
# latest result for the head SHA and cannot strand a merge. (Same posture dry-run-drift.yml and
# ci.yml already take for their required contexts.)
concurrency:
  group: conservation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conservation:
    name: plant → deliverable, and the produced/delivered arithmetic
    runs-on: ubuntu-latest
    # issues: write so a scheduled failure can find-or-update its tracking issue (#1142, mirroring
    # #1138). contents: read is restated because a job-level block replaces (not extends) the
    # top-level one.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 20
    # The receipt both validate-conservation.ts and .github/actions/gate-liveness read. A literal
    # path, not ${{ runner.temp }}: the `runner` context is not available in a job-level `env:` block.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      # The M3 probe reads the target's authorship history and the M1 secrets tier reads git history,
      # so a shallow clone would degrade both into honest-but-useless not-run rows. fetch-depth: 0
      # is also what lets the filter step below diff against the PR base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First step on purpose: the drill is about the ALERT path, not this pipeline, so it must not
      # pay for a 20-minute conservation run to reach it. Everything below is skipped once it fails.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287): failing on purpose so the tracking-issue step runs under the real job token. This is NOT a conservation failure."
          exit 1

      # The `paths:` filter that used to live on the `pull_request` trigger, moved in-job by #1205
      # so this context reports on EVERY PR (see the header note on the #1107 deadlock). `case`
      # patterns, not pathspecs: in `case` a `*` matches `/` too, so `src/scan/*` covers the whole
      # subtree. Schedule and workflow_dispatch always run the full job.
      - id: filter
        name: Does this change set touch the conservation pipeline or its fixtures?
        run: |
          # #1498: a merge-queue entry is NOT a schedule. It runs the GATE (relevant) but must NOT
          # run the nine captured-fixture drift checks. Those re-run PINNED EXTERNAL TOOLS and
          # detect an upstream release moving a tool's output schema — so gating the queue on them
          # would make merges fail for reasons that have nothing to do with the batch being merged,
          # and would put an unrelated third party on the critical path to every merge. They stay
          # on the daily schedule, which is the cadence that actually matches what they detect.
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # BOTH flags. The scheduled run is the ONLY thing that executes the drift checks on a
            # regular cadence now, so forgetting `drift` here would silently retire all nine —
            # a guard that still exists, still passes, and can no longer fire.
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
          echo "Changed files:"
          echo "$files"
          relevant=false
          drift=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/audit-conservation.ts) relevant=true ;;
              src/conservation-ledger.ts) relevant=true ;;
              src/audit-runner.ts) relevant=true ;;
              src/audit-runners.ts) relevant=true ;;
              src/audit-report.ts) relevant=true ;;
              src/cli/validate-conservation.ts) relevant=true ;;
              src/cli/run-audit.ts) relevant=true ;;
              targets/calibration/*) relevant=true ;;
            esac
            # The captured-fixture contracts. These make the drift checks meaningful AND can change
            # what the probes parse, so they set both flags.
            case "$f" in
              src/cli/fixture-drift.ts|src/cli/osv-fixture-drift.ts) relevant=true; drift=true ;;
              src/scan/fixture-drift-contracts.ts) relevant=true; drift=true ;;
              src/scan/__fixtures__/*|src/__fixtures__/*) relevant=true; drift=true ;;
              .github/workflows/conservation.yml) relevant=true; drift=true ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "false" ]; then
            echo "No change to the conservation pipeline, its probes, its fixtures or this workflow — a planted finding's route to the deliverable cannot have changed from this PR. Nothing to assert. The daily scheduled run covers the tree regardless."
          fi
          if [ "$relevant" = "true" ] && [ "$drift" = "false" ]; then
            echo "Running the gate but SKIPPING the 9 captured-fixture drift checks: they re-run pinned external tools and assert the FRESH output still satisfies the committed contract, so they detect an UPSTREAM release changing a tool's output schema. That is a function of time, not of this diff — no change to a fixture, a contract or the drift CLI can make them say anything about this PR. The daily scheduled run executes all of them."
          fi

      # #1509: a short-circuited job and a dead job are both "no scoring happened", and until now they
      # looked identical from outside. The no-op is DECLARED, with its reason, so the assert step at
      # the end can pass it while still printing something a reader cannot mistake for a scoring run.
      - name: Declare the no-op (a short-circuit must not read like a scoring run)
        if: steps.filter.outputs.relevant != 'true'
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: conservation-plants, conservation-negative-controls
          status: declared-no-op
          scope: "in-job filter found no change to the conservation pipeline, its probes, its fixtures or this workflow — nothing was scored, and this run is evidence about nothing. The daily scheduled run covers the tree regardless."

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.relevant == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.relevant == 'true'

      # Same pins as dry-run-drift.yml / corpus-drift.yml — each scanner degrades to "found nothing"
      # without its binary rather than failing loudly, which here would look like a module that
      # legitimately produced nothing instead of the missing toolchain it is.
      - name: Install mechanical-tier scanner binaries
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/mechanical-binaries

      # M3's FULL tier is the `vitals` plugin. Without it hotspot-scan drops to the reduced
      # churn×complexity tier (#807), which computes a ranking but no knowledge-risk analysis — so
      # it structurally cannot produce M3's planted truck-factor-1 row and the gate correctly
      # reported `GONE M3` on this workflow's first run. vitals is not on npm/PyPI, but it is a
      # public zero-dependency Python 3 repo, so CI can have the real thing rather than an excuse.
      #
      # Pinned by commit, not by branch: src/cli/hotspot-scan.ts asserts the install reports
      # EXPECTED_VITALS_VERSION (0.2.0), the version src/hotspot-scan.ts's report schema was
      # verified against (#94/#369/#808). A floating clone that moved to 0.3.0 would exit 1 on that
      # check — loud, and correct, but it would block this job on an unrelated upstream release.
      # Bumping the pin means re-verifying the schema first.
      - name: Install the vitals plugin (M3's full tier)
        if: steps.filter.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/vitals"
          git -C "$HOME/vitals" init -q
          git -C "$HOME/vitals" fetch -q --depth 1 https://github.com/chopratejas/vitals.git 9c580c8160c7c58cbf2cef821a8d92cfcbb2fd62
          git -C "$HOME/vitals" checkout -q FETCH_HEAD
          echo "$HOME/vitals/scripts" >> "$GITHUB_PATH"

      # Asserted in its own step so a broken install (upstream gone, network, a bad pin) reads as
      # "vitals is missing" here rather than as `GONE M3` three steps later. The gate's own message
      # does quote the probe's reason, so nothing is lost either way — this just puts the toolchain
      # failure where a toolchain failure belongs, one step after the install.
      - name: Assert vitals resolves at the pinned version
        if: steps.filter.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          vitals_cli.py version

      # #1703: THE TWO TIERS MUST NOT BE ABLE TO SKIP EACH OTHER, AND THE GATE GOES FIRST.
      #
      # Everything above this point is setup: a failure there means nothing below can say anything,
      # so those steps keep GitHub's default `success()` semantics and correctly abort the job. This
      # step is the boundary marker. Every step below it runs when the TOOLCHAIN is good, regardless
      # of whether a sibling step failed — `!cancelled()` rather than `always()`, because this
      # workflow sets `cancel-in-progress: true` and a superseded run must not spend 20 minutes.
      #
      # What this fixes: on run 30644789486 the vitals drift check failed and GitHub skipped
      # `Conservation gate (must PASS)`, both negative controls, and four of the other eight drift
      # checks. The required context is named `plant → deliverable, and the produced/delivered
      # arithmetic` — so a TIME-based upstream schema drift was silently suppressing the CHANGE-based
      # gate the context is named for, and the run reported red for a reason that had nothing to do
      # with planting or arithmetic. The tiers are independent by construction (one is a function of
      # an upstream release, the other of this diff); nothing about that independence survives if one
      # can skip the other.
      #
      # Not separate jobs: the required context IS this job's name, so splitting would move the nine
      # drift checks into a new context that is not registered as required — silently demoting nine
      # gates to advisory, which is the #1509 shape. Not `continue-on-error`: that would make a real
      # drift failure green. Ordering is now gate-then-drift so the 20-minute budget is spent on the
      # named gate first (Stryker + lighthouse dominate the drift tier's runtime).
      - id: toolchain
        name: Toolchain ready — the tier boundary (#1703)
        if: steps.filter.outputs.relevant == 'true'
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Conservation gate (must PASS)
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && !inputs.liveness_drill }}
        run: pnpm exec tsx src/cli/validate-conservation.ts

      # #1105: the vitest wiring test for this gate (src/cli/validate-conservation.test.ts) is
      # opt-in behind HARVEY_CONSERVATION_E2E — inside `pnpm verify`'s shared worker pool its
      # ~30-50s synchronous child-process run intermittently starved vitest's worker RPC channel
      # ("Timeout calling onTaskUpdate", exit 1 with zero failing tests). Run it here instead,
      # alone, with the toolchain already on PATH from the steps above.
      - name: Conservation gate — vitest wiring test (isolated from pnpm verify)
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' }}
        env:
          HARVEY_CONSERVATION_E2E: "1"
        run: pnpm exec vitest run src/cli/validate-conservation.test.ts

      - id: nc_loss
        name: Negative control — a seeded producer loss must FAIL the gate
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && !inputs.liveness_drill }}
        run: |
          if pnpm exec tsx src/cli/validate-conservation.ts --seed-loss M7; then
            echo "::error::--seed-loss M7 discarded everything the M7 probe produced and the gate still exited 0. The gate cannot fail, so its PASS above means nothing (#350/#1065)."
            exit 1
          fi

      - id: nc_unaccounted
        name: Negative control — a seeded unaccounted drop must FAIL the ledger
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && !inputs.liveness_drill }}
        run: |
          if pnpm exec tsx src/cli/validate-conservation.ts --seed-unaccounted; then
            echo "::error::--seed-unaccounted removed a finding from the assembled deliverable with no disposition and the conservation ledger still exited 0. The arithmetic is not being asserted (#1096)."
            exit 1
          fi

      # The negative controls are a SEPARATE claim from the gate, so they get their own record: a
      # gate nobody has watched fail is indistinguishable from one that cannot (#350/#1065), and an
      # `if:` that quietly stopped matching would retire both controls in silence. Recorded here
      # rather than by the CLI because what is being asserted is that both steps EXECUTED — the CLI
      # runs are supposed to exit non-zero.
      #
      # #1703: conditioned on the two control steps BY ID, not on `success()`. `success()` meant "no
      # earlier step in this job failed", so a drift check nine steps away could silently retire this
      # record — which is exactly what happened on run 30644789486. By id it records when, and only
      # when, both controls did their job.
      - name: Record that both negative controls executed
        if: ${{ !cancelled() && steps.nc_loss.outcome == 'success' && steps.nc_unaccounted.outcome == 'success' }}
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: conservation-negative-controls
          units: 2
          scope: "seeded producer loss (--seed-loss M7) + seeded unaccounted drop (--seed-unaccounted), both required to exit non-zero"

      # Captured-fixture schema-drift checks (#1130): re-run each pinned tool against a reproducible
      # seed and assert the FRESH output still satisfies the contract the committed fixture and its
      # parser depend on (the #1063 invariant). jscpd/knip/lighthouse are node deps installed by
      # pnpm; trufflehog/semgrep/gitleaks are installed by the mechanical-binaries action above;
      # vitals is on PATH from the steps above; stryker installs the target's own dep tree via npx;
      # lighthouse uses the runner's preinstalled Google Chrome via chrome-launcher.
      # semgrep and gitleaks (#1266) closed the last gap in this family: FIXTURE-INVENTORY.md claimed
      # "every CAPTURED fixture now has a drift check" while these two had none, because #1165
      # recaptured them 24 minutes before #1170 landed this family. The two live-only fixtures
      # (trufflehog VERIFIED, PostgREST) have no capture and so no drift check — they are reason-blocked.
      #
      # Each check is independent of the other eight for the same reason it is independent of the
      # gate: they watch nine DIFFERENT upstream tools. On run 30644789486 vitals failed and Stryker,
      # lighthouse, semgrep and gitleaks were skipped, so that run is evidence about one tool and
      # silence about four — the shape a drift check exists to prevent, reached through the CI graph.
      - name: OSV-scanner fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/osv-fixture-drift.ts
      - name: jscpd fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool jscpd
      - name: knip fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool knip
      - name: trufflehog fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool trufflehog
      - name: vitals fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool vitals --fixture /nonexistent/vitals-report.json
      - name: Stryker fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool stryker
      - name: lighthouse fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool lighthouse
      - name: semgrep fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool semgrep
      - name: gitleaks fixture schema drift check
        if: ${{ !cancelled() && steps.toolchain.outputs.ready == 'true' && steps.filter.outputs.drift == 'true' }}
        run: pnpm exec tsx src/cli/fixture-drift.ts --tool gitleaks

      # #1509: without this, a job that died in setup reports the same absence of drift as a job that
      # ran the whole pipeline and found none. `always()` so it still reports after an earlier step
      # failed — naming the phase that never ran is exactly what that case needs. Excluded on the
      # alert drill, which fails on purpose before anything is scored.
      - name: Gate liveness — did this job actually assert anything?
        if: always() && !inputs.alert_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: conservation-plants, conservation-negative-controls

      # Scheduled runs go red on a branch nobody watches (#1128/#1138's precedent, applied here by
      # #1142). On a scheduled failure, find-or-update ONE tracking issue by the marker label.
      # Still never fires on PR/push — those failures are already visible on the PR — but
      # `workflow_dispatch` is now permanently in the condition (#1287): an alert path that can only
      # run on a cron nobody can trigger is an alert path nobody can prove works, and this one had
      # never executed once.
      - name: Open or update the conservation tracking issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-conservation-alert
          label-description: Auto-opened when the scheduled conservation CI run fails
          title: conservation scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled `conservation` run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Either a planted finding didn't survive probe → deliverable, the produced/delivered arithmetic came up unaccounted, or a negative control stopped failing — see the job log for which step. This is a scanner or pipeline bug (or the gate itself broke); there is no baseline here to move. Close this issue once green."
