# M8 (mutation testing) for the external-repo corpus — issue #300.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM corpus-drift.yml, which scores every other module of the same
# targets: cost. This one runs a per-target FULL install (the target's own lockfile-implied package
# manager, since #1268) and then re-runs the target's whole test suite once per mutant — minutes per
# target on top of corpus-drift's own cost (MEASURED 2026-07-28, a real full-sweep run:
# ~20m35s scoring 13 targets, dominated by --install and semgrep/detect-static on the largest ones,
# NOT the ~2 minutes this comment used to claim — #1571), and the timeout has to be sized for the
# suite, not the scan. Folding this into the daily drift job would make the fast check as slow as
# the slow one, and a timeout bump there would be paying M8's cost on every module.
#
# Monthly, not weekly: the targets are pinned at a commit, so the only thing that can move an M8
# score is OUR wrapper's reading of Stryker's report — a much narrower surface than the source-tier
# detectors, and one that changes far less often. workflow_dispatch is the on-demand path when the
# wrapper itself changes; pull_request runs it when the M8 config or its scorer is edited, so a
# change to either is measured before it lands rather than a month later.
#
# On failure: the job names the target whose mutation score moved. As everywhere in this corpus,
# that is EITHER the target's suite changing under the pin (rebaseline in src/scan/external-corpus.ts
# with the measured note) OR our wrapper mis-reading the report (a scanner bug). Never something to
# silence.
#
# SCOPE — 4 of the corpus's 5 suite-carrying targets are scored here (inbox-zero and rallly joined
# proposit and boxyhq, #1268), and the remaining gap is deliberate, recorded, and NOT a silent skip
# (CLAUDE.md's coverage guard). multi-tenant-starter's suite starts a Docker Postgres container per
# run, which mutation testing would pay per mutant; saas-lite's suite is Playwright E2E only, so
# there is nothing to mutate. Both carry their measured reason in external-corpus.ts's
# M8_DOCKER_PER_MUTANT / M8_E2E_ONLY_SUITE. carbon carries its own recorded not-run reason too — the
# pnpm-aware install resolves its deps, but its own vitest configs need a monorepo build step
# #1268 did not attempt (see external-corpus.ts's M8 entry for carbon).

name: corpus-m8

on:
  schedule:
    - cron: "0 8 1 * *" # 1st of the month, 08:00 UTC — an hour after corpus-drift's weekly slot
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-corpus-m8-alert path fires end-to-end (#1287/#1333). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/scan/m8-corpus.ts"
      - "src/mutation-scan.ts"
      - "src/cli/mutation-scan.ts"
      - "src/cli/corpus-drift.ts"
      - "src/cli/corpus-pins.ts"
      - "src/scan/corpus-clone.ts"
      - ".github/workflows/corpus-m8.yml"
      - ".github/actions/corpus-clone-cache/**"

concurrency:
  group: corpus-m8-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # #1333: the alert path below find-or-updates ONE tracking issue on a scheduled failure.

jobs:
  mutation:
    name: install target deps + score M8 mutation baselines
    runs-on: ubuntu-latest
    # proposit/boxyhq: ~1s of Stryker each (21/35 mutants) on top of two non-workspace installs of
    # ~1000-1700 packages — each with its own lockfile-implied package manager since #1268, which
    # for proposit is pnpm, not npm. inbox-zero/rallly (#1268): pnpm workspace installs (~35-70s each,
    # MEASURED) plus a real Stryker run each (~100s for inbox-zero's 125 mutants, ~10s for rallly's
    # 30) — still low single-digit minutes total. The headroom is for the installs and for suites
    # that grow, not for the current mutant counts — a Stryker run that somehow hangs should die
    # here rather than burn an hour.
    timeout-minutes: 45
    steps:
      # Checkout first — the alert step at the end is a LOCAL composite action, so a drill that
      # fails before the checkout leaves `./.github/actions/alert-issue` unresolvable and proves
      # nothing. Everything expensive still comes after the drill.
      - uses: actions/checkout@v4

      # Before the four target installs and the Stryker runs on purpose: the drill proves the ALERT
      # path, not the mutation baselines, so it must not pay ~20 minutes to reach it.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287/#1333): failing on purpose so the tracking-issue step runs under the real job token. This is NOT an M8 baseline drift."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # #1571: same pin-keyed clone cache corpus-drift.yml uses — this job scores 4 of the same
      # pinned targets, so it rides corpus-drift's daily-warmed cache entry rather than re-cloning
      # cold every month.
      #
      # READ-ONLY on purpose: there is no `mode: save` step in this job, because the key hashes ALL
      # fourteen pins and this job only ever clones four. It did save, once, and that is what
      # poisoned the cache on 2026-07-30 — a 4-target tree took the 14-target key, corpus-drift's
      # complete tree was then refused as a duplicate, and every later run restored the partial one.
      # Warming this entry is corpus-drift.yml's job; this one consumes it.
      - name: Corpus clone cache
        id: corpus-cache
        uses: ./.github/actions/corpus-clone-cache

      # Only the targets with a scoreable suite. --install is redundant with --m8's own install for
      # these, but passing it keeps this job's M5-knip reading consistent with corpus-drift.yml's
      # rather than silently scoring knip against an uninstalled tree.
      - name: Score M8 mutation baselines
        env:
          HARVEY_CORPUS_CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
        run: |
          set -euo pipefail
          pnpm corpus-drift --target proposit --install --m8 --json corpus-m8-proposit.json
          pnpm corpus-drift --target boxyhq --install --m8 --json corpus-m8-boxyhq.json
          pnpm corpus-drift --target inbox-zero --install --m8 --json corpus-m8-inbox-zero.json
          pnpm corpus-drift --target rallly --install --m8 --json corpus-m8-rallly.json

      - name: Upload M8 scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-m8-scorecard
          path: corpus-m8-*.json
          if-no-files-found: warn

      # #1333: this job runs MONTHLY, so before this step a failure could sit unseen for up to 31
      # days on a branch nobody watches — the longest blind window of any gate in the repo. Never
      # fires on PR/push; workflow_dispatch is permanently in the condition (#1287) because a
      # cron-only alert path cannot be proven to work.
      - name: Open or update the corpus-m8 tracking issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-corpus-m8-alert
          label-description: Auto-opened when the monthly corpus-m8 mutation run fails
          title: corpus-m8 scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The monthly `corpus-m8` mutation run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). A target's mutation score moved off its baseline, or a target install/Stryker run errored — see the corpus-m8-scorecard artifact for the per-target table. That is EITHER the target's suite changing under its pin (rebaseline in src/scan/external-corpus.ts with the measured note) OR our wrapper mis-reading Stryker's report (a scanner bug). Never something to silence. Close this issue once green."
