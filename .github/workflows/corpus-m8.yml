# M8 (mutation testing) for the external-repo corpus — issue #300.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM corpus-drift.yml, which scores every other module of the same
# targets: cost. This one runs a per-target FULL install (the target's own lockfile-implied package
# manager, since #1268) and then re-runs the target's whole test suite once per mutant — minutes per
# target on top of corpus-drift's own cost (MEASURED 2026-07-28, a real full-sweep run:
# ~20m35s scoring 13 targets, dominated by --install and semgrep/detect-static on the largest ones,
# NOT the ~2 minutes this comment used to claim — #1571), and the timeout has to be sized for the
# suite, not the scan. Folding this into the daily drift job would make the fast check as slow as
# the slow one, and a timeout bump there would be paying M8's cost on every module.
#
# Monthly, not weekly: the targets are pinned at a commit, so the only thing that can move an M8
# score is OUR wrapper's reading of Stryker's report — a much narrower surface than the source-tier
# detectors, and one that changes far less often. workflow_dispatch is the on-demand path when the
# wrapper itself changes; pull_request runs it when the M8 config or its scorer is edited, so a
# change to either is measured before it lands rather than a month later.
#
# On failure: the job names the target whose mutation score moved. As everywhere in this corpus,
# that is EITHER the target's suite changing under the pin (rebaseline in src/scan/external-corpus.ts
# with the measured note) OR our wrapper mis-reading the report (a scanner bug). Never something to
# silence.
#
# SCOPE, RE-DERIVED 2026-07-31 (#1693) from src/scan/external-corpus.ts's 17 targets — the counts
# this block used to carry ("4 of the corpus's 5 suite-carrying targets") were hand-written and had
# gone stale, which is a version of the same defect #1692 was filed about:
#
#   * SIX are scored here, and they are exactly the slugs carrying an M8_CORPUS_CONFIGS entry:
#     saas-lite (#1818), proposit, boxyhq, inbox-zero, rallly (#1268) and multi-tenant-starter
#     (#1496, wired in by #1692). Five of them mutation-score the target's OWN suite unmodified.
#     multi-tenant-starter
#     does NOT: its own suite starts a Docker Postgres container per invocation, which Stryker would
#     pay per mutant (#1436's M8_DOCKER_PER_MUTANT, still recorded in external-corpus.ts as the
#     reason THAT suite is unscored), so m8-corpus.ts's `extraFiles` vendors a standalone DB-free
#     vitest suite into the disposable clone instead — see that target's M8 baseline note for the
#     accepted trade. src/scan/m8-corpus.test.ts fails if this step and that config list disagree,
#     which is exactly the drift that left #1496's new baseline re-measured by nobody.
#   * FIVE record an M8 not-run with a measured reason and no config yet: carbon (its workspaces
#     load a vitest config from a workspace package's BUILT output, which this job does not build),
#     and ghostfolio,
#     tanstack-com, cravab, flori-web (real suites detected; no measured `mutate` scope chosen yet).
#     Each carries a falsifier that exits 0 the moment an M8_CORPUS_CONFIGS entry lands.
#   * SIX are measured by corpus-drift.yml's source tier instead, where a FINDING is the
#     measurement rather than a percentage: subscription-payments, launch-mvp, mvp-boilerplate,
#     supabase-security-labs and effective emit #224's M8-00 zero-coverage High, and documenso emits
#     #932's M8-04 workspace measurement-gap.
#
# So none of the eleven unscored here is a silent skip (AGENTS.md's coverage guard) — every one
# carries its reason in external-corpus.ts. Re-derive these counts rather than quoting them.

name: corpus-m8

on:
  schedule:
    - cron: "0 8 1 * *" # 1st of the month, 08:00 UTC — an hour after corpus-drift's weekly slot
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-corpus-m8-alert path fires end-to-end (#1287/#1333). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/scan/m8-corpus.ts"
      - "src/scan/m8-corpus-artifacts.ts"
      - "src/scan/external-corpus.ts"
      - "src/mutation-scan.ts"
      - "src/cli/mutation-scan.ts"
      - "src/cli/corpus-m8.ts"
      - "src/cli/corpus-drift.ts"
      - "src/cli/corpus-pins.ts"
      - "src/scan/corpus-clone.ts"
      - ".github/workflows/corpus-m8.yml"
      - ".github/actions/corpus-clone-cache/**"

concurrency:
  group: corpus-m8-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # #1333: the alert path below find-or-updates ONE tracking issue on a scheduled failure.

jobs:
  plan:
    name: derive exact M8 target set
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The matrix is derived from M8_CORPUS_CONFIGS, while the same command accounts for every
      # remaining external-corpus target with its recorded non-mutation reason. A hand-maintained
      # target list cannot silently diverge from the manifest again.
      - name: Derive configured targets and counted non-mutation reasons
        id: plan
        run: pnpm exec tsx src/cli/corpus-m8.ts plan --github-output "$GITHUB_OUTPUT"

  mutation:
    name: M8 target (${{ matrix.target }})
    needs: plan
    if: ${{ !inputs.alert_drill }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    # The pre-change single job allowed 45 minutes. Each isolated target now gets 20: more than 2x
    # the measured 9m58s inbox-zero critical target, while a hung suite no longer holds five
    # already-finished targets hostage. The wrapper itself has no test-worker blocking window.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Authenticate private corpus mirrors
        uses: ./.github/actions/corpus-mirror-auth
        with:
          private-key: ${{ secrets.CORPUS_MIRROR_DEPLOY_KEY }}
      # Content-addressed clone reuse remains read-only and pin-keyed. Preparation/baseline output
      # is deliberately not reused: dependency installs execute target lifecycle scripts and the
      # unmutated baseline is part of Stryker's real mutation execution. Caching either result would
      # make a green score possible without exercising the current wrapper, defeating this gate.
      - name: Corpus clone cache
        id: corpus-cache
        uses: ./.github/actions/corpus-clone-cache
      - name: Prepare, baseline-test, mutate and score target
        env:
          HARVEY_CORPUS_CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
        run: pnpm exec tsx src/cli/corpus-m8.ts target --target "${{ matrix.target }}" --out "corpus-m8-${{ matrix.target }}/result.json"
      # A failed target still writes and uploads its status: aggregation, not matrix fail-fast,
      # owns the final verdict after every shard has had a chance to report.
      - name: Upload target result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-m8-${{ matrix.target }}
          path: corpus-m8-${{ matrix.target }}/
          if-no-files-found: error

  aggregate:
    name: M8 aggregate (all targets)
    needs: [plan, mutation]
    if: ${{ always() && (inputs.alert_drill || needs.plan.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checkout first because the final alert is a local composite action.
      - uses: actions/checkout@v4
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287/#1333): failing on purpose so the tracking-issue step runs under the real job token. This is NOT an M8 baseline drift."
          exit 1
      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.alert_drill }}
      - uses: actions/setup-node@v4
        if: ${{ !inputs.alert_drill }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: ${{ !inputs.alert_drill }}
        run: pnpm install --frozen-lockfile
      - name: Download every target result
        if: ${{ !inputs.alert_drill }}
        uses: actions/download-artifact@v4
        with:
          pattern: corpus-m8-*
          path: corpus-m8-artifacts
      - name: Validate, reconcile and aggregate
        if: ${{ !inputs.alert_drill }}
        run: pnpm exec tsx src/cli/corpus-m8.ts aggregate --artifacts corpus-m8-artifacts --out corpus-m8-aggregate.json
      - name: Upload reconciled M8 report
        if: ${{ !inputs.alert_drill && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: corpus-m8-aggregate
          path: corpus-m8-aggregate.json
          if-no-files-found: error
      # #1333: this job runs MONTHLY, so before this step a failure could sit unseen for up to 31
      # days. It never fires on PR/push; workflow_dispatch remains to prove the real alert path.
      - name: Open or update the corpus-m8 tracking issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-corpus-m8-alert
          label-description: Auto-opened when the monthly corpus-m8 mutation run fails
          title: corpus-m8 scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The monthly `corpus-m8` mutation aggregate failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). A target's mutation score moved, a shard failed, or a target artifact was missing/duplicate/corrupt — see the per-target artifacts and corpus-m8-aggregate report. Close this issue once green."
