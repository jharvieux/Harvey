          def purge(path: str) -> bool:
              try:
                  info = os.lstat(path)
              except FileNotFoundError:
                  return True
              if stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode):
                  try:
                      names = sorted(os.listdir(path))
                  except OSError:
                      return False
                  complete = True
                  for name in names:
                      complete = purge(os.path.join(path, name)) and complete
                  try:
                      os.rmdir(path)
                  except OSError:
                      complete = False
                  return complete
              try:
                  os.unlink(path)
                  return True
              except OSError:
                  return False

