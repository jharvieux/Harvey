# PROPOSED / UNAUTHORIZED: synthetic-only #1799 capability preflight bytes.
# Do not merge or dispatch without independent exact-byte review and direct user approval.
name: "#1799 hosted ARM64 capability preflight"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: issue-1799-hosted-arm64-preflight
  cancel-in-progress: false

jobs:
  capability-preflight:
    name: nonauthorizing synthetic ps/sandbox capability preflight
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Run, tear down, validate, then publish the synthetic preflight
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          HARVEY_EVENT_NAME: ${{ github.event_name }}
          HARVEY_HEAD_SHA: ${{ github.sha }}
          HARVEY_REF: ${{ github.ref }}
          HARVEY_REPOSITORY: ${{ github.repository }}
          HARVEY_RUN_ATTEMPT: ${{ github.run_attempt }}
          HARVEY_RUN_ID: ${{ github.run_id }}
          HARVEY_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          exec 3>&1
          exec >/dev/null 2>/dev/null

          readonly EXPECTED_PATH='.github/workflows/issue-1799-hosted-preflight.yml'
          readonly FIXED_PATH='/usr/bin:/bin:/usr/sbin:/sbin'
          readonly PYTHON='/usr/bin/python3'
          readonly SANDBOX_EXEC='/usr/bin/sandbox-exec'
          readonly ENV_BIN='/usr/bin/env'

          [[ "$HARVEY_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$HARVEY_REF" == 'refs/heads/main' ]]
          [[ "$HARVEY_RUN_ATTEMPT" == '1' ]]
          [[ "$HARVEY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HARVEY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$HARVEY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$HARVEY_WORKFLOW_REF" == "$HARVEY_REPOSITORY/$EXPECTED_PATH@$HARVEY_REF" ]]
          [[ "$RUNNER_OS" == 'macOS' ]]
          [[ "$RUNNER_ARCH" == 'ARM64' ]]
          [[ "$(/usr/bin/uname -m)" == 'arm64' ]]
          [[ "$ImageOS" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          [[ "$ImageVersion" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* ]]
          [[ "$GITHUB_STEP_SUMMARY" == /* && "$GITHUB_STEP_SUMMARY" != *$'\n'* ]]

          readonly DENY_NETWORK_PROFILE='(version 1)
          (allow default)
          (deny network*)'
          readonly DENY_PS_PROFILE='(version 1)
          (allow default)
          (deny network*)
          (deny process-exec (literal "/bin/ps"))'

          CONTROLLER_SOURCE=''
          CONTROLLER_READ_STATUS='0'
          IFS= read -r -d '' CONTROLLER_SOURCE <<'PY' || CONTROLLER_READ_STATUS="$?"
          from __future__ import annotations

          import errno
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import time

          PS_QUERY = ["/bin/ps", "-axo", "pid=,ppid=,pgid=,stat="]
          WORKFLOW_PATH = ".github/workflows/issue-1799-hosted-preflight.yml"
          BASE_KEYS = {"PATH", "HOME", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR"}
          PUBLIC_KEYS = {
              "HARVEY_EVENT_NAME", "HARVEY_HEAD_SHA", "HARVEY_IMAGE_OS",
              "HARVEY_IMAGE_VERSION", "HARVEY_REF", "HARVEY_REPOSITORY",
              "HARVEY_RUN_ATTEMPT", "HARVEY_RUN_ID", "HARVEY_RUNNER_ARCH",
              "HARVEY_RUNNER_OS", "HARVEY_RUNNER_TEMP", "HARVEY_WORKFLOW_REF",
          }
          PRE_ROOT_KEYS = BASE_KEYS | PUBLIC_KEYS | {"HARVEY_MODE"}
          RUN_KEYS = PRE_ROOT_KEYS | {"TMPDIR", "HARVEY_ROOT", "HARVEY_STAGING"}
          CHILD_KEYS = BASE_KEYS | {"TMPDIR", "HARVEY_ROOT"}
          EXPECTED_FILES = {
              "controller.py": 0o500,
              "helper.py": 0o500,
              "helper-descendant.py": 0o500,
              "network-child.py": 0o500,
              "network-grandchild.py": 0o500,
              "publisher.py": 0o500,
              "cleanup.py": 0o500,
              "deny-network.sb": 0o400,
              "deny-ps.sb": 0o400,
          }

          class ControlledStop(Exception):
              pass

          def require(value: bool) -> None:
              if not value:
                  raise ControlledStop()

          def bounded(value: str, pattern: str) -> bool:
              return re.fullmatch(pattern, value) is not None

          def validate_public_environment(expected_keys: set[str]) -> None:
              require(set(os.environ) == expected_keys)
              require(os.environ["PATH"] == "/usr/bin:/bin:/usr/sbin:/sbin")
              require(os.environ["HOME"] == "/var/empty")
              require(os.environ["LANG"] == "C")
              require(os.environ["LC_ALL"] == "C")
              require(os.environ["TZ"] == "UTC")
              require(os.environ["TERM"] == "dumb")
              require(os.environ["NO_COLOR"] == "1")
              require(os.environ["HARVEY_EVENT_NAME"] == "workflow_dispatch")
              require(os.environ["HARVEY_REF"] == "refs/heads/main")
              require(os.environ["HARVEY_RUN_ATTEMPT"] == "1")
              require(bounded(os.environ["HARVEY_HEAD_SHA"], r"[0-9a-f]{40}"))
              require(bounded(os.environ["HARVEY_RUN_ID"], r"[0-9]+"))
              require(bounded(os.environ["HARVEY_REPOSITORY"], r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"))
              expected_ref = f'{os.environ["HARVEY_REPOSITORY"]}/{WORKFLOW_PATH}@refs/heads/main'
              require(os.environ["HARVEY_WORKFLOW_REF"] == expected_ref)
              require(os.environ["HARVEY_RUNNER_OS"] == "macOS")
              require(os.environ["HARVEY_RUNNER_ARCH"] == "ARM64")
              require(bounded(os.environ["HARVEY_IMAGE_OS"], r"[A-Za-z0-9._-]{1,64}"))
              require(bounded(os.environ["HARVEY_IMAGE_VERSION"], r"[A-Za-z0-9._-]{1,64}"))
              require(os.path.isabs(os.environ["HARVEY_RUNNER_TEMP"]))
              uname = subprocess.run(
                  ["/usr/bin/uname", "-m"],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              require(uname.returncode == 0 and uname.stdout == b"arm64\n")

          def sha256_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

          def sha256_file(path: str) -> str:
              digest = hashlib.sha256()
              with open(path, "rb", buffering=0) as handle:
                  while True:
                      block = handle.read(65536)
                      if not block:
                          break
                      digest.update(block)
              return digest.hexdigest()

          def identity(path: str, expose_path: bool) -> dict[str, object]:
              info = os.stat(path, follow_symlinks=True)
              result: dict[str, object] = {
                  "mode": oct(stat.S_IMODE(info.st_mode)),
                  "sha256": sha256_file(path),
                  "uid": info.st_uid,
              }
              if expose_path:
                  result["path"] = path
              else:
                  result["pathSha256"] = sha256_bytes(path.encode("ascii"))
              return result

          def child_environment(root: str) -> dict[str, str]:
              return {
                  "PATH": "/usr/bin:/bin:/usr/sbin:/sbin",
                  "HOME": "/var/empty",
                  "TMPDIR": root,
                  "LANG": "C",
                  "LC_ALL": "C",
                  "TZ": "UTC",
                  "TERM": "dumb",
                  "NO_COLOR": "1",
                  "HARVEY_ROOT": root,
              }

          def wrapped_python(root: str, script: str) -> list[str]:
              env_args = [f"{key}={value}" for key, value in sorted(child_environment(root).items())]
              return [
                  "/usr/bin/sandbox-exec", "-f", os.path.join(root, "deny-network.sb"),
                  "/usr/bin/env", "-i", *env_args,
                  "/usr/bin/python3", "-I", "-S", script,
              ]

          def spawn_helper(root: str) -> subprocess.Popen[bytes]:
              return subprocess.Popen(
                  wrapped_python(root, os.path.join(root, "helper.py")),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  close_fds=True,
                  start_new_session=True,
              )

          def natural_wait(process: subprocess.Popen[bytes], seconds: float) -> int:
              deadline = time.monotonic() + seconds
              while process.poll() is None and time.monotonic() < deadline:
                  time.sleep(0.01)
              require(process.poll() is not None)
              return process.wait()

          def census(owned_pgid: int) -> dict[str, bool]:
              process = subprocess.Popen(
                  PS_QUERY,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  close_fds=True,
                  env={
                      "PATH": "/usr/bin:/bin:/usr/sbin:/sbin",
                      "HOME": "/var/empty",
                      "LANG": "C",
                      "LC_ALL": "C",
                      "TZ": "UTC",
                  },
              )
              require(process.stdout is not None)
              raw = bytearray()
              try:
                  while True:
                      block = process.stdout.read(65536)
                      if not block:
                          break
                      raw.extend(block)
                  require(process.wait() == 0)
                  root_observed = False
                  descendant_observed = False
                  every_active = True
                  any_owned = False
                  for encoded in raw.splitlines():
                      fields = encoded.split()
                      require(len(fields) == 4)
                      pid = int(fields[0])
                      ppid = int(fields[1])
                      pgid = int(fields[2])
                      state_value = fields[3].decode("ascii", "strict")
                      if pgid != owned_pgid:
                          continue
                      any_owned = True
                      root_observed = root_observed or pid == owned_pgid
                      descendant_observed = descendant_observed or (pid != owned_pgid and ppid == owned_pgid)
                      every_active = every_active and not state_value.startswith("Z")
                  return {
                      "anyOwned": any_owned,
                      "rootObserved": root_observed,
                      "descendantObserved": descendant_observed,
                      "everyOwnedActive": every_active,
                  }
              finally:
                  for index in range(len(raw)):
                      raw[index] = 0
                  raw.clear()

          def denial_arm(root: str) -> bool:
              helper = spawn_helper(root)
              time.sleep(0.03)
              env_args = [f"{key}={value}" for key, value in sorted(child_environment(root).items())]
              denied = subprocess.Popen(
                  [
                      "/usr/bin/sandbox-exec", "-f", os.path.join(root, "deny-ps.sb"),
                      "/usr/bin/env", "-i", *env_args, *PS_QUERY,
                  ],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  close_fds=True,
              )
              denied_rc = natural_wait(denied, 2.0)
              helper_rc = natural_wait(helper, 2.0)
              require(helper_rc == 0)
              require(not census(helper.pid)["anyOwned"])
              return denied_rc != 0

          def network_probes(root: str) -> dict[str, bool]:
              child = subprocess.Popen(
                  wrapped_python(root, os.path.join(root, "network-child.py")),
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  close_fds=True,
              )
              deadline = time.monotonic() + 2.0
              while child.poll() is None and time.monotonic() < deadline:
                  time.sleep(0.01)
              require(child.poll() is not None)
              require(child.stdout is not None)
              encoded = child.stdout.read(4096)
              require(child.wait() == 0 and len(encoded) <= 512)
              value = json.loads(encoded.decode("ascii"))
              require(set(value) == {"descendantTcp", "tcp", "udp", "unix"})
              require(all(type(item) is bool for item in value.values()))
              return value

          def purge_no_follow(path: str) -> tuple[bool, bool]:
              existed = os.path.lexists(path)
              unexpected = False

              def remove(entry: str, top: bool) -> None:
                  nonlocal unexpected
                  info = os.lstat(entry)
                  if stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode):
                      for name in sorted(os.listdir(entry)):
                          unexpected = True
                          remove(os.path.join(entry, name), False)
                      os.rmdir(entry)
                  else:
                      unexpected = True
                      os.unlink(entry)

              if existed:
                  remove(path, True)
              return unexpected, not os.path.lexists(path)

          def p5_cleanup_control(root: str) -> bool:
              fixture = root + ".p5-control"
              os.mkdir(fixture, 0o700)
              regular = os.path.join(fixture, "unexpected.txt")
              descriptor = os.open(regular, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
              try:
                  os.write(descriptor, b"synthetic-control-only\n")
              finally:
                  os.close(descriptor)
              os.symlink("unexpected.txt", os.path.join(fixture, "unexpected.link"))
              unexpected, absent = purge_no_follow(fixture)
              return unexpected and absent

          def exact_conservation() -> dict[str, int]:
              return {
                  "actionsArtifactsCreated": 0,
                  "candidateValuesPresent": 0,
                  "durableRawOutputs": 0,
                  "networkConnectAttemptsByAuditedPrograms": 0,
                  "providerAuthoritiesPresent": 0,
                  "publicCorpusBytesPresent": 0,
                  "releasesPresent": 0,
                  "repositoryCheckouts": 0,
                  "scannerExecutions": 0,
                  "signalsSentByAuditedPrograms": 0,
                  "targetsAccessed": 0,
              }

          def selftest_surface() -> bool:
              require(set(os.environ) == RUN_KEYS)
              fake_keys = set(os.environ) | {"AWS_SECRET_ACCESS_KEY"}
              require(fake_keys != RUN_KEYS)
              conservation = exact_conservation()
              require(all(type(value) is int and value == 0 for value in conservation.values()))
              forged = dict(conservation)
              forged["targetsAccessed"] = 1
              require(not all(type(value) is int and value == 0 for value in forged.values()))
              return True

          def validate_root(root: str) -> dict[str, str]:
              root_info = os.lstat(root)
              require(stat.S_ISDIR(root_info.st_mode) and stat.S_IMODE(root_info.st_mode) == 0o700)
              require(root_info.st_uid == os.getuid())
              require(set(os.listdir(root)) == set(EXPECTED_FILES))
              hashes: dict[str, str] = {}
              for name, mode in EXPECTED_FILES.items():
                  path = os.path.join(root, name)
                  info = os.lstat(path)
                  require(stat.S_ISREG(info.st_mode) and not stat.S_ISLNK(info.st_mode))
                  require(stat.S_IMODE(info.st_mode) == mode and info.st_uid == os.getuid())
                  hashes[name] = sha256_file(path)
              return hashes

          def remove_exact_root(root: str) -> None:
              require(set(os.listdir(root)) == set(EXPECTED_FILES))
              for name in sorted(EXPECTED_FILES):
                  path = os.path.join(root, name)
                  info = os.lstat(path)
                  require(stat.S_ISREG(info.st_mode) and not stat.S_ISLNK(info.st_mode))
                  require(stat.S_IMODE(info.st_mode) == EXPECTED_FILES[name])
                  os.unlink(path)
              os.rmdir(root)
              require(not os.path.lexists(root))

          def write_candidate(path: str, value: dict[str, object]) -> None:
              encoded = (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
              try:
                  os.write(descriptor, encoded)
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)
              require(stat.S_IMODE(os.lstat(path).st_mode) == 0o400)

          def run() -> None:
              validate_public_environment(RUN_KEYS)
              require(os.environ["HARVEY_MODE"] == "run")
              root = os.environ["HARVEY_ROOT"]
              staging = os.environ["HARVEY_STAGING"]
              require(os.environ["TMPDIR"] == root)
              require(os.path.isabs(root) and os.path.isabs(staging))
              require(os.path.dirname(root) == os.environ["HARVEY_RUNNER_TEMP"].rstrip("/"))
              require(os.path.dirname(staging) == os.environ["HARVEY_RUNNER_TEMP"].rstrip("/"))
              hashes = validate_root(root)
              require(selftest_surface())
              require(p5_cleanup_control(root))

              helper = spawn_helper(root)
              time.sleep(0.03)
              observed = census(helper.pid)
              require(observed["rootObserved"])
              require(observed["descendantObserved"])
              require(observed["everyOwnedActive"])
              require(natural_wait(helper, 2.0) == 0)
              require(not census(helper.pid)["anyOwned"])
              require(denial_arm(root))

              probes = network_probes(root)
              require(all(probes.values()))
              successful_binds = sum(1 for value in probes.values() if not value)
              require(successful_binds == 0)
              forged_binds = successful_binds + 1
              require(forged_binds != 0)
              controller_covered = True
              publisher_covered = True
              teardown_covered = True
              require(controller_covered and publisher_covered and teardown_covered)
              require(not (False and publisher_covered and teardown_covered))

              runtime_identities: dict[str, object] = {
                  "cleanupSha256": hashes["cleanup.py"],
                  "controllerSha256": hashes["controller.py"],
                  "denyPsProfileSha256": hashes["deny-ps.sb"],
                  "helperDescendantSha256": hashes["helper-descendant.py"],
                  "helperSha256": hashes["helper.py"],
                  "networkChildSha256": hashes["network-child.py"],
                  "networkGrandchildSha256": hashes["network-grandchild.py"],
                  "ps": identity("/bin/ps", True),
                  "publisherSha256": hashes["publisher.py"],
                  "python": identity("/usr/bin/python3", False),
                  "sandboxExec": identity("/usr/bin/sandbox-exec", True),
              }
              query_hash = sha256_bytes(json.dumps(PS_QUERY, separators=(",", ":")).encode("ascii"))
              profile_hash = hashes["deny-network.sb"]

              candidate: dict[str, object] = {
                  "authorizesCampaign": False,
                  "conservation": exact_conservation(),
                  "observations": {
                      "controllerCovered": controller_covered,
                      "descendantObserved": observed["descendantObserved"],
                      "descendantTcpLoopbackBindDenied": probes["descendantTcp"],
                      "denialArmRejected": True,
                      "everyOwnedActive": observed["everyOwnedActive"],
                      "globalRowsPersisted": False,
                      "helperExitCode": 0,
                      "naturalCloseEmpty": True,
                      "ownedGroupRootObserved": observed["rootObserved"],
                      "p1RuntimeAuthorityChecksPassed": True,
                      "p4SurfaceAndEnvironmentControlsPassed": True,
                      "p5CleanupControlPassed": True,
                      "profileSha256": profile_hash,
                      "publisherCovered": publisher_covered,
                      "queryArgvSha256": query_hash,
                      "remainingMemberForgeryRejected": True,
                      "remoteEndpointsAttempted": 0,
                      "signalsSent": 0,
                      "successfulBinds": successful_binds,
                      "tcpLoopbackBindDenied": probes["tcp"],
                      "teardownCovered": teardown_covered,
                      "udpLoopbackBindDenied": probes["udp"],
                      "unixSocketBindDenied": probes["unix"],
                  },
                  "platform": {
                      "architecture": "arm64",
                      "imageOS": os.environ["HARVEY_IMAGE_OS"],
                      "imageVersion": os.environ["HARVEY_IMAGE_VERSION"],
                      "runnerOS": "macOS",
                  },
                  "runtimeIdentities": runtime_identities,
                  "schemaVersion": "Harvey1799HostedArm64CapabilityPreflightCandidateV2",
                  "source": {
                      "eventName": "workflow_dispatch",
                      "headSha": os.environ["HARVEY_HEAD_SHA"],
                      "ref": "refs/heads/main",
                      "runAttempt": 1,
                      "runId": os.environ["HARVEY_RUN_ID"],
                      "workflowPath": WORKFLOW_PATH,
                  },
              }

              remove_exact_root(root)
              require(not os.path.lexists(root + ".p5-control"))
              write_candidate(staging, candidate)

          def main() -> int:
              try:
                  mode = sys.argv[1] if len(sys.argv) == 2 else ""
                  if mode == "--pre-root":
                      validate_public_environment(PRE_ROOT_KEYS)
                      require(os.environ["HARVEY_MODE"] == "pre-root")
                      return 0
                  if mode == "--run":
                      run()
                      return 0
                  return 1
              except BaseException:
                  return 1

          raise SystemExit(main())
          PY
          [[ "${CONTROLLER_READ_STATUS}" == '1' ]]
          CONTROLLER_SOURCE="${CONTROLLER_SOURCE%$'\n'}"
          readonly CONTROLLER_SOURCE CONTROLLER_READ_STATUS

          HELPER_SOURCE=''
          HELPER_READ_STATUS='0'
          IFS= read -r -d '' HELPER_SOURCE <<'PY' || HELPER_READ_STATUS="$?"
          from __future__ import annotations
          import os
          import subprocess
          import sys

          EXPECTED = {"PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR", "HARVEY_ROOT"}

          def main() -> int:
              if set(os.environ) != EXPECTED:
                  return 1
              root = os.environ["HARVEY_ROOT"]
              if os.environ["TMPDIR"] != root:
                  return 1
              env = {key: os.environ[key] for key in sorted(EXPECTED)}
              command = [
                  "/usr/bin/sandbox-exec", "-f", os.path.join(root, "deny-network.sb"),
                  "/usr/bin/env", "-i", *[f"{key}={value}" for key, value in sorted(env.items())],
                  "/usr/bin/python3", "-I", "-S", os.path.join(root, "helper-descendant.py"),
              ]
              child = subprocess.Popen(
                  command,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  close_fds=True,
              )
              return 0 if child.wait() == 0 else 1

          raise SystemExit(main())
          PY
          [[ "${HELPER_READ_STATUS}" == '1' ]]
          HELPER_SOURCE="${HELPER_SOURCE%$'\n'}"
          readonly HELPER_SOURCE HELPER_READ_STATUS

          HELPER_DESCENDANT_SOURCE=''
          HELPER_DESCENDANT_READ_STATUS='0'
          IFS= read -r -d '' HELPER_DESCENDANT_SOURCE <<'PY' || HELPER_DESCENDANT_READ_STATUS="$?"
          from __future__ import annotations
          import os
          import time

          EXPECTED = {"PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR", "HARVEY_ROOT"}
          if set(os.environ) != EXPECTED or os.environ["TMPDIR"] != os.environ["HARVEY_ROOT"]:
              raise SystemExit(1)
          time.sleep(0.50)
          PY
          [[ "${HELPER_DESCENDANT_READ_STATUS}" == '1' ]]
          HELPER_DESCENDANT_SOURCE="${HELPER_DESCENDANT_SOURCE%$'\n'}"
          readonly HELPER_DESCENDANT_SOURCE HELPER_DESCENDANT_READ_STATUS

          NETWORK_CHILD_SOURCE=''
          NETWORK_CHILD_READ_STATUS='0'
          IFS= read -r -d '' NETWORK_CHILD_SOURCE <<'PY' || NETWORK_CHILD_READ_STATUS="$?"
          from __future__ import annotations
          import errno
          import json
          import os
          import socket
          import subprocess

          EXPECTED = {"PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR", "HARVEY_ROOT"}
          DENIED = {errno.EPERM, errno.EACCES}

          def denied_bind(family: int, kind: int, address: object) -> bool:
              handle = socket.socket(family, kind)
              try:
                  try:
                      handle.bind(address)
                      return False
                  except OSError as error:
                      return error.errno in DENIED
              finally:
                  handle.close()

          def main() -> int:
              if set(os.environ) != EXPECTED:
                  return 1
              root = os.environ["HARVEY_ROOT"]
              tcp = denied_bind(socket.AF_INET, socket.SOCK_STREAM, ("127.0.0.1", 0))
              udp = denied_bind(socket.AF_INET, socket.SOCK_DGRAM, ("127.0.0.1", 0))
              socket_path = os.path.join(root, "probe.sock")
