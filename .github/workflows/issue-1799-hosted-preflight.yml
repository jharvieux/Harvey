          printf '%s' "$HELPER_DESCENDANT_SOURCE" >"$ROOT/helper-descendant.py"
          printf '%s' "$NETWORK_ALLOW_SOURCE" >"$ROOT/network-allow.py"
          printf '%s' "$NETWORK_CHILD_SOURCE" >"$ROOT/network-child.py"
          printf '%s' "$NETWORK_GRANDCHILD_SOURCE" >"$ROOT/network-grandchild.py"
          printf '%s' "$PUBLISHER_SOURCE" >"$ROOT/publisher.py"
          printf '%s' "$CLEANUP_SOURCE" >"$ROOT/cleanup.py"
          printf '%s' "$DENY_NETWORK_PROFILE" >"$ROOT/deny-network.sb"
          printf '%s' "$DENY_PS_PROFILE" >"$ROOT/deny-ps.sb"
          /bin/chmod 0500 "$ROOT/controller.py" "$ROOT/helper.py" "$ROOT/helper-descendant.py" \
            "$ROOT/network-allow.py" "$ROOT/network-child.py" "$ROOT/network-grandchild.py" \
            "$ROOT/publisher.py" "$ROOT/cleanup.py"
          /bin/chmod 0400 "$ROOT/deny-network.sb" "$ROOT/deny-ps.sb"

          STAGE='allow-control'
          "$ENV_BIN" -i \
            "PATH=$FIXED_PATH" 'HOME=/var/empty' "TMPDIR=$ROOT" \
            'LANG=C' 'LC_ALL=C' 'TZ=UTC' 'TERM=dumb' 'NO_COLOR=1' \
            "HARVEY_ROOT=$ROOT" \
            "$PYTHON" -I -S "$ROOT/network-allow.py" >"$ROOT/allow-control.json" 3>&-
          /bin/chmod 0400 "$ROOT/allow-control.json"

          STAGE='controller'
          "$ENV_BIN" -i \
            "PATH=$FIXED_PATH" 'HOME=/var/empty' "TMPDIR=$ROOT" \
            'LANG=C' 'LC_ALL=C' 'TZ=UTC' 'TERM=dumb' 'NO_COLOR=1' \
            "HARVEY_EVENT_NAME=$HARVEY_EVENT_NAME" "HARVEY_HEAD_SHA=$HARVEY_HEAD_SHA" \
            "HARVEY_IMAGE_OS=$ImageOS" "HARVEY_IMAGE_VERSION=$ImageVersion" \
            "HARVEY_REF=$HARVEY_REF" "HARVEY_REPOSITORY=$HARVEY_REPOSITORY" \
            "HARVEY_RUN_ATTEMPT=$HARVEY_RUN_ATTEMPT" "HARVEY_RUN_ID=$HARVEY_RUN_ID" \
            "HARVEY_RUNNER_ARCH=$RUNNER_ARCH" "HARVEY_RUNNER_OS=$RUNNER_OS" \
            "HARVEY_RUNNER_TEMP=$RUNNER_TEMP" "HARVEY_WORKFLOW_REF=$HARVEY_WORKFLOW_REF" \
            "HARVEY_ROOT=$ROOT" "HARVEY_STAGING=$STAGING" \
            "$PYTHON" -I -S "$ROOT/controller.py" 3>&-
          [[ ! -e "$ROOT" && ! -e "$ROOT.p5-control" && -f "$STAGING" ]]

          STAGE='publisher'
          "$SANDBOX_EXEC" -p "$DENY_NETWORK_PROFILE" "$ENV_BIN" -i \
            "PATH=$FIXED_PATH" 'HOME=/var/empty' "TMPDIR=$ROOT" \
            'LANG=C' 'LC_ALL=C' 'TZ=UTC' 'TERM=dumb' 'NO_COLOR=1' \
            "HARVEY_ROOT=$ROOT" "HARVEY_STAGING=$STAGING" \
            "HARVEY_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" \
            "$PYTHON" -I -S -c "$PUBLISHER_SOURCE" >&3
          STAGE='postconditions'
          [[ ! -e "$ROOT" && ! -e "$ROOT.p5-control" && ! -e "$STAGING" ]]
          STAGE='complete'
          trap - EXIT HUP INT TERM
