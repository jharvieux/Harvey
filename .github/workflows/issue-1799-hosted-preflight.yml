          def strict_pairs(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          def strict_loads(encoded: bytes) -> dict[str, object]:
              require(len(encoded) <= 16384 and encoded.endswith(b"\n"))
              value = json.loads(encoded.decode("ascii"), object_pairs_hook=strict_pairs)
              require(type(value) is dict)
              return value

          def sha(value: str) -> bool:
              return len(value) == 64 and all(character in "0123456789abcdef" for character in value)

          def exact_identity(value: object, expose_path: bool) -> None:
              require(type(value) is dict)
              required = {"mode", "sha256", "uid", "path" if expose_path else "pathSha256"}
              require(set(value) == required)
              require(type(value["mode"]) is str and value["mode"].startswith("0o"))
              require(type(value["sha256"]) is str and sha(value["sha256"]))
              require(type(value["uid"]) is int and value["uid"] >= 0)
              path_key = "path" if expose_path else "pathSha256"
              require(type(value[path_key]) is str)
              if expose_path:
                  require(value[path_key] in {"/bin/ps", "/usr/bin/sandbox-exec"})
              else:
                  require(sha(value[path_key]))

          def validate_candidate(value: dict[str, object]) -> None:
              require(set(value) == {"authorizesCampaign", "conservation", "observations", "platform", "runtimeIdentities", "schemaVersion", "source"})
              require(value["authorizesCampaign"] is False)
              require(value["schemaVersion"] == "Harvey1799HostedArm64CapabilityPreflightCandidateV2")

              conservation = value["conservation"]
              require(type(conservation) is dict and set(conservation) == CONSERVATION_KEYS)
              require(all(type(item) is int and item == 0 for item in conservation.values()))

              observations = value["observations"]
              require(type(observations) is dict and set(observations) == OBSERVATION_KEYS)
              true_keys = OBSERVATION_KEYS - {
                  "globalRowsPersisted", "helperExitCode", "profileSha256", "queryArgvSha256",
                  "remoteEndpointsAttempted", "signalsSent", "successfulBinds",
              }
              require(all(observations[key] is True for key in true_keys))
              require(observations["globalRowsPersisted"] is False)
              for key in ["helperExitCode", "remoteEndpointsAttempted", "signalsSent", "successfulBinds"]:
                  require(type(observations[key]) is int and observations[key] == 0)
              require(type(observations["profileSha256"]) is str and sha(observations["profileSha256"]))
              require(type(observations["queryArgvSha256"]) is str and sha(observations["queryArgvSha256"]))

              platform = value["platform"]
              require(type(platform) is dict and set(platform) == {"architecture", "imageOS", "imageVersion", "runnerOS"})
              require(platform["architecture"] == "arm64" and platform["runnerOS"] == "macOS")
              for key in ["imageOS", "imageVersion"]:
                  require(type(platform[key]) is str and 1 <= len(platform[key]) <= 64)
                  require(all(character.isalnum() or character in "._-" for character in platform[key]))

              runtime = value["runtimeIdentities"]
              require(type(runtime) is dict and set(runtime) == RUNTIME_KEYS)
              for key in RUNTIME_KEYS - {"ps", "python", "sandboxExec"}:
                  require(type(runtime[key]) is str and sha(runtime[key]))
              exact_identity(runtime["ps"], True)
              exact_identity(runtime["python"], False)
              exact_identity(runtime["sandboxExec"], True)

              source = value["source"]
              require(type(source) is dict and set(source) == {"eventName", "headSha", "ref", "runAttempt", "runId", "workflowPath"})
              require(source["eventName"] == "workflow_dispatch")
