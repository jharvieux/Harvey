# Synthetic-only #1799 capability preflight. It never checks out or scans a target.
name: "#1799 hosted ARM64 capability preflight"

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: issue-1799-hosted-arm64-preflight
  cancel-in-progress: false

jobs:
  capability-preflight:
    name: synthetic process and Seatbelt egress preflight
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Run, tear down, validate, then publish the synthetic preflight
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          exec 3>&1
          exec >/dev/null 2>/dev/null

          readonly EXPECTED_PATH='.github/workflows/issue-1799-hosted-preflight.yml'
          readonly FIXED_PATH='/usr/bin:/bin:/usr/sbin:/sbin'
          readonly PYTHON="$(/usr/bin/xcrun --find python3)"
          readonly SANDBOX_EXEC='/usr/bin/sandbox-exec'
          readonly ENV_BIN='/usr/bin/env'
          readonly EXPECTED_DENY_NETWORK_PROFILE_SHA256='9c5b74ccb7b1548dff667033de6f0b70fd71aa836247c164b64ba8bfdaeb4a3b'
          readonly HARVEY_EVENT_NAME="$GITHUB_EVENT_NAME"
          readonly HARVEY_HEAD_SHA="$GITHUB_SHA"
          readonly HARVEY_REF="$GITHUB_REF"
          readonly HARVEY_REPOSITORY="$GITHUB_REPOSITORY"
          readonly HARVEY_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          readonly HARVEY_RUN_ID="$GITHUB_RUN_ID"
          readonly HARVEY_WORKFLOW_REF="$GITHUB_WORKFLOW_REF"

          [[ "$HARVEY_EVENT_NAME" == 'workflow_dispatch' ]]
          [[ "$HARVEY_REF" == 'refs/heads/main' ]]
          [[ "$HARVEY_RUN_ATTEMPT" == '1' ]]
          [[ "$HARVEY_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HARVEY_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$HARVEY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$HARVEY_WORKFLOW_REF" == "$HARVEY_REPOSITORY/$EXPECTED_PATH@$HARVEY_REF" ]]
          [[ "$RUNNER_OS" == 'macOS' && "$RUNNER_ARCH" == 'ARM64' ]]
          [[ "$(/usr/bin/uname -m)" == 'arm64' ]]
          [[ "$PYTHON" == /* && "$PYTHON" != *$'\n'* && -x "$PYTHON" ]]
          [[ "$ImageOS" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          [[ "$ImageVersion" =~ ^[A-Za-z0-9._-]{1,64}$ ]]
          [[ "$RUNNER_TEMP" == /* && "$RUNNER_TEMP" != *$'\n'* ]]
          [[ "$GITHUB_STEP_SUMMARY" == /* && "$GITHUB_STEP_SUMMARY" != *$'\n'* ]]

          readonly DENY_NETWORK_PROFILE='(version 1)
          (allow default)
          (deny network*)'
          readonly DENY_PS_PROFILE='(version 1)
          (allow default)
          (deny network*)
          (deny process-exec (literal "/bin/ps"))'

          CONTROLLER_SOURCE=''
          CONTROLLER_READ_STATUS='0'
          IFS= read -r -d '' CONTROLLER_SOURCE <<'PY' || CONTROLLER_READ_STATUS="$?"
          from __future__ import annotations
          import errno
          import hashlib
          import json
          import os
          import re
          import signal
          import stat
          import subprocess
          import sys
          import time

          EXPECTED_DENY_NETWORK_PROFILE_SHA256 = "9c5b74ccb7b1548dff667033de6f0b70fd71aa836247c164b64ba8bfdaeb4a3b"
          WORKFLOW_PATH = ".github/workflows/issue-1799-hosted-preflight.yml"
          PS_QUERY = ["/bin/ps", "-axo", "pid=,ppid=,pgid=,stat="]
          BASE_KEYS = {"PATH", "HOME", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR", "__CF_USER_TEXT_ENCODING"}
          PUBLIC_KEYS = {
              "HARVEY_EVENT_NAME", "HARVEY_HEAD_SHA", "HARVEY_IMAGE_OS",
              "HARVEY_IMAGE_VERSION", "HARVEY_REF", "HARVEY_REPOSITORY",
              "HARVEY_RUN_ATTEMPT", "HARVEY_RUN_ID", "HARVEY_RUNNER_ARCH",
              "HARVEY_RUNNER_OS", "HARVEY_RUNNER_TEMP", "HARVEY_WORKFLOW_REF",
          }
          RUN_KEYS = BASE_KEYS | PUBLIC_KEYS | {"TMPDIR", "HARVEY_ROOT", "HARVEY_STAGING"}
          EXPECTED_FILES = {
              "allow-control.json": 0o400, "cleanup.py": 0o500,
              "controller.py": 0o500, "deny-network.sb": 0o400,
              "deny-ps.sb": 0o400, "helper-descendant.py": 0o500,
              "helper.py": 0o500, "network-allow.py": 0o500,
              "network-child.py": 0o500, "network-grandchild.py": 0o500,
              "publisher.py": 0o500,
          }
          DENIED_ERRNOS = {errno.EPERM, errno.EACCES}

          class Rejected(Exception):
              pass

          def require(value: bool) -> None:
              if not value:
                  raise Rejected()

          def sha256_file(path: str) -> str:
              digest = hashlib.sha256()
              with open(path, "rb", buffering=0) as handle:
                  while block := handle.read(65536):
                      digest.update(block)
              return digest.hexdigest()

          def identity(path: str, disclose_path: bool) -> dict[str, object]:
              info = os.stat(path)
              value: dict[str, object] = {
                  "mode": oct(stat.S_IMODE(info.st_mode)),
                  "sha256": sha256_file(path),
                  "uid": info.st_uid,
              }
              value["path" if disclose_path else "pathSha256"] = (
                  path if disclose_path else hashlib.sha256(path.encode("ascii")).hexdigest()
              )
              return value

          def validate_environment() -> None:
              require(set(os.environ) == RUN_KEYS)
              require(os.environ["PATH"] == "/usr/bin:/bin:/usr/sbin:/sbin")
              require(os.environ["HOME"] == "/var/empty")
              require(os.environ["LANG"] == "C" and os.environ["LC_ALL"] == "C")
              require(os.environ["TZ"] == "UTC" and os.environ["TERM"] == "dumb")
              require(os.environ["NO_COLOR"] == "1")
              require(re.fullmatch(r"0x[0-9A-F]+:0x[0-9A-F]+:0x[0-9A-F]+", os.environ["__CF_USER_TEXT_ENCODING"]) is not None)
              require(os.environ["HARVEY_EVENT_NAME"] == "workflow_dispatch")
              require(os.environ["HARVEY_REF"] == "refs/heads/main")
              require(os.environ["HARVEY_RUN_ATTEMPT"] == "1")
              require(re.fullmatch(r"[0-9a-f]{40}", os.environ["HARVEY_HEAD_SHA"]) is not None)
              require(re.fullmatch(r"[0-9]+", os.environ["HARVEY_RUN_ID"]) is not None)
              require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", os.environ["HARVEY_REPOSITORY"]) is not None)
              expected_ref = f'{os.environ["HARVEY_REPOSITORY"]}/{WORKFLOW_PATH}@refs/heads/main'
              require(os.environ["HARVEY_WORKFLOW_REF"] == expected_ref)
              require(os.environ["HARVEY_RUNNER_OS"] == "macOS")
              require(os.environ["HARVEY_RUNNER_ARCH"] == "ARM64")
              require(re.fullmatch(r"[A-Za-z0-9._-]{1,64}", os.environ["HARVEY_IMAGE_OS"]) is not None)
              require(re.fullmatch(r"[A-Za-z0-9._-]{1,64}", os.environ["HARVEY_IMAGE_VERSION"]) is not None)
              uname = subprocess.run(
                  ["/usr/bin/uname", "-m"], stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                  close_fds=True, check=False,
              )
              require(uname.returncode == 0 and uname.stdout == b"arm64\n")

          def child_environment(root: str) -> dict[str, str]:
              return {
                  "PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "HOME": "/var/empty",
                  "TMPDIR": root, "LANG": "C", "LC_ALL": "C", "TZ": "UTC",
                  "TERM": "dumb", "NO_COLOR": "1", "HARVEY_ROOT": root,
              }

          def plain_python(root: str, name: str) -> list[str]:
              values = child_environment(root)
              return [
                  "/usr/bin/env", "-i",
                  *[f"{key}={value}" for key, value in sorted(values.items())],
                  sys.executable, "-I", "-S", os.path.join(root, name),
              ]

          def natural_wait(process: subprocess.Popen[bytes], seconds: float) -> int:
              deadline = time.monotonic() + seconds
              while process.poll() is None and time.monotonic() < deadline:
                  time.sleep(0.01)
              require(process.poll() is not None)
              return process.wait()

          def census(owned_pgid: int) -> dict[str, bool]:
              result = subprocess.run(
                  PS_QUERY, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL, close_fds=True, check=False,
                  env={"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "HOME": "/var/empty",
                       "LANG": "C", "LC_ALL": "C", "TZ": "UTC"},
              )
              require(result.returncode == 0)
              root_observed = descendant_observed = any_owned = False
              every_active = True
              for encoded in result.stdout.splitlines():
                  fields = encoded.split()
                  require(len(fields) == 4)
                  pid, ppid, pgid = (int(fields[index]) for index in range(3))
                  if pgid != owned_pgid:
                      continue
                  any_owned = True
                  root_observed = root_observed or pid == owned_pgid
                  descendant_observed = descendant_observed or (pid != owned_pgid and ppid == owned_pgid)
                  every_active = every_active and not fields[3].startswith(b"Z")
              return {"anyOwned": any_owned, "rootObserved": root_observed,
                      "descendantObserved": descendant_observed, "everyOwnedActive": every_active}

          def spawn_helper(root: str) -> subprocess.Popen[bytes]:
              return subprocess.Popen(
                  plain_python(root, "helper.py"), stdin=subprocess.DEVNULL,
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  close_fds=True, start_new_session=True,
              )

          def denial_arm(root: str) -> bool:
              helper = spawn_helper(root)
              try:
                  time.sleep(0.05)
                  values = child_environment(root)
                  denied = subprocess.Popen(
                      ["/usr/bin/sandbox-exec", "-f", os.path.join(root, "deny-ps.sb"),
                       "/usr/bin/env", "-i",
                       *[f"{key}={value}" for key, value in sorted(values.items())], *PS_QUERY],
                      stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL, close_fds=True,
                  )
                  denied_rc = natural_wait(denied, 2.0)
                  require(natural_wait(helper, 2.0) == 0)
                  require(not census(helper.pid)["anyOwned"])
                  return denied_rc != 0
              finally:
                  if helper.poll() is None:
                      os.killpg(helper.pid, signal.SIGKILL)
                      helper.wait()

          def strict_json_file(path: str, limit: int) -> dict[str, object]:
              descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
              try:
                  encoded = os.read(descriptor, limit + 1)
              finally:
                  os.close(descriptor)
              require(len(encoded) <= limit and encoded.endswith(b"\n"))
              value = json.loads(encoded.decode("ascii"))
              require(type(value) is dict)
              return value

          def validate_allow_control(value: dict[str, object]) -> None:
              require(value == {
                  "attempts": 6,
                  "results": {
                      "tcp4LoopbackConnect": True, "tcp6LoopbackConnect": True,
                      "udp4LoopbackSend": True, "udp6LoopbackSend": True,
                      "unixConnect": True, "mdnsUnixConnect": True,
                  },
                  "successful": 6,
              })

          def network_probes(root: str) -> dict[str, int]:
              values = child_environment(root)
              # Keep the process-census controller outside Seatbelt: macOS blocks
              # /bin/ps under deny-network. Apply the boundary at the dedicated
              # probe root instead; its plain grandchild proves inherited denial.
              child = subprocess.Popen(
                  ["/usr/bin/sandbox-exec", "-f", os.path.join(root, "deny-network.sb"),
                   "/usr/bin/env", "-i",
                   *[f"{key}={value}" for key, value in sorted(values.items())],
                   sys.executable, "-I", "-S", os.path.join(root, "network-child.py")],
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, close_fds=True,
                  start_new_session=True,
              )
              try:
                  encoded, _ = child.communicate(timeout=4.0)
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid, signal.SIGKILL)
                  child.wait()
                  raise
              require(child.returncode == 0 and len(encoded) <= 8192)
              require(not census(child.pid)["anyOwned"])
              value = json.loads(encoded.decode("ascii"))
              expected = {
                  "grandchildMdnsUnixConnect", "grandchildTcp4LoopbackConnect",
                  "mdnsUnixConnect", "tcp4Bind", "tcp4DocumentationConnect",
                  "tcp4LoopbackConnect", "tcp6Bind", "tcp6DocumentationConnect",
                  "tcp6LoopbackConnect", "udp4Bind", "udp4DocumentationSend",
                  "udp4LoopbackSend", "udp6Bind", "udp6DocumentationSend",
                  "udp6LoopbackSend", "unixBind",
              }
              require(type(value) is dict and set(value) == expected)
              errnos: dict[str, int] = {}
              for key, row in value.items():
                  require(type(row) is dict and set(row) == {"denied", "errno"})
                  require(row["denied"] is True)
                  require(type(row["errno"]) is int and row["errno"] in DENIED_ERRNOS)
                  errnos[key] = row["errno"]
              return errnos

          def purge_no_follow(path: str) -> tuple[bool, bool]:
              existed = os.path.lexists(path)
              unexpected = False
              def remove(entry: str) -> None:
                  nonlocal unexpected
                  info = os.lstat(entry)
                  if stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode):
                      for name in sorted(os.listdir(entry)):
                          unexpected = True
                          remove(os.path.join(entry, name))
                      os.rmdir(entry)
                  else:
                      unexpected = True
                      os.unlink(entry)
              if existed:
                  remove(path)
              return unexpected, not os.path.lexists(path)

          def p5_cleanup_control(root: str) -> bool:
              fixture = root + ".p5-control"
              os.mkdir(fixture, 0o700)
              file_path = os.path.join(fixture, "unexpected.txt")
              descriptor = os.open(file_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
              try:
                  os.write(descriptor, b"synthetic-control-only\n")
              finally:
                  os.close(descriptor)
              os.symlink("unexpected.txt", os.path.join(fixture, "unexpected.link"))
              unexpected, absent = purge_no_follow(fixture)
              return unexpected and absent

          def validate_root(root: str) -> dict[str, str]:
              info = os.lstat(root)
              require(stat.S_ISDIR(info.st_mode) and stat.S_IMODE(info.st_mode) == 0o700)
              require(info.st_uid == os.getuid() and set(os.listdir(root)) == set(EXPECTED_FILES))
              hashes: dict[str, str] = {}
              for name, mode in EXPECTED_FILES.items():
                  path = os.path.join(root, name)
                  info = os.lstat(path)
                  require(stat.S_ISREG(info.st_mode) and not stat.S_ISLNK(info.st_mode))
                  require(stat.S_IMODE(info.st_mode) == mode and info.st_uid == os.getuid())
                  hashes[name] = sha256_file(path)
              require(hashes["deny-network.sb"] == EXPECTED_DENY_NETWORK_PROFILE_SHA256)
              return hashes

          def remove_exact_root(root: str) -> None:
              require(set(os.listdir(root)) == set(EXPECTED_FILES))
              for name, mode in sorted(EXPECTED_FILES.items()):
                  path = os.path.join(root, name)
                  info = os.lstat(path)
                  require(stat.S_ISREG(info.st_mode) and stat.S_IMODE(info.st_mode) == mode)
                  os.unlink(path)
              os.rmdir(root)
              require(not os.path.lexists(root))

          def write_candidate(path: str, value: dict[str, object]) -> None:
              encoded = (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
              try:
                  os.write(descriptor, encoded)
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)

          def cleanup_owned(processes: list[subprocess.Popen[bytes]]) -> int:
              signals_sent = 0
              for process in processes:
                  if process.poll() is None:
                      try:
                          os.killpg(process.pid, signal.SIGTERM)
                          signals_sent += 1
                      except ProcessLookupError:
                          pass
              return signals_sent

          def run() -> None:
              validate_environment()
              root, staging = os.environ["HARVEY_ROOT"], os.environ["HARVEY_STAGING"]
              require(os.environ["TMPDIR"] == root)
              require(os.path.dirname(root) == os.environ["HARVEY_RUNNER_TEMP"].rstrip("/"))
              require(os.path.dirname(staging) == os.environ["HARVEY_RUNNER_TEMP"].rstrip("/"))
              hashes = validate_root(root)
              require(p5_cleanup_control(root))
              validate_allow_control(strict_json_file(os.path.join(root, "allow-control.json"), 2048))
              owned: list[subprocess.Popen[bytes]] = []
              signals_sent = 0
              try:
                  helper = spawn_helper(root)
                  owned.append(helper)
                  time.sleep(0.05)
                  observed = census(helper.pid)
                  require(observed["rootObserved"] and observed["descendantObserved"])
                  require(observed["everyOwnedActive"])
                  require(natural_wait(helper, 2.0) == 0)
                  require(not census(helper.pid)["anyOwned"])
                  require(denial_arm(root))
                  denied_errnos = network_probes(root)
              except BaseException:
                  signals_sent += cleanup_owned(owned)
                  raise
              require(signals_sent == 0)
              conservation = {
                  "actionsArtifactsCreated": 0, "candidateValuesPresent": 0,
                  "durableRawOutputs": 0, "networkBindAttemptsByAuditedPrograms": 5,
                  "networkConnectAttemptsByAuditedPrograms": 11,
                  "providerAuthoritiesPresent": 0, "publicCorpusBytesPresent": 0,
                  "releasesPresent": 0, "repositoryCheckouts": 0, "scannerExecutions": 0,
                  "signalsSentByAuditedPrograms": signals_sent,
                  "successfulNetworkConnectsByAuditedPrograms": 0, "targetsAccessed": 0,
              }
              candidate: dict[str, object] = {
                  "authorizesCampaign": False,
                  "conservation": conservation,
                  "observations": {
                      "allowControlAttempts": 6, "allowControlSuccessful": 6,
                      "controllerCovered": True, "denialArmRejected": True,
                      "deniedErrnos": denied_errnos,
                      "descendantObserved": observed["descendantObserved"],
                      "everyOwnedActive": observed["everyOwnedActive"],
                      "globalRowsPersisted": False, "helperExitCode": 0,
                      "naturalCloseEmpty": True,
                      "nonNetworkFileIoPassed": True,
                      "nonNetworkProcessExecPassed": True,
                      "ownedGroupRootObserved": observed["rootObserved"],
                      "p5CleanupControlPassed": True,
                      "profileSha256": hashes["deny-network.sb"],
                      "publisherCovered": True, "remoteEndpointsAttempted": 4,
                      "signalsSent": signals_sent, "successfulBinds": 0,
                      "teardownCovered": True,
                  },
                  "platform": {
                      "architecture": "arm64", "imageOS": os.environ["HARVEY_IMAGE_OS"],
                      "imageVersion": os.environ["HARVEY_IMAGE_VERSION"], "runnerOS": "macOS",
                  },
                  "runtimeIdentities": {
                      "cleanupSha256": hashes["cleanup.py"], "controllerSha256": hashes["controller.py"],
                      "denyPsProfileSha256": hashes["deny-ps.sb"],
                      "helperDescendantSha256": hashes["helper-descendant.py"],
                      "helperSha256": hashes["helper.py"], "networkAllowSha256": hashes["network-allow.py"],
                      "networkChildSha256": hashes["network-child.py"],
                      "networkGrandchildSha256": hashes["network-grandchild.py"],
                      "ps": identity("/bin/ps", True), "publisherSha256": hashes["publisher.py"],
                      "python": identity(sys.executable, False),
                      "sandboxExec": identity("/usr/bin/sandbox-exec", True),
                  },
                  "schemaVersion": "Harvey1799HostedArm64CapabilityPreflightCandidateV3",
                  "source": {
                      "eventName": "workflow_dispatch", "headSha": os.environ["HARVEY_HEAD_SHA"],
                      "ref": "refs/heads/main", "runAttempt": 1,
                      "runId": os.environ["HARVEY_RUN_ID"], "workflowPath": WORKFLOW_PATH,
                  },
              }
              remove_exact_root(root)
              require(not os.path.lexists(root + ".p5-control"))
              write_candidate(staging, candidate)

          try:
              run()
          except BaseException:
              raise SystemExit(1)
          PY
          [[ "${CONTROLLER_READ_STATUS}" == '1' ]]
          CONTROLLER_SOURCE="${CONTROLLER_SOURCE%$'\n'}"
          readonly CONTROLLER_SOURCE CONTROLLER_READ_STATUS
          HELPER_SOURCE=''
          HELPER_READ_STATUS='0'
          IFS= read -r -d '' HELPER_SOURCE <<'PY' || HELPER_READ_STATUS="$?"
          from __future__ import annotations
          import os
          import subprocess
          import sys
          EXPECTED = {"PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR", "HARVEY_ROOT", "__CF_USER_TEXT_ENCODING"}
          if set(os.environ) != EXPECTED or os.environ["TMPDIR"] != os.environ["HARVEY_ROOT"]:
              raise SystemExit(1)
          root = os.environ["HARVEY_ROOT"]
          values = {key: os.environ[key] for key in sorted(EXPECTED)}
          child = subprocess.Popen(
              ["/usr/bin/env", "-i", *[f"{key}={value}" for key, value in sorted(values.items())],
               sys.executable, "-I", "-S", os.path.join(root, "helper-descendant.py")],
              stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL, close_fds=True,
          )
          raise SystemExit(0 if child.wait() == 0 else 1)
          PY
          [[ "${HELPER_READ_STATUS}" == '1' ]]
          HELPER_SOURCE="${HELPER_SOURCE%$'\n'}"
          readonly HELPER_SOURCE HELPER_READ_STATUS

          HELPER_DESCENDANT_SOURCE=''
          HELPER_DESCENDANT_READ_STATUS='0'
          IFS= read -r -d '' HELPER_DESCENDANT_SOURCE <<'PY' || HELPER_DESCENDANT_READ_STATUS="$?"
          from __future__ import annotations
          import os
          import time
          EXPECTED = {"PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR", "HARVEY_ROOT", "__CF_USER_TEXT_ENCODING"}
          if set(os.environ) != EXPECTED or os.environ["TMPDIR"] != os.environ["HARVEY_ROOT"]:
              raise SystemExit(1)
          time.sleep(0.50)
          PY
          [[ "${HELPER_DESCENDANT_READ_STATUS}" == '1' ]]
          HELPER_DESCENDANT_SOURCE="${HELPER_DESCENDANT_SOURCE%$'\n'}"
          readonly HELPER_DESCENDANT_SOURCE HELPER_DESCENDANT_READ_STATUS
          NETWORK_ALLOW_SOURCE=''
          NETWORK_ALLOW_READ_STATUS='0'
          IFS= read -r -d '' NETWORK_ALLOW_SOURCE <<'PY' || NETWORK_ALLOW_READ_STATUS="$?"
          from __future__ import annotations
          import json
          import os
          import socket
          EXPECTED = {"PATH", "HOME", "TMPDIR", "LANG", "LC_ALL", "TZ", "TERM", "NO_COLOR", "HARVEY_ROOT", "__CF_USER_TEXT_ENCODING"}
          if set(os.environ) != EXPECTED or os.environ["TMPDIR"] != os.environ["HARVEY_ROOT"]:
              raise SystemExit(1)
          root = os.environ["HARVEY_ROOT"]
          results: dict[str, bool] = {}

          def tcp(family: int, address: object, key: str) -> None:
              server = socket.socket(family, socket.SOCK_STREAM)
              client = socket.socket(family, socket.SOCK_STREAM)
              accepted = None
              try:
                  server.bind(address)
                  server.listen(1)
                  client.settimeout(1.0)
                  client.connect(server.getsockname())
                  accepted, _ = server.accept()
                  client.sendall(b"x")
                  results[key] = accepted.recv(1) == b"x"
