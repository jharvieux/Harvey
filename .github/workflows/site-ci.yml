# #1592: nothing in CI ran the site's OWN build or lint. `site-smoke.yml` only probes the
# DEPLOYED site over HTTP, so a page that fails to build never reaches it — a broken page never
# deploys, and site-smoke stays green against the last good deployment while `main` carries the
# break. This job runs `site/`'s own toolchain: `pnpm run build` (`next build`, which typechecks
# via the Next TS plugin, LINTS via the same config as `next lint` — see the no-separate-lint-step
# note below — AND performs the static-generation pass — see the no-separate-tsc note below), now
# backed by a real `eslint-config-next` config. CORRECTED 2026-07-30: an earlier draft of this
# comment claimed pre-PR `next lint` exited 0 unconditionally
# ("No ESLint warnings or errors") — that is FALSE. MEASURED 2026-07-30 from a clean `npm ci` at
# `main@9001e7a` (no eslint dependency present, no eslint config file — this predates #1597's
# conversion to pnpm): `npm run lint` prints Next's "How would you like to configure ESLint?"
# interactive setup prompt, then exits 1 because CI has no TTY to answer it (reproduced via
# `CI=true npm run lint < /dev/null`, both in a plain shell and matching GitHub Actions'
# non-interactive stdin) — it never reached any actual lint check, so the gap was a loud,
# unconditional exit-1 failure, not a silent pass. `site-smoke.yml`/nothing invoked a lint command
# before this PR either way, so the broken exit code never blocked anything — the real defect this
# PR closes.
#
# Since #1597 `site/` is a `pnpm-workspace.yaml` MEMBER, not a separate npm project — there is no
# `site/package-lock.json` any more, and its deps resolve out of the one lockfile at the repo
# root. So install happens at the repo root (`pnpm install --frozen-lockfile`) and build run
# inside `site/` via pnpm, never npm.
#
# Why no separate `tsc --noEmit` step: MEASURED 2026-07-30 — a page that throws at render time
# (`throw new Error(...)` at the top of a page component, which is syntactically and
# type-correctly valid TypeScript) passes `tsc --noEmit` with exit 0 but fails `next build` with
# exit 1 during the "Generating static pages" step, because `next build` actually performs the
# static-generation pass `tsc` never runs. `next build`'s own "Linting and checking validity of
# types" step already re-uses the Next TS plugin and fails loud on a real type error (also
# MEASURED, same session: exit 1 on an injected `number`/`string` mismatch). So `next build` is a
# strict superset of `tsc --noEmit` here — it typechecks AND catches the render-time class `tsc`
# structurally cannot see — and a bare `tsc` step would add CI time without adding coverage.
#
# Why no separate `pnpm run lint` (`next lint`) step either — same principle, second instance
# (#1607): `site/next.config.mjs` sets no `eslint.ignoreDuringBuilds` override (default `false`),
# so `next build`'s "Linting and checking validity of types" step already runs the SAME ESLint
# pass, over the SAME default directories (`app/`, `components/`, `lib/`, etc.), as standalone
# `next lint` — both read `site/eslint.config.mjs`. MEASURED 2026-07-30: a planted
# react/no-unescaped-entities violation in app/page.tsx fails `pnpm run build` and
# `pnpm run lint` with the byte-identical error (line:col, rule name, and message all matched).
# And GitHub Actions skips a later step by default once an earlier
# one fails (confirmed live in run `30600773918`), so there is no code path where a separate lint
# step's outcome could ever differ from build's: pass, it already passed inside build; fail, it
# never runs. The `lint` script in `site/package.json` stays — useful for a local
# `pnpm run lint` — only the redundant CI step is dropped.
#
# NOT a required status check (operator call — #1592's acceptance says recommend, don't
# self-grant). Because of that this uses a plain `paths:` filter on the trigger rather than the
# in-job two-tier filter conservation.yml/corpus-drift.yml use for THEIR required contexts: #1107's
# deadlock (a path-filtered REQUIRED check never reports on a PR outside its filter, so branch
# protection waits forever) only applies once a check is required. If this is later promoted to
# required, the filter must move in-job with a green no-op short-circuit — copy the shape
# conservation.yml uses for its `relevant` flag — before it is registered, exactly as #1107 forced
# for dry-run-drift.

name: site-ci

# `pnpm-lock.yaml` / `pnpm-workspace.yaml` are in the path filter, not just `site/**`: since #1597
# site's deps resolve out of the root lockfile, so a dependency bump for site can land as a
# root-lockfile-only diff that never touches `site/**` — without these two paths this gate would
# never fire for that change, the same silent-coverage-loss shape #1592 was filed for.
on:
  pull_request:
    paths:
      - "site/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site-ci.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site-ci.yml"
  workflow_dispatch:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: site build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Install runs at the repo ROOT — see the header note. site/ has no lockfile of its own
      # since #1597; its deps resolve out of pnpm-lock.yaml at the root.
      - run: pnpm install --frozen-lockfile

      # Typechecks (via the Next TS plugin), LINTS via `site/eslint.config.mjs` (flat config,
      # `next/core-web-vitals` via `FlatCompat` — same config `next lint` reads), AND performs the
      # static-generation pass. See the header notes on why neither a separate `tsc --noEmit` step
      # nor a separate `pnpm run lint` step is added: both are provably redundant with this one.
      - run: pnpm run build
        working-directory: site
