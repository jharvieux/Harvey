# Gate 1's residual (#1341): acceptance.yml reads PR BODIES, and an issue can close with no PR body
# to read. Two paths, both live in this repo:
#
#   • A BARE CLICK in the GitHub UI. It touches no PR and no merge, so acceptance.yml never runs.
#     MEASURED 2026-07-28 over the last 120 closed issues: 11 closed this way, 4 of them opened by a
#     human — #1130 and #1155 state acceptance criteria and carry no disposition anywhere.
#   • The DEVELOPMENT SIDEBAR. Linking a PR to an issue closes it on merge with NO closing keyword in
#     the body, so the body-reading gate sees nothing. The worse of the two: it looks like a normal
#     PR-driven close. MEASURED 2026-07-28 against a live probe (issue #1384 / PR #1386, a PR
#     carrying no keyword): the sidebar link alone populates `closedByPullRequestsReferences`, which
#     is the field the CLI reads, so this path is covered by the same code as the keyword path.
#
# WHERE THE DISPOSITION LIVES on a non-PR close (#1341's second criterion): an issue COMMENT in the
# same `ACCEPTANCE #<issue>.<n> <met|split|relayed|ruled-unmet>: <detail>` format. It is the only venue that
# exists on every close path, it is where the operator already reads, and it survives the close. The
# CLI reads the union of every linked PR body and every issue comment, so a PR that already carries
# its dispositions passes here unchanged and nothing is written twice.
#
# WHAT IT DOES ON FAILURE: comment naming the unaccounted criteria, add the `acceptance-unaccounted`
# label, and RE-OPEN — EVERY time, one terminal state for a failed close (#1696). It used to re-open
# only once ("the label is the memory"), so a repeat failure stood CLOSED with the label as its only
# trace — a state that reads as completed to `gh issue list` and to every reader not on the issue
# page. MEASURED 2026-07-31: all 10 issues then closed carrying the label were in that state, every
# one still failing the gate when re-run, so the standing record had reached nobody ten out of ten
# times. The way out of a re-open is one disposition line per criterion, not a second click. When a
# later run passes, the label is REMOVED, because a label asserting an unaccounted criterion on an
# accounted-for issue is a false statement about the issue. The first-failure and pass branches were
# demonstrated live against #1384 on 2026-07-28; the repeat-failure re-open is proven at the CLI
# layer against a recording stub `gh` and awaits its live drill (#1750, the #1348 pattern).
#
# A NEGATIVE CONTROL RUNS ON EVERY INVOCATION (step 2), the same posture acceptance.yml takes:
# `--selftest-close` scores the hermetic cases returned by `closeSelftestCases()` — both close paths
# in both directions plus partial, malformed, duplicate, relay-completion and ruled-unmet controls.
# It needs no network, so a green run means "this gate passed AND it can still fail" even
# on a close it had nothing to object to.
#
# SINCE #1562 acceptance.yml EVALUATES THE SAME THING this gate does — same venues, same close set —
# so a PR that goes green there does not get re-opened here. That parity was reached by tightening
# the PR check; nothing here was loosened, and nothing here may be.
#
# BOT-OPENED ISSUES ARE EXEMPT, disclosed rather than silent: the alert-path drills (#1287) open,
# comment on and close a tracking issue under the job token, and 7 of the 11 bare-click closes
# measured above were exactly that. They state no criteria and are not work items.
#
# `workflow_dispatch` with an `issue` input makes this re-provable on demand:
#   gh workflow run "acceptance on close" -f issue=1155
# It is NOT an alert path in the #1287 sense — it does not use .github/actions/alert-issue and is not
# scheduled — so it carries no entry in .github/alert-paths.json.

name: acceptance on close

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to check (re-runs the same gate the closed event runs). Ignored when liveness_drill is set — the drill runs no gate and touches no issue."
        required: true
        type: string
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509/#1568). SKIPS the gate and its self-test, so nothing is read and no issue is commented on, labelled or re-opened — the guard is then the only thing that can turn it red."
        type: boolean
        default: false

concurrency:
  group: acceptance-close-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance-close:
    name: an issue may not close with a criterion nothing accounted for
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, unlike acceptance.yml: this gate has no red tick to show on a PR, so its verdict has
      # to land where the person who closed the issue reads it. A gate whose failure nobody sees is
      # the unfired alert path #1287 found four of.
      issues: write
      pull-requests: read
    timeout-minutes: 10
    # The receipt every record step and every gate CLI in this job writes to. A literal path, not
    # ${{ runner.temp }}: the `runner` context is not available in a job-level `env:` block. Without
    # it `recordMeasured` writes NOTHING (it is silent off CI by design) while the bash asserter
    # falls back to $RUNNER_TEMP — producer and asserter then disagree about the path and the assert
    # fails on a job that scored fine. MEASURED 2026-07-31 on PR #1697's first run, in all five
    # workflows this landed in.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      # The issues event can carry the pre-merge SHA (#2068). Resolve before checkout, so neither
      # that stale tree nor a linked PR's head supplies the code this write-capable job executes.
      - name: Bind evidence to authenticated default-branch history
        id: evidence-revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
            const { execFileSync } = require('node:child_process');
            const { readFileSync, appendFileSync } = require('node:fs');
            const [owner, repo] = (process.env.GITHUB_REPOSITORY ?? '').split('/');
            if (![owner, repo].every(part => /^[A-Za-z0-9_.-]+$/.test(part ?? ''))) throw new Error('Missing repository identity');
            const payload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const eventName = process.env.GITHUB_EVENT_NAME;
            const api = (endpoint, body) => JSON.parse(execFileSync('gh', ['api', endpoint, ...(body ? ['--input', '-'] : [])], {
              encoding: 'utf8', input: body ? JSON.stringify(body) : undefined,
            }));
            const repository = `${owner}/${repo}`;
            const drill = eventName === 'workflow_dispatch' && String(payload.inputs?.liveness_drill) === 'true';
            if (!['issues', 'workflow_dispatch'].includes(eventName)) throw new Error('Unsupported close event');
            const rawIssue = eventName === 'issues' ? payload.issue?.number : payload.inputs?.issue;
            if (!drill && (!/^[1-9][0-9]*$/.test(String(rawIssue)) || !Number.isSafeInteger(Number(rawIssue)))) {
              throw new Error('The close gate needs a positive issue number');
            }
            const issue = drill ? 1 : Number(rawIssue);
            const shaPattern = /^[0-9a-f]{40}$/;
            const workflowSourceSha = process.env.GITHUB_WORKFLOW_SHA;
            if (!shaPattern.test(workflowSourceSha ?? '')) throw new Error('Missing workflow source SHA');
            const query = `query($owner: String!, $repo: String!, $issue: Int!, $after: String, $drill: Boolean!) {
              repository(owner: $owner, name: $repo) {
                nameWithOwner
                defaultBranchRef { name target { __typename oid } }
                issue(number: $issue) @skip(if: $drill) {
                  number
                  closedByPullRequestsReferences(first: 100, after: $after, includeClosedPrs: true) {
                    nodes { number merged baseRefName repository { nameWithOwner } mergeCommit { oid } }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }`;
            let after = null;
            let selected;
            const links = [];
            const cursors = new Set();
            do {
              const response = api('graphql', { query, variables: { owner, repo, issue, after, drill } });
              if (response.errors?.length) throw new Error('Linked-PR GraphQL query failed');
              const record = response.data?.repository;
              if (record?.nameWithOwner?.toLowerCase() !== repository.toLowerCase()) throw new Error('Repository identity mismatch');
              selected = record.defaultBranchRef;
              if (!selected?.name || selected.target?.__typename !== 'Commit' || !shaPattern.test(selected.target.oid)) {
                throw new Error('Authenticated default branch did not resolve to a commit');
              }
              if (drill) break;
              const connection = record.issue?.closedByPullRequestsReferences;
              if (record.issue?.number !== issue || !Array.isArray(connection?.nodes) || typeof connection.pageInfo?.hasNextPage !== 'boolean') {
                throw new Error('Could not read the complete linked-PR set for the issue');
              }
              links.push(...connection.nodes);
              if (!connection.pageInfo.hasNextPage) break;
              after = connection.pageInfo.endCursor;
              if (typeof after !== 'string' || !after || cursors.has(after)) throw new Error('Linked-PR pagination did not advance');
              cursors.add(after);
            } while (true);

            const selectedEvidenceSha = selected.target.oid;
            const verifiedMerges = [];
            const otherLinks = [];
            for (const pr of links) {
              if (!Number.isSafeInteger(pr?.number) || pr.number < 1 || !pr.repository?.nameWithOwner || typeof pr.merged !== 'boolean' || !pr.baseRefName) {
                throw new Error('Incomplete linked-PR identity');
              }
              // These remain disposition venues in validate-acceptance; they never choose code.
              const reason = pr.repository.nameWithOwner.toLowerCase() !== repository.toLowerCase() ? 'different repository'
                : !pr.merged ? 'not merged' : pr.baseRefName !== selected.name ? 'different base branch' : null;
              if (reason) {
                otherLinks.push({ number: pr.number, repository: pr.repository.nameWithOwner, reason });
                continue;
              }
              const merge = pr.mergeCommit?.oid;
              if (!shaPattern.test(merge ?? '')) throw new Error(`Linked merged PR #${pr.number} has no merge commit`);
              const data = api(`repos/${repository}/compare/${merge}...${selectedEvidenceSha}`);
              if (!['ahead', 'identical'].includes(data.status) || data.base_commit?.sha !== merge || data.merge_base_commit?.sha !== merge) {
                throw new Error(`Default-branch revision ${selectedEvidenceSha} does not contain linked PR #${pr.number} merge ${merge}`);
              }
              verifiedMerges.push({ number: pr.number, mergeCommit: merge });
            }
            const selectionReason = drill ? 'Authenticated default-branch tip for liveness drill; no issue read'
              : verifiedMerges.length ? 'Authenticated default-branch tip contains every linked merge into this default branch'
              : 'Authenticated default-branch tip; no linked merge into this default branch';
            const receipt = { repository, issue: drill ? null : issue, event: eventName,
              workflowSourceSha, suppliedEventSha: process.env.GITHUB_SHA, selectedEvidenceSha,
              defaultBranch: selected.name, selectionReason, verifiedMerges, otherLinks };
            console.log(`Acceptance evidence revision: ${JSON.stringify(receipt)}`);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Acceptance evidence revision\n\n\`\`\`json\n${JSON.stringify(receipt, null, 2)}\n\`\`\`\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `sha=${selectedEvidenceSha}\nissue=${drill ? '' : issue}\n`);
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.evidence-revision.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Negative control — every seeded violation must FAIL the gate
        if: ${{ !inputs.liveness_drill }}
        run: |
          if ! pnpm exec tsx src/cli/validate-acceptance.ts --selftest-close; then
            echo "::error::The close gate's self-test did not hold: either a healthy close stopped passing, or a seeded violation stopped failing. A gate that cannot fail makes its verdict below meaningless (#350/#1065)."
            exit 1
          fi

      - name: Acceptance conservation on close
        if: ${{ !inputs.liveness_drill }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED_ISSUE: ${{ steps.evidence-revision.outputs.issue }}
          ACCEPTANCE_REPOSITORY: ${{ github.repository }}
        run: >
          pnpm exec tsx src/cli/validate-acceptance.ts
          --closed-issue "$CLOSED_ISSUE"
          --repo "$ACCEPTANCE_REPOSITORY"
          --act

      # #1568: this job answers to no PR and raises no alarm — it runs on `issues: [closed]`, so a
      # run that dies in setup posts no comment, re-opens nothing, and is indistinguishable from a
      # close it had no objection to. Nothing else in this repo watches it. `always()` so a job that
      # died in setup names the phase that never ran.
      - name: Gate liveness — did this job actually assess the close?
        if: always()
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: acceptance-close-selftest, acceptance-close
