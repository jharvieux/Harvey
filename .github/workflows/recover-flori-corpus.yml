name: recover-flori-corpus

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      # Deliberately restore the pre-mirror main pin set: that is the immutable cache key which
      # still holds Effective's shallow pinned checkout. This branch changes the manifest key.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: corpus-cache
        uses: ./.github/actions/corpus-clone-cache
      - name: Export Effective's pinned tree as a portable root snapshot
        env:
          CACHE_DIR: ${{ steps.corpus-cache.outputs.cache-dir }}
        run: |
          set -euo pipefail
          source="$CACHE_DIR/joshcoolman__effective"
          original="52744674ef83306bc58ecfc607aa840092137132"
          recovery="$RUNNER_TEMP/effective-recovery"
          test -d "$source/.git"
          git -C "$source" rev-parse --verify "HEAD^{commit}" | grep -Fx "$original"
          git clone -q "$source" "$recovery"
          tree=$(git -C "$recovery" rev-parse "HEAD^{tree}")
          message="Harvey corpus recovery snapshot

          Original upstream: joshcoolman/effective@$original
          Recovered under: Harvey issue #1832
          The source cache was shallow; this root commit preserves the pinned tree exactly without claiming unavailable ancestry."
          snapshot=$(printf '%s\n' "$message" | \
            GIT_AUTHOR_NAME="Harvey Corpus Recovery" \
            GIT_AUTHOR_EMAIL="corpus-recovery@harvey.invalid" \
            GIT_AUTHOR_DATE="2026-08-04T22:10:00Z" \
            GIT_COMMITTER_NAME="Harvey Corpus Recovery" \
            GIT_COMMITTER_EMAIL="corpus-recovery@harvey.invalid" \
            GIT_COMMITTER_DATE="2026-08-04T22:10:00Z" \
            git -C "$recovery" commit-tree "$tree")
          git -C "$recovery" update-ref refs/heads/recovered-effective-pin "$snapshot"
          git -C "$recovery" bundle create "$GITHUB_WORKSPACE/effective.git" refs/heads/recovered-effective-pin
          git bundle verify "$GITHUB_WORKSPACE/effective.git"
          git bundle list-heads "$GITHUB_WORKSPACE/effective.git" | grep -F "$snapshot"
          printf 'snapshot=%s\ntree=%s\noriginal=%s\n' "$snapshot" "$tree" "$original" | tee "$GITHUB_WORKSPACE/effective-recovery.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: effective-recovery-snapshot
          path: |
            effective.git
            effective-recovery.txt
          if-no-files-found: error
