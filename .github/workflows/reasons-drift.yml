# CI-wiring remainder of #1072 (item 5): the #1033 recorded-reasons gate's STRUCTURAL half already
# runs under `pnpm verify` (src/recorded-reasons.test.ts, every PR). What it does NOT check on any
# cadence is DECAY: `--revalidate` actually RUNS each empirical falsifier, and an exit 0 means the
# blocker the reason describes is gone while the prose still asserts it (a STALE row) — see
# docs/design/recorded-reasons.md. Before this workflow, that pass ran on demand only, so a reason
# could go stale indefinitely between the (rare) sessions that happened to pass `--revalidate` by
# hand — the exact self-sealing shape CLAUDE.md's "recorded reasons decay" doctrine warns about.
#
# This job runs the OFFLINE half only: no `--live`/`--tier`, so every falsifier tagged
# FALSIFIER-TIER (m2-stack, lighthouse, secbench, supabase-labs, #1167) is SKIPPED-LIVE — disclosed
# in the log, not silently dropped — and every other empirical falsifier actually executes. As of
# this writing every non-tier-gated falsifier is a local, offline command (grep/test/ls/node/tsx
# against files already in this checkout) — no mechanical scanner binaries required — so this needs
# nothing beyond `pnpm install` and the runner's preinstalled `gh`, unlike
# dry-run-drift.yml/conservation.yml.
#
# `--issues` is on this cadence too (#1246): `collectReasons` reads FILES, so a blocker recorded in a
# GitHub issue body or comment is gated by nothing at all — and #1254 found one (on #1163) that the
# code had already falsified on the day it was posted, with nothing anywhere able to say so.
# `--issues` folds the open issues' bodies/comments in as extra surfaces for the structural half.
# Two properties this step must keep:
#
#   • Their FALSIFIERs are NOT executed, and adding `--issues` to a `--revalidate` run does not
#     change that — the CLI filters issue-recorded reasons out of the re-validation pass and reports
#     each as `ℹ NOT RE-TESTED` instead. An issue body is input anyone with comment access can write;
#     running its commands on a schedule with the repo checked out would be a remote-execution
#     surface. The remedy the row names is to MIRROR the block into the file it constrains, which
#     puts it under `--revalidate` on this same job.
#   • It fails loud when `gh` cannot read (the fourth negative control below plants exactly that).
#     Reporting "0 issue-recorded claims" from a fetch that never worked is the silent pass this
#     whole family exists to prevent.
#
# No new permission is needed for it: the job already holds `issues: write` for its tracking issue,
# which subsumes the read `gh issue list` does. It does need GH_TOKEN in the step env.
#
# The four live tiers are NOT exercised anywhere in CI: every FALSIFIER-TIER command targets
# something no CI job stands up (a live crAPI gateway, a served target URL, an external
# superredhat/vandyand clone, a paired supabase-security-labs variant). They are run by hand where
# the tier exists — `pnpm validate-reasons --revalidate --tier <name>`, or `--live` for all four —
# and each names its target as a `<placeholder>` bound from the environment on that run
# (`<superredhat-clone>` reads HARVEY_FALSIFIER_SUPERREDHAT_CLONE). Before that binding existed the
# placeholder went to `sh -c` verbatim, where `<` is an input redirect: the command died on "No such
# file or directory", exited 1, and the gate read that as "the blocker still holds". All five live
# falsifiers were unfalsifiable-by-construction and reported green (measured 2026-07-27); an unbound
# placeholder is now UNVERIFIABLE and the command is not run at all.
#
# Scheduled rather than per-PR: a falsifier goes stale on ANY commit that removes the blocker it
# describes, not only on edits to the reason's own file, so a path-filtered pull_request trigger
# would miss most of what this exists to catch (the same reasoning dry-run-drift.yml gives for why
# IT has no path filter — except this job is not a required check, so a plain schedule is enough).
#
# THE NEGATIVE CONTROLS ARE PART OF THE JOB (conservation.yml's posture, #1065's lesson): the check
# step above passes on a repo where every reason is sound, which is also what a gate that can no
# longer fire looks like. Four control steps plant a condition that MUST be rejected — a stale
# reason, a malformed one, an unbound live-tier placeholder, and an `--issues` fetch with no usable
# credential — so a green run means "passed AND can still fail". The first three run on the planted
# fixture only and DELIBERATELY omit `--issues`: pointed at the real issue tracker, any unrelated
# malformed issue block would make all three exit non-zero for the wrong reason and they would pass
# vacuously. For the same reason nothing here may make a reason field mandatory that the planted
# fixtures do not carry (`TOUCHES:` is the live example — see docs/design/recorded-reasons.md);
# doing so turns all three green-by-accident while proving nothing. The repo's own reasons are
# untouched by every control.

name: reasons-drift

on:
  schedule:
    - cron: "0 8 * * *" # Daily 08:00 UTC — after dry-run-drift (Mon 07:00) and conservation (07:30)
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-reasons-alert path fires end-to-end (#1287). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false

concurrency:
  group: reasons-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reasons-drift:
    name: recorded-reasons offline re-validation (#1072)
    runs-on: ubuntu-latest
    # issues: write so a scheduled failure can find-or-update its tracking issue, mirroring
    # corpus-drift.yml/conservation.yml/ci.yml's heavy-cli job (#1138/#1142).
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287): failing on purpose so the tracking-issue step runs under the real job token. This is NOT a reasons-drift failure."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: check
        name: Re-validate every recorded reason, in the repo and in open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm validate-reasons --revalidate --issues 2>&1 | tee reasons-drift.log

      - name: Plant the negative-control corpus
        env:
          FIXTURE: ${{ runner.temp }}/reasons-control
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE"
          cat > "$FIXTURE/stale.ts" <<'EOF'
          // REASON: nothing in this repo can do the thing (planted; its falsifier succeeds)
          // KIND: empirical
          // PROVENANCE: ASSUMED 2026-07-27
          // FALSIFIER: true
          EOF
          cat > "$FIXTURE/malformed.md" <<'EOF'
          REASON: planted claim with no way to re-test it
          KIND: empirical
          PROVENANCE: ASSUMED 2026-07-27
          EOF
          cat > "$FIXTURE/unbound.ts" <<'EOF'
          // REASON: planted live-tier claim whose target is supplied by whoever stands the tier up
          // KIND: empirical
          // PROVENANCE: MEASURED 2026-07-27
          // FALSIFIER: true <served-target>
          // FALSIFIER-TIER: lighthouse
          EOF

      - name: Negative control — a reason whose falsifier now exits 0 must FAIL the gate
        env:
          FIXTURE: ${{ runner.temp }}/reasons-control
        run: |
          if pnpm validate-reasons --root "$FIXTURE/stale.ts" --revalidate; then
            echo "::error::A planted reason whose falsifier exits 0 was not reported STALE. The re-validation pass cannot fail, so the PASS above means nothing (#1065)."
            exit 1
          fi

      - name: Negative control — an empirical reason with no falsifier must FAIL the structural pass
        env:
          FIXTURE: ${{ runner.temp }}/reasons-control
        run: |
          if pnpm validate-reasons --root "$FIXTURE/malformed.md"; then
            echo "::error::A planted empirical reason carrying no FALSIFIER was accepted. The structural half of the gate is not asserting anything (#1033)."
            exit 1
          fi

      - name: Negative control — an unbound live-tier placeholder must FAIL rather than read as 'holds'
        env:
          FIXTURE: ${{ runner.temp }}/reasons-control
        run: |
          if pnpm validate-reasons --root "$FIXTURE/unbound.ts" --revalidate --tier lighthouse; then
            echo "::error::A live-tier falsifier with an unbound <placeholder> did not report UNVERIFIABLE. Run verbatim it dies on a shell redirect and exits non-zero, which the gate would read as 'the blocker still holds' (#1072)."
            exit 1
          fi

      # The other three controls plant a bad reason; this one plants a broken SURFACE. A fetch that
      # returns nothing is indistinguishable in the output from a tracker with no recorded blockers,
      # so the failure has to be asserted, not assumed. Checking the message too — the other three
      # accept any non-zero exit, which is a weaker control (#1253 item 2).
      - name: Negative control — an --issues fetch with no usable credential must FAIL, not report zero
        env:
          GH_TOKEN: not-a-real-token
        run: |
          set -uo pipefail
          if out=$(pnpm validate-reasons --issues 2>&1); then
            printf '%s\n' "$out"
            echo "::error::--issues accepted an unusable gh credential and reported an issue-recorded claim count anyway. A fetch that quietly returns nothing reads exactly like a tracker with no recorded blockers, so the PASS above proves nothing (#1065/#1246)."
            exit 1
          fi
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qF 'gh issue list'; then
            echo "::error::--issues exited non-zero, but not for the unauthenticated-gh reason this control plants. A control that passes on any failure is not a control."
            exit 1
          fi

      # Scheduled runs go red on a branch nobody watches (#1128/#1138's precedent, applied here as
      # in corpus-drift.yml/conservation.yml). On a scheduled failure, find-or-update ONE tracking
      # issue by the marker label.
      #
      # This step USED to read `github.event_name == 'schedule'` alone, with the rationale "a manual
      # run's failure is already visible to whoever ran it". #1287 falsified that: the exclusion also
      # made the path unprovable, and it had consequently never executed — `ci-reasons-alert` did not
      # exist as a label, which is machine-checkable proof of exactly that. `workflow_dispatch` is
      # now permanently in the condition.
      - name: Open or update the reasons-drift tracking issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-reasons-alert
          label-description: Auto-opened when the scheduled reasons-drift CI run fails
          title: reasons-drift scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled `reasons-drift` run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Either a reason block is malformed — **in the repo OR in an open issue's body/comment, which `--issues` now folds in (#1246); the log names the row as `issue #N`** — or an empirical falsifier now exits 0 (STALE — the blocker it describes is gone, but the recorded reason still asserts it, per CLAUDE.md's recorded-reasons-decay doctrine), or `gh issue list` could not read the tracker (the issue surface went ungated; fix the credential, do not drop the flag), or a negative control stopped failing (the gate itself broke — fix that before trusting the pass). See the job log for which step and which row. Re-read the claim, correct or retire it, and close this issue once green."
