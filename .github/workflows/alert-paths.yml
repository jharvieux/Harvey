# Gate 5 of epic #1320 (#1287). The ONLINE half of the alert-path gate.
#
# The structural half — every alert path dispatch-provable, registered, carrying a proof run, and a
# scheduled workflow either alerting or disclosed — is pure and lives in `pnpm verify` via
# src/alert-paths.test.ts. This job exists for the one assertion that needs the network:
#
#   EVERY MARKER LABEL STILL EXISTS.
#
# That is #1287's standing invariant. Each alert step self-heals its label with `gh label create`,
# so a marker label that does not exist is machine-checkable proof the path has never executed —
# which is exactly how three unfired paths were found. It is also the half NO DIFF CAN SPEAK TO: a
# label deleted by hand in the GitHub UI changes no file in this repo, and a deleted label breaks
# find-or-update so every future alarm opens a duplicate issue instead of updating one.
#
# TWO TIERS, like conservation.yml, because this job does two unrelated things:
#   • the LABEL check is TIME-based — it detects out-of-band deletion, so it runs on every PR and
#     on the daily schedule regardless of what changed.
#   • the NEGATIVE CONTROLS are CHANGE-based — they re-prove the gate can still fail, which only
#     needs re-asserting when the gate's own code moves.
#
# No `paths:` filter on the trigger, deliberately: a path-filtered required check never reports on
# PRs outside its filter and deadlocks them permanently (#1107). It runs on every PR and short-
# circuits with a LOGGED reason instead.

name: alert-paths

on:
  schedule:
    - cron: "45 7 * * *" # Daily 07:45 UTC — between conservation (07:30) and reasons-drift (08:00)
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Prove the ci-alert-paths-alert path fires end-to-end (#1287/#1333). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509/#1568). SKIPS the label pass and the negative controls, leaving a job every one of whose steps succeeds — the guard is then the only thing that can turn it red."
        type: boolean
        default: false
  pull_request:

concurrency:
  group: alert-paths-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # read for `--labels`, which re-reads the tracking issue behind every no-alert-path disclosure;
  # write since #1333, for this gate's own alert path.
  issues: write

jobs:
  alert-paths:
    name: every alert path is dispatch-provable and its marker label exists
    runs-on: ubuntu-latest
    # #1333: this gate holds every other scheduled workflow to "alert on failure, and prove it
    # once", and until now it did not meet its own rule. It does now — see the alert step at the
    # bottom of this job, and it was DRILLED ON THIS BRANCH BEFORE MERGING, not one merge late.
    #
    # This comment used to say the opposite, in MEASURED's register, and it was wrong. It claimed
    # `gh workflow run` validates `-f` inputs against the DEFAULT BRANCH's copy of the file, so the
    # drill for a newly-declared `alert_drill` input was "only dispatchable after this file is on
    # main", and quoted an HTTP 422 to prove it. Run 30605765391 dispatched that exact command
    # successfully at 2026-07-31T05:03:52Z — eight seconds after this comment was committed — on
    # `--ref feature/sweep-ci-1333`, with the input accepted and the branch's own drill step
    # executing. The 422 does not reproduce; three sibling paths drilled the same way the same night
    # (30605813952, 30605818422, 30605815019).
    #
    # The corrected rule, which is what .github/alert-paths.json now records: only the workflow FILE
    # must exist on the default branch (#1288's genuine evidence is a 404 on a file that did not:
    # `HTTP 404: workflow secbench.yml not found on the default branch`). The INPUTS, JOBS and STEPS
    # need not be — a workflow_dispatch run executes the copy on the `--ref` you name, so a newly
    # declared `alert_drill` input is drillable from the branch that declares it. Consequence for
    # anyone adding an alert path to an EXISTING workflow file: you need no `pendingProof` hatch,
    # drill it on your branch. The hatch remains for the genuine case — a workflow file not yet on
    # main.
    timeout-minutes: 10
    # The receipt every record step and every gate CLI in this job writes to. A literal path, not
    # ${{ runner.temp }}: the `runner` context is not available in a job-level `env:` block. Without
    # it `recordMeasured` writes NOTHING (it is silent off CI by design) while the bash asserter
    # falls back to $RUNNER_TEMP — producer and asserter then disagree about the path and the assert
    # fails on a job that scored fine. MEASURED 2026-07-31 on PR #1697's first run, in all five
    # workflows this landed in.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # After the checkout (the alert step below is a LOCAL composite action) and before the install,
      # so the drill proves the ALERT path without paying for the gate it guards.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287/#1333): failing on purpose so the tracking-issue step runs under the real job token. This is NOT an alert-path gate failure."
          exit 1

      - id: filter
        name: Does this change set touch the alert-path gate itself?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request (${{ github.event_name }}) — running the negative controls too."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
          relevant=false
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/*|.github/actions/*|.github/alert-paths.json|src/alert-paths.ts|src/cli/validate-alert-paths.ts) relevant=true ;;
            esac
          done <<< "$files"
          # Logged either way: a green run must be legible as "checked and clean" or "correctly
          # skipped", never as an unexplained pass.
          if [ "$relevant" = "true" ]; then
            echo "This PR touches a workflow, the shared alert action, the registry or the gate — negative controls will run."
          else
            echo "This PR touches none of .github/workflows/**, .github/actions/**, .github/alert-paths.json or the gate source, so the negative controls are skipped. The marker-label check below STILL RUNS: label deletion happens outside any diff."
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Always, on every PR and every schedule. `gh` that cannot run exits 127 = UNVERIFIABLE and
      # still fails the job — "I could not check" must never be reported as "checked and clean".
      - name: Every marker label exists (and the structure still holds)
        if: ${{ !inputs.liveness_drill }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx src/cli/validate-alert-paths.ts --labels

      - name: Negative control — a schedule-only alert condition must FAIL the gate
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        run: |
          if pnpm exec tsx src/cli/validate-alert-paths.ts --seed-unprovable; then
            echo "::error::--seed-unprovable put every alert path back on a cron-only condition — the exact state main was in while four alert paths sat unfired — and the gate still exited 0. The PASS above means nothing (#1287)."
            exit 1
          fi

      - name: Negative control — a missing marker label must FAIL the gate
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if pnpm exec tsx src/cli/validate-alert-paths.ts --labels --seed-missing-label; then
            echo "::error::--seed-missing-label removed a marker label from the observed set and the gate still exited 0. A missing label is the one machine-checkable proof that an alert path never ran, so this control failing to fail voids the whole gate (#1287)."
            exit 1
          fi

      - name: Negative control — a CLOSED tracking issue must FAIL the no-alarm disclosure
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if pnpm exec tsx src/cli/validate-alert-paths.ts --labels --seed-closed-tracking; then
            echo "::error::--seed-closed-tracking closed every no-alert-path disclosure's tracking issue and the gate still exited 0. That hatch is the one place this gate fails OPEN: a pendingProof whose tracker closes with no proof recorded has quietly become a permanent exemption (#1287/#1288)."
            exit 1
          fi

      # The negative controls are a SEPARATE claim from the gate (conservation.yml's shape): a gate
      # nobody has watched fail is indistinguishable from one that cannot, and the `if:` above can
      # retire all three in silence. Recorded here rather than by the CLI because what is asserted
      # is that the three steps EXECUTED — those CLI runs are supposed to exit non-zero.
      - name: Record that all three negative controls executed
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: alert-paths-negative-controls
          units: 3
          scope: "--seed-unprovable + --seed-missing-label + --seed-closed-tracking, all three required to exit non-zero"

      - name: Declare the controls' no-op (a short-circuit must not read like a scoring run)
        if: steps.filter.outputs.relevant != 'true'
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: alert-paths-negative-controls
          status: declared-no-op
          scope: "in-job filter found no workflow, no shared action, no registry and no gate source in this diff, so the three seeded controls were skipped. The label check above still ran and carries the verdict; nothing here is evidence that the controls can still fail."

      # #1568/#1509: the label pass is the one assertion in this repo that no diff can speak to, so a
      # run that died before reaching it reports an absence that reads exactly like "every label is
      # there". `always()` so a job that died in setup names the phase that never ran. Excluded on the
      # alert drill, which fails on purpose at its first step, before anything is scored.
      - name: Gate liveness — did this job actually check any path?
        if: always() && !inputs.alert_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: alert-paths, alert-paths-negative-controls

      # #1333: the daily label check is the one assertion in this repo that NO DIFF CAN SPEAK TO, so
      # a scheduled failure here is precisely the case nobody would otherwise notice.
      - name: Open or update the alert-paths tracking issue
        if: failure() && !inputs.liveness_drill && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-alert-paths-alert
          label-description: Auto-opened when the scheduled alert-paths gate fails
          title: alert-paths scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled `alert-paths` gate failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Most likely a marker label was deleted out of band — which breaks find-or-update, so every future alarm opens a duplicate issue instead of updating one — or a `pendingProof`/`scheduledWithoutAlertPath` disclosure now points at a closed tracking issue. Reproduce with `pnpm exec tsx src/cli/validate-alert-paths.ts --labels`. Close this issue once green."
