# Regenerates the calibration dry run (src/cli/dry-run.ts, #34) and diffs its findings.json AND
# pii-data-map.json against their committed copies (#336). Nobody runs the harness by hand when a
# rule or fixture lands, so the artifacts silently age behind the scanner's real output — a
# 2026-07-16 regeneration alone turned up 7 findings main's own code already emits that the
# committed findings.json didn't have (a new auth_rls_initplan detector, #374). pii-data-map.json
# had no gate at all and drifted after #461 undetected until caught by hand. timing.json is
# deliberately excluded: it churns by design every run (wall-clock numbers), and only
# findings.json/pii-data-map.json are meant to be deterministic across machines (issue #285/#302
# — stable ids via sorted inputs).
#
# Deliberately NOT part of `pnpm verify`: dry-run.ts's mechanical scan shells out to
# gitleaks/trufflehog/semgrep/osv-scanner, none of them npm dependencies — verify stays
# deterministic and offline (see corpus-drift.yml's own note on the same trade-off). Same binary
# install list as corpus-drift.yml, scoped to the one target this harness actually runs against.
#
# On failure: regenerate locally (`pnpm exec tsx src/cli/dry-run.ts`) and commit the corrected
# findings.json/pii-data-map.json — see this file's own header comment for why that's tool-driven,
# not a hand-edit.
#
# REQUIRED STATUS CHECK on `main` since #1107 (operator ruling 2026-07-26). This is the only gate
# that inspects the DELIVERABLE rather than the code that produces it, and on PR #1104 it was the
# only check that caught a client-facing information disclosure (an absolute scan-scope path leaked
# into a finding's `evidence`) while the required `verify` passed.
#
# Being required is why this workflow has NO `paths:` filter on `pull_request` any more. GitHub
# waits forever for a required context that never reports, so a path-filtered required check
# deadlocks every PR outside its filter — three docs-only PRs in the 2026-07-26 sweep (#1108,
# #1111, #1113) would have been permanently unmergeable. The filter therefore moved INSIDE the job
# (the `filter` step below): the job always runs and always reports, and only the expensive work is
# conditional. Same tiering shape as ci.yml's changes/verify split (#1025/#1031), collapsed into
# one job because there is exactly one heavy step group and one status context to keep stable.

name: dry-run-drift

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      liveness_drill:
        description: "Prove the gate-liveness guard fires (#1509). SKIPS the regenerate + diff steps, leaving a job every one of whose steps succeeds — the guard is then the only thing that can turn it red."
        type: boolean
        default: false
      alert_drill:
        description: "Prove the ci-dry-run-drift-alert path fires end-to-end (#1287/#1333). Fails this job on purpose; opens, comments on and then closes a self-cleaning drill issue."
        type: boolean
        default: false
  pull_request:
  # #1498: merge queue. Without this the required `regenerate dry-run findings + diff committed
  # artifact` context never reports on a queue entry and the queue deadlocks. The relevance filter
  # below sets relevant=true on any non-`pull_request` event, so a queue entry regenerates and
  # diffs for real instead of short-circuiting.
  merge_group:

# A scheduled drift check has no reason to run twice concurrently, and a re-dispatch means the
# newer run is the interesting one. Safe on a required check: a cancellation here is only ever
# caused by a NEWER run on the same `github.ref` — for a PR that is `refs/pull/N/merge`, so the
# superseding run reports against the newer head commit, which is the commit branch protection
# actually evaluates. A `cancelled` conclusion is therefore never the latest result for the head
# SHA, and cannot strand a merge. (Same posture ci.yml already takes for the required `verify`.)
concurrency:
  group: dry-run-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # #1333: the alert path below find-or-updates ONE tracking issue on a scheduled failure.

jobs:
  drift:
    name: regenerate dry-run findings + diff committed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The receipt both dry-run.ts and .github/actions/gate-liveness read. A literal path, not
    # ${{ runner.temp }}: the `runner` context is not available in a job-level `env:` block.
    env:
      HARVEY_LIVENESS_RECEIPT: /tmp/harvey-gate-liveness.receipt
    steps:
      # fetch-depth: 0 so the filter step can diff against the PR base. It does not affect what the
      # scan sees: dry-run.ts copies the target into a scratch dir and `git init`s a fresh repo
      # there (buildScratchTarget), so this checkout's history depth never reaches the scanners.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before the install and the mechanical-binary provisioning on purpose: the drill proves the
      # ALERT path, not the artifact, so it must not pay for a regeneration to reach it.
      - name: Alert-path liveness drill — fail deliberately (#1287)
        if: inputs.alert_drill
        run: |
          echo "::error::Alert-path liveness drill (#1287/#1333): failing on purpose so the tracking-issue step runs under the real job token. This is NOT an artifact drift."
          exit 1

      - id: filter
        name: Does this change set touch the artifact or anything that produces it?
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
          echo "Changed files:"
          echo "$files"
          relevant=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/cli/dry-run.ts) relevant=true ;;
              src/scan/*) relevant=true ;;
              targets/calibration/*) relevant=true ;;
              dry-run/findings.json|dry-run/pii-data-map.json) relevant=true ;;
              .github/workflows/dry-run-drift.yml) relevant=true ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "false" ]; then
            echo "No change to the dry-run harness, its rules, its fixture or its committed artifact — the artifact cannot have drifted from this PR. Nothing to regenerate."
          fi

      # #1509: a short-circuited job and a job that died in setup are both "nothing was regenerated,
      # nothing was diffed". Declaring the no-op is what keeps the two distinguishable in the job
      # summary — the same problem the #1107 in-job filter creates one level down.
      - name: Declare the no-op (a short-circuit must not read like a diffed run)
        if: steps.filter.outputs.relevant != 'true'
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: dry-run-regen, dry-run-diff
          status: declared-no-op
          scope: "in-job filter found no change to the dry-run harness, its rules, its fixture or the committed artifact — the artifact cannot have drifted from this PR, so nothing was regenerated and nothing was diffed."

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.relevant == 'true'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.relevant == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.relevant == 'true'

      # Same pins as corpus-drift.yml's install step — each scanner degrades to "found nothing"
      # without its binary rather than failing loudly, which here would look like a clean diff
      # instead of the drift it actually is.
      - name: Install mechanical-tier scanner binaries
        if: steps.filter.outputs.relevant == 'true'
        uses: ./.github/actions/mechanical-binaries

      - name: Regenerate dry-run findings
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        run: pnpm exec tsx src/cli/dry-run.ts --target targets/calibration --out /tmp/dry-run-regen

      - name: Diff regenerated findings.json against the committed artifact
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        run: |
          if ! diff -u dry-run/findings.json /tmp/dry-run-regen/findings.json; then
            echo "::error::dry-run/findings.json has drifted from the scanner's real output — regenerate it (pnpm exec tsx src/cli/dry-run.ts) and commit the result. timing.json is excluded by design (#302)."
            exit 1
          fi

      - name: Diff regenerated pii-data-map.json against the committed artifact
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        run: |
          if ! diff -u dry-run/pii-data-map.json /tmp/dry-run-regen/pii-data-map.json; then
            echo "::error::dry-run/pii-data-map.json has drifted from the scanner's real output — regenerate it (pnpm exec tsx src/cli/dry-run.ts) and commit the result. timing.json is excluded by design (#302)."
            exit 1
          fi

      # The regeneration and the comparison are separate phases and only the second one is this
      # job's product. A regeneration that produced findings and then never got diffed reads exactly
      # like a clean diff — the produce-vs-deliver gap CLAUDE.md's conservation rule is about. dry-run.ts
      # records the regeneration; this records the comparison.
      - name: Record that both committed artifacts were actually diffed
        if: steps.filter.outputs.relevant == 'true' && !inputs.liveness_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: record
          gate: dry-run-diff
          units: 2
          scope: "findings.json and pii-data-map.json each diffed against the freshly regenerated output"

      # #1509: this is a REQUIRED context, so "green" here is a merge decision. `always()` so a job
      # that died in setup says which phase never ran instead of leaving a reader to infer it.
      # Excluded on an alert drill, which fails on purpose before any phase runs — otherwise the
      # drill's red would be attributed to the liveness guard rather than to the deliberate failure.
      - name: Gate liveness — did this job actually regenerate and diff?
        if: always() && !inputs.alert_drill
        uses: ./.github/actions/gate-liveness
        with:
          mode: assert
          expect: dry-run-regen, dry-run-diff

      # #1333: until now this scheduled job went red on a branch nobody watches and raised nothing.
      # Never fires on PR/push/merge_group — those failures are already visible on the PR — but
      # workflow_dispatch is permanently in the condition (#1287) because a cron-only alert path
      # cannot be proven to work. EXCLUDED on a liveness drill (#1569): that drill fails the job on
      # purpose at the liveness assert, so without this clause it would open a REAL
      # `ci-dry-run-drift-alert` issue rather than proving anything about the artifacts.
      - name: Open or update the dry-run-drift tracking issue
        if: failure() && !inputs.liveness_drill && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/alert-issue
        with:
          marker: ci-dry-run-drift-alert
          label-description: Auto-opened when the scheduled dry-run-drift CI run fails
          title: dry-run-drift scheduled run failing
          drill: ${{ inputs.alert_drill }}
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          body: "The scheduled `dry-run-drift` run failed (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Either the committed dry-run artifacts have drifted from the scanner's real output — regenerate with `pnpm exec tsx src/cli/dry-run.ts --target targets/calibration --out dry-run` and commit BOTH dry-run/findings.json and dry-run/pii-data-map.json — or the job errored before it could diff, in which case the gate-liveness step names the phase that never ran. Close this issue once green."
