# The mechanical-tier scanner binaries, installed once and CACHED (#1498).
#
# This block was duplicated verbatim in five workflows (ci.yml, conservation.yml, dry-run-drift.yml,
# corpus-drift.yml, secbench.yml) and there was NO actions/cache anywhere in the repo. Every job that
# needed them paid a pipx install plus three network fetches — 15-23s MEASURED, and four chances to
# fail on someone else's infrastructure. A scanner binary that fails to download does not degrade
# quietly here: gitleaks throws ENOENT rather than degrading (see src/scan/secrets.ts), and a run
# missing osv-scanner emits a DEP-OSV-00 disclosure row that does not belong in a committed artifact.
#
# The cache key pins EVERY version, so a version bump is a cache miss by construction — there is no
# way to bump a pinned tool and silently keep running the old one. That is the property worth having;
# the seconds saved are secondary.
name: Install mechanical-tier scanner binaries
description: semgrep, trufflehog, osv-scanner and gitleaks, cached by pinned version.

runs:
  using: composite
  steps:
    # Versions live here so the cache key and the installer cannot disagree. osv-scanner's asset
    # carries no version in its name, so an unpinned URL would drift the toolchain under the
    # baselines without anyone choosing to.
    - id: versions
      shell: bash
      run: |
        set -euo pipefail
        OSV=2.3.8
        GITLEAKS=8.30.1
        TRUFFLEHOG=head
        # #1266: semgrep was the one tool `pipx install semgrep` left UNPINNED, contradicting this
        # action's own "pins EVERY version" comment above. MEASURED 2026-07-30: a runner resolved
        # 1.172.0 while the committed fixture (src/scan/__fixtures__/semgrep/) and
        # SEMGREP_PINNED_VERSION (src/scan/fixture-drift-contracts.ts) are both 1.164.0 — the new
        # semgrep-fixture-drift check correctly failed loud on that mismatch (its whole job), which
        # is what surfaced the gap. Pinned here to match.
        SEMGREP=1.164.0
        # The KEY is emitted here too, so restore and save read ONE string. Since #1516 they are two
        # separate steps, and two hand-written copies of a key is a silent way to save under a key
        # nothing will ever restore. Suffix bumped v3 -> v4: v3 entries were written before anything
        # asserted completeness, so they carry no guarantee this action now makes.
        {
          echo "osv=$OSV"
          echo "gitleaks=$GITLEAKS"
          echo "trufflehog=$TRUFFLEHOG"
          echo "semgrep=$SEMGREP"
          echo "key=mech-bins-${{ runner.os }}-osv$OSV-gl$GITLEAKS-th$TRUFFLEHOG-sg$SEMGREP-v4"
        } >> "$GITHUB_OUTPUT"

    # #1516: RESTORE, not the combined cache action. actions/cache saves in a post step at the end of
    # the job, which is after every assertion this action makes and outside its control — so the only
    # way to guarantee an incomplete tree is never written is to own the save. Split restore/save
    # puts the completeness assertion BETWEEN them.
    - id: cache
      uses: actions/cache/restore@v4
      with:
        # pipx shims in ~/.local/bin point INTO ~/.local/pipx/venvs — caching bin alone yields a
        # dangling semgrep shim that resolves and then fails at exec. Both paths or neither.
        path: |
          ~/.local/bin
          ~/.local/pipx
        key: ${{ steps.versions.outputs.key }}

    - name: Install (cache miss only)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      # PIPX_HOME/PIPX_BIN_DIR are the whole fix for #1509. The runner ships a preinstalled pipx
      # configured to write to /opt/pipx and /opt/pipx_bin — NEITHER of which is under the cached
      # paths. So the first run installed semgrep to /opt/pipx_bin, saved a cache containing the
      # three curl'd binaries and no semgrep, and every run after that got a cache HIT, skipped
      # the install, and had no semgrep at all. Pointing pipx at the cached tree is what makes the
      # key's promise true.
      run: |
        set -euo pipefail
        # Set HERE, not in an `env:` block: the cached paths are $HOME-relative and `env:` has no
        # $HOME expansion — `${{ github.workspace }}/../.local` resolves to /home/runner/work/<repo>/
        # .local, which is NOT $HOME/.local and would have re-created the same miss under a new name.
        export PIPX_HOME="$HOME/.local/pipx"
        export PIPX_BIN_DIR="$HOME/.local/bin"
        # pipx no longer guarantees ~/.local/bin exists on ubuntu-latest — MEASURED 2026-07-28, where
        # the osv-scanner `curl -o` into it failed with `curl: (23)` on a fresh runner.
        mkdir -p "$HOME/.local/bin"
        pipx install "semgrep==${{ steps.versions.outputs.semgrep }}"
        curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
          | sh -s -- -b "$HOME/.local/bin"
        curl -sSfL -o "$HOME/.local/bin/osv-scanner" \
          https://github.com/google/osv-scanner/releases/download/v${{ steps.versions.outputs.osv }}/osv-scanner_linux_amd64
        chmod +x "$HOME/.local/bin/osv-scanner"
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${{ steps.versions.outputs.gitleaks }}/gitleaks_${{ steps.versions.outputs.gitleaks }}_linux_x64.tar.gz \
          | tar -xz -C "$HOME/.local/bin" gitleaks

    # THE PRE-SAVE GATE (#1516). Runs on both paths — a restored cache is checked as strictly as a
    # freshly installed one, because the tree that gets restored is the tree the next job inherits.
    - name: Every binary resolves INSIDE the cached tree
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/assert-complete.sh"

    # Only now. Skipped on a cache hit (nothing changed to save) and unreachable on an incomplete
    # tree, because the step above exits 1 and this one carries no `always()`.
    - name: Save the cache, now that the tree is proven complete
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.local/bin
          ~/.local/pipx
        key: ${{ steps.versions.outputs.key }}

    - name: Put them on PATH and PROVE they run
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        # Presence is the step above's job; this one is EXECUTABILITY. A restored cache that cannot
        # execute is worse than no cache: every consumer would either throw ENOENT mid-scan or emit a
        # not-assessed row. Invoked by absolute path so a system copy earlier on PATH cannot answer
        # for a cached one that is broken — the same confusion #1516 removed from the presence check.
        for b in semgrep trufflehog osv-scanner gitleaks; do
          "$HOME/.local/bin/$b" --version >/dev/null 2>&1 || "$HOME/.local/bin/$b" version >/dev/null 2>&1 || {
            echo "::error::$b present in ~/.local/bin but not runnable — cache is poisoned; bump the key suffix in the versions step"; exit 1; }
        done
        echo "mechanical binaries OK: $(semgrep --version) | osv-scanner $(osv-scanner --version 2>&1 | head -1)"
